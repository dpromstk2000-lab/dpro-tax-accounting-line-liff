name: DPRO TAX R153 Disposable Direct-DML Boundary QA (Synthetic Only)

on:
  push:
    branches: [tax-r7-staging-20261010]
    paths:
      - '.github/workflows/dpro-tax-r153-disposable-direct-dml-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dpro-tax-r153-readonly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  disposable-reference-hardening:
    if: ${{ github.repository == 'dpromstk2000-lab/dpro-tax-accounting-line-liff' && github.ref == 'refs/heads/tax-r7-staging-20261010' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      pg:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: r153-ephemeral-test-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - name: Read only checkout pinned staging source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Refuse unexpected source change or environment
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.ref }}" = 'refs/heads/tax-r7-staging-20261010'
          test "${{ github.repository }}" = 'dpromstk2000-lab/dpro-tax-accounting-line-liff'
          test "$(git hash-object .github/workflows/dpro-tax-r152-disposable-postgres-booking-qa.yml)" = '8c3ed43f0f1fdc3217382f47b43c5f68763f1f37'
          test "$(git hash-object .github/workflows/dpro-tax-r151-staging-boundary-qa.yml)" = 'bd6a075f06f0692ff868067416afb5781faad6c1'
          echo R153_STAGING_SOURCE_ISOLATION_OK
      - name: Reproduce reference raw-DML exposure and prove least-privilege repair in disposable PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ job.services.pg.id }}"
          cat > "$RUNNER_TEMP/r153_extract.py" <<'R153_EXTRACT_SOURCE'
          #!/usr/bin/env python3
          """Read-only extraction of R152's pinned, synthetic SQL inside a workflow source."""
          from pathlib import Path
          import hashlib
          import os
          import subprocess
          
          repo=Path(os.environ.get('GITHUB_WORKSPACE','.') )
          source=repo/'.github/workflows/dpro-tax-r152-disposable-postgres-booking-qa.yml'
          want='8c3ed43f0f1fdc3217382f47b43c5f68763f1f37'
          actual=subprocess.check_output(['git','hash-object',str(source)], text=True).strip()
          assert actual==want, 'R153_REF_SOURCE_DRIFT_STOP'
          s=source.read_text('utf-8')
          start_marker='cat > "$RUNNER_TEMP/r152_disposable.sql" <<\'R152_DISPOSABLE_SQL\''
          start=s.index(start_marker)+len(start_marker)
          assert s[start]=='\n'
          start+=1
          end=s.index('\n          R152_DISPOSABLE_SQL',start)
          chunk=s[start:end].splitlines()
          assert len(chunk)>60 and all(x.startswith('          ') for x in chunk)
          raw='\n'.join(x[10:] for x in chunk)+'\n'
          assert 'CREATE SCHEMA r152;' in raw and 'GRANT SELECT, INSERT, UPDATE ON r152.bookings TO r152_app;' in raw
          assert 'The r152.office/r152.kind GUCs are test-only' in raw
          want_sha='abaea610ff7a6834511abff0a2e79416ea78dadfef76f4e6304483fe2babd9d9'
          assert hashlib.sha256(raw.encode()).hexdigest()==want_sha,'R153_SQL_SOURCE_DRIFT_STOP'
          out=Path(os.environ.get('RUNNER_TEMP','/tmp'))/'r153_original_disposable.sql'
          out.write_text(raw,'utf-8')
          print('R153_REFERENCE_SOURCE_PINNED_OK',actual,want_sha,flush=True)
          R153_EXTRACT_SOURCE
          cat > "$RUNNER_TEMP/r153_probe.py" <<'R153_PROBE_SOURCE'
          #!/usr/bin/env python3
          """R153 local disposable PostgreSQL ONLY. Never connect to Supabase, Worker or customer DB."""
          from __future__ import annotations
          import os
          import subprocess
          from datetime import datetime, timedelta, timezone
          
          container = os.environ.get('R153_PG_CONTAINER','')
          assert container.isalnum() and len(container)>12, 'R153 requires GitHub ephemeral service container id'
          num=0
          
          def call(sql, *, success=True, required=None):
              r=subprocess.run(['docker','exec','-i',container,'psql','-X','-v','ON_ERROR_STOP=1','-U','postgres','-d','postgres'],
                               input=sql+'\n',text=True,capture_output=True,timeout=60)
              msg=r.stdout+'\n'+r.stderr
              if (r.returncode==0)!=success or (required and required not in msg):
                  raise AssertionError(f'Unexpected SQL result (wanted {success}, required {required!r}): '+msg[-1700:])
              return msg
          
          def passed(note):
              global num
              num+=1
              print(f'R153_PASS_{num:02d}: {note}',flush=True)
          
          def actor(kind='client',office='office-A',who='client-1'):
              return '\n'.join(["SET ROLE r152_app;",f"SELECT set_config('r152.office','{office}',false);",f"SELECT set_config('r152.kind','{kind}',false);",f"SELECT set_config('r152.actor','{who}',false);"])
          
          # Simple future whole-hour slot, no minute grid drift.
          future=(datetime.now(timezone.utc)+timedelta(days=24)).replace(minute=0,second=0,microsecond=0)+timedelta(hours=1)
          slot=future.isoformat()
          
          call(actor()+f"""
          SELECT r152.request_slot('office-A','client-1','staff-A','r153-legacy','hash-v1','{slot}'::timestamptz,30);
          UPDATE r152.bookings SET status='confirmed', staff_id='staff-B'
           WHERE office_id='office-A' AND request_key='r153-legacy' RETURNING status;
          """,required='confirmed')
          passed('R152 reference permits a client raw UPDATE bypass (reproduced only in disposal container)')
          call(actor()+f"""
          INSERT INTO r152.bookings(office_id,client_id,staff_id,request_key,payload_hash,starts_at,ends_at,status)
           VALUES('office-A','client-1','staff-A','r153-raw-insert','hash-raw','{slot}'::timestamptz,
           '{(future+timedelta(minutes=30)).isoformat()}'::timestamptz,'requested');
          """)
          passed('R152 reference permits raw INSERT bypass (reproduced only in disposal container)')
          
          call("""
          REVOKE INSERT, UPDATE, DELETE ON TABLE r152.bookings FROM r152_app;
          REVOKE USAGE, SELECT ON SEQUENCE r152.bookings_id_seq FROM r152_app;
          ALTER FUNCTION r152.request_slot(text,text,text,text,text,timestamptz,integer) SECURITY DEFINER;
          ALTER FUNCTION r152.request_slot(text,text,text,text,text,timestamptz,integer) SET search_path = pg_catalog,r152;
          ALTER FUNCTION r152.confirm_slot(bigint) SECURITY DEFINER;
          ALTER FUNCTION r152.confirm_slot(bigint) SET search_path = pg_catalog,r152;
          ALTER FUNCTION r152.cancel_slot(bigint) SECURITY DEFINER;
          ALTER FUNCTION r152.cancel_slot(bigint) SET search_path = pg_catalog,r152;
          """)
          passed('reference repaired in disposable database with function-only writes')
          
          for q,desc in [('UPDATE r152.bookings SET status=\'confirmed\' WHERE request_key=\'r153-raw-insert\';','raw UPDATE'),
                         (f"INSERT INTO r152.bookings(office_id,client_id,staff_id,request_key,payload_hash,starts_at,ends_at) VALUES('office-A','client-1','staff-A','r153-second-raw','hash','{slot}'::timestamptz,'{(future+timedelta(minutes=30)).isoformat()}'::timestamptz);",'raw INSERT'),
                         ("DELETE FROM r152.bookings WHERE request_key='r153-legacy';",'raw DELETE')]:
              call(actor()+q,success=False,required='permission denied for table bookings')
              passed('untrusted role denied '+desc+' after grant removal')
          
          call("""
          DO $$ BEGIN
          IF has_table_privilege('r152_app','r152.bookings','UPDATE') THEN RAISE EXCEPTION 'UNEXPECTED_UPDATE_GRANT'; END IF;
          IF has_table_privilege('r152_app','r152.bookings','INSERT') THEN RAISE EXCEPTION 'UNEXPECTED_INSERT_GRANT'; END IF;
          IF has_table_privilege('r152_app','r152.bookings','DELETE') THEN RAISE EXCEPTION 'UNEXPECTED_DELETE_GRANT'; END IF;
          IF NOT has_table_privilege('r152_app','r152.bookings','SELECT') THEN RAISE EXCEPTION 'SELECT_BREAKAGE'; END IF;
          END $$;
          """)
          passed('PostgreSQL effective privileges confirm only raw SELECT is retained')
          
          call(actor()+f"SELECT r152.request_slot('office-A','client-1','staff-Q','r153-after-revoke','hash2','{(future+timedelta(days=1)).isoformat()}'::timestamptz,30);")
          passed('client can still create requested row only through validated function')
          
          call(actor()+"SELECT status FROM r152.bookings WHERE request_key='r153-after-revoke';",required='requested')
          passed('RLS permits client to view their own pending record')
          
          # Cross-office read must yield zero rows.
          res=call(actor('staff','office-B','staff-B')+"SELECT 'R153_CROSS_OFFICE_'|| count(*) FROM r152.bookings WHERE request_key='r153-after-revoke';",required='R153_CROSS_OFFICE_0')
          passed('office-B cannot read office-A row under simulated RLS')
          
          # Obtain row id in independent SQL command; synthetic test data, no secrets.
          query=call(actor('staff','office-A','staff-A')+"SELECT 'R153_ID_'||id FROM r152.bookings WHERE request_key='r153-after-revoke';")
          ids=[x.strip().split('R153_ID_',1)[1].split()[0] for x in query.splitlines() if 'R153_ID_' in x]
          assert len(ids)==1 and ids[0].isdigit(), 'Expected one app-row id'
          ident=ids[0]
          call(actor('client','office-A','client-1')+f'SELECT r152.confirm_slot({ident});',success=False,required='R152_CONFIRM_FORBIDDEN')
          passed('client cannot confirm through function after permission hardening')
          call(actor('staff','office-B','staff-B')+f'SELECT r152.confirm_slot({ident});',success=False,required='R152_CONFIRM_NOT_AVAILABLE')
          passed('foreign office cannot confirm through function')
          call(actor('staff','office-A','staff-A')+f'SELECT r152.confirm_slot({ident});')
          passed('staff can confirm own-office requested booking')
          call(actor('client','office-A','client-1')+f'SELECT r152.cancel_slot({ident});',success=False,required='R152_CANCEL_NOT_ALLOWED')
          passed('client cannot cancel a confirmed appointment')
          call(actor('staff','office-A','staff-A')+f'SELECT r152.cancel_slot({ident});')
          passed('staff can cancel and release confirmed booking')
          
          # WARNING: r152.* test GUCs are mutable by the test actor; prove this is NOT real authentication.
          call(actor('staff','office-A','forged-test-actor')+"SELECT 'R153_GUC_MUTABLE_'||current_setting('r152.office',true);",required='R153_GUC_MUTABLE_office-A')
          passed('TEST-ONLY GUCs remain mutable and must never be used as production identity')
          
          assert num==16, f'R153 test count drift: {num}'
          print(f'R153_SUMMARY {num}/{num} PASS; R152 reference bypass reproduced then prevented; NOT production auth',flush=True)
          R153_PROBE_SOURCE
          echo "b7c0db3ea4ea54f72e61ded81e70fd4bea59cff6aab4637360e94d4ac7f4b47d  $RUNNER_TEMP/r153_extract.py" | sha256sum -c -
          echo "7e7c62e3088226499ca69a04d336a9da898d43abca945946d64aea55fec989cf  $RUNNER_TEMP/r153_probe.py" | sha256sum -c -
          python3 -m py_compile "$RUNNER_TEMP/r153_extract.py" "$RUNNER_TEMP/r153_probe.py"
          python3 "$RUNNER_TEMP/r153_extract.py"
          export R153_PG_CONTAINER="${{ job.services.pg.id }}"
          docker exec -i "$R153_PG_CONTAINER" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres < "$RUNNER_TEMP/r153_original_disposable.sql"
          python3 "$RUNNER_TEMP/r153_probe.py"
          echo R153_DISPOSABLE_DML_HARDENING_QA_SUCCESS
      - name: State scope and do not authorize commercial deployment
        if: success()
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## R153 PASS — SYNTHETIC POSTGRESQL REFERENCE ONLY
          - Independently reproduced direct DML bypass in R152 disposable reference schema.
          - In the same disposable service, removed raw table-write privileges and required function-level mutations.
          - Negative tests rejected raw UPDATE, INSERT, DELETE; standard request/confirmation/cancellation remained usable.
          - Reference SECURITY DEFINER is owned by the disposable test superuser, NOT suitable as-is for production.
          - **R152 GUC test identities are forgeable** and do not prove JWT signature or real tenant authentication.
          - No production Supabase, Worker, LINE, customer data, real secrets or write permissions.
          - Real customer production release remains **HOLD** pending commercial 18-gate acceptance.
          EOF
