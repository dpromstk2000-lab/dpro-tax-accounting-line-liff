name: DPRO TAX R154 Disposable DB-Role Auth Boundary QA (Synthetic Only)

on:
  push:
    branches: [tax-r7-staging-20261010]
    paths:
      - '.github/workflows/dpro-tax-r154-disposable-auth-role-boundary-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dpro-tax-r154-synthetic-only-${{ github.ref }}
  cancel-in-progress: false

jobs:
  disposable-db-role-auth-qa:
    if: ${{ github.repository == 'dpromstk2000-lab/dpro-tax-accounting-line-liff' && github.ref == 'refs/heads/tax-r7-staging-20261010' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      pg:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: r154-local-disposable-superuser-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - name: Read-only checkout of pinned staging revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Deny drift from R153 and disallow production branch execution
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.ref }}" = 'refs/heads/tax-r7-staging-20261010'
          test "$(git hash-object .github/workflows/dpro-tax-r153-disposable-direct-dml-qa.yml)" = 'd931f63a70a560b7f447fbcef1e6fd25868fb06d'
          test "$(git hash-object .github/workflows/dpro-tax-r152-disposable-postgres-booking-qa.yml)" = '8c3ed43f0f1fdc3217382f47b43c5f68763f1f37'
          test "$(git hash-object .github/workflows/dpro-tax-r151-staging-boundary-qa.yml)" = 'bd6a075f06f0692ff868067416afb5781faad6c1'
          test "$(git hash-object config.js)" = 'da1876bae8333a3a10ee13495c0063ded0c2b351'
          test "$(git hash-object app.js)" = '4c3475219e5c7fc9203ec5e5143d4f6eb8299423'
          test -z "$(git status --porcelain)"
          echo 'R154_SOURCE_PINS_AND_READONLY_SCOPE_OK'
      - name: Prove authenticated DB session roles resist client-controlled GUC spoofing
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/r154_disposable.sql" <<'R154_PG_SQL'
          -- R154 / Disposable PostgreSQL 17 role-bound identity proof. NEVER deploy to Supabase.
          -- Synthetic passwords are test literals only. Authenticated PostgreSQL login roles are NOT Supabase JWT auth.
          CREATE SCHEMA r154;
          CREATE EXTENSION IF NOT EXISTS btree_gist;
          CREATE ROLE r154_fn_owner NOLOGIN;
          CREATE ROLE r154_client_a LOGIN PASSWORD 'r154-only-client-a-ephemeral';
          CREATE ROLE r154_client_a2 LOGIN PASSWORD 'r154-only-client-a2-ephemeral';
          CREATE ROLE r154_staff_a LOGIN PASSWORD 'r154-only-staff-a-ephemeral';
          CREATE ROLE r154_client_b LOGIN PASSWORD 'r154-only-client-b-ephemeral';
          CREATE ROLE r154_staff_b LOGIN PASSWORD 'r154-only-staff-b-ephemeral';
          CREATE ROLE r154_outsider LOGIN PASSWORD 'r154-only-outsider-ephemeral';
          GRANT USAGE ON SCHEMA r154 TO r154_fn_owner, r154_client_a,r154_client_a2,r154_staff_a,r154_client_b,r154_staff_b,r154_outsider;
          CREATE TABLE r154.subjects (
           login_name name PRIMARY KEY, office text NOT NULL, actor text NOT NULL, kind text NOT NULL CHECK(kind IN ('client','staff')),
           UNIQUE (office, actor)
          );
          INSERT INTO r154.subjects VALUES
          ('r154_client_a','office-A','client-A1','client'),
          ('r154_client_a2','office-A','client-A2','client'),
          ('r154_staff_a','office-A','staff-A','staff'),
          ('r154_client_b','office-B','client-B','client'),
          ('r154_staff_b','office-B','staff-B','staff');
          CREATE TABLE r154.bookings (
           id bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
           office text NOT NULL,
           actor text NOT NULL,
           request_key text NOT NULL,
           slot_start timestamptz NOT NULL,
           duration_minutes integer NOT NULL CHECK (duration_minutes IN (30,60,90)),
           assigned_staff text NOT NULL DEFAULT 'staff-main',
           slot_range tstzrange NOT NULL,
           CHECK (lower(slot_range) = slot_start AND upper(slot_range) = slot_start + duration_minutes*interval '1 minute'),
           status text NOT NULL DEFAULT 'requested' CHECK(status IN ('requested','confirmed','cancelled')),
           UNIQUE(office,actor,request_key),
           EXCLUDE USING gist (office WITH =, assigned_staff WITH =, slot_range WITH &&) WHERE (status='confirmed')
          );
          ALTER TABLE r154.bookings ENABLE ROW LEVEL SECURITY;
          ALTER TABLE r154.bookings FORCE ROW LEVEL SECURITY;
          CREATE POLICY fn_only ON r154.bookings FOR ALL TO r154_fn_owner USING (true) WITH CHECK (true);
          GRANT SELECT ON r154.subjects TO r154_fn_owner;
          GRANT SELECT,INSERT,UPDATE ON r154.bookings TO r154_fn_owner;
          -- Never grant raw table privileges to the login roles.
          REVOKE ALL ON r154.subjects FROM PUBLIC;
          REVOKE ALL ON r154.bookings FROM PUBLIC;
          CREATE FUNCTION r154.identity_scope() RETURNS text
          LANGUAGE plpgsql SECURITY DEFINER SET search_path=pg_catalog,r154
          AS $$ DECLARE v record; BEGIN
           SELECT office,actor,kind INTO v FROM r154.subjects WHERE login_name=session_user;
           IF NOT FOUND THEN RAISE EXCEPTION 'R154_UNKNOWN_IDENTITY'; END IF;
           RETURN v.office||':'||v.actor||':'||v.kind;
          END $$;
          CREATE FUNCTION r154.request_slot(p_key text,p_start timestamptz,p_duration int) RETURNS bigint
          LANGUAGE plpgsql SECURITY DEFINER SET search_path=pg_catalog,r154
          AS $$ DECLARE v record; v_id bigint; v_old r154.bookings%ROWTYPE; BEGIN
           SELECT office,actor,kind INTO v FROM r154.subjects WHERE login_name=session_user;
           IF NOT FOUND OR v.kind <> 'client' THEN RAISE EXCEPTION 'R154_REQUEST_FORBIDDEN'; END IF;
           IF p_key IS NULL OR length(p_key)<2 OR length(p_key)>90 OR p_start IS NULL OR
              p_start <= now() OR mod(extract(epoch FROM p_start)::bigint,1800) <> 0 OR p_duration NOT IN (30,60,90) THEN
             RAISE EXCEPTION 'R154_INVALID_REQUEST';
           END IF;
           SELECT * INTO v_old FROM r154.bookings WHERE office=v.office AND actor=v.actor AND request_key=p_key;
           IF FOUND THEN
            IF v_old.slot_start <> p_start OR v_old.duration_minutes <> p_duration THEN RAISE EXCEPTION 'R154_REPLAY_MISMATCH'; END IF;
            RETURN v_old.id;
           END IF;
           INSERT INTO r154.bookings(office,actor,request_key,slot_start,duration_minutes,slot_range)
           VALUES(v.office,v.actor,p_key,p_start,p_duration,tstzrange(p_start,p_start+p_duration*interval '1 minute','[)'))
           ON CONFLICT (office,actor,request_key) DO NOTHING RETURNING id INTO v_id;
           IF v_id IS NULL THEN
            SELECT * INTO v_old FROM r154.bookings WHERE office=v.office AND actor=v.actor AND request_key=p_key;
            IF v_old.slot_start <> p_start OR v_old.duration_minutes <> p_duration THEN RAISE EXCEPTION 'R154_REPLAY_MISMATCH'; END IF;
            RETURN v_old.id;
           END IF;
           RETURN v_id;
          END $$;
          CREATE FUNCTION r154.confirm_slot(p_id bigint) RETURNS text
          LANGUAGE plpgsql SECURITY DEFINER SET search_path=pg_catalog,r154
          AS $$ DECLARE v record; BEGIN
           SELECT office,actor,kind INTO v FROM r154.subjects WHERE login_name=session_user;
           IF NOT FOUND OR v.kind <> 'staff' THEN RAISE EXCEPTION 'R154_CONFIRM_FORBIDDEN'; END IF;
           UPDATE r154.bookings SET status='confirmed' WHERE id=p_id AND office=v.office AND status='requested';
           IF NOT FOUND THEN RAISE EXCEPTION 'R154_CONFIRM_UNAVAILABLE'; END IF;
           RETURN 'confirmed';
          END $$;
          CREATE FUNCTION r154.cancel_slot(p_id bigint) RETURNS text
          LANGUAGE plpgsql SECURITY DEFINER SET search_path=pg_catalog,r154
          AS $$ DECLARE v record; BEGIN
           SELECT office,actor,kind INTO v FROM r154.subjects WHERE login_name=session_user;
           IF NOT FOUND OR v.kind <> 'staff' THEN RAISE EXCEPTION 'R154_CANCEL_FORBIDDEN'; END IF;
           UPDATE r154.bookings SET status='cancelled' WHERE id=p_id AND office=v.office AND status='confirmed';
           IF NOT FOUND THEN RAISE EXCEPTION 'R154_CANCEL_UNAVAILABLE'; END IF;
           RETURN 'cancelled';
          END $$;
          CREATE FUNCTION r154.visible_count() RETURNS integer
          LANGUAGE plpgsql SECURITY DEFINER SET search_path=pg_catalog,r154
          AS $$ DECLARE v record; n integer; BEGIN
           SELECT office,actor,kind INTO v FROM r154.subjects WHERE login_name=session_user;
           IF NOT FOUND THEN RAISE EXCEPTION 'R154_UNKNOWN_IDENTITY'; END IF;
           SELECT count(*) INTO n FROM r154.bookings
           WHERE office=v.office AND (v.kind='staff' OR actor=v.actor);
           RETURN n;
          END $$;
          -- Deliberately non-superuser SECURITY DEFINER owner, with no login and no CREATE privilege.
          ALTER FUNCTION r154.identity_scope() OWNER TO r154_fn_owner;
          ALTER FUNCTION r154.request_slot(text,timestamptz,int) OWNER TO r154_fn_owner;
          ALTER FUNCTION r154.confirm_slot(bigint) OWNER TO r154_fn_owner;
          ALTER FUNCTION r154.cancel_slot(bigint) OWNER TO r154_fn_owner;
          ALTER FUNCTION r154.visible_count() OWNER TO r154_fn_owner;
          REVOKE ALL ON FUNCTION r154.identity_scope() FROM PUBLIC;
          REVOKE ALL ON FUNCTION r154.request_slot(text,timestamptz,int) FROM PUBLIC;
          REVOKE ALL ON FUNCTION r154.confirm_slot(bigint) FROM PUBLIC;
          REVOKE ALL ON FUNCTION r154.cancel_slot(bigint) FROM PUBLIC;
          REVOKE ALL ON FUNCTION r154.visible_count() FROM PUBLIC;
          GRANT EXECUTE ON FUNCTION r154.identity_scope() TO r154_client_a,r154_client_a2,r154_staff_a,r154_client_b,r154_staff_b;
          GRANT EXECUTE ON FUNCTION r154.request_slot(text,timestamptz,int) TO r154_client_a,r154_client_a2,r154_staff_a,r154_client_b,r154_staff_b;
          GRANT EXECUTE ON FUNCTION r154.confirm_slot(bigint) TO r154_client_a,r154_client_a2,r154_staff_a,r154_client_b,r154_staff_b;
          GRANT EXECUTE ON FUNCTION r154.cancel_slot(bigint) TO r154_client_a,r154_client_a2,r154_staff_a,r154_client_b,r154_staff_b;
          GRANT EXECUTE ON FUNCTION r154.visible_count() TO r154_client_a,r154_client_a2,r154_staff_a,r154_client_b,r154_staff_b;
          R154_PG_SQL
          cat > "$RUNNER_TEMP/r154_qa.py" <<'R154_PY_QA'
          #!/usr/bin/env python3
          """R154 disposable PostgreSQL authenticated DB-login roles reference tests.
          NOT Supabase JWT validation. No customer credentials, API calls, or writes to shared DB.
          """
          import os
          import subprocess
          import sys
          from concurrent.futures import ThreadPoolExecutor
          
          CONTAINER = os.getenv('R154_PG_CONTAINER','')
          assert CONTAINER and len(CONTAINER) > 10, 'Only the GitHub disposable container should execute R154 QA'
          PASSWORDS={
          'r154_client_a':'r154-only-client-a-ephemeral',
          'r154_client_a2':'r154-only-client-a2-ephemeral',
          'r154_staff_a':'r154-only-staff-a-ephemeral',
          'r154_client_b':'r154-only-client-b-ephemeral',
          'r154_staff_b':'r154-only-staff-b-ephemeral',
          'r154_outsider':'r154-only-outsider-ephemeral',
          }
          PASSED=[]
          def call(role,sql,password=None):
              password=PASSWORDS.get(role,'') if password is None else password
              return subprocess.run(['docker','exec','-e','PGPASSWORD='+password,CONTAINER,'psql','-XAt','-v','ON_ERROR_STOP=1','-h','127.0.0.1','-U',role,'-d','postgres','-c',sql],capture_output=True,text=True,timeout=20)
          
          def case(name,role,sql,success=True,marker=None,password=None):
              p=call(role,sql,password)
              output=p.stdout+'\n'+p.stderr
              if (p.returncode==0)!=success or (marker is not None and marker not in output):
                  raise AssertionError(f'R154_FAIL {name} role={role} expected_success={success} marker={marker} code={p.returncode} output={output[-650:]}')
              PASSED.append(name)
              print(f'R154_PASS_{len(PASSED):02d}: {name}',flush=True)
              return p.stdout.strip()
          
          if __name__=='__main__':
              # Each call opens a fresh authenticated database session. Unlike user-provided custom GUCs,
              # session_user cannot be rewritten by an ordinary SQL role.
              case('client A identity comes from PostgreSQL session_user','r154_client_a','SELECT r154.identity_scope();',marker='office-A:client-A1:client')
              case('GUC claim forgery does not alter authenticated identity','r154_client_a',"SELECT set_config('r152.office','office-B',false); SELECT set_config('request.jwt.claims','{\"office\":\"office-B\",\"role\":\"staff\"}',false); SELECT r154.identity_scope();",marker='office-A:client-A1:client')
              case('raw bookings SELECT denied','r154_client_a','SELECT count(*) FROM r154.bookings;',False,'permission denied')
              case('raw bookings INSERT denied','r154_client_a',"INSERT INTO r154.bookings(office,actor,request_key,slot_start,duration_minutes,slot_range) VALUES('office-B','client-B','bad','2030-02-10 09:00+00',30,tstzrange('2030-02-10 09:00+00','2030-02-10 09:30+00','[)'));",False,'permission denied')
              case('raw bookings UPDATE denied','r154_client_a',"UPDATE r154.bookings SET status='confirmed';",False,'permission denied')
              case('raw bookings DELETE denied','r154_client_a',"DELETE FROM r154.bookings;",False,'permission denied')
              case('role-to-office mapping cannot be edited','r154_client_a',"UPDATE r154.subjects SET office='office-B' WHERE login_name='r154_client_a';",False,'permission denied')
              case('new functions cannot be created in controlled schema','r154_client_a',"CREATE FUNCTION r154.fake() RETURNS int LANGUAGE sql AS 'SELECT 1';",False,'permission denied')
              case('client cannot SET ROLE to staff','r154_client_a','SET ROLE r154_staff_b;',False,'permission denied')
              case('client cannot SET SESSION AUTHORIZATION to staff','r154_client_a','SET SESSION AUTHORIZATION r154_staff_b;',False,'permission denied')
              case('invalid DB password rejected','r154_client_a','SELECT r154.identity_scope();',False,'password authentication failed',password='wrong-r154-test-password')
              case('nonregistered outsider cannot call privileged function','r154_outsider','SELECT r154.identity_scope();',False,'permission denied')
              case('function owner is NOLOGIN and not superuser','r154_staff_a',"SELECT rolsuper::text||'/'||rolcanlogin::text FROM pg_roles WHERE rolname='r154_fn_owner';",True,'false/false')
              case('public clients cannot access mapping table','r154_client_a','SELECT * FROM r154.subjects;',False,'permission denied')
              id1=case('client A1 requests a future 30m slot','r154_client_a',"SELECT r154.request_slot('r154-k1','2030-06-01 09:00+00',30);")
              assert id1.isdigit(),f'Invalid booking id: {id1}'
              id1_retry=case('same key same payload idempotently returns same ID','r154_client_a',"SELECT r154.request_slot('r154-k1','2030-06-01 09:00+00',30);")
              assert id1==id1_retry
              case('same key altered payload fails closed','r154_client_a',"SELECT r154.request_slot('r154-k1','2030-06-01 10:00+00',30);",False,'R154_REPLAY_MISMATCH')
              case('same-office different client cannot see A1 request','r154_client_a2','SELECT r154.visible_count();',True,'0')
              case('office A staff sees A1 request','r154_staff_a','SELECT r154.visible_count();',True,'1')
              case('office B client cannot see A1 request','r154_client_b','SELECT r154.visible_count();',True,'0')
              case('office B staff cannot confirm A booking','r154_staff_b',f'SELECT r154.confirm_slot({id1});',False,'R154_CONFIRM_UNAVAILABLE')
              case('client cannot confirm their own booking','r154_client_a',f'SELECT r154.confirm_slot({id1});',False,'R154_CONFIRM_FORBIDDEN')
              case('office A staff confirms A booking','r154_staff_a',f'SELECT r154.confirm_slot({id1});',True,'confirmed')
              case('client cannot cancel confirmed booking','r154_client_a',f'SELECT r154.cancel_slot({id1});',False,'R154_CANCEL_FORBIDDEN')
              case('office B staff cannot cancel A booking','r154_staff_b',f'SELECT r154.cancel_slot({id1});',False,'R154_CANCEL_UNAVAILABLE')
              case('office A staff can cancel own-office booking','r154_staff_a',f'SELECT r154.cancel_slot({id1});',True,'cancelled')
              bid=case('B client creates in own office','r154_client_b',"SELECT r154.request_slot('r154-b1','2030-06-01 09:00+00',30);")
              assert bid.isdigit()
              case('office A staff cannot count B office bookings','r154_staff_a','SELECT r154.visible_count();',True,'1')
              case('office B staff sees only B booking','r154_staff_b','SELECT r154.visible_count();',True,'1')
              case('15-minute start rejected','r154_client_a',"SELECT r154.request_slot('r154-bad','2030-06-01 09:15+00',30);",False,'R154_INVALID_REQUEST')
              case('past start rejected','r154_client_a',"SELECT r154.request_slot('r154-past','2025-01-01 09:00+00',30);",False,'R154_INVALID_REQUEST')
              case('staff cannot create a client booking','r154_staff_a',"SELECT r154.request_slot('r154-staff','2030-06-01 09:00+00',30);",False,'R154_REQUEST_FORBIDDEN')
              case('client spoofed claims still create in their real office','r154_client_a',"SELECT set_config('r152.office','office-B',false); SELECT r154.request_slot('r154-guc1','2030-06-01 11:00+00',30);",True)
              case('GUC-spoofed request not visible to office B','r154_staff_b','SELECT r154.visible_count();',True,'1')
              case('cross-office private records remain separate','r154_client_a2','SELECT r154.visible_count();',True,'0')
              # Real concurrent PG sessions: eight simultaneous confirms for the same office/staff/slot.
              ids=[]
              for i in range(8):
                  r=call('r154_client_a',f"SELECT r154.request_slot('r154-race-{i}','2030-07-01 09:00+00',60);")
                  assert r.returncode==0 and r.stdout.strip().isdigit(),r.stderr
                  ids.append(int(r.stdout.strip()))
              PASSED.append('eight independent pending requests created')
              print(f'R154_PASS_{len(PASSED):02d}: eight independent pending requests created',flush=True)
              with ThreadPoolExecutor(max_workers=8) as pool:
                  rs=list(pool.map(lambda x:call('r154_staff_a',f'SELECT r154.confirm_slot({x});'),ids))
              successful=[x for x in rs if x.returncode==0]
              failed=[x for x in rs if x.returncode!=0]
              assert len(successful)==1,(len(successful),[x.stderr[-240:] for x in failed])
              PASSED.append('exactly one of eight genuine PostgreSQL sessions confirms')
              print(f'R154_PASS_{len(PASSED):02d}: exactly one of eight genuine PostgreSQL sessions confirms',flush=True)
              assert len(failed)==7 and all('conflicting key value' in x.stderr for x in failed),[x.stderr[-280:] for x in failed]
              PASSED.append('seven overlaps rejected by exclusion constraint')
              print(f'R154_PASS_{len(PASSED):02d}: seven overlaps rejected by exclusion constraint',flush=True)
              # A SQL-injection-like GUC cannot change database-authenticated role identity.
              case('fake staff GUC cannot bypass authenticated client role','r154_client_a',f"SELECT set_config('r152.kind','staff',false); SELECT r154.confirm_slot({ids[0]});",False,'R154_CONFIRM_FORBIDDEN')
              print(f'R154_SUMMARY {len(PASSED)}/{len(PASSED)} PASS; synthetic DB logins only, commercial Supabase auth remains HOLD',flush=True)
          R154_PY_QA
          echo "47d562a837147a8a8e60f60a4caa1ad0d614ac8aed262fddac73f67b653e1c35  $RUNNER_TEMP/r154_disposable.sql" | sha256sum -c -
          echo "6be3a634976e70316114228de66eb2bd007b7aeca8c92a40747d789bb3989254  $RUNNER_TEMP/r154_qa.py" | sha256sum -c -
          python3 -m py_compile "$RUNNER_TEMP/r154_qa.py"
          export R154_PG_CONTAINER="${{ job.services.pg.id }}"
          test -n "$R154_PG_CONTAINER"
          docker exec -i "$R154_PG_CONTAINER" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres < "$RUNNER_TEMP/r154_disposable.sql"
          python3 "$RUNNER_TEMP/r154_qa.py"
          echo 'R154_ROLE_BOUNDARY_DISPOSABLE_QA_PASS: REAL_TENANT_DEPLOYMENT_HOLD'
      - name: Report isolation scope without approving production
        if: success()
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## R154 isolated PostgreSQL authenticated-login reference PASS
          - Real PostgreSQL 17 disposable container with separate **synthetic DB login roles**.
          - `session_user` is authenticated by PostgreSQL; client-controlled custom GUCs cannot substitute for this identity.
          - Direct table DML/SELECT forbidden; functions are owned by synthetic non-login non-superuser role.
          - Client/staff authorization, cross-office restrictions, idempotency, overlap and concurrent booking checks.
          - **IMPORTANT:** Supabase/PostgREST uses shared database roles and JWT claims; this test **does NOT validate Supabase JWT signatures, production tenant auth, or real Worker**.
          - No real LINE, storage, secrets, service-role key, shared Supabase or customer data.
          - No pushes, merges, uploads, Worker deploys, SQL to real DB, or production API calls.
          - Real-customer production release stays **HOLD**, pending 18 evidence gates and owner approval.
          EOF
