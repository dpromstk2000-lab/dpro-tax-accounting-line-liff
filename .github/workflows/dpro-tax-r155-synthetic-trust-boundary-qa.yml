name: DPRO TAX R155 Synthetic JWT Office Storage LINE Trust Boundary QA

on:
  push:
    branches: [tax-r7-staging-20261010]
    paths:
      - '.github/workflows/dpro-tax-r155-synthetic-trust-boundary-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dpro-tax-r155-synthetic-only-${{ github.ref }}
  cancel-in-progress: false

jobs:
  trust-boundary-qa:
    if: ${{ github.repository == 'dpromstk2000-lab/dpro-tax-accounting-line-liff' && github.ref == 'refs/heads/tax-r7-staging-20261010' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Read-only checkout of staging test revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Deny main, baseline drift and unintended privilege
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'dpromstk2000-lab/dpro-tax-accounting-line-liff'
          test "$GITHUB_REF" = 'refs/heads/tax-r7-staging-20261010'
          test "$(git hash-object .github/workflows/dpro-tax-r151-staging-boundary-qa.yml)" = "bd6a075f06f0692ff868067416afb5781faad6c1" || { echo "R155_PROTECTED_BASELINE_DRIFT: .github/workflows/dpro-tax-r151-staging-boundary-qa.yml"; exit 1; }
          test "$(git hash-object .github/workflows/dpro-tax-r152-disposable-postgres-booking-qa.yml)" = "8c3ed43f0f1fdc3217382f47b43c5f68763f1f37" || { echo "R155_PROTECTED_BASELINE_DRIFT: .github/workflows/dpro-tax-r152-disposable-postgres-booking-qa.yml"; exit 1; }
          test "$(git hash-object .github/workflows/dpro-tax-r153-disposable-direct-dml-qa.yml)" = "d931f63a70a560b7f447fbcef1e6fd25868fb06d" || { echo "R155_PROTECTED_BASELINE_DRIFT: .github/workflows/dpro-tax-r153-disposable-direct-dml-qa.yml"; exit 1; }
          test "$(git hash-object .github/workflows/dpro-tax-r154-disposable-auth-role-boundary-qa.yml)" = "3d5964f33675a636bf1f35e90c98d59aaaafd437" || { echo "R155_PROTECTED_BASELINE_DRIFT: .github/workflows/dpro-tax-r154-disposable-auth-role-boundary-qa.yml"; exit 1; }
          test "$(git hash-object app.js)" = "4c3475219e5c7fc9203ec5e5143d4f6eb8299423" || { echo "R155_PROTECTED_BASELINE_DRIFT: app.js"; exit 1; }
          test "$(git hash-object config.js)" = "da1876bae8333a3a10ee13495c0063ded0c2b351" || { echo "R155_PROTECTED_BASELINE_DRIFT: config.js"; exit 1; }
          echo R155_BASELINE_IMMUTABLE
      - name: Run deterministic isolated authorization and signed webhook contract tests
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/r155_qa.py" <<'PY_R155_LOCAL_ONLY'
          #!/usr/bin/env python3
          """R155 synthetic-only credential, office, file, and LINE boundary tests.

          REFERENCE QA ONLY. Never deploy this module. It does not validate the real
          Supabase JWT keys, LINE production secret, PostgREST, RLS, Worker, or storage.
          """
          import base64
          import hashlib
          import hmac
          import json
          import re
          import sys
          from dataclasses import dataclass
          from types import MappingProxyType

          NOW = 1791763200  # fixed synthetic epoch, no machine clock dependency
          ISS = 'https://issuer.r155.invalid/'
          AUD = 'dpro-tax-r155-synthetic'
          KID = 'synthetic-hs256-key-1'
          JWT_KEY = b'R155-SYNTHETIC-ONLY-SIGNING-KEY-NOT-FOR-DEPLOYMENT-32-BYTES'
          LINE_KEYS = MappingProxyType({
              'synthetic-line-channel-a': (b'synthetic-line-secret-a-DO-NOT-DEPLOY','office-A'),
              'synthetic-line-channel-b': (b'synthetic-line-secret-b-DO-NOT-DEPLOY','office-B'),
          })

          @dataclass(frozen=True)
          class Principal:
              subject: str
              office: str
              kind: str
              client: str

          # Office/role are server-maintained, NOT copied from request body or GUC.
          MEMBERSHIPS = MappingProxyType({
              'sub-client-a1': Principal('sub-client-a1', 'office-A', 'client', 'client-A1'),
              'sub-client-a2': Principal('sub-client-a2', 'office-A', 'client', 'client-A2'),
              'sub-staff-a': Principal('sub-staff-a', 'office-A', 'staff', ''),
              'sub-client-b1': Principal('sub-client-b1', 'office-B', 'client', 'client-B1'),
              'sub-staff-b': Principal('sub-staff-b', 'office-B', 'staff', ''),
          })

          class Denied(Exception):
              pass


          def strict_json(raw):
              def reject_duplicates(pairs):
                  output = {}
                  for k, v in pairs:
                      if k in output:
                          raise Denied('DUPLICATE_JSON_FIELD')
                      output[k] = v
                  return output
              try:
                  return json.loads(raw, object_pairs_hook=reject_duplicates,
                                    parse_constant=lambda _: (_ for _ in ()).throw(Denied('NONFINITE_JSON')))
              except (ValueError, UnicodeDecodeError) as exc:
                  raise Denied('MALFORMED_JSON') from exc


          def b64url(data):
              return base64.urlsafe_b64encode(data).decode('ascii').rstrip('=')


          def dec64(value):
              if not isinstance(value, str) or not value or not re.fullmatch('[A-Za-z0-9_-]+', value):
                  raise Denied('NONCANONICAL_B64URL')
              try:
                  raw = base64.urlsafe_b64decode(value + ('=' * (-len(value) % 4)))
              except (ValueError, base64.binascii.Error) as exc:
                  raise Denied('NONCANONICAL_B64URL') from exc
              if b64url(raw) != value:
                  raise Denied('NONCANONICAL_B64URL')
              return raw


          def encode_token(subject='sub-client-a1', changes=None, header=None, key=JWT_KEY):
              claims = {'iss': ISS, 'aud': AUD, 'sub': subject, 'iat': NOW - 30,
                        'nbf': NOW - 30, 'exp': NOW + 300, 'jti': 'r155-test-token-01'}
              if changes:
                  claims.update(changes)
              h = {'typ': 'JWT', 'alg': 'HS256', 'kid': KID}
              if header:
                  h.update(header)
              p = b64url(json.dumps(h, separators=(',', ':'), sort_keys=True).encode())
              q = b64url(json.dumps(claims, separators=(',', ':'), sort_keys=True).encode())
              signature = b64url(hmac.new(key, (p+'.'+q).encode('ascii'), hashlib.sha256).digest())
              return p+'.'+q+'.'+signature


          def jwt_with_raw(header, payload):
              h = b64url(header.encode())
              p = b64url(payload.encode())
              return h+'.'+p+'.'+b64url(hmac.new(JWT_KEY, (h+'.'+p).encode(), hashlib.sha256).digest())


          def authenticated_principal(jwt, now=NOW):
              if not isinstance(jwt, str) or len(jwt) > 4096 or jwt.count('.') != 2:
                  raise Denied('TOKEN_SHAPE')
              parts = jwt.split('.')
              header = strict_json(dec64(parts[0]))
              claims = strict_json(dec64(parts[1]))
              signature = dec64(parts[2])
              if not isinstance(header, dict) or not isinstance(claims, dict):
                  raise Denied('TOKEN_STRUCTURE')
              if set(header) != {'typ', 'alg', 'kid'} or header != {'typ': 'JWT', 'alg': 'HS256', 'kid': KID}:
                  raise Denied('HEADER_ALLOWLIST')
              expected = hmac.new(JWT_KEY, (parts[0]+'.'+parts[1]).encode(), hashlib.sha256).digest()
              if len(signature) != 32 or not hmac.compare_digest(signature, expected):
                  raise Denied('INVALID_SIGNATURE')
              if claims.get('iss') != ISS or claims.get('aud') != AUD:
                  raise Denied('ISSUER_AUDIENCE')
              for key in ('iat', 'nbf', 'exp'):
                  if type(claims.get(key)) is not int:
                      raise Denied('TIMESTAMP_TYPE')
              if claims['exp'] <= now or claims['iat'] > now + 30 or claims['nbf'] > now + 30:
                  raise Denied('TOKEN_TIME')
              if claims['nbf'] > claims['exp'] or claims['iat'] > claims['exp'] or claims['exp'] - claims['iat'] > 900:
                  raise Denied('TOKEN_LIFETIME')
              subject = claims.get('sub')
              if not isinstance(subject, str) or not re.fullmatch(r'sub-[a-z][a-z0-9-]{2,40}', subject):
                  raise Denied('SUBJECT_SHAPE')
              if not isinstance(claims.get('jti'), str) or not re.fullmatch(r'[A-Za-z0-9-]{8,64}', claims['jti']):
                  raise Denied('TOKEN_ID')
              principal = MEMBERSHIPS.get(subject)
              if principal is None:
                  raise Denied('MEMBERSHIP_UNKNOWN')
              if 'office_id' in claims and claims['office_id'] != principal.office:
                  raise Denied('OFFICE_CLAIM_MISMATCH')
              if 'role' in claims and claims['role'] != principal.kind:
                  raise Denied('ROLE_CLAIM_MISMATCH')
              return principal


          def authorize(principal, action, requested_office=None, requested_client=None):
              if requested_office is not None and requested_office != principal.office:
                  raise Denied('OFFICE_SCOPE_MISMATCH')
              rules = {'client.view': 'client', 'client.request': 'client', 'client.file': 'client',
                       'staff.review': 'staff', 'staff.confirm': 'staff', 'staff.file': 'staff'}
              if rules.get(action) != principal.kind:
                  raise Denied('ROLE_ACTION_DENIED')
              if requested_client is not None:
                  if principal.kind == 'client' and requested_client != principal.client:
                      raise Denied('CLIENT_SCOPE_MISMATCH')
                  if requested_client not in CLIENT_OFFICES or CLIENT_OFFICES[requested_client] != principal.office:
                      raise Denied('CROSS_OFFICE_CLIENT')
              return principal.office

          CLIENT_OFFICES = MappingProxyType({'client-A1':'office-A','client-A2':'office-A','client-B1':'office-B'})


          def file_key(principal, client, filename):
              authorize(principal, 'client.file' if principal.kind == 'client' else 'staff.file', requested_client=client)
              if not isinstance(filename, str) or not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._-]{0,79}', filename):
                  raise Denied('UNSAFE_FILE_NAME')
              if filename in ('.','..') or filename.startswith('..') or '..' in filename:
                  raise Denied('FILE_TRAVERSAL')
              return f'tenants/{principal.office}/{client}/{filename}'

          class BookingRequests:
              def __init__(self):
                  self.bookings = {}
              def submit(self, principal, request_key, payload, office_hint=None):
                  authorize(principal, 'client.request', requested_office=office_hint)
                  if not isinstance(request_key, str) or not re.fullmatch('[A-Za-z0-9_-]{6,70}', request_key):
                      raise Denied('INVALID_IDEMPOTENCY_KEY')
                  if type(payload) is not tuple or len(payload) != 2 or payload[1] not in (30,60,90):
                      raise Denied('INVALID_SLOT_PAYLOAD')
                  idx = (principal.office, principal.client, request_key)
                  if idx in self.bookings:
                      if self.bookings[idx] != payload:
                          raise Denied('ALTERED_IDEMPOTENCY_REPLAY')
                      return idx
                  self.bookings[idx] = payload
                  return idx


          def line_body(channel='synthetic-line-channel-a', eid='r155-webhook-001', timestamp=None, destination=None):
              if timestamp is None:
                  timestamp = NOW * 1000
              msg = {'destination': destination or channel, 'events': [
                  {'type':'message', 'webhookEventId':eid, 'timestamp':timestamp,
                   'source':{'type':'user','userId':'synthetic-user-001'}}]}
              return json.dumps(msg, separators=(',', ':'), sort_keys=True).encode()


          def line_signature(body, channel='synthetic-line-channel-a', key=None):
              secret = key if key is not None else LINE_KEYS[channel][0]
              return base64.b64encode(hmac.new(secret, body, hashlib.sha256).digest()).decode('ascii')

          class WebhookLedger:
              """In-memory test ledger. Real delivery needs durable transactional deduplication."""
              def __init__(self):
                  self.seen = set()
              def ingest(self, configured_channel, body, signature):
                  info = LINE_KEYS.get(configured_channel)
                  if info is None or not isinstance(body, bytes) or len(body) > 32768:
                      raise Denied('UNTRUSTED_CHANNEL_OR_BODY')
                  if not isinstance(signature,str) or not re.fullmatch('[A-Za-z0-9+/]{43}=', signature):
                      raise Denied('LINE_SIGNATURE_SHAPE')
                  expected = line_signature(body, configured_channel)
                  if not hmac.compare_digest(signature, expected):
                      raise Denied('LINE_SIGNATURE_INVALID')
                  message = strict_json(body)
                  if not isinstance(message, dict) or message.get('destination') != configured_channel:
                      raise Denied('LINE_DESTINATION_MISMATCH')
                  events = message.get('events')
                  if not isinstance(events,list) or len(events) != 1 or not isinstance(events[0],dict):
                      raise Denied('LINE_EVENT_SHAPE')
                  event = events[0]
                  event_id = event.get('webhookEventId')
                  if not isinstance(event_id,str) or not re.fullmatch('[A-Za-z0-9_-]{8,90}', event_id):
                      raise Denied('LINE_EVENT_ID')
                  if type(event.get('timestamp')) is not int or event['timestamp'] > (NOW+300)*1000:
                      raise Denied('LINE_FUTURE_TIMESTAMP')
                  # Old redeliveries are intentionally not rejected by age alone.
                  key = (configured_channel,event_id)
                  if key in self.seen:
                      raise Denied('LINE_DUPLICATE_EVENT')
                  self.seen.add(key)
                  return info[1]

          PASSED = []
          def ok(name, fn, expected=None):
              actual = fn()
              if expected is not None and actual != expected:
                  raise AssertionError((name, actual, expected))
              PASSED.append(name)
              print(f'R155_PASS_{len(PASSED):02d}: {name}',flush=True)

          def deny(name, fn, code=None):
              try:
                  fn()
              except Denied as exc:
                  if code is not None and str(exc) != code:
                      raise AssertionError(f'{name} wrong refusal {exc}, expected {code}') from exc
              else:
                  raise AssertionError(f'{name}: expected denial')
              PASSED.append(name)
              print(f'R155_PASS_{len(PASSED):02d}: {name}',flush=True)

          if __name__ == '__main__':
              ca = authenticated_principal(encode_token())
              c2 = authenticated_principal(encode_token('sub-client-a2'))
              sa = authenticated_principal(encode_token('sub-staff-a'))
              cb = authenticated_principal(encode_token('sub-client-b1'))
              sb = authenticated_principal(encode_token('sub-staff-b'))
              ok('client A1 signed JWT maps to server office A', lambda: ca.office, 'office-A')
              ok('client A2 is distinct subject', lambda: c2.client, 'client-A2')
              ok('staff A maps to staff-only server role', lambda: sa.kind, 'staff')
              ok('client B maps to office B', lambda: cb.office, 'office-B')
              ok('staff B maps to office B', lambda: sb.office, 'office-B')
              deny('wrong HMAC signing key', lambda: authenticated_principal(encode_token(key=b'bad-synthetic-key')), 'INVALID_SIGNATURE')
              tok = encode_token()
              tampered = tok.split('.')
              tampered[1] = b64url(json.dumps({'sub':'sub-staff-a','iss':ISS,'aud':AUD}).encode())
              deny('payload substitution invalidates signature', lambda: authenticated_principal('.'.join(tampered)), 'INVALID_SIGNATURE')
              deny('alg none forbidden', lambda: authenticated_principal(encode_token(header={'alg':'none'})), 'HEADER_ALLOWLIST')
              deny('RS256/HS256 algorithm confusion forbidden', lambda: authenticated_principal(encode_token(header={'alg':'RS256'})), 'HEADER_ALLOWLIST')
              deny('unknown signing key ID', lambda: authenticated_principal(encode_token(header={'kid':'remote-key'})), 'HEADER_ALLOWLIST')
              deny('untrusted issuer', lambda: authenticated_principal(encode_token(changes={'iss':'https://attacker.invalid'})), 'ISSUER_AUDIENCE')
              deny('untrusted audience', lambda: authenticated_principal(encode_token(changes={'aud':'other-service'})), 'ISSUER_AUDIENCE')
              deny('expired JWT', lambda: authenticated_principal(encode_token(changes={'exp':NOW-1})), 'TOKEN_TIME')
              deny('future not-before JWT', lambda: authenticated_principal(encode_token(changes={'nbf':NOW+100})), 'TOKEN_TIME')
              deny('issued far in the future', lambda: authenticated_principal(encode_token(changes={'iat':NOW+100})), 'TOKEN_TIME')
              deny('overlong JWT lifetime', lambda: authenticated_principal(encode_token(changes={'exp':NOW+1800})), 'TOKEN_LIFETIME')
              deny('missing subject', lambda: authenticated_principal(encode_token(changes={'sub':None})), 'SUBJECT_SHAPE')
              deny('unknown membership subject', lambda: authenticated_principal(encode_token('sub-client-unknown')), 'MEMBERSHIP_UNKNOWN')
              deny('malformed token segments', lambda: authenticated_principal('a.b'), 'TOKEN_SHAPE')
              deny('invalid base64url segment', lambda: authenticated_principal('a$.b.c'), 'NONCANONICAL_B64URL')
              deny('token size bound', lambda: authenticated_principal('A'*5000), 'TOKEN_SHAPE')
              raw_header='{"typ":"JWT","alg":"HS256","kid":"'+KID+'"}'
              raw_claim='{"iss":"'+ISS+'","aud":"'+AUD+'","sub":"sub-client-a1","sub":"sub-staff-a"}'
              deny('duplicate JSON claim rejected', lambda: authenticated_principal(jwt_with_raw(raw_header,raw_claim)), 'DUPLICATE_JSON_FIELD')
              deny('duplicate JSON header rejected', lambda: authenticated_principal(jwt_with_raw('{"typ":"JWT","alg":"HS256","alg":"none","kid":"'+KID+'"}', '{}')), 'DUPLICATE_JSON_FIELD')
              deny('non-object payload rejected', lambda: authenticated_principal(jwt_with_raw(raw_header,'[]')), 'TOKEN_STRUCTURE')
              deny('boolean timestamp rejected', lambda: authenticated_principal(encode_token(changes={'exp':True})), 'TIMESTAMP_TYPE')
              deny('signed cross-office claim rejected', lambda: authenticated_principal(encode_token(changes={'office_id':'office-B'})), 'OFFICE_CLAIM_MISMATCH')
              deny('signed privilege escalation rejected', lambda: authenticated_principal(encode_token(changes={'role':'staff'})), 'ROLE_CLAIM_MISMATCH')
              ok('consistent signed office claim permitted', lambda: authenticated_principal(encode_token(changes={'office_id':'office-A'})).office, 'office-A')
              ok('consistent signed client claim permitted', lambda: authenticated_principal(encode_token(changes={'role':'client'})).kind, 'client')
              ok('client views own office', lambda: authorize(ca,'client.view',requested_office='office-A'), 'office-A')
              deny('client A cannot select office B', lambda: authorize(ca,'client.view',requested_office='office-B'), 'OFFICE_SCOPE_MISMATCH')
              deny('client A cannot view A2 data', lambda: authorize(ca,'client.view',requested_client='client-A2'), 'CLIENT_SCOPE_MISMATCH')
              deny('client A cannot approve staff workflow', lambda: authorize(ca,'staff.confirm'), 'ROLE_ACTION_DENIED')
              deny('staff A cannot access office B', lambda: authorize(sa,'staff.review',requested_office='office-B'), 'OFFICE_SCOPE_MISMATCH')
              deny('staff B cannot access office A client', lambda: authorize(sb,'staff.file',requested_client='client-A1'), 'CROSS_OFFICE_CLIENT')
              ok('staff A can review own office', lambda: authorize(sa,'staff.review'), 'office-A')
              ok('staff B can review own office', lambda: authorize(sb,'staff.review'), 'office-B')
              deny('staff cannot impersonate client operation', lambda: authorize(sa,'client.request'), 'ROLE_ACTION_DENIED')
              deny('unrecognized permission denied', lambda: authorize(sa,'admin.export'), 'ROLE_ACTION_DENIED')
              ok('client file prefix sourced from server identity', lambda: file_key(ca,'client-A1','invoice-001.pdf'), 'tenants/office-A/client-A1/invoice-001.pdf')
              deny('client cannot get another client file', lambda: file_key(ca,'client-A2','invoice-001.pdf'), 'CLIENT_SCOPE_MISMATCH')
              deny('file traversal refused', lambda: file_key(ca,'client-A1','../secret.txt'), 'UNSAFE_FILE_NAME')
              deny('slash path refused', lambda: file_key(ca,'client-A1','other/path.pdf'), 'UNSAFE_FILE_NAME')
              deny('backslash traversal refused', lambda: file_key(ca,'client-A1','..\\secrets'), 'UNSAFE_FILE_NAME')
              deny('encoded traversal refused', lambda: file_key(ca,'client-A1','%2e%2e%2fhidden'), 'UNSAFE_FILE_NAME')
              deny('control character filename refused', lambda: file_key(ca,'client-A1','abc\x00.txt'), 'UNSAFE_FILE_NAME')
              ok('staff A file scoped to same office', lambda: file_key(sa,'client-A2','form.pdf'), 'tenants/office-A/client-A2/form.pdf')
              deny('staff A file cannot access office B', lambda: file_key(sa,'client-B1','form.pdf'), 'CROSS_OFFICE_CLIENT')
              bk = BookingRequests()
              ok('idempotent request succeeds', lambda: bk.submit(ca,'synthetic-key-111',('2030-01-01T09:00Z',30)),('office-A','client-A1','synthetic-key-111'))
              ok('identical replay returns same request key', lambda: bk.submit(ca,'synthetic-key-111',('2030-01-01T09:00Z',30)),('office-A','client-A1','synthetic-key-111'))
              deny('altered payload fails idempotency gate', lambda: bk.submit(ca,'synthetic-key-111',('2030-01-01T10:00Z',30)), 'ALTERED_IDEMPOTENCY_REPLAY')
              ok('distinct client same key isolated',lambda:bk.submit(c2,'synthetic-key-111',('2030-01-01T10:00Z',30)), ('office-A','client-A2','synthetic-key-111'))
              deny('request office spoof denied',lambda:bk.submit(ca,'synthetic-key-222',('2030-01-01T11:00Z',30),'office-B'),'OFFICE_SCOPE_MISMATCH')
              deny('malformed idempotency key denied',lambda:bk.submit(ca,'../bad',('2030-01-01T11:00Z',30)),'INVALID_IDEMPOTENCY_KEY')
              deny('bad duration denied',lambda:bk.submit(ca,'synthetic-key-333',('2030-01-01T11:00Z',15)),'INVALID_SLOT_PAYLOAD')
              wb = line_body()
              ws = line_signature(wb)
              ledger = WebhookLedger()
              ok('valid synthetic LINE signature accepted into server-mapped office',lambda:ledger.ingest('synthetic-line-channel-a',wb,ws),'office-A')
              deny('duplicate LINE webhook event blocked',lambda:ledger.ingest('synthetic-line-channel-a',wb,ws),'LINE_DUPLICATE_EVENT')
              deny('tampered webhook content rejected',lambda:WebhookLedger().ingest('synthetic-line-channel-a',wb+b' ',ws),'LINE_SIGNATURE_INVALID')
              deny('wrong channel signature rejected',lambda:WebhookLedger().ingest('synthetic-line-channel-b',wb,ws),'LINE_SIGNATURE_INVALID')
              deny('wrong LINE HMAC signing key rejected',lambda:WebhookLedger().ingest('synthetic-line-channel-a',wb,line_signature(wb,key=b'wrong')),'LINE_SIGNATURE_INVALID')
              deny('unknown channel refused',lambda:WebhookLedger().ingest('outside-channel',wb,ws),'UNTRUSTED_CHANNEL_OR_BODY')
              wb_other=line_body(destination='synthetic-line-channel-b')
              deny('signed body with destination mismatch refused',lambda:WebhookLedger().ingest('synthetic-line-channel-a',wb_other,line_signature(wb_other)),'LINE_DESTINATION_MISMATCH')
              wb_future=line_body(timestamp=(NOW+600)*1000)
              deny('future timestamp refused',lambda:WebhookLedger().ingest('synthetic-line-channel-a',wb_future,line_signature(wb_future)),'LINE_FUTURE_TIMESTAMP')
              wb_old=line_body(eid='synthetic-old-event',timestamp=(NOW-86400)*1000)
              ok('old signed retry not denied solely for age',lambda:WebhookLedger().ingest('synthetic-line-channel-a',wb_old,line_signature(wb_old)),'office-A')
              wb_dup=b'{"destination":"synthetic-line-channel-a","events":[],"events":[]}'
              deny('duplicate JSON event list field denied',lambda:WebhookLedger().ingest('synthetic-line-channel-a',wb_dup,line_signature(wb_dup)),'DUPLICATE_JSON_FIELD')
              wb_empty=b'{"destination":"synthetic-line-channel-a","events":[]}'
              deny('empty synthetic webhook events refused',lambda:WebhookLedger().ingest('synthetic-line-channel-a',wb_empty,line_signature(wb_empty)),'LINE_EVENT_SHAPE')
              ok('same event identifier on separate trusted channel is independently scoped',lambda:WebhookLedger().ingest('synthetic-line-channel-b',line_body(channel='synthetic-line-channel-b'),line_signature(line_body(channel='synthetic-line-channel-b'),'synthetic-line-channel-b')),'office-B')
              assert len(PASSED) >= 60
              print('R155_SUMMARY',len(PASSED),'/',len(PASSED),'PASS',flush=True)
              print('R155_SYNTHETIC_BOUNDARY_QA_PASS: REAL_SUPABASE_LINE_AND_PRODUCTION_RELEASE_HOLD',flush=True)
          PY_R155_LOCAL_ONLY
