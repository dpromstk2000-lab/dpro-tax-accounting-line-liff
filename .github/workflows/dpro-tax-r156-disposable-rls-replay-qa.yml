name: DPRO TAX R156 Disposable PostgreSQL RLS and Persistent Replay QA

on:
  push:
    branches: [tax-r7-staging-20261010]
    paths:
      - '.github/workflows/dpro-tax-r156-disposable-rls-replay-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dpro-tax-r156-isolated-only-${{ github.ref }}
  cancel-in-progress: false

jobs:
  disposable-rls-replay-qa:
    if: ${{ github.repository == 'dpromstk2000-lab/dpro-tax-accounting-line-liff' && github.ref == 'refs/heads/tax-r7-staging-20261010' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      pg:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: r156-disposable-postgres-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - name: Read only pinned staging checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Confirm branch source integrity and production isolation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'dpromstk2000-lab/dpro-tax-accounting-line-liff'
          test "$GITHUB_REF" = 'refs/heads/tax-r7-staging-20261010'
          test "$(git hash-object .github/workflows/dpro-tax-r151-staging-boundary-qa.yml)" = "bd6a075f06f0692ff868067416afb5781faad6c1" || { echo "R156_BASELINE_DRIFT .github/workflows/dpro-tax-r151-staging-boundary-qa.yml"; exit 1; }
          test "$(git hash-object .github/workflows/dpro-tax-r152-disposable-postgres-booking-qa.yml)" = "8c3ed43f0f1fdc3217382f47b43c5f68763f1f37" || { echo "R156_BASELINE_DRIFT .github/workflows/dpro-tax-r152-disposable-postgres-booking-qa.yml"; exit 1; }
          test "$(git hash-object .github/workflows/dpro-tax-r153-disposable-direct-dml-qa.yml)" = "d931f63a70a560b7f447fbcef1e6fd25868fb06d" || { echo "R156_BASELINE_DRIFT .github/workflows/dpro-tax-r153-disposable-direct-dml-qa.yml"; exit 1; }
          test "$(git hash-object .github/workflows/dpro-tax-r154-disposable-auth-role-boundary-qa.yml)" = "3d5964f33675a636bf1f35e90c98d59aaaafd437" || { echo "R156_BASELINE_DRIFT .github/workflows/dpro-tax-r154-disposable-auth-role-boundary-qa.yml"; exit 1; }
          test "$(git hash-object .github/workflows/dpro-tax-r155-synthetic-trust-boundary-qa.yml)" = "e21797ce5271a949c337b6bcf85d3d1339ce4ffd" || { echo "R156_BASELINE_DRIFT .github/workflows/dpro-tax-r155-synthetic-trust-boundary-qa.yml"; exit 1; }
          test "$(git hash-object app.js)" = "4c3475219e5c7fc9203ec5e5143d4f6eb8299423" || { echo "R156_BASELINE_DRIFT app.js"; exit 1; }
          test "$(git hash-object config.js)" = "da1876bae8333a3a10ee13495c0063ded0c2b351" || { echo "R156_BASELINE_DRIFT config.js"; exit 1; }
          test -z "$(git status --porcelain)"
          echo R156_BASELINE_READONLY_OK
      - name: Verify durable RLS and replay ledger on disposable PostgreSQL 17
        shell: bash
        run: |
          set -euo pipefail
          R156_PG_CONTAINER="$(docker ps --filter ancestor=postgres:17-alpine --format '{{.ID}}' | head -n 1)"
          test -n "$R156_PG_CONTAINER"
          echo "R156_DISPOSABLE_POSTGRES_ONLY"
          cat > "$RUNNER_TEMP/r156_qa.py" <<'PY_R156_SYNTHETIC_DISPOSABLE_ONLY'
          #!/usr/bin/env python3
          """R156 isolated PostgreSQL RLS+durable idempotency reference.
          
          Only run in disposable CI. NOT deployable production SQL. This reference
          assumes an upstream JWT verifier has already authenticated the subject.
          Custom PostgreSQL GUC values are NOT an authentication mechanism.
          """
          import concurrent.futures
          import os
          import re
          import subprocess
          import sys
          
          CONTAINER = os.environ.get('R156_PG_CONTAINER', '')
          if not re.fullmatch(r'[0-9a-f]{12,64}', CONTAINER):
              raise SystemExit('R156_FAIL: disposable PostgreSQL container id required')
          TESTS = []
          
          def sql(query):
              p = subprocess.run(['docker','exec','-i','-u','postgres',CONTAINER,
                                  'psql','-XAt','-v','ON_ERROR_STOP=1','-U','postgres','-d','postgres'],
                                 input=query, text=True,capture_output=True,timeout=45)
              return p
          
          def check(name, role, subject, statement, expected=None, error=None):
              assert re.fullmatch(r'r156_(authenticated|gateway)',role),role
              assert subject is None or re.fullmatch(r'[A-Za-z0-9_]+',subject),subject
              prefix='BEGIN; SET LOCAL ROLE '+role+'; '
              if subject is not None:
                  prefix += "SET LOCAL request.jwt.claim.sub = '"+subject+"'; "
              p=sql(prefix+statement+'; COMMIT;')
              stdout=p.stdout.strip().splitlines()
              if error:
                  if p.returncode == 0 or error not in p.stderr:
                      raise AssertionError('R156_FAIL '+name+' wrong denial: '+p.stderr[-450:]+' OUT='+p.stdout[-200:])
              elif p.returncode != 0 or not stdout or stdout[-1] != 'COMMIT' or (expected is not None and expected not in stdout):
                  raise AssertionError('R156_FAIL '+name+' code='+str(p.returncode)+' err='+p.stderr[-450:]+' OUT='+p.stdout[-350:])
              TESTS.append(name)
              print(f'R156_PASS_{len(TESTS):02d}: {name}',flush=True)
              return p.stdout
          
          SCHEMA = r'''
          -- R156 EPHEMERAL REFERENCE SCHEMA: DO NOT DEPLOY TO SUPABASE.
          CREATE SCHEMA r156;
          CREATE ROLE r156_authenticated NOLOGIN;
          CREATE ROLE r156_gateway NOLOGIN;
          CREATE ROLE r156_fn_owner NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE;
          REVOKE ALL ON SCHEMA r156 FROM PUBLIC;
          GRANT USAGE ON SCHEMA r156 TO r156_authenticated, r156_gateway, r156_fn_owner;
          CREATE TABLE r156.memberships(subject text PRIMARY KEY, office text NOT NULL,
            client text, actor_kind text NOT NULL CHECK(actor_kind IN ('client','staff')),
            CHECK((actor_kind='client')=(client IS NOT NULL)));
          INSERT INTO r156.memberships VALUES
           ('clientA1','A','A1','client'),('clientA2','A','A2','client'),
           ('clientB1','B','B1','client'),('staffA','A',NULL,'staff'),
           ('staffB','B',NULL,'staff');
          CREATE TABLE r156.documents(id bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
           office text NOT NULL, client text NOT NULL, title text NOT NULL);
          INSERT INTO r156.documents(office,client,title) VALUES
           ('A','A1','a1_private'),('A','A2','a2_private'),('B','B1','b1_private');
          GRANT SELECT ON r156.memberships TO r156_fn_owner;
          CREATE FUNCTION r156.can_read(p_office text,p_client text) RETURNS boolean
           LANGUAGE sql STABLE SECURITY DEFINER SET search_path=pg_catalog,r156
           AS $$ SELECT EXISTS(SELECT 1 FROM r156.memberships m
            WHERE m.subject = current_setting('request.jwt.claim.sub', true)
            AND m.office=p_office AND (m.actor_kind='staff' OR (m.actor_kind='client' AND m.client=p_client))) $$;
          CREATE FUNCTION r156.can_write(p_office text) RETURNS boolean
           LANGUAGE sql STABLE SECURITY DEFINER SET search_path=pg_catalog,r156
           AS $$ SELECT EXISTS(SELECT 1 FROM r156.memberships m
            WHERE m.subject = current_setting('request.jwt.claim.sub', true)
            AND m.office=p_office AND m.actor_kind='staff') $$;
          ALTER FUNCTION r156.can_read(text,text) OWNER TO r156_fn_owner;
          ALTER FUNCTION r156.can_write(text) OWNER TO r156_fn_owner;
          REVOKE ALL ON FUNCTION r156.can_read(text,text) FROM PUBLIC;
          REVOKE ALL ON FUNCTION r156.can_write(text) FROM PUBLIC;
          GRANT EXECUTE ON FUNCTION r156.can_read(text,text),r156.can_write(text) TO r156_authenticated;
          ALTER TABLE r156.documents ENABLE ROW LEVEL SECURITY;
          ALTER TABLE r156.documents FORCE ROW LEVEL SECURITY;
          CREATE POLICY docs_read ON r156.documents FOR SELECT TO r156_authenticated
           USING (r156.can_read(office,client));
          CREATE POLICY docs_update ON r156.documents FOR UPDATE TO r156_authenticated
           USING (r156.can_write(office)) WITH CHECK(r156.can_write(office));
          GRANT SELECT,UPDATE ON r156.documents TO r156_authenticated;
          -- Gateway-only persistent ledgers: no direct raw table privileges for clients.
          CREATE TABLE r156.channels(channel text PRIMARY KEY, office text NOT NULL);
          INSERT INTO r156.channels VALUES ('channel_A','A'),('channel_B','B');
          CREATE TABLE r156.webhook_ledger(channel text NOT NULL, event_id text NOT NULL,
           payload_digest text NOT NULL, PRIMARY KEY(channel,event_id));
          CREATE TABLE r156.idempotency_ledger(office text NOT NULL, subject text NOT NULL,
           request_key text NOT NULL, payload_digest text NOT NULL,
           PRIMARY KEY(office,subject,request_key));
          ALTER TABLE r156.webhook_ledger OWNER TO r156_fn_owner;
          ALTER TABLE r156.idempotency_ledger OWNER TO r156_fn_owner;
          GRANT SELECT ON r156.channels TO r156_fn_owner;
          CREATE FUNCTION r156.record_event(p_channel text,p_event text,p_digest text) RETURNS text
           LANGUAGE plpgsql VOLATILE SECURITY DEFINER SET search_path=pg_catalog,r156 AS $$
           DECLARE v_office text; v_inserted text; v_old text;
           BEGIN
            SELECT office INTO v_office FROM r156.channels WHERE channel=p_channel;
            IF NOT FOUND OR p_event IS NULL OR p_digest IS NULL OR length(p_event) NOT BETWEEN 2 AND 100
                OR length(p_digest) <> 64 OR p_digest !~ '^[a-f0-9]{64}$' THEN
               RAISE EXCEPTION 'R156_EVENT_INPUT_DENIED';
            END IF;
            INSERT INTO r156.webhook_ledger(channel,event_id,payload_digest)
             VALUES(p_channel,p_event,p_digest)
             ON CONFLICT DO NOTHING RETURNING event_id INTO v_inserted;
            IF v_inserted IS NOT NULL THEN RETURN 'new'; END IF;
            SELECT payload_digest INTO v_old FROM r156.webhook_ledger WHERE channel=p_channel AND event_id=p_event;
            IF v_old IS DISTINCT FROM p_digest THEN RAISE EXCEPTION 'R156_EVENT_REPLAY_MISMATCH'; END IF;
            RETURN 'duplicate';
           END $$;
          CREATE FUNCTION r156.record_request(p_office text,p_subject text,p_key text,p_digest text) RETURNS text
           LANGUAGE plpgsql VOLATILE SECURITY DEFINER SET search_path=pg_catalog,r156 AS $$
           DECLARE v_office text; v_kind text; v_inserted text; v_old text;
           BEGIN
            SELECT office,actor_kind INTO v_office,v_kind FROM r156.memberships WHERE subject=p_subject;
            IF NOT FOUND OR v_office <> p_office OR v_kind <> 'client' OR p_key IS NULL
               OR length(p_key) NOT BETWEEN 2 AND 100 OR p_digest IS NULL
               OR length(p_digest) <> 64 OR p_digest !~ '^[a-f0-9]{64}$' THEN
              RAISE EXCEPTION 'R156_REQUEST_SCOPE_DENIED';
            END IF;
            INSERT INTO r156.idempotency_ledger(office,subject,request_key,payload_digest)
             VALUES(p_office,p_subject,p_key,p_digest)
             ON CONFLICT DO NOTHING RETURNING request_key INTO v_inserted;
            IF v_inserted IS NOT NULL THEN RETURN 'new'; END IF;
            SELECT payload_digest INTO v_old FROM r156.idempotency_ledger
              WHERE office=p_office AND subject=p_subject AND request_key=p_key;
            IF v_old IS DISTINCT FROM p_digest THEN RAISE EXCEPTION 'R156_REQUEST_REPLAY_MISMATCH'; END IF;
            RETURN 'duplicate';
           END $$;
          ALTER FUNCTION r156.record_event(text,text,text) OWNER TO r156_fn_owner;
          ALTER FUNCTION r156.record_request(text,text,text,text) OWNER TO r156_fn_owner;
          REVOKE ALL ON FUNCTION r156.record_event(text,text,text) FROM PUBLIC;
          REVOKE ALL ON FUNCTION r156.record_request(text,text,text,text) FROM PUBLIC;
          GRANT EXECUTE ON FUNCTION r156.record_event(text,text,text),r156.record_request(text,text,text,text) TO r156_gateway;
          '''
          
          if __name__=='__main__':
              first=sql(SCHEMA)
              if first.returncode:
                  raise SystemExit('R156_SCHEMA_SETUP_FAIL: '+first.stderr[-1500:])
              print('R156_DISPOSABLE_POSTGRES_SCHEMA_CREATED',flush=True)
              A='a'*64; B='b'*64; C='c'*64
              check('A1 sees its private document', 'r156_authenticated','clientA1',"SELECT title FROM r156.documents",'a1_private')
              check('A1 cannot see A2 document', 'r156_authenticated','clientA1',"SELECT count(*) FROM r156.documents WHERE client='A2'",'0')
              check('A1 cannot see office B document', 'r156_authenticated','clientA1',"SELECT count(*) FROM r156.documents WHERE office='B'",'0')
              check('A2 sees its own document', 'r156_authenticated','clientA2',"SELECT title FROM r156.documents",'a2_private')
              check('B1 sees its own document', 'r156_authenticated','clientB1',"SELECT title FROM r156.documents",'b1_private')
              check('staff A sees 2 own-office documents', 'r156_authenticated','staffA',"SELECT count(*) FROM r156.documents",'2')
              check('staff B sees 1 own-office document', 'r156_authenticated','staffB',"SELECT count(*) FROM r156.documents",'1')
              check('unknown subject sees zero documents', 'r156_authenticated','unknown',"SELECT count(*) FROM r156.documents",'0')
              check('subject absent yields no documents', 'r156_authenticated',None,"SELECT count(*) FROM r156.documents",'0')
              check('forged office claim ignored', 'r156_authenticated','clientA1',"SET LOCAL request.jwt.claim.office = 'B'; SELECT count(*) FROM r156.documents WHERE office='B'",'0')
              check('forged role claim ignored', 'r156_authenticated','clientA1',"SET LOCAL request.jwt.claim.role = 'staff'; SELECT count(*) FROM r156.documents",'1')
              check('client cannot update own document', 'r156_authenticated','clientA1',"UPDATE r156.documents SET title='mutated' WHERE office='A'",'UPDATE 0')
              check('staff A can update own document', 'r156_authenticated','staffA',"UPDATE r156.documents SET title='updated_A1' WHERE office='A' AND client='A1'",'UPDATE 1')
              check('staff A cannot update office B', 'r156_authenticated','staffA',"UPDATE r156.documents SET title='mutatedB' WHERE office='B'",'UPDATE 0')
              check('staff B can update own office', 'r156_authenticated','staffB',"UPDATE r156.documents SET title='updated_B1' WHERE office='B'",'UPDATE 1')
              check('authenticated cannot read memberships', 'r156_authenticated','clientA1',"SELECT * FROM r156.memberships",error='permission denied')
              check('authenticated cannot alter membership table', 'r156_authenticated','clientA1',"UPDATE r156.memberships SET office='B'",error='permission denied')
              check('authenticated cannot select raw ledger', 'r156_authenticated','clientA1',"SELECT * FROM r156.webhook_ledger",error='permission denied')
              check('authenticated cannot invoke gateway event function', 'r156_authenticated','clientA1',"SELECT r156.record_event('channel_A','evt_err','"+A+"')",error='permission denied')
              check('authenticated cannot invoke gateway reservation function', 'r156_authenticated','clientA1',"SELECT r156.record_request('A','clientA1','req_err','"+A+"')",error='permission denied')
              check('gateway cannot read private documents', 'r156_gateway',None,"SELECT * FROM r156.documents",error='permission denied')
              check('unknown channel is denied', 'r156_gateway',None,"SELECT r156.record_event('channel_X','evt_one','"+A+"')",error='R156_EVENT_INPUT_DENIED')
              check('malformed digest is denied', 'r156_gateway',None,"SELECT r156.record_event('channel_A','evt_one','bad')",error='R156_EVENT_INPUT_DENIED')
              check('first event persisted', 'r156_gateway',None,"SELECT r156.record_event('channel_A','evt_one','"+A+"')",'new')
              check('identical event retry deduplicated', 'r156_gateway',None,"SELECT r156.record_event('channel_A','evt_one','"+A+"')",'duplicate')
              check('event same ID altered body rejected', 'r156_gateway',None,"SELECT r156.record_event('channel_A','evt_one','"+B+"')",error='R156_EVENT_REPLAY_MISMATCH')
              check('independent channel can use same event ID', 'r156_gateway',None,"SELECT r156.record_event('channel_B','evt_one','"+B+"')",'new')
              check('first reservation idempotency saved', 'r156_gateway',None,"SELECT r156.record_request('A','clientA1','req_one','"+A+"')",'new')
              check('reservation retry identical is deduped', 'r156_gateway',None,"SELECT r156.record_request('A','clientA1','req_one','"+A+"')",'duplicate')
              check('reservation changed payload is denied', 'r156_gateway',None,"SELECT r156.record_request('A','clientA1','req_one','"+B+"')",error='R156_REQUEST_REPLAY_MISMATCH')
              check('mismatched office and subject denied', 'r156_gateway',None,"SELECT r156.record_request('B','clientA1','req_bad','"+A+"')",error='R156_REQUEST_SCOPE_DENIED')
              check('staff cannot create client request', 'r156_gateway',None,"SELECT r156.record_request('A','staffA','req_bad','"+A+"')",error='R156_REQUEST_SCOPE_DENIED')
              check('unknown subject request denied', 'r156_gateway',None,"SELECT r156.record_request('A','unknown','req_bad','"+A+"')",error='R156_REQUEST_SCOPE_DENIED')
              check('second client same key is independent', 'r156_gateway',None,"SELECT r156.record_request('A','clientA2','req_one','"+B+"')",'new')
              check('other office same key is independent', 'r156_gateway',None,"SELECT r156.record_request('B','clientB1','req_one','"+C+"')",'new')
              check('client role cannot CREATE schema objects', 'r156_authenticated','clientA1',"CREATE TABLE r156.evil(x text)",error='permission denied')
              check('client role has no gateway role-grant', 'r156_authenticated','clientA1',
                    "SELECT CASE WHEN pg_has_role('r156_authenticated','r156_gateway','SET') THEN 'UNSAFE' ELSE 'role_not_granted' END",'role_not_granted')
              # Concurrency across eight *independent PostgreSQL sessions*, durable uniqueness guaranteed by PK.
              def contender(index):
                  p=sql("BEGIN; SET LOCAL ROLE r156_gateway; SELECT r156.record_event('channel_A','evt_race','"+C+"'); COMMIT;")
                  return p
              with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
                  results=list(pool.map(contender,range(8)))
              if any(p.returncode for p in results):
                  raise AssertionError('R156_RACE_SQL_FAIL: '+str([p.stderr[-100:] for p in results]))
              outputs=[p.stdout.strip().splitlines() for p in results]
              if sum('new' in o for o in outputs)!=1 or sum('duplicate' in o for o in outputs)!=7:
                  raise AssertionError('R156_RACE_OUTCOME_FAIL: '+str(outputs))
              TESTS.append('8 concurrent replay event requests yield exactly one inserted event')
              print(f'R156_PASS_{len(TESTS):02d}: {TESTS[-1]}',flush=True)
              # Same event id is durable across new sessions; collision is still denied.
              check('persisted race duplicate read in fresh DB session', 'r156_gateway',None,"SELECT r156.record_event('channel_A','evt_race','"+C+"')",'duplicate')
              check('persisted race payload conflict denied in fresh DB session', 'r156_gateway',None,"SELECT r156.record_event('channel_A','evt_race','"+A+"')",error='R156_EVENT_REPLAY_MISMATCH')
              expected_total=40
              if len(TESTS)!=expected_total:
                  raise AssertionError(f'R156_EXPECTED_{expected_total}_ACTUAL_{len(TESTS)}')
              print(f'R156_SUMMARY {len(TESTS)} / {expected_total} PASS',flush=True)
              print('R156_DISPOSABLE_POSTGRES_RLS_REPLAY_QA_PASS: VERIFIED_JWT_UPSTREAM_ASSUMED_PRODUCTION_HOLD',flush=True)
          PY_R156_SYNTHETIC_DISPOSABLE_ONLY
          printf '%s  %s\n' 'a0ebfb6ea0ef4319dd4bbe0b494847d6a7b396585cd88f5b14385f19124c09d6' "$RUNNER_TEMP/r156_qa.py" | sha256sum --check --status
          R156_PG_CONTAINER="$R156_PG_CONTAINER" python3 -I "$RUNNER_TEMP/r156_qa.py"
      - name: Report explicit evidence limitations
        if: success()
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## R156 Disposable PostgreSQL RLS and Durable Replay Reference PASS — PRODUCTION HOLD
          - Disposable PostgreSQL 17 only, local synthetic users and offices, no customer or real tenant data.
          - Validates RLS-style row visibility with server-mapped synthetic subject; forged office/role claims do not control policy.
          - Demonstrates durable event/request idempotency across database sessions and 8 concurrent event inserts.
          - **Upstream signature verification is ASSUMED, NOT TESTED.** PostgreSQL `request.jwt.claim.sub` GUC is not authenticated by PostgreSQL itself and can be forged by a direct SQL client.
          - Not a real Supabase/PostgREST JWT/JWKS, Supabase RLS migration, Storage, Cloudflare Worker, or LINE webhook test.
          - No access to production Worker, real Supabase, LINE, CONTROL CENTER or business data.
          - R151-R155 and app/config code are hash-pinned and checked read-only.
          - Real customer deployments remain **HOLD** pending owner approval and real-environment evidence gates.
          EOF
