name: DPRO TAX R158 Staging Public Demo Source Integrity (Read Only)

on:
  push:
    branches: [tax-r7-staging-20261010]
    paths:
      - '.github/workflows/dpro-tax-r158-public-demo-source-integrity-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dpro-tax-r158-public-demo-readonly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  public-demo-source-qa:
    if: ${{ github.repository == 'dpromstk2000-lab/dpro-tax-accounting-line-liff' && github.ref == 'refs/heads/tax-r7-staging-20261010' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact staging revision without push credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Deny production branch and pinned baseline drift
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'dpromstk2000-lab/dpro-tax-accounting-line-liff'
          test "$GITHUB_REF" = 'refs/heads/tax-r7-staging-20261010'
          test "$(git hash-object .github/workflows/dpro-tax-r151-staging-boundary-qa.yml)" = "bd6a075f06f0692ff868067416afb5781faad6c1" || { echo "R158_PINNED_SOURCE_DRIFT .github/workflows/dpro-tax-r151-staging-boundary-qa.yml"; exit 1; }
          test "$(git hash-object .github/workflows/dpro-tax-r152-disposable-postgres-booking-qa.yml)" = "8c3ed43f0f1fdc3217382f47b43c5f68763f1f37" || { echo "R158_PINNED_SOURCE_DRIFT .github/workflows/dpro-tax-r152-disposable-postgres-booking-qa.yml"; exit 1; }
          test "$(git hash-object .github/workflows/dpro-tax-r153-disposable-direct-dml-qa.yml)" = "d931f63a70a560b7f447fbcef1e6fd25868fb06d" || { echo "R158_PINNED_SOURCE_DRIFT .github/workflows/dpro-tax-r153-disposable-direct-dml-qa.yml"; exit 1; }
          test "$(git hash-object .github/workflows/dpro-tax-r154-disposable-auth-role-boundary-qa.yml)" = "3d5964f33675a636bf1f35e90c98d59aaaafd437" || { echo "R158_PINNED_SOURCE_DRIFT .github/workflows/dpro-tax-r154-disposable-auth-role-boundary-qa.yml"; exit 1; }
          test "$(git hash-object .github/workflows/dpro-tax-r155-synthetic-trust-boundary-qa.yml)" = "e21797ce5271a949c337b6bcf85d3d1339ce4ffd" || { echo "R158_PINNED_SOURCE_DRIFT .github/workflows/dpro-tax-r155-synthetic-trust-boundary-qa.yml"; exit 1; }
          test "$(git hash-object .github/workflows/dpro-tax-r156-disposable-rls-replay-qa.yml)" = "ff6442c6b4d2d0c409b906625a3322cdb16ab47e" || { echo "R158_PINNED_SOURCE_DRIFT .github/workflows/dpro-tax-r156-disposable-rls-replay-qa.yml"; exit 1; }
          test "$(git hash-object .github/workflows/dpro-tax-r157-loopback-http-gateway-qa.yml)" = "c6cf3510194b6f3af3474554966f57905fce7224" || { echo "R158_PINNED_SOURCE_DRIFT .github/workflows/dpro-tax-r157-loopback-http-gateway-qa.yml"; exit 1; }
          test "$(git hash-object app.js)" = "4c3475219e5c7fc9203ec5e5143d4f6eb8299423" || { echo "R158_PINNED_SOURCE_DRIFT app.js"; exit 1; }
          test "$(git hash-object config.js)" = "da1876bae8333a3a10ee13495c0063ded0c2b351" || { echo "R158_PINNED_SOURCE_DRIFT config.js"; exit 1; }
          echo R158_PROTECTED_BASELINE_UNCHANGED
      - name: Run real staging source read-only safety audit
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/r158_source_audit.py" <<'PY_R158_SOURCE_ONLY'
          #!/usr/bin/env python3
          """Offline read-only audit of staging checkout public demo and boundary docs. Does not prove production safe."""
          from html.parser import HTMLParser
          from pathlib import Path
          import os,re,sys
          root=Path(sys.argv[1] if len(sys.argv)>1 else '.').resolve()
          passed=[]
          def check(desc,ok):
              if not ok: raise AssertionError(f'R158_SOURCE_FAIL {desc}')
              passed.append(desc)
              print(f'R158_SOURCE_PASS_{len(passed):02d}: {desc}',flush=True)
          def get(name):return (root/name).read_text(encoding='utf-8')
          class Tags(HTMLParser):
              def __init__(self):super().__init__();self.tags=[]
              def handle_starttag(self,tag,attrs):self.tags.append((tag,dict(attrs)))
          config=get('config.js'); index=get('index.html'); engine=get('R117_DEMO_engine.js'); ui=get('R117_DEMO_ui.js')
          check('staging config object is explicitly frozen','Object.freeze' in config and 'DPRO_TAX_CONFIG' in config)
          check('API base points to named staging Worker only',bool(re.search(r'API_BASE:\s*["\']https://dpro-tax-accounting-line-r7-staging\.dpromstk2000\.workers\.dev',config)))
          check('normal application demo toggle disabled',bool(re.search(r'ENABLE_DEMO_UI:\s*false\b',config)))
          check('LIFF production identifier intentionally unconfigured',bool(re.search(r'LIFF_ID:\s*["\']["\']',config)))
          check('no privileged Supabase key assignment in config',not re.search(r'(?im)^\s*\w*(SERVICE_ROLE|SECRET_KEY|PRIVATE_KEY|ADMIN_KEY)\w*\s*[:=]\s*["\'][^"\']+',config))
          check('normal public entrypoint does not load offline-demo engine', 'R117_DEMO_engine.js' not in index)
          check('normal public entrypoint uses external LINE SDK as a separate integration','static.line-scdn.net/liff/edge/2/sdk.js' in index)
          check('offline demo engine creates isolated session','createDemoSession' in engine and 'SYNTHETIC_ONLY' in engine)
          check('offline demo denies privileged side-effects','DEMO_SIDE_EFFECT_BLOCKED' in engine)
          check('offline demo rejects cross-office scope','DEMO_SCOPE_DENIED' in engine)
          check('offline demo contains no real Supabase endpoint','supabase.co' not in engine.lower())
          check('offline demo uses invalid placeholder origin for URL parsing','only-local.invalid' in engine)
          check('offline demo rejects or disables member write path','/api/member/' in engine and 'return locked()' in engine)
          check('demo source disallows browser network API literals',not re.search(r'\b(?:fetch|XMLHttpRequest|WebSocket|EventSource|sendBeacon)\s*\(',engine+'\n'+ui))
          check('demo source disallows persistent client-side storage',not re.search(r'\b(?:localStorage|sessionStorage|indexedDB|caches)\b',engine+'\n'+ui))
          check('demo source forbids external navigation by window.location assignment',not re.search(r'\b(?:window|document)\.location\s*=',engine+'\n'+ui))
          check('demo UI does not load production staging config','DPRO_TAX_CONFIG' not in ui)
          check('offline UI does not refer to production Worker origin','workers.dev' not in ui)
          check('offline engine does not carry LINE channel secrets',not re.search(r'(?i)LINE_CHANNEL_SECRET\s*[:=]',engine))
          check('offline engine does not expose service_role key',not re.search(r'(?i)SUPABASE_SERVICE_ROLE_KEY\s*[:=]',engine))
          pages=['R117_DEMO_index.html','R117_DEMO_owner.html','R117_DEMO_owner-ipad.html','R117_DEMO_member.html','R117_DEMO_system-check.html']
          for page in pages:
              s=get(page);p=Tags();p.feed(s)
              meta=[a for t,a in p.tags if t=='meta']; scripts=[a.get('src','') for t,a in p.tags if t=='script']
              csp=[a.get('content','') for a in meta if a.get('http-equiv','').lower()=='content-security-policy']
              check(page+' CSP blocks network and form submit',bool(csp) and "connect-src 'none'" in csp[0] and "form-action 'none'" in csp[0])
              check(page+' CSP blocks objects, frames, base changes',bool(csp) and all(x in csp[0] for x in ["default-src 'none'","object-src 'none'","frame-src 'none'","base-uri 'none'"]))
              check(page+' no-referrer and no external scripts',any(a.get('name')=='referrer' and a.get('content')=='no-referrer' for a in meta) and scripts==['R117_DEMO_engine.js','R117_DEMO_ui.js'])
              check(page+' no external forms or inline event handlers',not any(t=='form' and a.get('action') for t,a in p.tags) and not any(k.startswith('on') for t,a in p.tags for k in a))
              check(page+' explicitly labels fictional demo',('架空' in s or 'デモ' in s) and '1234' not in s or '1234' in s and 'デモ' in s)
          check('all demo pages and scripts audited',len(pages)==5)
          print('R158_SOURCE_SUMMARY',len(passed),'/',len(passed),'PASS; PRODUCTION_RELEASE_HOLD',flush=True)
          PY_R158_SOURCE_ONLY
          printf '%s  %s\n' '53bb13c6d674ce5f7dddd14a8ff345ed22951935792ea3aecf2b63b5a141eac2' "$RUNNER_TEMP/r158_source_audit.py" | sha256sum --check --status
          python3 -I "$RUNNER_TEMP/r158_source_audit.py" . | tee "$RUNNER_TEMP/r158_source_audit.py.log"
          grep -Fx 'R158_SOURCE_SUMMARY 46 / 46 PASS; PRODUCTION_RELEASE_HOLD' "$RUNNER_TEMP/r158_source_audit.py.log"
      - name: Exercise offline-demo engine in isolated Node VM
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/r158_demo_vm.cjs" <<'NODE_R158_VM_ONLY'
          'use strict';
          const fs=require('node:fs');
          const vm=require('node:vm');
          const assert=require('node:assert/strict');
          const filename=process.argv[2]||'R117_DEMO_engine.js';
          const source=fs.readFileSync(filename,'utf8');
          let outgoing=0;
          const blocked=()=>{outgoing++;throw new Error('R158_UNEXPECTED_EXTERNAL_SIDE_EFFECT')};
          const sandbox={window:{},URL,console,fetch:blocked,XMLHttpRequest:blocked,WebSocket:blocked,EventSource:blocked,localStorage:new Proxy({}, {get:blocked}),sessionStorage:new Proxy({}, {get:blocked}),indexedDB:new Proxy({}, {get:blocked}),navigator:{sendBeacon:blocked}};
          vm.runInNewContext(source,vm.createContext(sandbox),{filename,timeout:1200});
          const API=sandbox.window.DPRO_TAX_DEMO_ENGINE;
          let passed=0;
          function check(name,fn){try{assert.equal(fn(),true);passed++;console.log(`R158_VM_PASS_${String(passed).padStart(2,'0')}: ${name}`);}catch(e){console.error('R158_VM_FAIL',name,e.stack);process.exit(1);}}
          function attempt(s,path,opts){try{return {ok:true,value:s.request(path,opts)}}catch(e){return {ok:false,error:e,status:e?.status,code:e?.code}}}
          const session=API.createDemoSession({sessionId:'reference-A'});
          check('API available as window-only synthetic engine',()=>typeof API.createDemoSession==='function');
          check('session is synthetic only',()=>session.mode==='SYNTHETIC_ONLY');
          check('session id recorded without server login',()=>session.session_id==='reference-A');
          check('separate fresh sessions are independent',()=>API.createDemoSession({sessionId:'reference-B'})!==session);
          check('synthetic office carries demo flag',()=>session.snapshot().office.is_demo===true);
          check('office is visibly fictional',()=>session.snapshot().office.office_code==='dpro_taxacc_demo');
          check('health is only synthetic',()=>/Synthetic|synthetic/i.test(JSON.stringify(attempt(session,'/api/health',{method:'GET'}))));
          check('unknown external absolute URL blocked',()=>!attempt(session,'https://example.com/steal',{method:'GET'}).ok);
          check('unauthenticated admin dashboard refused',()=>!attempt(session,'/api/admin/dashboard',{method:'GET'}).ok);
          check('wrong demo PIN refused',()=>!attempt(session,'/api/admin/dashboard',{method:'GET',adminKey:'9876'}).ok);
          check('local fictional demo PIN can access demo only',()=>attempt(session,'/api/admin/dashboard',{method:'GET',adminKey:'1234'}).ok);
          check('raw production member URL does not expose private records',()=>!attempt(session,'/api/member/profile',{method:'GET',adminKey:'1234'}).ok);
          check('storage documents empty in demo',()=>{const r=attempt(session,'/api/admin/documents',{method:'GET',adminKey:'1234'});return r.ok&&Array.isArray(r.value.documents)&&r.value.documents.length===0});
          check('local system check never claims real DB',()=>{const r=attempt(session,'/api/admin/system-check',{method:'GET',adminKey:'1234'});return r.ok&&r.value.database.ok===false});
          check('external file mutation rejected',()=>!attempt(session,'/api/admin/documents',{method:'POST',adminKey:'1234',body:{file_name:'test'}}).ok);
          check('send LINE mutation rejected',()=>!attempt(session,'/api/line/send',{method:'POST',adminKey:'1234',body:{text:'x'}}).ok);
          check('unrecognized API mutation rejected',()=>!attempt(session,'/api/admin/payments',{method:'POST',adminKey:'1234',body:{amount:1}}).ok);
          check('server-side /api/admin/ route must require demo PIN',()=>!attempt(API.createDemoSession(),'/api/admin/clients',{method:'GET'}).ok);
          check('one new session begins with empty audit',()=>API.createDemoSession().audit().length===0);
          check('no browser/network/storage side effects observed',()=>outgoing===0);
          console.log(`R158_VM_SUMMARY ${passed} / ${passed} PASS; PRODUCTION_RELEASE_HOLD`);
          NODE_R158_VM_ONLY
          printf '%s  %s\n' '8ff619e9cf29fe76aa9acdfa9d9b832befaf454457f8923070f8313dc166da28' "$RUNNER_TEMP/r158_demo_vm.cjs" | sha256sum --check --status
          node "$RUNNER_TEMP/r158_demo_vm.cjs" R117_DEMO_engine.js | tee "$RUNNER_TEMP/r158_demo_vm.cjs.log"
          grep -Fx 'R158_VM_SUMMARY 20 / 20 PASS; PRODUCTION_RELEASE_HOLD' "$RUNNER_TEMP/r158_demo_vm.cjs.log"
      - name: Record audit scope and unresolved real-environment release blockers
        if: success()
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF_R158_SUMMARY'
          ## R158 real staging public-demo boundary static+local VM PASS — COMMERCIAL RELEASE HOLD
          - Evaluated actual checked-out `R117_DEMO_*` files (static 46 checks) and engine in isolated Node VM (20 checks).
          - The normal `config.js` is staging configuration, **not** proof that production Worker or Supabase is safe.
          - No customer/LINE/Storage connection, no DB operations, no Worker deployment, no production web requests, no writes.
          - A published *offline fictional demo* is deliberately different from real customer authentication and consent.
          - R147 source evidence still identifies missing public-booking idempotency/atomicity and live environment gaps.
          - R109 production Worker configuration previously contained unsafe fallback/flags; remediation and real acceptance are pending.
          - Do NOT deploy or promote. Production RELEASE HOLD until real environment G0–G12 + product acceptance evidence and explicit owner approval.
          EOF_R158_SUMMARY
