name: DPRO TAX R161 Disposable PG Booking Idempotency and Atomic Confirmation QA

on:
  push:
    branches: [tax-r7-staging-20261010]
    paths:
      - '.github/workflows/dpro-tax-r161-disposable-booking-atomicity-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dpro-tax-r161-disposable-only-${{ github.ref }}
  cancel-in-progress: false

jobs:
  booking-atomicity-qa:
    if: ${{ github.repository == 'dpromstk2000-lab/dpro-tax-accounting-line-liff' && github.ref == 'refs/heads/tax-r7-staging-20261010' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      pg:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: r161-disposable-only-no-customer-data
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - name: Read-only checkout pinned staging commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Protect R151-R160 source and prevent production run
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'dpromstk2000-lab/dpro-tax-accounting-line-liff'
          test "$GITHUB_REF" = 'refs/heads/tax-r7-staging-20261010'
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${CLOUDFLARE_API_TOKEN:-}"
          test -z "${LINE_CHANNEL_ACCESS_TOKEN:-}"
          test "$(git hash-object '.github/workflows/dpro-tax-r151-staging-boundary-qa.yml')" = 'bd6a075f06f0692ff868067416afb5781faad6c1' || { echo 'R161_PROTECTED_SOURCE_DRIFT: .github/workflows/dpro-tax-r151-staging-boundary-qa.yml'; exit 1; }
          test "$(git hash-object '.github/workflows/dpro-tax-r152-disposable-postgres-booking-qa.yml')" = '8c3ed43f0f1fdc3217382f47b43c5f68763f1f37' || { echo 'R161_PROTECTED_SOURCE_DRIFT: .github/workflows/dpro-tax-r152-disposable-postgres-booking-qa.yml'; exit 1; }
          test "$(git hash-object '.github/workflows/dpro-tax-r153-disposable-direct-dml-qa.yml')" = 'd931f63a70a560b7f447fbcef1e6fd25868fb06d' || { echo 'R161_PROTECTED_SOURCE_DRIFT: .github/workflows/dpro-tax-r153-disposable-direct-dml-qa.yml'; exit 1; }
          test "$(git hash-object '.github/workflows/dpro-tax-r154-disposable-auth-role-boundary-qa.yml')" = '3d5964f33675a636bf1f35e90c98d59aaaafd437' || { echo 'R161_PROTECTED_SOURCE_DRIFT: .github/workflows/dpro-tax-r154-disposable-auth-role-boundary-qa.yml'; exit 1; }
          test "$(git hash-object '.github/workflows/dpro-tax-r155-synthetic-trust-boundary-qa.yml')" = 'e21797ce5271a949c337b6bcf85d3d1339ce4ffd' || { echo 'R161_PROTECTED_SOURCE_DRIFT: .github/workflows/dpro-tax-r155-synthetic-trust-boundary-qa.yml'; exit 1; }
          test "$(git hash-object '.github/workflows/dpro-tax-r156-disposable-rls-replay-qa.yml')" = 'ff6442c6b4d2d0c409b906625a3322cdb16ab47e' || { echo 'R161_PROTECTED_SOURCE_DRIFT: .github/workflows/dpro-tax-r156-disposable-rls-replay-qa.yml'; exit 1; }
          test "$(git hash-object '.github/workflows/dpro-tax-r157-loopback-http-gateway-qa.yml')" = 'c6cf3510194b6f3af3474554966f57905fce7224' || { echo 'R161_PROTECTED_SOURCE_DRIFT: .github/workflows/dpro-tax-r157-loopback-http-gateway-qa.yml'; exit 1; }
          test "$(git hash-object '.github/workflows/dpro-tax-r158-public-demo-source-integrity-qa.yml')" = '7590c8417fa940b73ccaf4e65534176e1d643f32' || { echo 'R161_PROTECTED_SOURCE_DRIFT: .github/workflows/dpro-tax-r158-public-demo-source-integrity-qa.yml'; exit 1; }
          test "$(git hash-object '.github/workflows/dpro-tax-r159-release-evidence-contract-qa.yml')" = 'b631da2cf67eb198160a0ffd8b88596b020d51e9' || { echo 'R161_PROTECTED_SOURCE_DRIFT: .github/workflows/dpro-tax-r159-release-evidence-contract-qa.yml'; exit 1; }
          test "$(git hash-object '.github/workflows/dpro-tax-r160-staging-commercial-gap-qa.yml')" = '5f359b6ec11b1e119a180302e64c19e68885a637' || { echo 'R161_PROTECTED_SOURCE_DRIFT: .github/workflows/dpro-tax-r160-staging-commercial-gap-qa.yml'; exit 1; }
          test "$(git hash-object 'app.js')" = '4c3475219e5c7fc9203ec5e5143d4f6eb8299423' || { echo 'R161_PROTECTED_SOURCE_DRIFT: app.js'; exit 1; }
          test "$(git hash-object 'config.js')" = 'da1876bae8333a3a10ee13495c0063ded0c2b351' || { echo 'R161_PROTECTED_SOURCE_DRIFT: config.js'; exit 1; }
          test "$(git hash-object 'index.html')" = 'c7f6c0b30d1da913a924a582097d4bfe1570a704' || { echo 'R161_PROTECTED_SOURCE_DRIFT: index.html'; exit 1; }
          test "$(git hash-object 'owner.html')" = 'a8e7d1e8d83e54e9cbe42d1bd76190a6401c8f66' || { echo 'R161_PROTECTED_SOURCE_DRIFT: owner.html'; exit 1; }
          test "$(git hash-object 'member.html')" = 'fdf2e3ffc3ebba95e7b679b517ebc376215b25fc' || { echo 'R161_PROTECTED_SOURCE_DRIFT: member.html'; exit 1; }
          test -z "$(git status --porcelain)"
          echo R161_PINNED_STAGING_ONLY_NO_PRODUCTION_ACCESS
      - name: Run true PostgreSQL 17 exclusion and idempotency concurrency QA
        shell: bash
        run: |
          set -euo pipefail
          R161_PG_CONTAINER="$(docker ps --filter ancestor=postgres:17-alpine --format '{{.ID}}' | head -n 1)"
          test -n "$R161_PG_CONTAINER"
          echo R161_DISPOSABLE_POSTGRES_ONLY
          cat > "$RUNNER_TEMP/r161_reference.sql" <<'SQL_R161_EPHEMERAL_ONLY'
          -- DPRO TAX R161 isolated reference ONLY. Not a Supabase migration; NEVER deploy.
          -- Authoritative tenant identity, verified JWT, resource policy, timezone rules and business
          -- approvals remain separate production gates. This assumes a trusted server invokes
          -- the r161_gateway / r161_staff functions, NEVER an untrusted SQL client.
          CREATE EXTENSION IF NOT EXISTS btree_gist;
          CREATE SCHEMA r161;
          REVOKE ALL ON SCHEMA r161 FROM PUBLIC;
          CREATE ROLE r161_fn_owner NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE;
          CREATE ROLE r161_gateway NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE;
          CREATE ROLE r161_staff NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE;
          GRANT USAGE ON SCHEMA r161 TO r161_fn_owner,r161_gateway,r161_staff;
          CREATE TABLE r161.memberships(
            subject text PRIMARY KEY,
            office text NOT NULL,
            actor_kind text NOT NULL CHECK(actor_kind IN ('client','staff'))
          );
          INSERT INTO r161.memberships(subject,office,actor_kind) VALUES
            ('clientA1','A','client'),('clientA2','A','client'),
            ('clientB1','B','client'),('staffA','A','staff'),('staffB','B','staff');
          CREATE TABLE r161.resources(office text NOT NULL,resource text NOT NULL,
            PRIMARY KEY(office,resource));
          INSERT INTO r161.resources VALUES ('A','desk1'),('A','desk2'),('B','desk1');
          CREATE TABLE r161.bookings(
            id bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
            office text NOT NULL,
            client text NOT NULL,
            resource text NOT NULL,
            idempotency_key text NOT NULL,
            starts_at timestamptz NOT NULL,
            ends_at timestamptz NOT NULL,
            status text NOT NULL DEFAULT 'pending' CHECK(status IN ('pending','confirmed','cancelled')),
            CHECK(ends_at > starts_at),
            UNIQUE(office,client,idempotency_key),
            FOREIGN KEY(office,resource) REFERENCES r161.resources(office,resource),
            CONSTRAINT r161_confirmed_no_overlap EXCLUDE USING gist (
              office WITH =, resource WITH =, tstzrange(starts_at,ends_at,'[)') WITH &&
            ) WHERE (status = 'confirmed')
          );
          -- Raw tables and sequence are not available to gateway/staff roles.
          GRANT SELECT ON r161.memberships,r161.resources TO r161_fn_owner;
          GRANT SELECT,INSERT,UPDATE ON r161.bookings TO r161_fn_owner;
          GRANT USAGE,SELECT ON ALL SEQUENCES IN SCHEMA r161 TO r161_fn_owner;
          -- Untrusted business identity must NOT be sourced from PostgreSQL custom GUC claims.
          -- p_office/p_subject are trusted-server fields only; server binding is not modeled here.
          CREATE FUNCTION r161.request_booking(
           p_office text,p_subject text,p_resource text,p_key text,p_start timestamptz,p_minutes integer
          ) RETURNS text LANGUAGE plpgsql SECURITY DEFINER SET search_path=pg_catalog,r161 AS $$
          DECLARE v_id bigint; v_old r161.bookings%ROWTYPE;
          BEGIN
           IF p_office IS NULL OR p_subject IS NULL OR p_resource IS NULL OR p_key IS NULL
              OR p_key !~ '^[A-Za-z0-9_-]{16,96}$'
              OR NOT EXISTS(SELECT 1 FROM r161.memberships
                 WHERE subject=p_subject AND office=p_office AND actor_kind='client')
              OR NOT EXISTS(SELECT 1 FROM r161.resources
                 WHERE office=p_office AND resource=p_resource)
              OR p_start IS NULL OR p_start <= clock_timestamp() OR p_start > clock_timestamp()+interval '365 days'
              OR extract(minute from p_start AT TIME ZONE 'Asia/Tokyo')::int NOT IN (0,30)
              OR extract(second from p_start AT TIME ZONE 'Asia/Tokyo') <> 0
              OR p_minutes IS NULL OR p_minutes NOT IN (30,60,90) THEN
              RAISE EXCEPTION 'R161_BOOKING_REQUEST_DENIED';
           END IF;
           INSERT INTO r161.bookings(office,client,resource,idempotency_key,starts_at,ends_at)
           VALUES(p_office,p_subject,p_resource,p_key,p_start,p_start+make_interval(mins=>p_minutes))
           ON CONFLICT(office,client,idempotency_key) DO NOTHING RETURNING id INTO v_id;
           IF v_id IS NOT NULL THEN RETURN 'new:'||v_id::text; END IF;
           SELECT * INTO v_old FROM r161.bookings
             WHERE office=p_office AND client=p_subject AND idempotency_key=p_key;
           IF NOT FOUND OR v_old.resource IS DISTINCT FROM p_resource
             OR v_old.starts_at IS DISTINCT FROM p_start
             OR v_old.ends_at IS DISTINCT FROM p_start+make_interval(mins=>p_minutes) THEN
              RAISE EXCEPTION 'R161_IDEMPOTENCY_PAYLOAD_CONFLICT';
           END IF;
           RETURN 'duplicate:'||v_old.id::text;
          END $$;
          CREATE FUNCTION r161.confirm_booking(p_office text,p_staff text,p_id bigint)
           RETURNS text LANGUAGE plpgsql SECURITY DEFINER SET search_path=pg_catalog,r161 AS $$
          DECLARE v r161.bookings%ROWTYPE;
          BEGIN
           IF NOT EXISTS(SELECT 1 FROM r161.memberships
               WHERE subject=p_staff AND office=p_office AND actor_kind='staff') THEN
              RAISE EXCEPTION 'R161_STAFF_SCOPE_DENIED'; END IF;
           SELECT * INTO v FROM r161.bookings WHERE id=p_id FOR UPDATE;
           IF NOT FOUND OR v.office IS DISTINCT FROM p_office THEN
              RAISE EXCEPTION 'R161_CROSS_OFFICE_DENIED'; END IF;
           IF v.status='confirmed' THEN RETURN 'already_confirmed'; END IF;
           IF v.status<>'pending' THEN RAISE EXCEPTION 'R161_CANCELLED_IS_FINAL'; END IF;
           UPDATE r161.bookings SET status='confirmed' WHERE id=p_id;
           RETURN 'confirmed';
          END $$;
          CREATE FUNCTION r161.cancel_booking(p_office text,p_staff text,p_id bigint)
           RETURNS text LANGUAGE plpgsql SECURITY DEFINER SET search_path=pg_catalog,r161 AS $$
          DECLARE v r161.bookings%ROWTYPE;
          BEGIN
           IF NOT EXISTS(SELECT 1 FROM r161.memberships
               WHERE subject=p_staff AND office=p_office AND actor_kind='staff') THEN
              RAISE EXCEPTION 'R161_STAFF_SCOPE_DENIED'; END IF;
           SELECT * INTO v FROM r161.bookings WHERE id=p_id FOR UPDATE;
           IF NOT FOUND OR v.office IS DISTINCT FROM p_office THEN
              RAISE EXCEPTION 'R161_CROSS_OFFICE_DENIED'; END IF;
           IF v.status='cancelled' THEN RETURN 'already_cancelled'; END IF;
           UPDATE r161.bookings SET status='cancelled' WHERE id=p_id;
           RETURN 'cancelled';
          END $$;
          ALTER FUNCTION r161.request_booking(text,text,text,text,timestamptz,integer) OWNER TO r161_fn_owner;
          ALTER FUNCTION r161.confirm_booking(text,text,bigint) OWNER TO r161_fn_owner;
          ALTER FUNCTION r161.cancel_booking(text,text,bigint) OWNER TO r161_fn_owner;
          REVOKE ALL ON ALL FUNCTIONS IN SCHEMA r161 FROM PUBLIC;
          GRANT EXECUTE ON FUNCTION r161.request_booking(text,text,text,text,timestamptz,integer) TO r161_gateway;
          GRANT EXECUTE ON FUNCTION r161.confirm_booking(text,text,bigint),r161.cancel_booking(text,text,bigint) TO r161_staff;
          -- No user/role gets CREATE on this schema; never expose role privileges to public endpoints.
          SQL_R161_EPHEMERAL_ONLY
          cat > "$RUNNER_TEMP/r161_qa.py" <<'PY_R161_EPHEMERAL_ONLY'
          #!/usr/bin/env python3
          """DPRO TAX R161 disposable PostgreSQL tester. No customer env, no production connectivity."""
          import concurrent.futures
          import os
          import re
          import subprocess
          from datetime import datetime, timedelta, timezone
          
          CONTAINER = os.environ['R161_PG_CONTAINER']
          assert re.fullmatch(r'[0-9a-f]{12,64}', CONTAINER), 'Only Docker container ID accepted'
          RESULTS = []
          
          def psql(query):
              return subprocess.run(['docker','exec','-i','-u','postgres',CONTAINER,
                'psql','-XAt','-v','ON_ERROR_STOP=1','-U','postgres','-d','postgres'],
                input=query,text=True,capture_output=True,timeout=35)
          
          def run(role,query):
              assert role in ('r161_gateway','r161_staff','r161_fn_owner')
              return psql('BEGIN; SET LOCAL ROLE '+role+'; '+query+'; COMMIT;')
          
          def verify(name,role,query,expect=None,deny=None):
              p=run(role,query)
              if deny:
                  assert p.returncode!=0 and deny in p.stderr,(name,p.returncode,p.stderr[-450:],p.stdout[-200:])
              else:
                  assert p.returncode==0,(name,p.stderr[-600:])
                  assert expect is None or expect in p.stdout,(name,repr(p.stdout))
              RESULTS.append(name)
              print(f'R161_PASS_{len(RESULTS):02d}: {name}',flush=True)
              return p.stdout
          
          def request(office,client,resource,key,start,mins=30):
              return ("SELECT r161.request_booking('"+office+"','"+client+"','"+resource+"','"+key+"','"+start+"'::timestamptz,"+str(mins)+")")
          
          def confirm(office,staff,booking_id):
              return "SELECT r161.confirm_booking('"+office+"','"+staff+"',"+str(booking_id)+")"
          
          def cancel(office,staff,booking_id):
              return "SELECT r161.cancel_booking('"+office+"','"+staff+"',"+str(booking_id)+")"
          
          def get_id(result):
              match=re.search(r'(?:new|duplicate):(\d+)',result)
              assert match,result
              return int(match.group(1))
          
          if __name__=='__main__':
              # Anchors must be 30-min aligned in Asia/Tokyo, far enough in future for any runner TZ.
              tomorrow=(datetime.now(timezone.utc)+timedelta(days=4)).astimezone(timezone(timedelta(hours=9)))
              start=tomorrow.replace(hour=10,minute=0,second=0,microsecond=0).isoformat()
              plus30=(datetime.fromisoformat(start)+timedelta(minutes=30)).isoformat()
              plus60=(datetime.fromisoformat(start)+timedelta(minutes=60)).isoformat()
              past=(datetime.fromisoformat(start)-timedelta(days=12)).isoformat()
              m15=(datetime.fromisoformat(start)+timedelta(minutes=15)).isoformat()
              keys=[f'r161_key_{n:020d}' for n in range(50)]
              a=verify('first A1 pending request','r161_gateway',request('A','clientA1','desk1',keys[0],start),expect='new:')
              aid=get_id(a)
              again=verify('same request key returns original ID','r161_gateway',request('A','clientA1','desk1',keys[0],start),expect='duplicate:'+str(aid))
              assert get_id(again)==aid
              verify('changed resource same key rejected','r161_gateway',request('A','clientA1','desk2',keys[0],start),deny='R161_IDEMPOTENCY_PAYLOAD_CONFLICT')
              verify('changed start same key rejected','r161_gateway',request('A','clientA1','desk1',keys[0],plus30),deny='R161_IDEMPOTENCY_PAYLOAD_CONFLICT')
              verify('wrong office client denied','r161_gateway',request('B','clientA1','desk1',keys[1],start),deny='R161_BOOKING_REQUEST_DENIED')
              verify('unknown client denied','r161_gateway',request('A','unknown','desk1',keys[1],start),deny='R161_BOOKING_REQUEST_DENIED')
              verify('staff cannot book as client','r161_gateway',request('A','staffA','desk1',keys[1],start),deny='R161_BOOKING_REQUEST_DENIED')
              verify('unknown resource denied','r161_gateway',request('A','clientA1','desk3',keys[1],start),deny='R161_BOOKING_REQUEST_DENIED')
              verify('short key denied','r161_gateway',request('A','clientA1','desk1','short',start),deny='R161_BOOKING_REQUEST_DENIED')
              verify('past date denied','r161_gateway',request('A','clientA1','desk1',keys[1],past),deny='R161_BOOKING_REQUEST_DENIED')
              verify('off-grid start denied','r161_gateway',request('A','clientA1','desk1',keys[1],m15),deny='R161_BOOKING_REQUEST_DENIED')
              verify('unsupported duration denied','r161_gateway',request('A','clientA1','desk1',keys[1],start,45),deny='R161_BOOKING_REQUEST_DENIED')
              verify('raw booking SELECT denied','r161_gateway','SELECT count(*) FROM r161.bookings',deny='permission denied')
              verify('raw booking INSERT denied','r161_staff',"INSERT INTO r161.bookings(office,client,resource,idempotency_key,starts_at,ends_at) VALUES('A','clientA1','desk1','bad_key00000000000000',now()+interval '5 days',now()+interval '5 days 30 minutes')",deny='permission denied')
              verify('gateway cannot confirm','r161_gateway',confirm('A','staffA',aid),deny='permission denied')
              verify('staff cannot create request','r161_staff',request('A','clientA1','desk1',keys[2],start),deny='permission denied')
              verify('gateway cannot cancel','r161_gateway',cancel('A','staffA',aid),deny='permission denied')
              verify('outsider staff cannot confirm','r161_staff',confirm('A','unknown',aid),deny='R161_STAFF_SCOPE_DENIED')
              verify('cross-office staff cannot confirm','r161_staff',confirm('B','staffB',aid),deny='R161_CROSS_OFFICE_DENIED')
              b=verify('second client pending same slot allowed','r161_gateway',request('A','clientA2','desk1',keys[3],start),expect='new:')
              bid=get_id(b)
              verify('authorized staff confirms','r161_staff',confirm('A','staffA',aid),expect='confirmed')
              verify('same confirmation is idempotent','r161_staff',confirm('A','staffA',aid),expect='already_confirmed')
              verify('pending overlap cannot be confirmed','r161_staff',confirm('A','staffA',bid),deny='r161_confirmed_no_overlap')
              c=verify('adjacent 30-minute slot request accepted','r161_gateway',request('A','clientA2','desk1',keys[4],plus30),expect='new:')
              verify('adjacent 30-minute slot confirms','r161_staff',confirm('A','staffA',get_id(c)),expect='confirmed')
              d=verify('different resource same time pending','r161_gateway',request('A','clientA2','desk2',keys[5],start),expect='new:')
              verify('different resource same time confirms','r161_staff',confirm('A','staffA',get_id(d)),expect='confirmed')
              e=verify('other office same resource pending','r161_gateway',request('B','clientB1','desk1',keys[6],start),expect='new:')
              verify('other office same resource confirms','r161_staff',confirm('B','staffB',get_id(e)),expect='confirmed')
              verify('cross-office cancellation denied','r161_staff',cancel('B','staffB',aid),deny='R161_CROSS_OFFICE_DENIED')
              verify('authorized staff cancellation succeeds','r161_staff',cancel('A','staffA',aid),expect='cancelled')
              verify('cancelled booking cannot be reconfirmed','r161_staff',confirm('A','staffA',aid),deny='R161_CANCELLED_IS_FINAL')
              verify('cancel of same booking is idempotent','r161_staff',cancel('A','staffA',aid),expect='already_cancelled')
              verify('previously conflicting pending now confirms','r161_staff',confirm('A','staffA',bid),expect='confirmed')
              # 8 separate sessions compete on one office/resource/time; only one can confirm.
              race_time=(datetime.fromisoformat(start)+timedelta(days=2)).isoformat()
              race_ids=[]
              for i in range(8):
                  p=run('r161_gateway',request('A','clientA1','desk1',keys[8+i],race_time))
                  assert p.returncode==0,(i,p.stderr)
                  race_ids.append(get_id(p.stdout))
              RESULTS.append('eight separate pending requests coexist without reservation')
              print(f'R161_PASS_{len(RESULTS):02d}: {RESULTS[-1]}',flush=True)
              with concurrent.futures.ThreadPoolExecutor(max_workers=8) as executor:
                  races=list(executor.map(lambda i: run('r161_staff',confirm('A','staffA',race_ids[i])),range(8)))
              good=[p for p in races if p.returncode==0 and 'confirmed' in p.stdout]
              bad=[p for p in races if p.returncode!=0 and 'r161_confirmed_no_overlap' in p.stderr]
              assert len(good)==1 and len(bad)==7,[(q.returncode,q.stdout[-180:],q.stderr[-240:]) for q in races]
              RESULTS.append('eight concurrent confirmation sessions yield exactly one confirmed')
              print(f'R161_PASS_{len(RESULTS):02d}: {RESULTS[-1]}',flush=True)
              # Verify persistent effect from a fresh connection, not merely a Python counter.
              p=psql("SELECT count(*) FROM r161.bookings WHERE office='A' AND resource='desk1' AND starts_at='"+race_time+"'::timestamptz AND status='confirmed'")
              assert p.returncode==0 and p.stdout.strip()=='1',(p.stdout,p.stderr)
              RESULTS.append('fresh PostgreSQL session observes one confirmed winner')
              print(f'R161_PASS_{len(RESULTS):02d}: {RESULTS[-1]}',flush=True)
              # Simultaneous idempotent retries: exactly one new request, seven duplicate IDs.
              replay_time=(datetime.fromisoformat(start)+timedelta(days=3)).isoformat()
              with concurrent.futures.ThreadPoolExecutor(max_workers=8) as executor:
                  retries=list(executor.map(lambda _:run('r161_gateway',request('A','clientA2','desk2',keys[20],replay_time)),range(8)))
              assert all(p.returncode==0 for p in retries),[p.stderr for p in retries]
              outputs=[re.search(r'(new|duplicate):(\d+)',p.stdout) for p in retries]
              assert all(outputs) and len({m.group(2) for m in outputs})==1 and sorted(m.group(1) for m in outputs)==['duplicate']*7+['new'],[p.stdout for p in retries]
              RESULTS.append('8 concurrent identical requests yield one insert and same persisted ID')
              print(f'R161_PASS_{len(RESULTS):02d}: {RESULTS[-1]}',flush=True)
              p=run('r161_gateway',request('A','clientA2','desk2',keys[20],race_time))
              assert p.returncode!=0 and 'R161_IDEMPOTENCY_PAYLOAD_CONFLICT' in p.stderr
              RESULTS.append('changed-payload replay rejected after cross-session race')
              print(f'R161_PASS_{len(RESULTS):02d}: {RESULTS[-1]}',flush=True)
              assert len(RESULTS)==39,(len(RESULTS),RESULTS)
              print('R161_SUMMARY 39 / 39 PASS',flush=True)
              print('R161_EPHEMERAL_BOOKING_REFERENCE_PASS: COMMERCIAL_RELEASE_HOLD',flush=True)
          PY_R161_EPHEMERAL_ONLY
          printf "%s  %s\n" '679487d4bd40ea93118b64ea2cd047da5f0ec355b03b9eae09b6cd29b0226421' "$RUNNER_TEMP/r161_reference.sql" | sha256sum --check --status
          printf "%s  %s\n" 'e248f5eb72d4411ce1d5d5019288d8df10c6b08d5da6b1c5f5f12350b9ade720' "$RUNNER_TEMP/r161_qa.py" | sha256sum --check --status
          python3 -m py_compile "$RUNNER_TEMP/r161_qa.py"
