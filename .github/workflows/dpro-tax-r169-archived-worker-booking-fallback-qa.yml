name: DPRO TAX R169 Sanitized Booking Fallback Model QA (Read Only)

on:
  push:
    branches: [tax-r7-staging-20261010]
    paths:
      - '.github/workflows/dpro-tax-r169-archived-worker-booking-fallback-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dpro-tax-r169-archived-reference-${{ github.ref }}
  cancel-in-progress: false

jobs:
