name: DPRO TAX R170 Disposable Cutover Rollback Safety Contract QA

on:
  push:
    branches: [tax-r7-staging-20261010]
    paths:
      - '.github/workflows/dpro-tax-r170-cutover-rollback-contract-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dpro-tax-r170-disposable-only-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sidecar-and-rollback-qa:
    if: ${{ github.repository == 'dpromstk2000-lab/dpro-tax-accounting-line-liff' && github.ref == 'refs/heads/tax-r7-staging-20261010' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout staging without write credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Protect 22 known sources, no production env
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'dpromstk2000-lab/dpro-tax-accounting-line-liff'
          test "$GITHUB_REF" = 'refs/heads/tax-r7-staging-20261010'
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}" && test -z "${LINE_CHANNEL_SECRET:-}" && test -z "${CLOUDFLARE_API_TOKEN:-}"
          test "$(git hash-object .github/workflows/dpro-tax-r151-staging-boundary-qa.yml)" = "bd6a075f06f0692ff868067416afb5781faad6c1" || { echo "R170_SOURCE_DRIFT .github/workflows/dpro-tax-r151-staging-boundary-qa.yml"; exit 1; }
          test "$(git hash-object .github/workflows/dpro-tax-r152-disposable-postgres-booking-qa.yml)" = "8c3ed43f0f1fdc3217382f47b43c5f68763f1f37" || { echo "R170_SOURCE_DRIFT .github/workflows/dpro-tax-r152-disposable-postgres-booking-qa.yml"; exit 1; }
          test "$(git hash-object .github/workflows/dpro-tax-r153-disposable-direct-dml-qa.yml)" = "d931f63a70a560b7f447fbcef1e6fd25868fb06d" || { echo "R170_SOURCE_DRIFT .github/workflows/dpro-tax-r153-disposable-direct-dml-qa.yml"; exit 1; }
          test "$(git hash-object .github/workflows/dpro-tax-r154-disposable-auth-role-boundary-qa.yml)" = "3d5964f33675a636bf1f35e90c98d59aaaafd437" || { echo "R170_SOURCE_DRIFT .github/workflows/dpro-tax-r154-disposable-auth-role-boundary-qa.yml"; exit 1; }
          test "$(git hash-object .github/workflows/dpro-tax-r155-synthetic-trust-boundary-qa.yml)" = "e21797ce5271a949c337b6bcf85d3d1339ce4ffd" || { echo "R170_SOURCE_DRIFT .github/workflows/dpro-tax-r155-synthetic-trust-boundary-qa.yml"; exit 1; }
          test "$(git hash-object .github/workflows/dpro-tax-r156-disposable-rls-replay-qa.yml)" = "ff6442c6b4d2d0c409b906625a3322cdb16ab47e" || { echo "R170_SOURCE_DRIFT .github/workflows/dpro-tax-r156-disposable-rls-replay-qa.yml"; exit 1; }
          test "$(git hash-object .github/workflows/dpro-tax-r157-loopback-http-gateway-qa.yml)" = "c6cf3510194b6f3af3474554966f57905fce7224" || { echo "R170_SOURCE_DRIFT .github/workflows/dpro-tax-r157-loopback-http-gateway-qa.yml"; exit 1; }
          test "$(git hash-object .github/workflows/dpro-tax-r158-public-demo-source-integrity-qa.yml)" = "7590c8417fa940b73ccaf4e65534176e1d643f32" || { echo "R170_SOURCE_DRIFT .github/workflows/dpro-tax-r158-public-demo-source-integrity-qa.yml"; exit 1; }
          test "$(git hash-object .github/workflows/dpro-tax-r159-release-evidence-contract-qa.yml)" = "b631da2cf67eb198160a0ffd8b88596b020d51e9" || { echo "R170_SOURCE_DRIFT .github/workflows/dpro-tax-r159-release-evidence-contract-qa.yml"; exit 1; }
          test "$(git hash-object .github/workflows/dpro-tax-r160-staging-commercial-gap-qa.yml)" = "5f359b6ec11b1e119a180302e64c19e68885a637" || { echo "R170_SOURCE_DRIFT .github/workflows/dpro-tax-r160-staging-commercial-gap-qa.yml"; exit 1; }
          test "$(git hash-object .github/workflows/dpro-tax-r161-disposable-booking-atomicity-qa.yml)" = "7ae80a66d01c45e5bb2a8debfc5d0a4b0be5a838" || { echo "R170_SOURCE_DRIFT .github/workflows/dpro-tax-r161-disposable-booking-atomicity-qa.yml"; exit 1; }
          test "$(git hash-object .github/workflows/dpro-tax-r162-booking-bridge-contract-qa.yml)" = "ebc86c4e716f79b159cadac3b3b5e115934114f1" || { echo "R170_SOURCE_DRIFT .github/workflows/dpro-tax-r162-booking-bridge-contract-qa.yml"; exit 1; }
          test "$(git hash-object .github/workflows/dpro-tax-r163-guest-capability-loopback-qa.yml)" = "9a20d807bb0f47f9016e0609f2e04af7e35a2210" || { echo "R170_SOURCE_DRIFT .github/workflows/dpro-tax-r163-guest-capability-loopback-qa.yml"; exit 1; }
          test "$(git hash-object .github/workflows/dpro-tax-r164-ui-retry-bridge-contract-qa.yml)" = "292100ad0c5fdfa933c1cf3ad252658b6482a50f" || { echo "R170_SOURCE_DRIFT .github/workflows/dpro-tax-r164-ui-retry-bridge-contract-qa.yml"; exit 1; }
          test "$(git hash-object .github/workflows/dpro-tax-r165-disposable-recovery-http-qa.yml)" = "1ae15008458d07531fe8b784b6de17fa9ae6261f" || { echo "R170_SOURCE_DRIFT .github/workflows/dpro-tax-r165-disposable-recovery-http-qa.yml"; exit 1; }
          test "$(git hash-object .github/workflows/dpro-tax-r166-offline-booking-ui-contract-qa.yml)" = "a0313ee52c2924ac66ec776a789d10608546c111" || { echo "R170_SOURCE_DRIFT .github/workflows/dpro-tax-r166-offline-booking-ui-contract-qa.yml"; exit 1; }
          test "$(git hash-object .github/workflows/dpro-tax-r167-real-ui-candidate-isolation-qa.yml)" = "0b5957a015a378002eb81ee271c0880a11ab7cac" || { echo "R170_SOURCE_DRIFT .github/workflows/dpro-tax-r167-real-ui-candidate-isolation-qa.yml"; exit 1; }
          test "$(git hash-object .github/workflows/dpro-tax-r168-disposable-http-postgres-bridge-qa.yml)" = "aa139b7cb7723ec066310d35fe45888df9933254" || { echo "R170_SOURCE_DRIFT .github/workflows/dpro-tax-r168-disposable-http-postgres-bridge-qa.yml"; exit 1; }
          test "$(git hash-object app.js)" = "4c3475219e5c7fc9203ec5e5143d4f6eb8299423" || { echo "R170_SOURCE_DRIFT app.js"; exit 1; }
          test "$(git hash-object config.js)" = "da1876bae8333a3a10ee13495c0063ded0c2b351" || { echo "R170_SOURCE_DRIFT config.js"; exit 1; }
          test "$(git hash-object .github/workflows/dpro-tax-r169-archived-worker-booking-fallback-qa.yml)" = "448fdeebdd718d28110771128d22c7cb3dcda602" || { echo "R170_SOURCE_DRIFT .github/workflows/dpro-tax-r169-archived-worker-booking-fallback-qa.yml"; exit 1; }
          test "$(git hash-object index.html)" = "c7f6c0b30d1da913a924a582097d4bfe1570a704" || { echo "R170_SOURCE_DRIFT index.html"; exit 1; }
          echo 'R170_22_PINNED_STAGING_SOURCES_UNCHANGED'
      - name: Exercise fictional SQLite additive upgrade and safe rollback
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/R170_CUTOVER_CONTRACT.json" <<'R170_CONTRACT_JSON_SENTINEL'
          {
            "schema": "DPRO_TAX_R170_DRY_RUN",
            "environment": "synthetic_disposable",
            "source_branch": "tax-r7-staging-20261010",
            "product": "DPRO_TAX",
            "actual_customer_verified": false,
            "remote_services_disabled": true,
            "guest_verification": "NOT_CONNECTED",
            "live_schema": "UNVERIFIED",
            "real_rollback": "UNTESTED",
            "commercial_release": "HOLD",
            "existing_public_endpoint": "POST /api/public/appointments",
            "compatibility_decision": "UNDECIDED_REAL_WIRE_CONTRACT",
            "legacy_appointment_rows": "PRESERVE_NO_AUTO_BACKFILL",
            "new_idempotency_ledger": "SIDECAR_DRYRUN_ONLY",
            "rollback_direction": "READ_ONLY_DISABLE_NEW_WRITES_PRESERVE_JOURNAL",
            "guest_identity_options": ["LINE_ID_TOKEN_VERIFIED_SERVER", "SMS_OTP_VERIFIED_SERVER", "EMAIL_MAGIC_LINK_VERIFIED_SERVER"],
            "selected_guest_identity": "UNDECIDED",
            "booking_state": "PENDING_ONLY_NOT_CONFIRMED",
            "time_grid_minutes": 30,
            "approvals": {"contract_confirmed": false, "office_owner_approved": false, "dpro_release_manager_approved": false},
            "gates": [
              {"id":"C01","status":"NOT_TESTED"}, {"id":"C02","status":"NOT_TESTED"},
              {"id":"S01","status":"NOT_TESTED"}, {"id":"S02","status":"NOT_TESTED"},
              {"id":"S03","status":"NOT_TESTED"}, {"id":"S04","status":"NOT_TESTED"},
              {"id":"D01","status":"NOT_TESTED"}, {"id":"D02","status":"NOT_TESTED"},
              {"id":"B01","status":"NOT_TESTED"}, {"id":"B02","status":"NOT_TESTED"},
              {"id":"L01","status":"NOT_TESTED"}, {"id":"L02","status":"NOT_TESTED"},
              {"id":"O01","status":"NOT_TESTED"}, {"id":"O02","status":"NOT_TESTED"}, {"id":"O03","status":"NOT_TESTED"},
              {"id":"U01","status":"NOT_TESTED"}, {"id":"U02","status":"NOT_TESTED"}, {"id":"U03","status":"NOT_TESTED"}
            ]
          }
          R170_CONTRACT_JSON_SENTINEL
          cat > "$RUNNER_TEMP/R170_ROLLBACK_CUTOVER_QA.py" <<'R170_PYTHON_SRC_SENTINEL'
          #!/usr/bin/env python3
          """R170 dry-run ONLY; synthetic SQLite and detached rollout contract. No remote I/O."""
          from __future__ import annotations
          import copy, hashlib, json, os, sqlite3, tempfile, concurrent.futures, threading
          from pathlib import Path

          CODES = ('C01','C02','S01','S02','S03','S04','D01','D02','B01','B02','L01','L02','O01','O02','O03','U01','U02','U03')
          CHECKS=[]
          def check(label, cond):
              if not cond: raise AssertionError('R170_FAIL_'+str(len(CHECKS)+1).zfill(2)+': '+label)
              CHECKS.append(label)
              print('R170_PASS_'+str(len(CHECKS)).zfill(2)+': '+label,flush=True)

          def digest(con):
              rows=con.execute('SELECT id,office_code,requester_name,requested_start,status FROM legacy_appointments ORDER BY id').fetchall()
              return hashlib.sha256(json.dumps(rows,ensure_ascii=False,separators=(',',':')).encode()).hexdigest()

          def connect(file):
              c=sqlite3.connect(file,timeout=15,isolation_level=None,check_same_thread=False)
              c.execute('PRAGMA busy_timeout=15000')
              c.execute('PRAGMA foreign_keys=ON')
              c.execute('PRAGMA journal_mode=WAL')
              return c

          def setup(file):
              c=connect(file)
              c.executescript('''
          CREATE TABLE legacy_appointments(id INTEGER PRIMARY KEY,office_code TEXT NOT NULL,requester_name TEXT NOT NULL,requested_start TEXT NOT NULL,status TEXT NOT NULL);
          INSERT INTO legacy_appointments VALUES(1,'office-a','fictional-a','2030-01-07T10:00:00+09:00','requested');
          INSERT INTO legacy_appointments VALUES(2,'office-a','fictional-b','2030-01-07T10:30:00+09:00','confirmed');
          INSERT INTO legacy_appointments VALUES(3,'office-b','fictional-c','2030-01-07T11:00:00+09:00','requested');
          CREATE TABLE rollout_control(singleton INTEGER PRIMARY KEY CHECK(singleton=1),mode TEXT NOT NULL CHECK(mode IN ('HOLD','DRY_RUN','READ_ONLY_ROLLBACK')),schema_version TEXT NOT NULL);
          INSERT INTO rollout_control VALUES(1,'HOLD','legacy-v1');
          ''')
              return c

          def upgrade(c):
              c.execute('BEGIN IMMEDIATE')
              try:
                  c.execute('''CREATE TABLE booking_request_ledger (
                    id INTEGER PRIMARY KEY AUTOINCREMENT,
                    office_code TEXT NOT NULL, verified_subject TEXT NOT NULL,
                    idempotency_key TEXT NOT NULL, payload_hash TEXT NOT NULL,
                    requested_start TEXT NOT NULL,status TEXT NOT NULL CHECK(status='pending'),
                    UNIQUE(office_code,verified_subject,idempotency_key))''')
                  c.execute('CREATE INDEX ledger_office_subject ON booking_request_ledger(office_code,verified_subject)')
                  c.execute("UPDATE rollout_control SET schema_version='sidecar-v1' WHERE singleton=1")
                  c.execute('COMMIT')
              except: c.execute('ROLLBACK'); raise

          def request(file, office, sub, key, data, trusted=True, consent=True):
              """This is a dry-run gateway simulation. No external provider is wired."""
              if not trusted or not consent: return (403,'DENIED',None)
              if not all(isinstance(x,str) and len(x)>0 for x in (office,sub,key)) or len(key)<16: return (422,'BAD_INPUT',None)
              if office not in ('office-a','office-b') or len(sub)>96 or len(key)>96:return(422,'BAD_INPUT',None)
              if not isinstance(data,dict) or set(data)!={'requested_start','service'} or data['service']!='consultation':return(422,'BAD_INPUT',None)
              slot=data['requested_start']
              if not isinstance(slot,str) or not slot.endswith('+09:00') or not (slot[11:16].endswith(':00') or slot[11:16].endswith(':30')): return(422,'BAD_INPUT',None)
              payload=json.dumps(data,sort_keys=True,separators=(',',':'))
              h=hashlib.sha256(payload.encode()).hexdigest()
              c=connect(file)
              try:
                  c.execute('BEGIN IMMEDIATE')
                  mode=c.execute('SELECT mode FROM rollout_control WHERE singleton=1').fetchone()[0]
                  if mode!='DRY_RUN':
                      c.execute('ROLLBACK');return(503,'HOLD',None)
                  existing=c.execute('SELECT id,payload_hash FROM booking_request_ledger WHERE office_code=? AND verified_subject=? AND idempotency_key=?',(office,sub,key)).fetchone()
                  if existing:
                      c.execute('COMMIT')
                      return (200,'DUPLICATE',existing[0]) if existing[1]==h else (409,'CONFLICT',None)
                  c.execute('INSERT INTO booking_request_ledger(office_code,verified_subject,idempotency_key,payload_hash,requested_start,status) VALUES(?,?,?,?,?,?)',(office,sub,key,h,slot,'pending'))
                  rid=c.execute('SELECT last_insert_rowid()').fetchone()[0]
                  c.execute('COMMIT')
                  return 202,'PENDING',rid
              except:
                  if c.in_transaction:c.execute('ROLLBACK')
                  raise
              finally:c.close()

          def cutover_decision(c, manifest):
              if not isinstance(manifest,dict):return 'HOLD'
              if manifest.get('schema')!='DPRO_TAX_R170_DRY_RUN':return 'HOLD'
              if manifest.get('environment')!='synthetic_disposable':return 'HOLD'
              if manifest.get('actual_customer_verified') is not False:return 'HOLD'
              if manifest.get('remote_services_disabled') is not True:return 'HOLD'
              if manifest.get('source_branch')!='tax-r7-staging-20261010':return 'HOLD'
              if manifest.get('guest_verification')!='NOT_CONNECTED':return 'HOLD'
              if manifest.get('live_schema')!='UNVERIFIED':return 'HOLD'
              if manifest.get('real_rollback')!='UNTESTED':return 'HOLD'
              gates=manifest.get('gates')
              if not isinstance(gates,list) or [g.get('id') for g in gates if isinstance(g,dict)]!=list(CODES):return 'HOLD'
              if any(g.get('status')!='NOT_TESTED' for g in gates):return 'HOLD'
              if any(manifest.get('approvals',{}).values()):return 'HOLD'
              if c.execute('SELECT mode FROM rollout_control').fetchone()[0]!='HOLD':return 'HOLD'
              return 'DRY_RUN_REVIEW_ONLY'

          def rollback_readonly(c):
              c.execute('BEGIN IMMEDIATE')
              try:
                  c.execute("UPDATE rollout_control SET mode='READ_ONLY_ROLLBACK' WHERE singleton=1")
                  c.execute('COMMIT')
              except:c.execute('ROLLBACK');raise

          def run():
           with tempfile.TemporaryDirectory(prefix='r170_disposable_') as temp:
              db=str(Path(temp)/'fictional_only.sqlite')
              c=setup(db); before=digest(c)
              manifest=json.loads(Path(__file__).with_name('R170_CUTOVER_CONTRACT.json').read_text(encoding='utf-8'))
              original=copy.deepcopy(manifest)
              check('exact 18 precontract gate IDs',[x['id'] for x in manifest['gates']]==list(CODES))
              check('18 release gates remain NOT_TESTED',all(x['status']=='NOT_TESTED' for x in manifest['gates']))
              check('no customer environment authorized',manifest['actual_customer_verified'] is False)
              check('all remote services prohibited',manifest['remote_services_disabled'] is True)
              check('release cannot be approved by automated metadata',cutover_decision(c,manifest)=='DRY_RUN_REVIEW_ONLY')
              cases=[('wrong schema',lambda m:m.update(schema='UNKNOWN')),
              ('real environment not asserted',lambda m:m.update(environment='production')),
              ('customer verification cannot be inferred',lambda m:m.update(actual_customer_verified=True)),
              ('remote service flag cannot be enabled',lambda m:m.update(remote_services_disabled=False)),
              ('main branch forbidden',lambda m:m.update(source_branch='main')),
              ('guest adapter must remain unconnected',lambda m:m.update(guest_verification='CONNECTED')),
              ('live schema must be explicitly unverified',lambda m:m.update(live_schema='VERIFIED')),
              ('live rollback must remain untested',lambda m:m.update(real_rollback='PASS')),
              ('missing gate forbidden',lambda m:m['gates'].pop()),
              ('duplicate gate forbidden',lambda m:m['gates'].__setitem__(0,m['gates'][1])),
              ('fabricated gate PASS forbidden',lambda m:m['gates'][0].update(status='PASS')),
              ('office owner approval cannot bypass dry-run scope',lambda m:m['approvals'].update(office_owner_approved=True)),
              ('developer approval cannot bypass dry-run scope',lambda m:m['approvals'].update(dpro_release_manager_approved=True)),
              ('contract cannot be marked signed synthetically',lambda m:m['approvals'].update(contract_confirmed=True)),
              ('gate order drift forbidden',lambda m:m['gates'].reverse())]
              for name,fn in cases:
                  m=copy.deepcopy(original);fn(m);check(name,cutover_decision(c,m)=='HOLD')
              check('legacy starts as 3 untouched fictional rows',c.execute('SELECT COUNT(*) FROM legacy_appointments').fetchone()[0]==3)
              check('initial rollout is fail-closed',c.execute('SELECT mode FROM rollout_control').fetchone()[0]=='HOLD')
              check('old schema fingerprint captured',len(before)==64)
              upgrade(c)
              check('additive sidecar migration preserves old rows',digest(c)==before)
              check('sidecar schema exists',c.execute("SELECT name FROM sqlite_master WHERE name='booking_request_ledger'").fetchone() is not None)
              check('schema revision stamped',c.execute('SELECT schema_version FROM rollout_control').fetchone()[0]=='sidecar-v1')
              check('migration does not enable writes',c.execute('SELECT mode FROM rollout_control').fetchone()[0]=='HOLD')
              data={'requested_start':'2030-01-07T13:00:00+09:00','service':'consultation'}
              check('normal booking blocked by default',request(db,'office-a','client-a','a'*32,data)==(503,'HOLD',None))
              check('no new rows before opt-in',c.execute('SELECT COUNT(*) FROM booking_request_ledger').fetchone()[0]==0)
              # Explicitly synthetic only: allow dry-run transactions, never real deploy.
              c.execute("UPDATE rollout_control SET mode='DRY_RUN' WHERE singleton=1")
              check('dry-run does not authorize release',cutover_decision(c,manifest)=='HOLD')
              check('unauthenticated booking refused',request(db,'office-a','client-a','a'*32,data,trusted=False)[0]==403)
              check('consent not proven refused',request(db,'office-a','client-a','a'*32,data,consent=False)[0]==403)
              check('short key refused',request(db,'office-a','client-a','ab',data)[0]==422)
              check('unknown office refused',request(db,'office-X','client-a','b'*32,data)[0]==422)
              check('invalid service refused',request(db,'office-a','client-a','b'*32,{**data,'service':'fake'})[0]==422)
              check('15-minute slot refused',request(db,'office-a','client-a','b'*32,{**data,'requested_start':'2030-01-07T13:15:00+09:00'})[0]==422)
              first=request(db,'office-a','client-a','a'*32,data)
              check('first pending receipt is created',first[0]==202 and first[1]=='PENDING' and isinstance(first[2],int))
              check('identical submission returns same receipt',request(db,'office-a','client-a','a'*32,data)==(200,'DUPLICATE',first[2]))
              check('changed payload with same key denied',request(db,'office-a','client-a','a'*32,{**data,'requested_start':'2030-01-07T13:30:00+09:00'})[0]==409)
              check('other client same key isolated',request(db,'office-a','client-b','a'*32,data)[2]!=first[2])
              check('other office same key isolated',request(db,'office-b','client-a','a'*32,data)[2]!=first[2])
              check('legacy rows still unchanged after dry run',digest(c)==before)
              check('no row becomes confirmed',c.execute("SELECT COUNT(*) FROM booking_request_ledger WHERE status<>'pending'").fetchone()[0]==0)
              check('no identifying phone or email fields in sidecar',not any('phone' in n or 'email' in n for _,n,*_ in c.execute('PRAGMA table_info(booking_request_ledger)').fetchall()))
              key='race-key-'+'z'*24
              def parallel(_):return request(db,'office-a','client-a',key,data)
              with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:out=list(pool.map(parallel,range(8)))
              ids=[x[2] for x in out]
              check('8 concurrent retries use one request id',len(set(ids))==1 and all(isinstance(v,int) for v in ids))
              check('only one first write across race',sum(x[0]==202 for x in out)==1)
              check('exactly seven safe duplicate acknowledgments',sum(x[0]==200 for x in out)==7)
              check('database ledger contains one race row',c.execute('SELECT COUNT(*) FROM booking_request_ledger WHERE idempotency_key=?',(key,)).fetchone()[0]==1)
              c.close();c=connect(db)
              check('reopened DB still has the race request',request(db,'office-a','client-a',key,data)[2]==ids[0])
              rollback_readonly(c)
              check('rollback is READ_ONLY_ROLLBACK',c.execute('SELECT mode FROM rollout_control').fetchone()[0]=='READ_ONLY_ROLLBACK')
              check('rollback rejects even formerly valid write',request(db,'office-a','client-a','c'*32,data)==(503,'HOLD',None))
              check('rollback never restores legacy direct-insert route',c.execute('SELECT mode FROM rollout_control').fetchone()[0]!='LEGACY_WRITABLE')
              check('rollback retains idempotency journal',c.execute('SELECT COUNT(*) FROM booking_request_ledger').fetchone()[0]>=4)
              check('rollback retains original old rows and checksum',digest(c)==before)
              check('release evaluation after rollback always HOLD',cutover_decision(c,manifest)=='HOLD')
              check('no cross-service secrets or external requests needed',os.environ.get('DPRO_TAX_R170_ALLOW_REMOTE') is None)
              print('R170_SUMMARY '+str(len(CHECKS))+' / '+str(len(CHECKS))+' PASS',flush=True)
              print('R170_REVERSIBLE_SIDECAR_DRYRUN_PASS: ACTUAL_SCHEMA_AND_PRODUCTION_RELEASE_HOLD',flush=True)
              c.close()
          if __name__=='__main__':run()
          R170_PYTHON_SRC_SENTINEL
          printf '%s  %s\n' '0a5eef9bcdb08d399360f339392455bd256357cf68e1c6ce6d179737d3cc18f1' "$RUNNER_TEMP/R170_CUTOVER_CONTRACT.json" | sha256sum --check --status
          printf '%s  %s\n' '47e31a5430f64a77553aa23f1f2a39232b4bfdbe836fb6ab5a02a0068346c024' "$RUNNER_TEMP/R170_ROLLBACK_CUTOVER_QA.py" | sha256sum --check --status
          python3 -m py_compile "$RUNNER_TEMP/R170_ROLLBACK_CUTOVER_QA.py"
          python3 -I "$RUNNER_TEMP/R170_ROLLBACK_CUTOVER_QA.py" | tee "$RUNNER_TEMP/r170.log"
          grep -Fx 'R170_SUMMARY 56 / 56 PASS' "$RUNNER_TEMP/r170.log"
