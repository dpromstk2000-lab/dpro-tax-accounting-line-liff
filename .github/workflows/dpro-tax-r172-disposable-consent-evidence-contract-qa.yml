          test "$(git hash-object .github/workflows/dpro-tax-r158-public-demo-source-integrity-qa.yml)" = "7590c8417fa940b73ccaf4e65534176e1d643f32" || { echo "R172_PIN_MISMATCH .github/workflows/dpro-tax-r158-public-demo-source-integrity-qa.yml"; exit 1; }
          test "$(git hash-object .github/workflows/dpro-tax-r159-release-evidence-contract-qa.yml)" = "b631da2cf67eb198160a0ffd8b88596b020d51e9" || { echo "R172_PIN_MISMATCH .github/workflows/dpro-tax-r159-release-evidence-contract-qa.yml"; exit 1; }
          test "$(git hash-object .github/workflows/dpro-tax-r160-staging-commercial-gap-qa.yml)" = "5f359b6ec11b1e119a180302e64c19e68885a637" || { echo "R172_PIN_MISMATCH .github/workflows/dpro-tax-r160-staging-commercial-gap-qa.yml"; exit 1; }
          test "$(git hash-object .github/workflows/dpro-tax-r161-disposable-booking-atomicity-qa.yml)" = "7ae80a66d01c45e5bb2a8debfc5d0a4b0be5a838" || { echo "R172_PIN_MISMATCH .github/workflows/dpro-tax-r161-disposable-booking-atomicity-qa.yml"; exit 1; }
          test "$(git hash-object .github/workflows/dpro-tax-r162-booking-bridge-contract-qa.yml)" = "ebc86c4e716f79b159cadac3b3b5e115934114f1" || { echo "R172_PIN_MISMATCH .github/workflows/dpro-tax-r162-booking-bridge-contract-qa.yml"; exit 1; }
          test "$(git hash-object .github/workflows/dpro-tax-r163-guest-capability-loopback-qa.yml)" = "9a20d807bb0f47f9016e0609f2e04af7e35a2210" || { echo "R172_PIN_MISMATCH .github/workflows/dpro-tax-r163-guest-capability-loopback-qa.yml"; exit 1; }
