          test "$(git hash-object .github/workflows/dpro-tax-r165-disposable-recovery-http-qa.yml)" = "1ae15008458d07531fe8b784b6de17fa9ae6261f" || { echo "R172_PIN_MISMATCH .github/workflows/dpro-tax-r165-disposable-recovery-http-qa.yml"; exit 1; }
          test "$(git hash-object .github/workflows/dpro-tax-r166-offline-booking-ui-contract-qa.yml)" = "a0313ee52c2924ac66ec776a789d10608546c111" || { echo "R172_PIN_MISMATCH .github/workflows/dpro-tax-r166-offline-booking-ui-contract-qa.yml"; exit 1; }
          test "$(git hash-object .github/workflows/dpro-tax-r167-real-ui-candidate-isolation-qa.yml)" = "0b5957a015a378002eb81ee271c0880a11ab7cac" || { echo "R172_PIN_MISMATCH .github/workflows/dpro-tax-r167-real-ui-candidate-isolation-qa.yml"; exit 1; }
          test "$(git hash-object .github/workflows/dpro-tax-r168-disposable-http-postgres-bridge-qa.yml)" = "aa139b7cb7723ec066310d35fe45888df9933254" || { echo "R172_PIN_MISMATCH .github/workflows/dpro-tax-r168-disposable-http-postgres-bridge-qa.yml"; exit 1; }
          test "$(git hash-object app.js)" = "4c3475219e5c7fc9203ec5e5143d4f6eb8299423" || { echo "R172_PIN_MISMATCH app.js"; exit 1; }
          test "$(git hash-object config.js)" = "da1876bae8333a3a10ee13495c0063ded0c2b351" || { echo "R172_PIN_MISMATCH config.js"; exit 1; }
          test "$(git hash-object .github/workflows/dpro-tax-r169-archived-worker-booking-fallback-qa.yml)" = "448fdeebdd718d28110771128d22c7cb3dcda602" || { echo "R172_PIN_MISMATCH .github/workflows/dpro-tax-r169-archived-worker-booking-fallback-qa.yml"; exit 1; }
          test "$(git hash-object index.html)" = "c7f6c0b30d1da913a924a582097d4bfe1570a704" || { echo "R172_PIN_MISMATCH index.html"; exit 1; }
          test "$(git hash-object .github/workflows/dpro-tax-r170-cutover-rollback-contract-qa.yml)" = "bf903fb6a2a108e49977780c087eec5d969d3fbe" || { echo "R172_PIN_MISMATCH .github/workflows/dpro-tax-r170-cutover-rollback-contract-qa.yml"; exit 1; }
          test "$(git hash-object .github/workflows/dpro-tax-r171-privacy-consent-bridge-qa.yml)" = "63d78f54d56b72846c0dd071089d79d37716960d" || { echo "R172_PIN_MISMATCH .github/workflows/dpro-tax-r171-privacy-consent-bridge-qa.yml"; exit 1; }
          echo 'R172_PIN_SUMMARY 24 / 24 PASS; SOURCE_UNMODIFIED'
      - name: Materialize isolated fake identity and SQLite reference only in runner temp
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/r172_reference.py" <<'R172_SYNTHETIC_REFERENCE_ONLY'
          #!/usr/bin/env python3
          """DPRO TAX R172: synthetic, nondeployable consent evidence + booking HTTP reference.
          Test fixtures use a PUBLIC signing key. NO actual identity or customer data.
          """
          import base64, concurrent.futures, datetime as dt, hashlib, hmac, http.server, json, os, re, secrets, sqlite3, tempfile, threading, urllib.error, urllib.request

          NOW = dt.datetime(2026, 10, 13, 10, 0, tzinfo=dt.timezone(dt.timedelta(hours=9)))
          JST = dt.timezone(dt.timedelta(hours=9))
          KEY = b'R172_PUBLIC_SYNTHETIC_ONLY_NEVER_REAL_SECURITY_KEY'
          DUMMY_NOTICE = b'FICTIONAL_NONLEGAL_PRIVACY_NOTICE_FOR_ISOLATED_QA_ONLY_V1'
          DB_PATH = None


          def raw(obj): return json.dumps(obj, ensure_ascii=False, separators=(',', ':'), sort_keys=True).encode()
          def digest(obj): return hashlib.sha256(raw(obj)).hexdigest()
          def b64(b): return base64.urlsafe_b64encode(b).decode().rstrip('=')
          def ub64(s): return base64.urlsafe_b64decode(s + '=' * (-len(s) % 4))


          def issue_token(office='office_A', subject='guest_A', exp=180, **overrides):
              data = dict(iss='fixture-verifier', aud='booking-service', method='simulated_verified_contact', purpose='booking', office=office, sub=subject, iat=int(NOW.timestamp()), exp=int(NOW.timestamp())+exp)
              data.update(overrides)
              m = b64(raw(data)); return m + '.' + b64(hmac.new(KEY,m.encode(),hashlib.sha256).digest())


          def verify_identity(token):
              if not isinstance(token,str) or len(token)>2048 or token.count('.')!=1: raise Bad(401,'IDENTITY_REQUIRED')
              try:
                  m,s=token.split('.'); sig=hmac.new(KEY,m.encode(),hashlib.sha256).digest()
                  if not hmac.compare_digest(sig,ub64(s)): raise ValueError()
                  d=json.loads(ub64(m))
              except Exception: raise Bad(401,'IDENTITY_INVALID')
              if not isinstance(d,dict) or set(d)!={'iss','aud','method','purpose','office','sub','iat','exp'}: raise Bad(401,'IDENTITY_CLAIMS')
              if d['iss']!='fixture-verifier' or d['aud']!='booking-service' or d['method']!='simulated_verified_contact' or d['purpose']!='booking':raise Bad(401,'IDENTITY_SCOPE')
              if not all(isinstance(d[x],str) and re.fullmatch(r'[a-zA-Z0-9_-]{3,35}',d[x]) for x in ['office','sub']): raise Bad(401,'IDENTITY_SCOPE')
              if type(d['iat']) is not int or type(d['exp']) is not int or d['iat']>int(NOW.timestamp())+30 or d['exp']<=int(NOW.timestamp()) or d['exp']-d['iat']>300:raise Bad(401,'IDENTITY_EXPIRED')
              return d['office'],d['sub']


          class Bad(Exception):
              def __init__(self,status,code): self.status=status;self.code=code;super().__init__(code)

          def connect():
              c=sqlite3.connect(DB_PATH,timeout=12,isolation_level=None)
              c.execute('PRAGMA foreign_keys=ON');c.execute('PRAGMA busy_timeout=12000');return c

          def setup(path):
              global DB_PATH
              DB_PATH=path
              c=connect()
              c.executescript('''
              PRAGMA journal_mode=WAL;
              CREATE TABLE policies(office TEXT PRIMARY KEY,version TEXT NOT NULL,digest TEXT NOT NULL,path TEXT NOT NULL,active INTEGER NOT NULL,fictional_approved INTEGER NOT NULL);
              CREATE TABLE consent_events(seq INTEGER PRIMARY KEY AUTOINCREMENT,kind TEXT NOT NULL CHECK(kind IN ('challenge','revocation')));
              CREATE TABLE challenges(id TEXT PRIMARY KEY,office TEXT NOT NULL,subject TEXT NOT NULL,version TEXT NOT NULL,digest TEXT NOT NULL,issued_at INTEGER NOT NULL,expires_at INTEGER NOT NULL,issued_seq INTEGER NOT NULL,used_by TEXT);
              CREATE TABLE bookings(id TEXT PRIMARY KEY,office TEXT NOT NULL,subject TEXT NOT NULL,key TEXT NOT NULL,service TEXT NOT NULL,start TEXT NOT NULL,intent_hash TEXT NOT NULL,status TEXT NOT NULL CHECK(status='pending'),UNIQUE(office,subject,key));
              CREATE TABLE consent_evidence(id INTEGER PRIMARY KEY AUTOINCREMENT,booking_id TEXT NOT NULL UNIQUE,office TEXT NOT NULL,subject TEXT NOT NULL,policy_version TEXT NOT NULL,policy_digest TEXT NOT NULL,challenge_id TEXT NOT NULL UNIQUE,accepted_at INTEGER NOT NULL,proof_method TEXT NOT NULL CHECK(proof_method='synthetic_verified_contact_plus_explicit_boolean'),FOREIGN KEY(booking_id) REFERENCES bookings(id));
              CREATE TABLE revocations(id INTEGER PRIMARY KEY,office TEXT NOT NULL,subject TEXT NOT NULL,version TEXT NOT NULL,occurred_at INTEGER NOT NULL,occurred_seq INTEGER NOT NULL);
              CREATE TRIGGER evidence_no_update BEFORE UPDATE ON consent_evidence BEGIN SELECT RAISE(ABORT,'AUDIT_APPEND_ONLY');END;
              CREATE TRIGGER evidence_no_delete BEFORE DELETE ON consent_evidence BEGIN SELECT RAISE(ABORT,'AUDIT_APPEND_ONLY');END;
              ''')
              for office in ['office_A','office_B']:
                  c.execute('INSERT INTO policies VALUES(?,?,?,?,1,1)',(office,'2026-10-v1',hashlib.sha256(DUMMY_NOTICE).hexdigest(),'/tax-privacy-v1.html'))
              c.close()

          def active_policy(c,office):
              row=c.execute('SELECT version,digest,path,active,fictional_approved FROM policies WHERE office=?',(office,)).fetchone()
              if not row or row[3]!=1 or row[4]!=1:raise Bad(503,'POLICY_UNAVAILABLE')
              if not re.fullmatch(r'20\d{2}-\d{2}-v\d{1,2}',row[0]) or not re.fullmatch('[0-9a-f]{64}',row[1]) or not re.fullmatch(r'/[a-zA-Z0-9/_-]+\.html',row[2]):raise Bad(503,'POLICY_INVALID')
              return row

          def issue_challenge(token):
              office,subject=verify_identity(token)
              c=connect()
              try:
                  c.execute('BEGIN IMMEDIATE')
                  policy=active_policy(c,office)
                  challenge=secrets.token_urlsafe(24)
                  seq=c.execute("INSERT INTO consent_events(kind) VALUES('challenge')").lastrowid
                  c.execute('INSERT INTO challenges(id,office,subject,version,digest,issued_at,expires_at,issued_seq) VALUES(?,?,?,?,?,?,?,?)',(challenge,office,subject,policy[0],policy[1],int(NOW.timestamp()),int(NOW.timestamp())+120,seq))
                  c.execute('COMMIT')
                  return 200,dict(ok=True,challenge_id=challenge,notice_version=policy[0],notice_digest=policy[1],notice_path=policy[2],expires_in=120)
              finally:c.close()


          def check_slot(start):
              if not isinstance(start,str) or len(start)!=25 or not re.fullmatch(r'\d{4}-\d{2}-\d{2}T\d{2}:(00|30):00\+09:00',start):raise Bad(422,'INVALID_SLOT')
              try:t=dt.datetime.fromisoformat(start)
              except Exception:raise Bad(422,'INVALID_SLOT')
              if not NOW<t<=NOW+dt.timedelta(days=365):raise Bad(422,'INVALID_SLOT')

          def make_booking(token,data,key):
              office,subject=verify_identity(token)
              if not isinstance(key,str) or not re.fullmatch(r'[a-zA-Z0-9_-]{20,100}',key):raise Bad(422,'IDEMPOTENCY_REQUIRED')
              if not isinstance(data,dict) or set(data)!={'service','requested_start_at','privacy_consent','privacy_notice_version','challenge_id'}:raise Bad(422,'BODY_INVALID')
              if data['privacy_consent'] is not True:raise Bad(422,'CONSENT_REQUIRED')
              if not isinstance(data['service'],str) or not re.fullmatch(r'service_[a-zA-Z0-9_-]{1,30}',data['service']):raise Bad(422,'SERVICE_INVALID')
              check_slot(data['requested_start_at'])
              if not isinstance(data['privacy_notice_version'],str) or not re.fullmatch(r'20\d{2}-\d{2}-v\d{1,2}',data['privacy_notice_version']):raise Bad(422,'VERSION_INVALID')
              if not isinstance(data['challenge_id'],str) or not re.fullmatch('[a-zA-Z0-9_-]{25,80}',data['challenge_id']):raise Bad(422,'CHALLENGE_INVALID')
              intent=digest({k:data[k] for k in ('service','requested_start_at','privacy_notice_version')})
              c=connect()
              try:
                  c.execute('BEGIN IMMEDIATE')
                  prior=c.execute('SELECT id,intent_hash FROM bookings WHERE office=? AND subject=? AND key=?',(office,subject,key)).fetchone()
                  if prior:
                      if prior[1]!=intent:raise Bad(409,'IDEMPOTENCY_CONFLICT')
                      c.execute('COMMIT')
                      return 200,dict(ok=True,id=prior[0],status='pending',replayed=True)
                  policy=active_policy(c,office)
                  if data['privacy_notice_version']!=policy[0]:raise Bad(409,'POLICY_CHANGED')
                  challenge=c.execute('SELECT office,subject,version,digest,issued_at,expires_at,used_by,issued_seq FROM challenges WHERE id=?',(data['challenge_id'],)).fetchone()
                  if not challenge:raise Bad(403,'CHALLENGE_NOT_FOUND')
                  if challenge[0:2]!=(office,subject):raise Bad(403,'CHALLENGE_SCOPE')
                  if challenge[2:4]!=(policy[0],policy[1]):raise Bad(409,'POLICY_CHANGED')
                  if not challenge[4]<=int(NOW.timestamp())<challenge[5]:raise Bad(403,'CHALLENGE_EXPIRED')
                  if challenge[6] is not None:raise Bad(409,'CHALLENGE_USED')
                  last=c.execute('SELECT MAX(occurred_seq) FROM revocations WHERE office=? AND subject=? AND version=?',(office,subject,policy[0])).fetchone()[0]
                  if last is not None and challenge[7]<=last:raise Bad(403,'CONSENT_REVOKED_RECONSENT_REQUIRED')
                  booking_id='req_'+secrets.token_hex(12)
                  c.execute('INSERT INTO bookings VALUES(?,?,?,?,?,?,?,?)',(booking_id,office,subject,key,data['service'],data['requested_start_at'],intent,'pending'))
                  c.execute('INSERT INTO consent_evidence(booking_id,office,subject,policy_version,policy_digest,challenge_id,accepted_at,proof_method) VALUES(?,?,?,?,?,?,?,?)',(booking_id,office,subject,policy[0],policy[1],data['challenge_id'],int(NOW.timestamp()),'synthetic_verified_contact_plus_explicit_boolean'))
                  c.execute('UPDATE challenges SET used_by=? WHERE id=?',(booking_id,data['challenge_id']))
                  c.execute('COMMIT')
                  return 201,dict(ok=True,id=booking_id,status='pending',replayed=False)
              except Exception:
                  if c.in_transaction:c.execute('ROLLBACK')
                  raise
              finally:c.close()

          def revoke(token,version):
              office,subject=verify_identity(token)
              if not isinstance(version,str) or not re.fullmatch(r'20\d{2}-\d{2}-v\d{1,2}',version):raise Bad(422,'VERSION_INVALID')
              c=connect()
              try:
                  c.execute('BEGIN IMMEDIATE')
                  pol=active_policy(c,office)
                  if pol[0]!=version:raise Bad(409,'VERSION_MISMATCH')
                  seq=c.execute("INSERT INTO consent_events(kind) VALUES('revocation')").lastrowid
                  c.execute('INSERT INTO revocations(office,subject,version,occurred_at,occurred_seq) VALUES(?,?,?,?,?)',(office,subject,version,int(NOW.timestamp()),seq))
                  c.execute('COMMIT')
                  return 200,dict(ok=True,revoked=True)
              finally:c.close()

          class Handler(http.server.BaseHTTPRequestHandler):
              def log_message(self,*args):pass
              def do_POST(self):
                  try:
                      if self.path not in ['/qa/challenge','/qa/book','/qa/revoke']:raise Bad(404,'NOT_FOUND')
                      n=self.headers.get('Content-Length')
                      if n is None or not n.isdigit() or int(n)>4096:raise Bad(413,'PAYLOAD_LIMIT')
                      payload=self.rfile.read(int(n))
                      try:d=json.loads(payload)
                      except Exception:raise Bad(400,'INVALID_JSON')
                      if not isinstance(d,dict):raise Bad(422,'BODY_INVALID')
                      auth=self.headers.get('Authorization','')
                      if not auth.startswith('Bearer '):raise Bad(401,'IDENTITY_REQUIRED')
                      token=auth[7:]
                      if self.path=='/qa/challenge':
                          if d:raise Bad(422,'BODY_INVALID')
                          status,out=issue_challenge(token)
                      elif self.path=='/qa/book': status,out=make_booking(token,d,self.headers.get('Idempotency-Key',''))
                      else:
                          if set(d)!={'privacy_notice_version'}:raise Bad(422,'BODY_INVALID')
                          status,out=revoke(token,d['privacy_notice_version'])
                  except Bad as e:status,out=e.status,dict(ok=False,error=e.code)
                  except sqlite3.Error:status,out=503,dict(ok=False,error='DATABASE_UNAVAILABLE')
                  except Exception:status,out=500,dict(ok=False,error='REFERENCE_ERROR')
                  outbytes=raw(out)
                  self.send_response(status);self.send_header('Content-Type','application/json; charset=utf-8');self.send_header('Cache-Control','no-store');self.send_header('Content-Length',str(len(outbytes)));self.end_headers();self.wfile.write(outbytes)

          def request(url,path,token=None,data=None,key=None,raw_body=None):
              h={'Content-Type':'application/json'}
              if token is not None:h['Authorization']='Bearer '+token
              if key is not None:h['Idempotency-Key']=key
              b=raw_body if raw_body is not None else raw({} if data is None else data)
              req=urllib.request.Request(url+path,data=b,headers=h,method='POST')
              try:
                  with urllib.request.urlopen(req,timeout=15) as resp:return resp.status,json.loads(resp.read())
              except urllib.error.HTTPError as e:return e.code,json.loads(e.read())

          class Test:
              def __init__(self,url):self.url=url;self.count=0
              def check(self,name,yes):
                  if not yes:raise AssertionError('R172_FAIL_'+name)
                  self.count+=1;print(f'R172_PASS_{self.count:02d}: {name}',flush=True)
              def call(self,path,token=None,data=None,key=None,raw_body=None):return request(self.url,path,token,data,key,raw_body)
              def error(self,name,path,status,code,token=None,data=None,key=None,raw_body=None):
                  s,o=self.call(path,token,data,key,raw_body);self.check(name,s==status and o=={'ok':False,'error':code})

          def tests(url):
              t=Test(url);A=issue_token();B=issue_token(subject='guest_B');C=issue_token(office='office_B')
              when='2026-10-14T10:00:00+09:00'
              def challenge(tok=A):
                  s,o=t.call('/qa/challenge',tok);assert s==200;return o
              def body(ch,**kw):
                  d=dict(service='service_tax',requested_start_at=when,privacy_consent=True,privacy_notice_version=ch['notice_version'],challenge_id=ch['challenge_id']);d.update(kw);return d
              def key(i):return 'idempotency_key_r172_'+str(i).zfill(6)
              s,ch=t.call('/qa/challenge',A)
              t.check('verified subject receives policy challenge',s==200 and ch['ok'] and ch['notice_version']=='2026-10-v1')
              t.check('server supplies notice digest',ch['notice_digest']==hashlib.sha256(DUMMY_NOTICE).hexdigest())
              t.check('same-site policy document path',ch['notice_path']=='/tax-privacy-v1.html')
              t.check('short capability lifetime',ch['expires_in']==120)
              t.error('anonymous challenge denied','/qa/challenge',401,'IDENTITY_REQUIRED')
              t.error('invalid signed identity denied','/qa/challenge',401,'IDENTITY_INVALID',token=A[:-1]+'*')
              t.error('wrong identity issuer denied','/qa/challenge',401,'IDENTITY_SCOPE',token=issue_token(iss='other'))
              t.error('wrong identity audience denied','/qa/challenge',401,'IDENTITY_SCOPE',token=issue_token(aud='other'))
              t.error('wrong identity purpose denied','/qa/challenge',401,'IDENTITY_SCOPE',token=issue_token(purpose='profile'))
              t.error('wrong identity method denied','/qa/challenge',401,'IDENTITY_SCOPE',token=issue_token(method='unverified'))
              t.error('expired identity denied','/qa/challenge',401,'IDENTITY_EXPIRED',token=issue_token(exp=-1))
              t.error('overlong identity validity denied','/qa/challenge',401,'IDENTITY_EXPIRED',token=issue_token(exp=900))
              t.error('identity with extra claims denied','/qa/challenge',401,'IDENTITY_CLAIMS',token=issue_token(role='admin'))
