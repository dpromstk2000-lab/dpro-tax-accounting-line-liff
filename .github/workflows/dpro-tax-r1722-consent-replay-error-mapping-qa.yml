name: DPRO TAX R172.2 Consent Replay Strict Error Mapping Repair QA (Synthetic Only)

on:
  push:
    branches: [tax-r7-staging-20261010]
    paths:
      - '.github/workflows/dpro-tax-r1721-disposable-consent-lock-fix-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dpro-tax-r1721-no-prod-${{ github.ref }}
  cancel-in-progress: false

jobs:
  consent-journal-qa:
    if: ${{ github.repository == 'dpromstk2000-lab/dpro-tax-accounting-line-liff' && github.ref == 'refs/heads/tax-r7-staging-20261010' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    services:
      pg:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: r172-only-disposable-no-customer-data
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - name: Checkout immutable staging source without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Protect 25 staging source blobs including failed R172; require no production credentials
        shell: bash
        run: |
