          test "$(git hash-object .github/workflows/dpro-tax-r167-real-ui-candidate-isolation-qa.yml)" = "0b5957a015a378002eb81ee271c0880a11ab7cac" || { echo "R172_PIN_DRIFT .github/workflows/dpro-tax-r167-real-ui-candidate-isolation-qa.yml"; exit 1; }
          test "$(git hash-object .github/workflows/dpro-tax-r168-disposable-http-postgres-bridge-qa.yml)" = "aa139b7cb7723ec066310d35fe45888df9933254" || { echo "R172_PIN_DRIFT .github/workflows/dpro-tax-r168-disposable-http-postgres-bridge-qa.yml"; exit 1; }
