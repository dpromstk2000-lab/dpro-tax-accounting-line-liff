          docker exec -i -u postgres "$R172_PG_CONTAINER" psql -XAt -v ON_ERROR_STOP=1 -U postgres -d postgres < "$RUNNER_TEMP/r172_r161.sql"
          docker exec -i -u postgres "$R172_PG_CONTAINER" psql -XAt -v ON_ERROR_STOP=1 -U postgres -d postgres < "$RUNNER_TEMP/r172_consent.sql"
          R172_PG_CONTAINER="$R172_PG_CONTAINER" python3 -I "$RUNNER_TEMP/r172_test.py" | tee "$RUNNER_TEMP/r172_result.log"
