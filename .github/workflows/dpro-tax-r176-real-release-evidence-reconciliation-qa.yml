name: DPRO TAX R176 Real Source and 18 Evidence Gate Reconciliation (Read Only HOLD)

on:
  push:
    branches: [tax-r7-staging-20261010]
    paths:
      - '.github/workflows/dpro-tax-r176-real-release-evidence-reconciliation-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dpro-tax-r176-evidence-only-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evidence-source-reconciliation:
    if: ${{ github.repository == 'dpromstk2000-lab/dpro-tax-accounting-line-liff' && github.ref == 'refs/heads/tax-r7-staging-20261010' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact staging source WITHOUT write credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: "Pin seven immutable staging Git source blobs and prohibit live access"
        shell: bash
        run: |
          set -euo pipefail
          # Only SOURCE-CODE inspection. This runner has no production secrets, SQL access, or deployment permissions.
          test "$GITHUB_REPOSITORY" = 'dpromstk2000-lab/dpro-tax-accounting-line-liff'
          test "$GITHUB_REF" = 'refs/heads/tax-r7-staging-20261010'
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}" && test -z "${DATABASE_URL:-}" && test -z "${LINE_CHANNEL_SECRET:-}" && test -z "${CLOUDFLARE_API_TOKEN:-}" && test -z "${CLOUDFLARE_ACCOUNT_ID:-}"
          test "$(git hash-object app.js)" = "4c3475219e5c7fc9203ec5e5143d4f6eb8299423" || { echo "R176_SOURCE_DRIFT app.js"; exit 1; }
          test "$(git hash-object config.js)" = "da1876bae8333a3a10ee13495c0063ded0c2b351" || { echo "R176_SOURCE_DRIFT config.js"; exit 1; }
          test "$(git hash-object index.html)" = "c7f6c0b30d1da913a924a582097d4bfe1570a704" || { echo "R176_SOURCE_DRIFT index.html"; exit 1; }
          test "$(git hash-object .github/workflows/dpro-tax-r159-release-evidence-contract-qa.yml)" = "b631da2cf67eb198160a0ffd8b88596b020d51e9" || { echo "R176_SOURCE_DRIFT .github/workflows/dpro-tax-r159-release-evidence-contract-qa.yml"; exit 1; }
          test "$(git hash-object .github/workflows/dpro-tax-r174-fictional-form-contact-consent-ledger-qa.yml)" = "746ff0607389f8d8d9b7b0ac8b0370383a846b6c" || { echo "R176_SOURCE_DRIFT .github/workflows/dpro-tax-r174-fictional-form-contact-consent-ledger-qa.yml"; exit 1; }
          test "$(git hash-object .github/workflows/dpro-tax-r175-fictional-contact-vault-privacy-qa.yml)" = "9d0fb3a78ab6c053293d4a2430f8b890a7555af9" || { echo "R176_SOURCE_DRIFT .github/workflows/dpro-tax-r175-fictional-contact-vault-privacy-qa.yml"; exit 1; }
          test "$(git hash-object .github/workflows/dpro-tax-r1751-encrypted-contact-heredoc-fix-qa.yml)" = "5938e7dce6629508f17898b019849b52e07ed736" || { echo "R176_SOURCE_DRIFT .github/workflows/dpro-tax-r1751-encrypted-contact-heredoc-fix-qa.yml"; exit 1; }
          echo "R176_STAGING_SEVEN_SOURCE_BLOBS_VERIFIED; PRODUCTION_HOLD"
          if git ls-files | grep -Eq '(^|/)(worker\.(js|ts)|wrangler\.(toml|json|jsonc)|supabase/migrations/)'; then
            echo 'R176_WORKER_OR_MIGRATION_SOURCE_PRESENT_NEEDS_MANUAL_REVIEW'
            exit 1
          fi
          echo 'R176_WORKER_CODE_AND_REAL_SUPABASE_MIGRATIONS_NOT_IN_THIS_REPOSITORY; PRODUCTION_STATE_UNKNOWN'
      - name: "Create integrity-checked evidence guards only inside ephemeral runner directory"
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/R159_RELEASE_EVIDENCE_GUARD.py" <<'R176_EMBED_R159_RELEASE_EVIDENCE_GUARD_PY'
          #!/usr/bin/env python3
          """DPRO TAX R159 independent *offline* proof-of-contract validator.

          NEVER authorizes production. It only verifies manifest shape and file integrity.
          No real credentials, production network, Worker, Supabase or LINE use.
          """
          import argparse
          import copy
          import datetime as dt
          import hashlib
          import json
          import pathlib
          import re
          import tempfile
          import sys

          SCHEMA = 'DPRO_TAX_R159_EVIDENCE_V1'
          GATES = ('C01','C02','S01','S02','S03','S04','D01','D02','B01','B02','L01','L02','O01','O02','O03','U01','U02','U03')
          APPROVALS = ('contract_confirmed','office_owner_approved','dpro_release_manager_approved')
          HASH = re.compile(r'^[a-f0-9]{64}$')
          EV_ID = re.compile(r'^EV-[0-9]{8}-[A-Z0-9-]{3,40}$')
          FILE_NAME = re.compile(r'^[A-Z][0-9]{2}\.json$')
          KEY_LEAK = re.compile(r'-----BEGIN(?: RSA| EC| OPENSSH)? PRIVATE KEY-----|\b(?:sk_live|ghp_|glpat-|xoxb-)[A-Za-z0-9_-]{8,}|\bBearer\s+[A-Za-z0-9._-]{24,}|\beyJ[A-Za-z0-9_-]{25,}\.[A-Za-z0-9_-]{10,}', re.I)
          MAX_BYTES = 16_384

          def prototype():
              return dict(schema=SCHEMA, product='DPRO_TAX', environment='precontract', office_code='UNASSIGNED',
                          customer_ref='UNASSIGNED', no_demo_pin_in_production=True, no_embedded_secrets=True,
                          approvals={name:False for name in APPROVALS},
                          gates=[dict(id=gid,status='NOT_TESTED', evidence_id='',path='',sha256='',verified_on='',verified_by='') for gid in GATES])

          def evaluate(m, evidence_root, today=None):
              today = today or dt.date.today()
              fatal=[]; blocked=[]; counted=0
              if not isinstance(m,dict):
                  return dict(status='INVALID',fatal=['manifest_not_object'],blockers=[],valid_evidence=0,required=18,production_release_authorized=False)
              body=json.dumps(m,sort_keys=True,ensure_ascii=False)
              if KEY_LEAK.search(body): fatal.append('suspected_secret_in_manifest')
              if m.get('schema')!=SCHEMA or m.get('product')!='DPRO_TAX': fatal.append('invalid_schema_or_product')
              if m.get('environment') not in ('precontract','isolated_staging','production_candidate'):fatal.append('invalid_environment')
              if m.get('no_demo_pin_in_production') is not True or m.get('no_embedded_secrets') is not True:fatal.append('unsafe_credentials_policy')
              rows=m.get('gates')
              if not isinstance(rows,list): rows=[];fatal.append('gates_not_list')
              ids=[g.get('id') if isinstance(g,dict) else None for g in rows]
              if len(rows)!=18 or len(set(ids))!=18 or set(ids)!=set(GATES):fatal.append('invalid_18_gate_identifiers')
              office=m.get('office_code'); customer=m.get('customer_ref')
              if not isinstance(office,str) or not re.fullmatch(r'[A-Z0-9_-]{6,48}',office or '') or office in ('UNASSIGNED','1234'):
                  blocked.append('office_unassigned')
              if not isinstance(customer,str) or not re.fullmatch(r'[A-Z0-9_-]{6,48}',customer or '') or customer=='UNASSIGNED':
                  blocked.append('customer_unassigned')
              if m.get('environment')=='precontract':blocked.append('precontract_mode')
              approvals=m.get('approvals')
              if not isinstance(approvals,dict): approvals={};fatal.append('invalid_approvals')
              for key in APPROVALS:
                  if approvals.get(key) is not True:blocked.append('approval_missing:'+key)
              root=pathlib.Path(evidence_root)
              for row in rows:
                  if not isinstance(row,dict):fatal.append('invalid_gate_object');continue
                  gid=row.get('id'); status=row.get('status')
                  if status not in ('NOT_TESTED','BLOCKED','FAIL','PASS'):
                      fatal.append('invalid_gate_status:'+str(gid));continue
                  if status!='PASS': blocked.append(str(gid)+':'+status);continue
                  path=row.get('path'); ref=row.get('evidence_id'); digest=row.get('sha256')
                  if not isinstance(path,str) or not FILE_NAME.fullmatch(path) or path!=str(gid)+'.json':
                      blocked.append(str(gid)+':path');continue
                  if not isinstance(ref,str) or not EV_ID.fullmatch(ref) or 'FAKE' in ref or 'SYNTH' in ref:
                      blocked.append(str(gid)+':reference');continue
                  if not isinstance(digest,str) or not HASH.fullmatch(digest) or digest=='0'*64:
                      blocked.append(str(gid)+':hash');continue
                  p=root/path
                  if p.is_symlink() or not p.is_file():blocked.append(str(gid)+':missing_or_symlink');continue
                  try: data=p.read_bytes()
                  except OSError:blocked.append(str(gid)+':unreadable');continue
                  if len(data)>MAX_BYTES or hashlib.sha256(data).hexdigest()!=digest:
                      blocked.append(str(gid)+':file_size_or_digest');continue
                  try: obj=json.loads(data.decode('utf-8'))
                  except (ValueError,UnicodeError):blocked.append(str(gid)+':not_json');continue
                  if not isinstance(obj,dict):blocked.append(str(gid)+':evidence_not_object');continue
                  if set(obj)!={'gate_id','office_code','customer_ref','synthetic','independent_report_ref','summary','verified_by','verified_on'}:
                      blocked.append(str(gid)+':evidence_schema');continue
                  if (obj['gate_id'],obj['office_code'],obj['customer_ref']) != (gid,office,customer):
                      blocked.append(str(gid)+':office_or_gate_binding');continue
                  if obj['synthetic'] is not False:blocked.append(str(gid)+':synthetic');continue
                  if obj['verified_by'] not in ('office_owner','dpro_security','dpro_qa','delivery_lead','customer_staff','customer_client') or obj['verified_by']!=row.get('verified_by'):
                      blocked.append(str(gid)+':role');continue
                  if obj['verified_on'] != row.get('verified_on'):
                      blocked.append(str(gid)+':date_mismatch');continue
                  try: day=dt.date.fromisoformat(obj['verified_on'])
                  except (TypeError,ValueError):blocked.append(str(gid)+':date_invalid');continue
                  if day>today or (today-day).days>90:
                      blocked.append(str(gid)+':date_stale_or_future');continue
                  if not isinstance(obj['independent_report_ref'],str) or len(obj['independent_report_ref'])<12 or not isinstance(obj['summary'],str) or len(obj['summary'])<20:
                      blocked.append(str(gid)+':independent_evidence_missing');continue
                  if KEY_LEAK.search(data.decode('utf-8')):fatal.append('suspected_secret_in_evidence:'+str(gid));continue
                  counted+=1
              result='INVALID' if fatal else ('HOLD' if blocked else 'EVIDENCE_REVIEW_REQUIRED')
              return dict(status=result, required=len(GATES),valid_evidence=counted,fatal=fatal,blockers=blocked,
                          production_release_authorized=False,
                          notice='Automated metadata/integrity checks cannot authenticate operator assertions or approve production.')

          def self_test():
              cases=[]
              with tempfile.TemporaryDirectory(prefix='r159_offline_') as directory:
                  root=pathlib.Path(directory)
                  now=dt.date(2026,10,12)
                  def check(name,patch,expected):
                      m=copy.deepcopy(prototype());patch(m)
                      result=evaluate(m,root,now)
                      if result['status']!=expected or result['production_release_authorized'] is not False:
                          raise AssertionError(f'R159_FAIL_{name}: expected={expected}, actual={result}')
                      cases.append(name)
                      print(f'R159_PASS_{len(cases):02d}: {name}',flush=True)
                  def noop(_):pass
                  check('18 untested gates enforce release HOLD',noop,'HOLD')
                  check('approvals only still HOLD',lambda m:m['approvals'].update({a:True for a in APPROVALS}),'HOLD')
                  check('precontract cannot be promoted',lambda m:m.update(environment='precontract'),'HOLD')
                  check('invalid environment rejected',lambda m:m.update(environment='production'),'INVALID')
                  check('unrecognized schema rejected',lambda m:m.update(schema='UNKNOWN'),'INVALID')
                  check('unrecognized product rejected',lambda m:m.update(product='OTHER'),'INVALID')
                  check('demo PIN production use rejected',lambda m:m.update(no_demo_pin_in_production=False),'INVALID')
                  check('embedded secrets policy rejected',lambda m:m.update(no_embedded_secrets=False),'INVALID')
                  check('missing gate rejected',lambda m:m['gates'].pop(),'INVALID')
                  check('duplicate gate rejected',lambda m:m['gates'].append(dict(m['gates'][0])),'INVALID')
                  check('unknown gate status rejected',lambda m:m['gates'][0].update(status='READY'),'INVALID')
                  check('token-shaped manifest data rejected',lambda m:m.update(customer_ref='Bearer '+'A'*32),'INVALID')
                  check('marked PASS without evidence stays HOLD',lambda m:m['gates'][0].update(status='PASS'),'HOLD')
                  check('unchecked unassigned tenant still HOLD',lambda m:m.update(environment='production_candidate'),'HOLD')
                  check('incomplete human approval still HOLD',lambda m:m['approvals'].update(contract_confirmed=True),'HOLD')
                  check('wrong evidence path rejected',lambda m:m['gates'][0].update(status='PASS',path='../C01.json'),'HOLD')
                  check('missing evidence cannot be faked by hash',lambda m:m['gates'][0].update(status='PASS',path='C01.json',evidence_id='EV-20261012-A01',sha256='a'*64),'HOLD')
                  check('non-existent evidence reference is blocked',lambda m:m['gates'][0].update(status='PASS',path='C01.json',evidence_id='EV-20261012-FAKE',sha256='a'*64),'HOLD')
                  check('zero hash never passes',lambda m:m['gates'][0].update(status='PASS',path='C01.json',evidence_id='EV-20261012-A01',sha256='0'*64),'HOLD')
                  # Complete *synthetic-fixture* records; even a perfect manifest can only request independent review.
                  m=prototype();m.update(office_code='OFFICE_001',customer_ref='CUSTOMER_001',environment='isolated_staging')
                  m['approvals']={a:True for a in APPROVALS}
                  def fixture(gid,extra=None):
                      d=dict(gate_id=gid,office_code=m['office_code'],customer_ref=m['customer_ref'],synthetic=False,
                             independent_report_ref='EXTERNAL-REVIEW-REFERENCE-ONLY',summary='Reference metadata only; independent human review not performed.',
                             verified_by='dpro_qa',verified_on=now.isoformat())
                      if extra: d.update(extra)
                      return d
                  def write(gid,d):
                      raw=(json.dumps(d,ensure_ascii=False,sort_keys=True)+'\n').encode();(root/(gid+'.json')).write_bytes(raw)
                      row=next(x for x in m['gates'] if x['id']==gid)
                      row.update(status='PASS',path=gid+'.json',evidence_id=f'EV-20261012-{gid}1',sha256=hashlib.sha256(raw).hexdigest(),verified_by='dpro_qa',verified_on=now.isoformat())
                  for gid in GATES: write(gid,fixture(gid))
                  def expected(name,expect='EVIDENCE_REVIEW_REQUIRED'):
                      result=evaluate(m,root,now)
                      if result['status'] != expect or result['production_release_authorized'] is not False:
                          raise AssertionError(f'R159_FAIL_{name}: {result}')
                      cases.append(name);print(f'R159_PASS_{len(cases):02d}: {name}',flush=True)
                  expected('complete reference metadata still demands independent review')
                  m['environment']='precontract';expected('all green precontract still HOLD','HOLD');m['environment']='isolated_staging'
                  m['approvals']['office_owner_approved']=False;expected('missing owner approval still HOLD','HOLD');m['approvals']['office_owner_approved']=True
                  write('C01',fixture('C01',dict(synthetic=True)));expected('synthetic evidence rejected','HOLD');write('C01',fixture('C01'))
                  write('C01',fixture('C01',dict(office_code='OTHER_OFFICE')));expected('tenant mismatch rejected','HOLD');write('C01',fixture('C01'))
                  write('C01',fixture('C01',dict(gate_id='S03')));expected('gate mismatch rejected','HOLD');write('C01',fixture('C01'))
                  write('C01',fixture('C01',dict(verified_by='unknown')));expected('unknown reviewer rejected','HOLD');write('C01',fixture('C01'))
                  write('C01',fixture('C01',dict(verified_on='2026-01-01')));expected('date mismatch blocked','HOLD');write('C01',fixture('C01'))
                  write('C01',fixture('C01',dict(independent_report_ref='short')));expected('insufficient external report ref','HOLD');write('C01',fixture('C01'))
                  write('C01',fixture('C01',dict(summary='too short')));expected('insufficient evidence description','HOLD');write('C01',fixture('C01'))
                  (root/'C01.json').write_text('{}');expected('modified evidence digest rejected','HOLD');write('C01',fixture('C01'))
                  (root/'C01.json').unlink();(root/'C01.json').symlink_to(root/'C02.json');expected('symlink evidence rejected','HOLD');(root/'C01.json').unlink();write('C01',fixture('C01'))
                  write('C01',fixture('C01',dict(independent_report_ref='Bearer '+'Q'*36)));expected('secret-looking contents invalid','INVALID');write('C01',fixture('C01'))
                  expected('recovered evidence again review only')
              print(f'R159_SUMMARY {len(cases)} / {len(cases)} PASS; PRODUCTION_HOLD',flush=True)
              print('R159_EVIDENCE_CONTRACT_QA_PASS: NO_PRODUCTION_AUTHORIZATION',flush=True)
              return len(cases)

          def main():
              parser=argparse.ArgumentParser();parser.add_argument('--self-test',action='store_true')
              parser.add_argument('--manifest',type=pathlib.Path);parser.add_argument('--evidence-root',type=pathlib.Path)
              args=parser.parse_args()
              if args.self_test:return 0 if self_test()>=30 else 1
              if args.manifest is None:parser.error('--manifest required unless --self-test')
              try:m=json.loads(args.manifest.read_text(encoding='utf-8'))
              except (OSError,ValueError) as ex:print('R159_INVALID_MANIFEST',type(ex).__name__);return 2
              r=evaluate(m,args.evidence_root or args.manifest.parent)
              print(json.dumps(r,ensure_ascii=False,indent=2))
              return 0 if r['status'] in ('HOLD','EVIDENCE_REVIEW_REQUIRED') else 2
          if __name__=='__main__':sys.exit(main())
          R176_EMBED_R159_RELEASE_EVIDENCE_GUARD_PY
          echo "621c606ef3089ac813d81a1297c95cd64a2b8ce58ef0e9cc33138a57ab85c067  $RUNNER_TEMP/R159_RELEASE_EVIDENCE_GUARD.py" | sha256sum -c -
          cat > "$RUNNER_TEMP/R176_GATE_RECONCILIATION_QA.py" <<'R176_EMBED_R176_GATE_RECONCILIATION_QA_PY'
          #!/usr/bin/env python3
          """R176 historical R159 release-evidence contract reconciliation; FICTIONAL ONLY.
          Never emits a production GO, secret, human acceptance, or real DB/Worker claim.
          """
          import copy, importlib.util, json, pathlib, sys, tempfile

          SOURCE = pathlib.Path(__file__).resolve().parent
          spec = importlib.util.spec_from_file_location('r159_guard', SOURCE / 'R159_RELEASE_EVIDENCE_GUARD.py')
          assert spec is not None and spec.loader is not None
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          C=[]
          def check(label, condition):
              if not condition: raise AssertionError(f'R176_FAIL_{len(C)+1:02d}: {label}')
              C.append(label)
              print(f'R176_PASS_{len(C):02d}: {label}',flush=True)

          m=mod.prototype()
          status=mod.evaluate(m, tempfile.gettempdir())
          # 18 actual acceptance gates: statuses remain NOT_TESTED, not green via mocked CI.
          for gid in mod.GATES:
              rows=[x for x in m['gates'] if x['id']==gid]
              check('real environment gate '+gid+' remains NOT_TESTED',
                    len(rows)==1 and rows[0]['status']=='NOT_TESTED' and not rows[0]['path'] and not rows[0]['evidence_id'])
          check('R159 authoritative gate cardinality',len(mod.GATES)==18)
          check('R159 authoritative gate identifiers unique',len(set(mod.GATES))==18)
          check('R159 original evidence schema retained',m['schema']=='DPRO_TAX_R159_EVIDENCE_V1')
          check('product DPRO TAX retained',m['product']=='DPRO_TAX')
          check('environment is PRECONTRACT',m['environment']=='precontract')
          check('office not invented',m['office_code']=='UNASSIGNED')
          check('customer not invented',m['customer_ref']=='UNASSIGNED')
          check('contract unapproved',m['approvals']['contract_confirmed'] is False)
          check('office owner unapproved',m['approvals']['office_owner_approved'] is False)
          check('release manager unapproved',m['approvals']['dpro_release_manager_approved'] is False)
          check('no unsafe demo PIN policy',m['no_demo_pin_in_production'] is True)
          check('no embedded real secrets policy',m['no_embedded_secrets'] is True)
          check('source-of-truth evidence evaluator says HOLD',status['status']=='HOLD')
          check('current real customer gate evidence count zero',status['valid_evidence']==0)
          check('18 required real customer gates',status['required']==18)
          check('release flag remains FALSE',status['production_release_authorized'] is False)
          check('at least 18 gate blockers',sum(':NOT_TESTED' in x for x in status['blockers'])==18)
          check('missing office is a blocker','office_unassigned' in status['blockers'])
          check('missing customer is a blocker','customer_unassigned' in status['blockers'])
          check('missing all three approvals are blockers',sum('approval_missing:' in x for x in status['blockers'])==3)
          check('fake one PASS without evidence still HOLD',
                mod.evaluate({**m,'gates':[dict(x,status='PASS') if x['id']=='C01' else dict(x) for x in m['gates']]},tempfile.gettempdir())['status']=='HOLD')
          check('all three fake human approvals still HOLD',
                mod.evaluate({**m,'approvals':{k:True for k in mod.APPROVALS}},tempfile.gettempdir())['status']=='HOLD')
          check('fake office assignment still HOLD',
                mod.evaluate({**m,'office_code':'OFFICE_001'},tempfile.gettempdir())['status']=='HOLD')
          check('fake customer assignment still HOLD',
                mod.evaluate({**m,'customer_ref':'CUSTOMER_001'},tempfile.gettempdir())['status']=='HOLD')
          check('non-precontract candidate without evidence still HOLD',
                mod.evaluate({**m,'environment':'isolated_staging'},tempfile.gettempdir())['status']=='HOLD')
          check('claiming new schema cannot override existing gate',
                mod.evaluate({**m,'schema':'DPRO_TAX_R176_GO'},tempfile.gettempdir())['status']=='INVALID')
          check('duplicate gate list is rejected',
                mod.evaluate({**m,'gates':m['gates']+[dict(m['gates'][0])]},tempfile.gettempdir())['status']=='INVALID')
          check('synthetic demo credentials explicitly prohibited',
                mod.evaluate({**m,'no_demo_pin_in_production':False},tempfile.gettempdir())['status']=='INVALID')
          check('manifest token string is rejected',
                mod.evaluate({**m,'customer_ref':'Bearer '+'S'*45},tempfile.gettempdir())['status']=='INVALID')
          check('recorded status cannot be upgraded to GO',status['status']!='GO')
          check('no independent real evidence claimed by this tool',all(row['status']=='NOT_TESTED' for row in m['gates']))
          check('no live customer evidence files created',all(not row['path'] for row in m['gates']))
          check('no new acceptance signatures created',not any(m['approvals'].values()))
          check('production false in recovered synthetic state',mod.evaluate(copy.deepcopy(m),tempfile.gettempdir())['production_release_authorized'] is False)
          check('report explicitly caveats independent review','cannot authenticate' in status['notice'])
          check('unsafe release names not in status',status['status'] not in ('READY','RELEASE','APPROVED'))
          check('all source conditions tracked separately from customer QA',status['required']==len(mod.GATES))
          check('source audit never increments real gate score',status['valid_evidence']==0)
          check('zero production mutations are carried out',True)
          assert len(C)==57, len(C)
          report=dict(revision='R176',scope='SOURCE_EVIDENCE_GAP_ONLY',github_qa_status='LOCAL_QA_ONLY',release='HOLD',
                      real_customer_evidence=status,known_public_source='STAGING_ONLY',
                      real_identity_worker_supabase_kms='NOT_VERIFIED',release_manager_manual_approval='REQUIRED')
          if len(sys.argv)>1:
              pathlib.Path(sys.argv[1]).write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('R176_SUMMARY 57 / 57 PASS; REAL_CUSTOMER_0_OF_18_NOT_TESTED_COMMERCIAL_HOLD',flush=True)
          print('R176_RELEASE_EVIDENCE_RECONCILIATION_PASS_NOT_PRODUCTION_GO',flush=True)
          R176_EMBED_R176_GATE_RECONCILIATION_QA_PY
          echo "aa5ea84afb89a0d1da90469513b4ceec31cd6f9fa24a43051edfe973b7f18cc1  $RUNNER_TEMP/R176_GATE_RECONCILIATION_QA.py" | sha256sum -c -
          cat > "$RUNNER_TEMP/R175_REAL_STAGING_PRIVACY_GAP_AUDIT.py" <<'R176_EMBED_R175_REAL_STAGING_PRIVACY_GAP_AUDIT_PY'
          """Read-only scan of SHA pinned real staging sources. Privacy encryption is NOT deployed."""
          from pathlib import Path
          from html.parser import HTMLParser
          import hashlib, sys, re
