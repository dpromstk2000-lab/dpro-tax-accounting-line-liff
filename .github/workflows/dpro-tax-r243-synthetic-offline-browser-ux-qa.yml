name: DPRO TAX R243 Isolated Real Chromium UX and Synthetic Booking QA

on:
  push:
    branches: ['qa/r225-synthetic-pg17-backup-restore-20261014']
    paths: ['.github/workflows/dpro-tax-r243-synthetic-offline-browser-ux-qa.yml']
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths: ['.github/workflows/dpro-tax-r243-synthetic-offline-browser-ux-qa.yml']

permissions:
  contents: read

jobs:
  r243-offline-browser-only:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/qa/r225-synthetic-pg17-backup-restore-20261014') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Read actual product files without any GitHub write credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install isolated headless Chromium test runner
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .r243-browser-venv
          .r243-browser-venv/bin/python -m pip install --disable-pip-version-check playwright==1.56.0
          .r243-browser-venv/bin/python -m playwright install --with-deps chromium
          echo 'PASS: isolated disposable Playwright Chromium ready; product source is untouched'

      - name: Start localhost-only static server (no production API proxy)
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html && test -s owner.html && test -s member.html
          test -s owner-ipad.html && test -s system-check.html
          python3 -m http.server 8765 --bind 127.0.0.1 > r243-local-http.log 2>&1 &
          echo $! > r243-local-http.pid
          for n in $(seq 1 30); do
            if curl --fail --silent --show-error --noproxy '*' http://127.0.0.1:8765/index.html -o /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent --show-error --noproxy '*' http://127.0.0.1:8765/index.html -o /dev/null
          echo 'PASS: only localhost static demo source served; external host calls blocked inside browser'

      - name: Render real desktop and mobile pages and exercise synthetic-only controls
        shell: bash
        run: |
          set -euo pipefail
          .r243-browser-venv/bin/python - <<'PY_R243_BROWSER'
          from pathlib import Path
          from urllib.parse import urlsplit, parse_qs
          import json
          from playwright.sync_api import sync_playwright

          ROOT = 'http://127.0.0.1:8765'
          API_HOST = 'dpro-tax-accounting-line-api.dpromstk2000.workers.dev'
          OUT = Path('r243-browser-evidence')
          OUT.mkdir(exist_ok=True)
          SCREENS = ['index.html','owner.html','member.html','owner-ipad.html','system-check.html','guide-center.html','demo-guide.html']
          report={'suite':'R243 OFFLINE ACTUAL CHROMIUM synthetic UI','screens':{},'interactions':[],
                  'blocked_requests':0,'synthetic_get_fixtures':0,'attempted_mutations':0,
                  'real_api_responses':0,'production_deploy':False,'commercial_release':'NO_GO/HOLD'}

          with sync_playwright() as pw:
              browser=pw.chromium.launch(headless=True,args=['--no-sandbox'])
              for preset,width,height in [('desktop',1280,800),('mobile',390,844)]:
                  ctx=browser.new_context(viewport={'width':width,'height':height},
                      device_scale_factor=1,is_mobile=(preset=='mobile'),has_touch=(preset=='mobile'),
                      reduced_motion='reduce',service_workers='block',java_script_enabled=True)
                  def safe_route(route):
                      u=urlsplit(route.request.url)
                      if (u.scheme=='http' and u.hostname=='127.0.0.1' and u.port==8765):
                          return route.continue_()
                      if u.hostname==API_HOST and route.request.method=='GET' and u.path=='/api/public/office':
                          report['synthetic_get_fixtures']+=1
                          return route.fulfill(status=200,content_type='application/json',
                              headers={'Access-Control-Allow-Origin':'*'},body=json.dumps({
                              'ok':True,'office':{'security_notice':'架空デモ：機密情報は送らないでください','booking_open_days':90},
                              'services':[{'id':'r243-fake-service','service_name':'架空の税務相談',
                                           'duration_minutes':30,'channel_options':['in_person','online','phone']}]
                          },ensure_ascii=False))
                      if u.hostname==API_HOST and route.request.method=='GET' and u.path=='/api/public/slots':
                          report['synthetic_get_fixtures']+=1
                          d=parse_qs(u.query).get('date',['2030-01-01'])[0]
                          return route.fulfill(status=200,content_type='application/json',
                              headers={'Access-Control-Allow-Origin':'*'},body=json.dumps({
                              'ok':True,'slots':[{'start_at':f'{d}T10:00:00+09:00',
                                      'local_time':'10:00','available':True}]
                          }))
                      if route.request.method not in ('GET','HEAD','OPTIONS'):
                          report['attempted_mutations']+=1
                      report['blocked_requests']+=1
                      return route.abort('blockedbyclient')

                  ctx.route('**/*',safe_route)
                  for path in SCREENS:
                      page=ctx.new_page()
                      res=page.goto(f'{ROOT}/{path}',wait_until='domcontentloaded',timeout=15000)
                      assert res and res.status==200,(preset,path,'local HTTP status')
                      page.wait_for_timeout(220)
                      title=page.title()
                      assert title and len(title.strip())>2,(preset,path,'missing title')
                      assert page.locator('html').get_attribute('lang')=='ja',(preset,path,'lang')
                      assert page.locator('body').is_visible(),(preset,path,'body invisible')
                      geometry=page.evaluate("""() => ({width:innerWidth, documentWidth:document.documentElement.scrollWidth,
                          bodyWidth:document.body.scrollWidth, height:innerHeight})""")
                      over=max(geometry['documentWidth'],geometry['bodyWidth'])-geometry['width']
                      # Record all overflows; gross breakage fails, small ones remain flagged for followup.
                      assert over<=64,(preset,path,'severe horizontal overflow',over)
                      fname=f'{preset}-{path.replace(".html", "")}.png'
                      page.screenshot(path=str(OUT/fname),full_page=False,animations='disabled')
                      report['screens'][f'{preset}/{path}']={
                          'title':title,'horizontal_overflow_px':over,'screenshot':fname,
                          'visible_buttons':page.get_by_role('button').count()}
                      if path=='index.html':
                          button=page.locator('[data-open-modal="register-modal"]')
                          assert button.count()==1,(preset,'register trigger missing')
                          button.click()
                          assert page.locator('#register-modal').is_visible(),(preset,'register modal did not open')
                          page.keyboard.press('Escape')
                          assert not page.locator('#register-modal').is_visible(),(preset,'Escape did not close registration')
                          report['interactions'].append(f'{preset}: registration open + Escape close')
                          page.locator('#booking-service').select_option('r243-fake-service')
                          minday=page.locator('#booking-date').get_attribute('min')
                          assert minday and len(minday)==10,(preset,'booking date min missing')
                          page.locator('#booking-date').fill(minday)
                          page.locator('#booking-date').dispatch_event('change')
                          page.locator('#slot-grid [data-slot]').first.wait_for(state='visible',timeout=7500)
                          page.locator('#slot-grid [data-slot]').first.click()
                          assert page.locator('#booking-start').input_value().startswith(minday), (preset,'slot selection not retained')
                          report['interactions'].append(f'{preset}: fake service/date/slot selected, NO submit')
                      if path=='owner.html':
                          page.locator('#owner-admin-code').fill('1234')
                          page.locator('#owner-code-clear').click()
                          assert page.locator('#owner-admin-code').input_value()=='',(preset,'owner clear broken')
                          assert page.locator('[data-admin-view]').count()==9,(preset,'owner nav count')
                          report['interactions'].append(f'{preset}: owner code clear + nine menu anchors')
                      if path=='owner-ipad.html':
                          page.locator('#ipad-admin-code').fill('1234')
                          page.locator('#ipad-code-clear').click()
                          assert page.locator('#ipad-admin-code').input_value()=='',(preset,'iPad clear broken')
                          report['interactions'].append(f'{preset}: iPad code clear')
                      if path=='system-check.html':
                          page.locator('#check-admin-code').fill('1234')
                          page.locator('#check-code-clear').click()
                          assert page.locator('#check-admin-code').input_value()=='',(preset,'system check clear broken')
                          report['interactions'].append(f'{preset}: system check code clear')
                      page.close()
                  ctx.close()
              browser.close()

          assert report['synthetic_get_fixtures']>=4, 'offline synthetic fixtures never used'
          assert report['attempted_mutations']==0, 'UI unexpectedly tried a mutating request during tests'
          assert report['real_api_responses']==0
          (OUT/'qa-results.json').write_text(json.dumps(report,ensure_ascii=False,indent=2,sort_keys=True),encoding='utf8')
          print('R243_BROWSER_QA='+json.dumps(report,ensure_ascii=False,sort_keys=True))
          print('PASS: 7 actual pages x desktop/mobile rendered; fake booking + modal/clear actions; no real API requests')
          PY_R243_BROWSER

      - name: Check screenshot and result inventory without exposing real data
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_R243_INV'
          from pathlib import Path
          import json
          d=Path('r243-browser-evidence')
          report=json.loads((d/'qa-results.json').read_text(encoding='utf8'))
          shots=list(d.glob('*.png'))
          assert len(shots)==14,('expected 7 desktop + 7 mobile',len(shots))
          assert len(report['screens'])==14
          assert len(report['interactions'])==10
          assert report['attempted_mutations']==0
          assert report['real_api_responses']==0
          assert all(s.stat().st_size>500 for s in shots)
          print('PASS: 14 actual Chromium viewport screenshots, 10 synthetic-only interactions; no data mutations')
          PY_R243_INV

      - name: Preserve synthetic screenshot evidence as an Actions-only artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r243-offline-browser-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: r243-browser-evidence/
          if-no-files-found: warn
          retention-days: 7

      - name: Declare product and production safety boundaries
        shell: bash
        run: |
          set -euo pipefail
          echo 'PASS: R243 browser UI verification is localhost-only with synthetic read-only fixture GETs.'
          echo 'No real API egress, no booking POST, no LINE dispatch, no Supabase connection, no Worker Deploy.'
          echo 'This is not a signed LINE/JWT test, accessibility certification, production reservation test, or full UI acceptance.'
          echo 'NO_GO / HOLD / NO MERGE / NO DEPLOY; keep all seven Workers and unchanged GitHub main.'
