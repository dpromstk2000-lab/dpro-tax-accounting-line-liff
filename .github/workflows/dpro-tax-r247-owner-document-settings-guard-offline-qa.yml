name: DPRO TAX R247 Real Source Owner Document Review and Settings Guards Offline QA

on:
  push:
    branches: ['qa/r225-synthetic-pg17-backup-restore-20261014']
    paths: ['.github/workflows/dpro-tax-r247-owner-document-settings-guard-offline-qa.yml', 'styles.css']
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths: ['.github/workflows/dpro-tax-r247-owner-document-settings-guard-offline-qa.yml', 'styles.css']

permissions:
  contents: read

jobs:
  r247-owner-document-settings-guards-isolated:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/qa/r225-synthetic-pg17-backup-restore-20261014') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out protected QA branch source without write token
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Install isolated Playwright Chromium for synthetic owner tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .r247-browser-venv
          .r247-browser-venv/bin/python -m pip install --disable-pip-version-check playwright==1.56.0
          .r247-browser-venv/bin/python -m playwright install --with-deps chromium
          echo 'PASS: disposable local browser ready; no product mutation' 
      - name: Start localhost static site without any proxy to production
        shell: bash
        run: |
          set -euo pipefail
          test -s owner.html && test -s app.js && test -s styles.css && test -s config.js
          python3 -m http.server 8765 --bind 127.0.0.1 > r247-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --silent --fail --noproxy '*' http://127.0.0.1:8765/owner.html -o /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent --show-error --noproxy '*' http://127.0.0.1:8765/owner.html -o /dev/null
          echo 'PASS: isolated localhost-only source ready' 
      - name: Check owner nine menus, document review and settings business guards offline
        shell: bash
        run: |
          set -euo pipefail
          .r247-browser-venv/bin/python - <<'PY_R247_BROWSER'
          from pathlib import Path
          from urllib.parse import urlsplit
          import json
          from playwright.sync_api import sync_playwright
          
          ROOT='http://127.0.0.1:8765'
          REMOTE='dpro-tax-accounting-line-api.dpromstk2000.workers.dev'
          EVIDENCE=Path('r247-owner-browser-evidence')
          EVIDENCE.mkdir(exist_ok=True)
          VIEWS=['dashboard','clients','cases','documents','appointments','inquiries','tasks','staff','settings']
          FAKE_CLIENT={
           'id':'r245-c1','legal_name':'架空会計テスト株式会社','client_code':'TX-FAKE-001',
           'client_type':'corporation','status':'active','representative_name':'架空担当者',
           'phone':'090-1111-2201','phone_normalized':'09011112201',
           'assigned_staff_id':None
          }
          FAKE_CASE={
           'id':'r245-case1','title':'架空の確定申告案件','case_code':'FAKE-CASE-001',
           'client_id':'r245-c1','case_type':'tax_return','status':'in_progress',
           'deadline_date':'2027-03-31','progress_percent':30,'deadline_is_confirmed':True,
           'next_action':'架空の確認作業','public_summary':'架空のテスト案件'
          }
          DASH={
           'ok':True,'office':{'office_name':'R246架空税理士事務所'},
           'counts':{'clients':1,'open_cases':1,'new_documents':0,'open_inquiries':0},
           'urgent_cases':[],'due_tasks':[],'documents_to_review':[],
           'active_appointments':[],'open_inquiries':[]
          }
          FAKE_DOC={
           'id':'r247-doc1','client_id':'r245-c1','original_filename':'架空_領収書.pdf',
           'submission_code':'DOC-R247-001','status':'new',
           'submitted_at':'2026-10-01T09:00:00+09:00','file_size_bytes':2048,
           'mime_type':'application/pdf','submitted_by_type':'client',
           'reviewed_at':None,'reviewed_by':None,'rejection_reason':''
          }
          FAKE_REQUEST={
           'id':'r247-request1','client_id':'r245-c1','title':'架空の月次資料提出依頼',
           'request_code':'REQ-R247-001','due_on':'2027-03-30',
           'status':'open','items':[{'item_name':'領収書'}]
          }
          FAKE_STAFF={
           'id':'r247-staff1','display_name':'架空事務所スタッフ','staff_code':'FAKE-STAFF-01',
           'role':'staff','email':'','phone':'','can_review_documents':True,'is_active':True
          }
          DOCUMENT_DETAIL={
           'ok':True,'document':FAKE_DOC,'client':FAKE_CLIENT,
           'contact':{'full_name':'架空の提出者'},'request':FAKE_REQUEST,
           'request_item':{'item_name':'領収書'},'reviewers':[FAKE_STAFF],
           'file':{'available':False},'access_logs':[]
          }
          FIXTURES={
           '/api/admin/dashboard':DASH,
           '/api/admin/clients':{'ok':True,'clients':[FAKE_CLIENT]},
           '/api/admin/cases':{'ok':True,'cases':[FAKE_CASE]},
           '/api/admin/document-requests':{'ok':True,'document_requests':[FAKE_REQUEST]},
           '/api/admin/documents':{'ok':True,'documents':[FAKE_DOC]},
           '/api/admin/documents/r247-doc1':DOCUMENT_DETAIL,
           '/api/admin/appointments':{'ok':True,'appointments':[]},
           '/api/admin/inquiries':{'ok':True,'inquiries':[]},
           '/api/admin/tasks':{'ok':True,'tasks':[]},
           '/api/admin/staff':{'ok':True,'staff':[FAKE_STAFF]},
           '/api/admin/settings':{'ok':True,'office':{
               'office_name':'R246架空税理士事務所','phone':'','email':'',
               'booking_open_days':90,'security_notice':'架空データのみ'} ,
               'services':[],'business_hours':[],'closed_dates':[]},
           '/api/public/office':{'ok':True,'office':{
               'security_notice':'架空データのみ','booking_open_days':90},'services':[]}
          }
          report={'suite':'R247 owner document review and settings guard offline browser',
                  'main_modified':False,'production_requests':0,'attempted_mutations':0,
                  'screenshots':[],'view_checks':{},'searches':{},'blocked_requests':0,
                  'mock_reads':0,'browser_errors':[],'settings_css_comparison':{},'business_flow_checks':{},'release':'NO_GO/HOLD'}
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--no-sandbox'])
              for preset,w,h in [('desktop',1280,800),('tablet',1024,800),('compact',768,900),('mobile',390,844)]:
                  ctx=browser.new_context(viewport={'width':w,'height':h},
                          device_scale_factor=1,is_mobile=preset=='mobile',
                          has_touch=preset=='mobile',reduced_motion='reduce',
                          service_workers='block',java_script_enabled=True)
                  events={'requests':0,'blocked':0,'mutations':0,'api':0}
                  def offline(route):
                      req=route.request
                      u=urlsplit(req.url)
                      if u.scheme=='http' and u.hostname=='127.0.0.1' and u.port==8765:
                          return route.continue_()
                      if u.hostname==REMOTE and req.method=='OPTIONS' and u.path in FIXTURES:
                          # Explicitly mock browser CORS preflight for synthetic admin X-Admin-Key GETs.
                          # This never reaches the Cloudflare Worker.
                          return route.fulfill(status=204,headers={
                              'Access-Control-Allow-Origin':'*',
                              'Access-Control-Allow-Methods':'GET, OPTIONS',
                              'Access-Control-Allow-Headers':'X-Admin-Key, X-Line-User-Id, Content-Type, Accept',
                              'Access-Control-Max-Age':'0'})
                      if u.hostname==REMOTE and req.method=='GET' and u.path in FIXTURES:
                          if u.path.startswith('/api/admin/') and req.headers.get('x-admin-key')!='1234':
                              events['blocked']+=1
                              return route.fulfill(status=403,content_type='application/json',
                                  headers={'Access-Control-Allow-Origin':'*'},
                                  body=json.dumps({'ok':False,'error':'SYNTHETIC_INVALID_CODE'}))
                          events['api']+=1
                          return route.fulfill(status=200,content_type='application/json',
                              headers={'Access-Control-Allow-Origin':'*'},
                              body=json.dumps(FIXTURES[u.path],ensure_ascii=False))
                      events['blocked']+=1
                      if req.method not in ('GET','HEAD','OPTIONS'):
                          events['mutations']+=1
                      return route.abort('blockedbyclient')
                  ctx.route('**/*',offline)
                  page=ctx.new_page()
                  errs=[]
                  page.on('pageerror',lambda e:errs.append(str(e)))
                  response=page.goto(ROOT+'/owner.html?demo=1',wait_until='domcontentloaded',timeout=15000)
                  assert response and response.status==200,(preset,'local source not loaded')
                  page.locator('#owner-app').wait_for(state='visible',timeout=15000)
                  page.locator('#owner-content').wait_for(state='visible',timeout=15000)
                  assert page.locator('#owner-auth').is_hidden(),(preset,'login form still visible')
                  assert page.locator('#owner-office-name').inner_text()=='R246架空税理士事務所'
                  assert page.locator('#metric-clients').inner_text()=='1'
                  assert page.locator('#metric-cases').inner_text()=='1'
                  assert page.locator('button[data-admin-view]').count()==9,(preset,'nine menus missing')
                  assert page.locator('#clients-table-body tr').count()==1,(preset,'fake client row absent')
                  assert page.locator('#cases-table-body tr').count()==1,(preset,'fake case row absent')
                  assert page.locator('#clients-table-body').inner_text().find('架空会計テスト株式会社')>=0
                  assert page.locator('#cases-table-body').inner_text().find('架空の確定申告案件')>=0
                  for view in VIEWS:
                      # A mobile sidebar is initially hidden; open it via the actual user control.
                      if preset=='mobile':
                          page.locator('#sidebar-toggle').click()
                          assert 'open' in (page.locator('#admin-sidebar').get_attribute('class') or ''),(
                              preset,view,'sidebar did not open')
                      button=page.locator('button[data-admin-view="'+view+'"]')
                      button.click(timeout=10000)
                      panel=page.locator('[data-admin-panel="'+view+'"]')
                      assert panel.is_visible(),(preset,view,'selected panel not visible')
                      assert button.evaluate('(e)=>e.classList.contains("active")'),(preset,view,'active nav state missing')
                      assert page.locator('[data-admin-panel]:visible').count()==1,(preset,view,'other panels unexpectedly visible')
                      if preset=='mobile':
                          assert 'open' not in (page.locator('#admin-sidebar').get_attribute('class') or ''),(
                              preset,view,'sidebar did not auto-close')
                      # R247: Only the checked-out QA-branch styles.css is rendered.
                      # No injected styles, production credentials, or live API responses.
                      geom=page.evaluate('Math.max(document.documentElement.scrollWidth,document.body.scrollWidth)-innerWidth')
                      assert geom<=1,(preset,view,'actual product stylesheet overflows',geom)
                      if view=='settings':
                          for selector in ('#business-hours-editor [data-business-day]','[data-hour-open]','[data-hour-close]'):
                              assert page.locator(selector).count()>=7,(preset,'seven weekday controls missing',selector)
                          report['settings_css_comparison'][preset]={'source_page_overflow_px':geom,
                              'no_temporary_css':True,'code_under_test':'styles.css',
                              'real_product_css_in_qa_branch':True}
                      fname=f'{preset}-owner-{view}.png'
                      panel.screenshot(path=str(EVIDENCE/fname),animations='disabled',timeout=15000)
                      report['screenshots'].append(fname)
                      report['view_checks'][f'{preset}/{view}']={'visible':True,'other_panels_hidden':True,
                                            'sidebar_closes':True,'page_overflow_px':geom}
                  # R247: Business flow inspection with actual app.js. No writes are issued.
                  # Start in documents after the last nine-menu iteration (settings).
                  if preset=='mobile':
                      page.locator('#sidebar-toggle').click()
                  page.locator('button[data-admin-view="documents"]').click()
                  docs=page.locator('#documents-table-body')
                  assert docs.locator('tr').count()==1,(preset,'fixture doc missing')
                  assert '架空_領収書.pdf' in docs.inner_text(),(preset,'doc title absent')
                  q=page.locator('#document-search')
                  q.fill('領収書')
                  assert 'DOC-R247-001' in docs.inner_text(),(preset,'document NFKC search failed')
                  q.fill('架空でも存在しないファイル')
                  assert '条件に一致する提出書類がありません' in docs.inner_text(),(preset,'document no-result copy')
                  q.fill('')
                  page.locator('#document-status-filter').select_option('accepted')
                  assert '条件に一致する提出書類がありません' in docs.inner_text(),(preset,'status filtering')
                  page.locator('#document-status-filter').select_option('new')
                  assert 'DOC-R247-001' in docs.inner_text(),(preset,'new document filtering')
                  page.locator('[data-document-tab="requests"]').click()
                  assert page.locator('#document-submission-table').is_hidden()
                  assert page.locator('#document-request-table').is_visible()
                  assert '架空の月次資料提出依頼' in page.locator('#requests-table-body').inner_text()
                  page.locator('[data-document-tab="submissions"]').click()
                  assert page.locator('#document-submission-table').is_visible()
                  assert page.locator('#document-request-table').is_hidden()
                  page.locator('[data-document-review-open="r247-doc1"]').click()
                  page.locator('#document-review-content').wait_for(state='visible',timeout=10000)
                  assert '架空_領収書.pdf' in page.locator('#document-review-summary').inner_text()
                  assert page.locator('#document-review-open').is_disabled(),(preset,'fake file must not open')
                  assert page.locator('#document-reviewer option').count()==1
                  assert '履歴はありません' in page.locator('#document-review-history').inner_text()
                  before_mutations=events['mutations']
                  page.locator('#document-review-note').fill('')
                  page.locator('#document-review-form [data-review-status="rejected"]').click()
                  assert page.locator('#document-review-note').evaluate('(e)=>document.activeElement===e')
                  assert events['mutations']==before_mutations,(preset,'rejection without reason attempted API write')
                  page.locator('#document-review-modal [data-close-modal]').click()
                  assert page.locator('#document-review-modal').is_hidden()
                  page.locator('[data-admin-panel="documents"]').screenshot(
                    path=str(EVIDENCE/f'{preset}-document-guard-flow.png'),animations='disabled',timeout=15000)
                  report['screenshots'].append(f'{preset}-document-guard-flow.png')
                  # R247: Settings edits are exercised in the DOM only; do NOT save valid data.
                  if preset=='mobile':
                      page.locator('#sidebar-toggle').click()
                  page.locator('button[data-admin-view="settings"]').click()
                  editor=page.locator('#business-hours-editor')
                  assert editor.locator('[data-business-day]').count()==7
                  monday=editor.locator('[data-business-day="1"]')
                  opening=monday.locator('[data-hour-open]')
                  closing=monday.locator('[data-hour-close]')
                  checkbox=monday.locator('[data-hour-closed]')
                  assert opening.locator('option').count()==48
                  assert closing.locator('option').count()==48
                  assert opening.input_value()=='09:00'
                  assert closing.input_value()=='17:00'
                  assert not checkbox.is_checked()
                  checkbox.check()
                  assert opening.is_disabled() and closing.is_disabled()
                  checkbox.uncheck()
                  assert opening.is_enabled() and closing.is_enabled()
                  # Invalid hours must be rejected before PATCH /api/admin/business-hours.
                  opening.select_option('17:00')
                  closing.select_option('09:00')
                  page.locator('#business-hours-form button[type="submit"]').click()
                  assert events['mutations']==before_mutations,(preset,'invalid hours wrote to API')
                  # Date form: special time fields become visible, impossible interval is rejected.
                  datevalue=page.evaluate("new Date(Date.now()+86400000*3).toISOString().slice(0,10)")
                  page.locator('#closed-date-value').fill(datevalue)
                  page.locator('#closed-date-type').select_option('special')
                  assert page.locator('#closed-date-time-fields').is_visible()
                  assert page.locator('#closed-date-open option').count()==48
                  assert page.locator('#closed-date-close option').count()==48
                  page.locator('#closed-date-open').select_option('17:00')
                  page.locator('#closed-date-close').select_option('09:00')
                  page.locator('#closed-date-form button[type="submit"]').click()
                  assert events['mutations']==before_mutations,(preset,'invalid special time wrote to API')
                  page.locator('#closed-date-type').select_option('closed')
                  assert page.locator('#closed-date-time-fields').is_hidden()
                  # Service modal: at least one consultation channel is required.
                  page.locator('[data-new-service]').click()
                  page.locator('#service-edit-name').fill('架空オンライン相談')
                  boxes=page.locator('#service-edit-form [name="channel_options"]')
                  assert boxes.count()>=3
                  for i in range(boxes.count()): boxes.nth(i).uncheck()
                  page.locator('#service-edit-form button[type="submit"]').click()
                  assert events['mutations']==before_mutations,(preset,'empty service channels wrote to API')
                  page.locator('#service-edit-modal [data-close-modal]').click()
                  assert page.locator('#service-edit-modal').is_hidden()
                  page.locator('[data-admin-panel="settings"]').screenshot(
                    path=str(EVIDENCE/f'{preset}-settings-guard-flow.png'),animations='disabled',timeout=15000)
                  report['screenshots'].append(f'{preset}-settings-guard-flow.png')
                  report['business_flow_checks'][preset]={
                      'document_search_and_no_result':True,'document_status_filter':True,
                      'request_submission_tabs':True,'fake_document_nonopenable':True,
                      'rejection_requires_reason':True,'seven_business_days':True,
                      'half_hour_option_count':48,'closed_disables_times':True,
                      'invalid_hours_blocked':True,'special_time_toggle':True,
                      'invalid_special_time_blocked':True,'service_channel_required':True,
                      'attempted_mutations':events['mutations']
                  }
                  # Exercise fuzzy/normalized phone search without any write request.
                  if preset=='mobile':page.locator('#sidebar-toggle').click()
                  page.locator('button[data-admin-view="clients"]').click()
                  search=page.locator('#client-search')
                  search.fill('+81 90-1111-2201')
                  assert page.locator('#clients-table-body tr').count()==1,(preset,'phone search did not match')
                  assert '架空会計テスト株式会社' in page.locator('#clients-table-body').inner_text()
                  search.fill('not-a-fake-client')
                  assert '一致する顧問先がありません' in page.locator('#clients-table-body').inner_text(),(
                      preset,'no-results state missing')
                  search.fill('')
                  assert '架空会計テスト株式会社' in page.locator('#clients-table-body').inner_text()
                  report['searches'][preset]={'international_phone_normalization':True,
                                              'no_results_message':True,'clear_restores_rows':True}
                  assert not errs,(preset,'uncaught UI JavaScript exceptions',errs)
                  assert events['mutations']==0,(preset,'mutating request emitted')
                  assert events['api']>=12,(preset,'synthetic endpoints not exercised',events)
                  report['attempted_mutations']+=events['mutations']
                  report['mock_reads']+=events['api']
                  report['blocked_requests']+=events['blocked']
                  page.close();ctx.close()
              browser.close()
          assert len(report['screenshots'])==44,len(report['screenshots'])
          assert len(report['view_checks'])==36
          assert len(report['settings_css_comparison'])==4
          assert len(report['business_flow_checks'])==4
          assert all(v['attempted_mutations']==0 for v in report['business_flow_checks'].values())
          assert all(v['source_page_overflow_px']<=1 and v['no_temporary_css'] for v in report['settings_css_comparison'].values())
          assert len(report['searches'])==4
          assert report['attempted_mutations']==0
          assert report['production_requests']==0
          (EVIDENCE/'qa-results.json').write_text(json.dumps(report,ensure_ascii=False,indent=2,sort_keys=True),encoding='utf-8')
          print('R247_OWNER_QA='+json.dumps(report,ensure_ascii=False,sort_keys=True))
          print('PASS: actual styles.css 36 menu screens + 8 owner guard screens; no API write')
          PY_R247_BROWSER
      - name: Verify 44 screenshots and failed-form no-write protection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_R247_INVENTORY'
          from pathlib import Path
          import json
          d=Path('r247-owner-browser-evidence')
          report=json.loads((d/'qa-results.json').read_text(encoding='utf8'))
          shots=list(d.glob('*.png'))
          assert len(shots)==44,('36 nine-menu screenshots + 8 R247 flow screenshots',len(shots))
          assert len(report['view_checks'])==36
          assert len(report['settings_css_comparison'])==4
          assert len(report['business_flow_checks'])==4
          assert all(v['attempted_mutations']==0 for v in report['business_flow_checks'].values())
          assert all(v['source_page_overflow_px']<=1 and v['no_temporary_css'] for v in report['settings_css_comparison'].values()) and len(report['searches'])==4
          assert all(p.stat().st_size>500 for p in shots)
          assert report['attempted_mutations']==0
          assert report['production_requests']==0
          assert all(x['page_overflow_px']<=16 for x in report['view_checks'].values())
          print('PASS: 44 screenshots: actual owner CSS, documents, settings guards; no business mutations')
          PY_R247_INVENTORY
      - name: Keep screenshot evidence in GitHub Actions only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r247-doc-settings-guards-${{ github.run_id }}-${{ github.run_attempt }}
          path: r247-owner-browser-evidence/
          if-no-files-found: warn
          retention-days: 7
      - name: Keep commercial NO_GO/HOLD regardless of QA outcome
        shell: bash
        run: |
          set -euo pipefail
          echo 'PASS: owner UI tests exercised read-only fake API GETs, no real API responses or business mutations.'
          echo 'No Supabase backup or live restore was performed. No production identity, LINE auth, Worker deployment or product modifications.'
          echo 'R247 checks QA branch real styles.css and owner document/settings guards without injection. Production/main remains unchanged; commercial HOLD continues.'
          echo 'NO_GO / HOLD / NO_MERGE; GitHub main unchanged; Worker7 KEEP.' 
