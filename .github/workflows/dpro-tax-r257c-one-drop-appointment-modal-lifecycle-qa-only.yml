                  assert '条件に一致する提出書類がありません' in docs.inner_text(),(preset,'status filtering')
                  page.locator('#document-status-filter').select_option('new')
                  assert 'DOC-R257C-001' in docs.inner_text(),(preset,'new document filtering')
                  page.locator('[data-document-tab="requests"]').click()
                  assert page.locator('#document-submission-table').is_hidden()
                  assert page.locator('#document-request-table').is_visible()
                  assert '架空の月次資料提出依頼' in page.locator('#requests-table-body').inner_text()
                  page.locator('[data-document-tab="submissions"]').click()
                  assert page.locator('#document-submission-table').is_visible()
                  assert page.locator('#document-request-table').is_hidden()
                  page.locator('[data-document-review-open="r257c-doc1"]').click()
