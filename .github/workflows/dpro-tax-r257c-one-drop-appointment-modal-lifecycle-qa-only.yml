name: DPRO TAX R257C One Drop QA-only Full Modal Reset and Stale Detail Invalidation

on:
  push:
    branches: ['qa/r225-synthetic-pg17-backup-restore-20261014']
    paths: ['.github/workflows/dpro-tax-r257c-one-drop-appointment-modal-lifecycle-qa-only.yml']

# Scoped to this disposable QA branch. No main, production DB or Worker permissions.
permissions:
  contents: write

jobs:
  r257c-owner-modal-lifecycle-qa-isolated:
    if: github.event_name == 'push' && github.ref == 'refs/heads/qa/r225-synthetic-pg17-backup-restore-20261014'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout QA branch for appointment-client search candidate and QA-only commit
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Prepare R257C candidate full modal reset and stale-response invalidation in QA checkout only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/qa/r225-synthetic-pg17-backup-restore-20261014'
          python3 - <<'PY_R257C_PATCH'
          from pathlib import Path
          p=Path('app.js')
          before=p.read_text(encoding='utf-8')
          # R257C: R256 ALREADY increments requestSeq on clear; preserve that proven guard.
          # Only patch booking modal close to reset form and call the existing invalidating clear function.
          old_close='  function closeModal(modal) {\n    const target = typeof modal === "string" ? document.getElementById(modal) : modal?.closest?.(".modal-backdrop") || modal;\n    if (target) target.hidden = true;\n    document.body.style.overflow = "";\n  }'
          new_close='  function closeModal(modal) {\n    const target = typeof modal === "string" ? document.getElementById(modal) : modal?.closest?.(".modal-backdrop") || modal;\n    if (target?.id === "appointment-create-modal") {\n      // R257C QA-only: reset form and invalidate pending selection on every close.\n      $("#admin-appointment-form")?.reset();\n      clearAppointmentClientSelection();\n    }\n    if (target) target.hidden = true;\n    document.body.style.overflow = "";\n  }'
          existing_clear='  function clearAppointmentClientSelection() {\n    adminState.appointmentClientRequestSeq = (adminState.appointmentClientRequestSeq || 0) + 1;\n'
          assert before.count(old_close)==1,'modal close differs from verified R256 expected source; stop'
          assert before.count(existing_clear)==1,'R256 existing invalidation not found; stop (do NOT duplicate it)'
          assert before.count(new_close)==0,'R257C patch applied already; stop'
          assert before.count('R254 QA-only')==1,'R254 booking-time guard missing'
          assert before.count('R255B QA-only')==1,'R255B legacy appointment search missing'
          assert before.count('R256 QA-only')==1,'R256 stale-response guard missing'
          updated=before.replace(old_close,new_close,1)
          assert updated.count('R257C QA-only')==1
          assert updated.count(existing_clear)==1
          assert updated.count('R256 QA-only')==1
          assert updated.count('R254 QA-only')==1
          assert updated.count('R255B QA-only')==1
          p.write_text(updated,encoding='utf-8')
          print('PASS: R257C modifies closeModal only, retains R256 request sequence invalidation; 72 real browser screens pending')
          PY_R257C_PATCH
          git diff --check
          test "$(git diff --name-only)" = app.js
          git diff --stat -- app.js
          node --check app.js
      - name: Install isolated Playwright Chromium for synthetic owner tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .r257c-browser-venv
          .r257c-browser-venv/bin/python -m pip install --disable-pip-version-check playwright==1.56.0
          .r257c-browser-venv/bin/python -m playwright install --with-deps chromium
          echo 'PASS: disposable localhost browser ready; only QA app.js candidate under test' 
      - name: Start localhost static site without any proxy to production
        shell: bash
        run: |
          set -euo pipefail
          test -s owner.html && test -s app.js && test -s styles.css && test -s config.js
          python3 -m http.server 8765 --bind 127.0.0.1 > r257c-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --silent --fail --noproxy '*' http://127.0.0.1:8765/owner.html -o /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent --show-error --noproxy '*' http://127.0.0.1:8765/owner.html -o /dev/null
          echo 'PASS: isolated localhost-only source ready' 
      - name: Check R257C closing or reopening modal resets booking form and cancels pending identity responses
