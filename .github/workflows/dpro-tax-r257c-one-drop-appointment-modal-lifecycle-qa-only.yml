                                            'sidebar_closes':True,'page_overflow_px':geom}
                  # R257C: Business flow inspection with actual app.js. No writes are issued.
                  # Start in documents after the last nine-menu iteration (settings).
                  if preset=='mobile':
                      page.locator('#sidebar-toggle').click()
                  page.locator('button[data-admin-view="documents"]').click()
                  docs=page.locator('#documents-table-body')
                  assert docs.locator('tr').count()==1,(preset,'fixture doc missing')
                  assert '架空_領収書.pdf' in docs.inner_text(),(preset,'doc title absent')
