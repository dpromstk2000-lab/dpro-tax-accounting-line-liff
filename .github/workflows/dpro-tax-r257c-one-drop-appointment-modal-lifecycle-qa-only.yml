          }
          FAKE_DOC={
           'id':'r257c-doc1','client_id':'r245-c1','original_filename':'架空_領収書.pdf',
           'submission_code':'DOC-R257C-001','status':'new',
           'submitted_at':'2026-10-01T09:00:00+09:00','file_size_bytes':2048,
           'mime_type':'application/pdf','submitted_by_type':'client',
           'reviewed_at':None,'reviewed_by':None,'rejection_reason':''
          }
          FAKE_REQUEST={
           'id':'r257c-request1','client_id':'r245-c1','title':'架空の月次資料提出依頼',
           'request_code':'REQ-R257C-001','due_on':'2027-03-30',
           'status':'open','items':[{'item_name':'領収書'}]
          }
          FAKE_STAFF={
           'id':'r257c-staff1','display_name':'架空事務所スタッフ','staff_code':'FAKE-STAFF-01',
           'role':'staff','email':'','phone':'','can_review_documents':True,'is_active':True
