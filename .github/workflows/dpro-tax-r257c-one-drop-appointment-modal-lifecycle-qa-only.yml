           'request_item':{'item_name':'領収書'},'reviewers':[FAKE_STAFF],
           'file':{'available':False},'access_logs':[]
          }
          # Deterministic wholly synthetic client detail endpoints for deferred-response race QA.
          DETAIL_A={'ok':True,'client':FAKE_CLIENT_A,'cases':[],'contacts':[],
              'document_requests':[],'appointments':[],'inquiries':[]}
          DETAIL_B={'ok':True,'client':FAKE_CLIENT_B,'cases':[],'contacts':[],
