                  page.locator('#service-edit-name').fill('架空オンライン相談')
                  boxes=page.locator('#service-edit-form [name="channel_options"]')
                  assert boxes.count()>=3
                  for i in range(boxes.count()): boxes.nth(i).uncheck()
                  page.locator('#service-edit-form button[type="submit"]').click()
                  assert events['mutations']==before_mutations,(preset,'empty service channels wrote to API')
                  page.locator('#service-edit-modal [data-close-modal]').click()
                  assert page.locator('#service-edit-modal').is_hidden()
                  page.locator('[data-admin-panel="settings"]').screenshot(
                    path=str(EVIDENCE/f'{preset}-settings-guard-flow.png'),animations='disabled',timeout=15000)
                  report['screenshots'].append(f'{preset}-settings-guard-flow.png')
                  report['business_flow_checks'][preset]={
                      'document_search_and_no_result':True,'document_status_filter':True,
                      'request_submission_tabs':True,'fake_document_nonopenable':True,
