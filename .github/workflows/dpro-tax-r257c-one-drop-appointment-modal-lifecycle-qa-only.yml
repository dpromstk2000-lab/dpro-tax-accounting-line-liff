                  page.locator('#closed-date-close').select_option('09:00')
                  page.locator('#closed-date-form button[type="submit"]').click()
                  assert events['mutations']==before_mutations,(preset,'invalid special time wrote to API')
                  page.locator('#closed-date-type').select_option('closed')
                  assert page.locator('#closed-date-time-fields').is_hidden()
                  # Service modal: at least one consultation channel is required.
