          }
          FAKE_CLIENT_D={
           'id':'r261-c-d','legal_name':'特別2026101501税理士事務所',
           'client_code':'SPEC-2026101501-D','client_type':'corporation','status':'active',
           'representative_name':'特別担当者','phone':'050-9911-3344',
