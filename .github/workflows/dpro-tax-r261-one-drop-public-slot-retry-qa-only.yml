name: DPRO TAX R261 One Drop QA-only Public Booking Slot Failure Retry and 88 Screen QA

on:
  push:
    branches: ['qa/r225-synthetic-pg17-backup-restore-20261014']
    paths: ['.github/workflows/dpro-tax-r261-one-drop-public-slot-retry-qa-only.yml']

# Scoped to this disposable QA branch. No main, production DB or Worker permissions.
permissions:
  contents: write

jobs:
  r261-owner-modal-lifecycle-qa-isolated:
    if: github.event_name == 'push' && github.ref == 'refs/heads/qa/r225-synthetic-pg17-backup-restore-20261014'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout QA branch for appointment-client search candidate and QA-only commit
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Prepare R261 accessible slot-fetch retry only in QA checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/qa/r225-synthetic-pg17-backup-restore-20261014'
          python3 - <<'PY_R261_PATCH'
          from pathlib import Path
          p=Path('app.js')
          before=p.read_text(encoding='utf8')
          old_catch='      } catch (error) {\n        if (requestSeq === slotRequestSeq) $("#slot-message").textContent = error.message;\n      }\n    }'
          new_catch='      } catch (error) {\n        if (requestSeq === slotRequestSeq) {\n          // R261 QA-only: preserve date/service and offer a safe retry for transient slot errors.\n          $("#slot-message").textContent = "空き時間を取得できませんでした。再試行してください。";\n          $("#slot-grid").innerHTML = \'<button class="btn btn-secondary" type="button" data-retry-slots>再試行</button>\';\n        }\n      }\n    }'
          old_click='    $("#slot-grid").addEventListener("click", (event) => {\n      const button = event.target.closest("[data-slot]");'
          new_click='    $("#slot-grid").addEventListener("click", (event) => {\n      if (event.target.closest("[data-retry-slots]")) { loadSlots(); return; }\n      const button = event.target.closest("[data-slot]");'
          assert before.count(old_catch)==1, 'current public slot failure handler changed; stop'
          assert before.count(old_click)==1, 'current public slot click handler changed; stop'
          for version in ('R254','R255B','R256','R257C','R258','R259','R260'):
              assert before.count(version+' QA-only')==1, 'existing guard missing: '+version
          assert 'R261 QA-only' not in before, 'already applied'
          after=before.replace(old_catch,new_catch,1).replace(old_click,new_click,1)
          assert after.count('R261 QA-only')==1
          for version in ('R254','R255B','R256','R257C','R258','R259','R260'):
              assert after.count(version+' QA-only')==1, 'previous product guard changed: '+version
          p.write_text(after,encoding='utf8')
          print('PASS: R261 public slot transient error retry only; prior R254-R260 protections preserved; 88-screen QA pending')
          PY_R261_PATCH
          git diff --check
          test "$(git diff --name-only)" = app.js
          git diff --stat -- app.js
          node --check app.js
      - name: Install isolated Playwright Chromium for synthetic owner tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .r261-browser-venv
          .r261-browser-venv/bin/python -m pip install --disable-pip-version-check playwright==1.56.0
          .r261-browser-venv/bin/python -m playwright install --with-deps chromium
          echo 'PASS: disposable localhost browser ready; only QA app.js candidate under test' 
      - name: Start localhost static site without any proxy to production
        shell: bash
        run: |
          set -euo pipefail
          test -s owner.html && test -s app.js && test -s styles.css && test -s config.js
          python3 -m http.server 8765 --bind 127.0.0.1 > r261-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --silent --fail --noproxy '*' http://127.0.0.1:8765/owner.html -o /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent --show-error --noproxy '*' http://127.0.0.1:8765/owner.html -o /dev/null
          echo 'PASS: isolated localhost-only source ready' 
      - name: Check R261 synthetic temporary slot failure and in-page retry plus prior regression
        shell: bash
        run: |
          set -euo pipefail
          .r261-browser-venv/bin/python - <<'PY_R261_BROWSER'
