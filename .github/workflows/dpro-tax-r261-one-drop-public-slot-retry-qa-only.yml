                          page.locator('#sidebar-toggle').click()
                          assert 'open' in (page.locator('#admin-sidebar').get_attribute('class') or ''),(
                              preset,view,'sidebar did not open')
                      button=page.locator('button[data-admin-view="'+view+'"]')
                      button.click(timeout=10000)
                      panel=page.locator('[data-admin-panel="'+view+'"]')
                      assert panel.is_visible(),(preset,view,'selected panel not visible')
                      assert button.evaluate('(e)=>e.classList.contains("active")'),(preset,view,'active nav state missing')
                      assert page.locator('[data-admin-panel]:visible').count()==1,(preset,view,'other panels unexpectedly visible')
                      if preset=='mobile':
                          assert 'open' not in (page.locator('#admin-sidebar').get_attribute('class') or ''),(
                              preset,view,'sidebar did not auto-close')
                      # R261: Only the checked-out QA-branch styles.css is rendered.
                      # No injected styles, production credentials, or live API responses.
                      geom=page.evaluate('Math.max(document.documentElement.scrollWidth,document.body.scrollWidth)-innerWidth')
                      assert geom<=1,(preset,view,'actual product stylesheet overflows',geom)
                      if view=='settings':
                          for selector in ('#business-hours-editor [data-business-day]','[data-hour-open]','[data-hour-close]'):
                              assert page.locator(selector).count()>=7,(preset,'seven weekday controls missing',selector)
                          report['settings_css_comparison'][preset]={'source_page_overflow_px':geom,
                              'no_temporary_css':True,'code_under_test':'styles.css',
                              'real_product_css_in_qa_branch':True}
                      fname=f'{preset}-owner-{view}.png'
                      panel.screenshot(path=str(EVIDENCE/fname),animations='disabled',timeout=15000)
                      report['screenshots'].append(fname)
                      report['view_checks'][f'{preset}/{view}']={'visible':True,'other_panels_hidden':True,
                                            'sidebar_closes':True,'page_overflow_px':geom}
                  # R261: Business flow inspection with actual app.js. No writes are issued.
                  # Start in documents after the last nine-menu iteration (settings).
                  if preset=='mobile':
                      page.locator('#sidebar-toggle').click()
                  page.locator('button[data-admin-view="documents"]').click()
                  docs=page.locator('#documents-table-body')
                  assert docs.locator('tr').count()==1,(preset,'fixture doc missing')
                  assert '架空_領収書.pdf' in docs.inner_text(),(preset,'doc title absent')
                  q=page.locator('#document-search')
                  q.fill('領収書')
                  assert 'DOC-R261-001' in docs.inner_text(),(preset,'document NFKC search failed')
                  q.fill('架空でも存在しないファイル')
                  assert '条件に一致する提出書類がありません' in docs.inner_text(),(preset,'document no-result copy')
                  q.fill('')
                  page.locator('#document-status-filter').select_option('accepted')
                  assert '条件に一致する提出書類がありません' in docs.inner_text(),(preset,'status filtering')
                  page.locator('#document-status-filter').select_option('new')
                  assert 'DOC-R261-001' in docs.inner_text(),(preset,'new document filtering')
                  page.locator('[data-document-tab="requests"]').click()
                  assert page.locator('#document-submission-table').is_hidden()
                  assert page.locator('#document-request-table').is_visible()
                  assert '架空の月次資料提出依頼' in page.locator('#requests-table-body').inner_text()
                  page.locator('[data-document-tab="submissions"]').click()
                  assert page.locator('#document-submission-table').is_visible()
                  assert page.locator('#document-request-table').is_hidden()
                  page.locator('[data-document-review-open="r261-doc1"]').click()
                  page.locator('#document-review-content').wait_for(state='visible',timeout=10000)
                  assert '架空_領収書.pdf' in page.locator('#document-review-summary').inner_text()
                  assert page.locator('#document-review-open').is_disabled(),(preset,'fake file must not open')
                  assert page.locator('#document-reviewer option').count()==1
                  assert '履歴はありません' in page.locator('#document-review-history').inner_text()
                  before_mutations=events['mutations']
                  page.locator('#document-review-note').fill('')
                  page.locator('#document-review-form [data-review-status="rejected"]').click()
                  assert page.locator('#document-review-note').evaluate('(e)=>document.activeElement===e')
                  assert events['mutations']==before_mutations,(preset,'rejection without reason attempted API write')
                  page.locator('#document-review-modal [data-close-modal]').click()
                  assert page.locator('#document-review-modal').is_hidden()
                  page.locator('[data-admin-panel="documents"]').screenshot(
                    path=str(EVIDENCE/f'{preset}-document-guard-flow.png'),animations='disabled',timeout=15000)
                  report['screenshots'].append(f'{preset}-document-guard-flow.png')
                  # R261: Settings edits are exercised in the DOM only; do NOT save valid data.
                  if preset=='mobile':
                      page.locator('#sidebar-toggle').click()
                  page.locator('button[data-admin-view="settings"]').click()
                  editor=page.locator('#business-hours-editor')
                  assert editor.locator('[data-business-day]').count()==7
                  monday=editor.locator('[data-business-day="1"]')
                  opening=monday.locator('[data-hour-open]')
                  closing=monday.locator('[data-hour-close]')
                  checkbox=monday.locator('[data-hour-closed]')
                  assert opening.locator('option').count()==48
                  assert closing.locator('option').count()==48
                  assert opening.input_value()=='09:00'
                  assert closing.input_value()=='17:00'
                  assert not checkbox.is_checked()
                  checkbox.check()
                  assert opening.is_disabled() and closing.is_disabled()
                  checkbox.uncheck()
                  assert opening.is_enabled() and closing.is_enabled()
                  # Invalid hours must be rejected before PATCH /api/admin/business-hours.
                  opening.select_option('17:00')
                  closing.select_option('09:00')
                  page.locator('#business-hours-form button[type="submit"]').click()
