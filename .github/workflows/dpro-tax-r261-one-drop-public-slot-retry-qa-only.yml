           'next_action':'架空の年末調整','public_summary':'北川架空案件'
          }
          DASH={
           'ok':True,'office':{'office_name':'R246架空税理士事務所'},
           'counts':{'clients':6,'open_cases':3,'new_documents':0,'open_inquiries':0},
           'urgent_cases':[],'due_tasks':[],'documents_to_review':[],
           'active_appointments':[],'open_inquiries':[]
          }
          FAKE_DOC={
           'id':'r261-doc1','client_id':'r245-c1','original_filename':'架空_領収書.pdf',
           'submission_code':'DOC-R261-001','status':'new',
           'submitted_at':'2026-10-01T09:00:00+09:00','file_size_bytes':2048,
           'mime_type':'application/pdf','submitted_by_type':'client',
           'reviewed_at':None,'reviewed_by':None,'rejection_reason':''
          }
          FAKE_REQUEST={
           'id':'r261-request1','client_id':'r245-c1','title':'架空の月次資料提出依頼',
           'request_code':'REQ-R261-001','due_on':'2027-03-30',
           'status':'open','items':[{'item_name':'領収書'}]
          }
          FAKE_STAFF={
           'id':'r261-staff1','display_name':'架空事務所スタッフ','staff_code':'FAKE-STAFF-01',
           'role':'staff','email':'','phone':'','can_review_documents':True,'is_active':True
          }
          DOCUMENT_DETAIL={
           'ok':True,'document':FAKE_DOC,'client':FAKE_CLIENT,
           'contact':{'full_name':'架空の提出者'},'request':FAKE_REQUEST,
           'request_item':{'item_name':'領収書'},'reviewers':[FAKE_STAFF],
           'file':{'available':False},'access_logs':[]
          }
          # Deterministic wholly synthetic client detail endpoints for deferred-response race QA.
          DETAIL_A={'ok':True,'client':FAKE_CLIENT_A,'cases':[],'contacts':[],
              'document_requests':[],'appointments':[],'inquiries':[]}
          DETAIL_B={'ok':True,'client':FAKE_CLIENT_B,'cases':[],'contacts':[],
              'document_requests':[],'appointments':[],'inquiries':[]}
          FIXTURES={
           '/api/admin/clients/r261-c-a':DETAIL_A,
           '/api/admin/clients/r261-c-b':DETAIL_B,
           '/api/admin/dashboard':DASH,
           '/api/admin/clients':{'ok':True,'clients':[FAKE_CLIENT,FAKE_CLIENT_A,FAKE_CLIENT_B,FAKE_CLIENT_C,FAKE_CLIENT_D,FAKE_CLIENT_E]},
           '/api/admin/cases':{'ok':True,'cases':[FAKE_CASE,FAKE_CASE_A,FAKE_CASE_B]},
           '/api/admin/document-requests':{'ok':True,'document_requests':[FAKE_REQUEST]},
           '/api/admin/documents':{'ok':True,'documents':[FAKE_DOC]},
           '/api/admin/documents/r261-doc1':DOCUMENT_DETAIL,
           '/api/admin/appointments':{'ok':True,'appointments':[]},
           '/api/admin/inquiries':{'ok':True,'inquiries':[]},
           '/api/admin/tasks':{'ok':True,'tasks':[]},
           '/api/admin/staff':{'ok':True,'staff':[FAKE_STAFF]},
           '/api/admin/settings':{'ok':True,'office':{
               'office_name':'R246架空税理士事務所','phone':'','email':'',
               'booking_open_days':90,'security_notice':'架空データのみ'} ,
               'services':[],'business_hours':[],'closed_dates':[]},
           '/api/public/office':{'ok':True,'office':{
               'security_notice':'架空データのみ','booking_open_days':90},'services':[{'id':'synthetic-r261-service','service_name':'架空の税務面談','duration_minutes':30,'channel_options':['in_person','phone']}]}
          }
          report={'suite':'R261 validated public booking submission plus slot race and 72 owner regression screens',
                  'main_modified':False,'production_requests':0,'attempted_mutations':0,
                  'screenshots':[],'view_checks':{},'searches':{},'blocked_requests':0,
                  'mock_reads':0,'browser_errors':[],'settings_css_comparison':{},'business_flow_checks':{},'r261_client_search_guards':{},'r261_case_search_guards':{},'r261_booking_guard':{},'r261_booking_client_search':{},'r261_race_guard':{},'r261_modal_close_guard':{},'r261_public_slot_race':{},'r261_submission_guards':{},'r261_slot_accessibility':{},'r261_slot_retry':{},'release':'NO_GO/HOLD'}
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--no-sandbox'])
              for preset,w,h in [('desktop',1280,800),('tablet',1024,800),('compact',768,900),('mobile',390,844)]:
                  ctx=browser.new_context(viewport={'width':w,'height':h},
                          device_scale_factor=1,is_mobile=preset=='mobile',
                          has_touch=preset=='mobile',reduced_motion='reduce',
                          service_workers='block',java_script_enabled=True)
                  events={'requests':0,'blocked':0,'mutations':0,'api':0}
                  deferred=[]
                  deferred_public=[]
                  slot_c_attempts=[0]
                  def offline(route):
                      req=route.request
                      u=urlsplit(req.url)
                      if u.scheme=='http' and u.hostname=='127.0.0.1' and u.port==8765:
                          return route.continue_()
                      if u.hostname==REMOTE and req.method=='GET' and u.path=='/api/public/slots':
                          selected_day=parse_qs(u.query).get('date',[''])[0]
                          if selected_day==DAY_A:
                              deferred_public.append(route)
                              return
                          if selected_day==DAY_B:
                              events['api']+=1
                              return route.fulfill(status=200,content_type='application/json',
                                  headers={'Access-Control-Allow-Origin':'*'},
                                  body=json.dumps({'ok':True,'slots':[SLOT_B]},ensure_ascii=False))
                          if selected_day==DAY_C:
                              slot_c_attempts[0]+=1
                              events['api']+=1
                              if slot_c_attempts[0]==1:
                                  return route.fulfill(status=503,content_type='application/json',
                                      headers={'Access-Control-Allow-Origin':'*'},
                                      body=json.dumps({'ok':False,'message':'架空の一時的な取得失敗'},ensure_ascii=False))
                              return route.fulfill(status=200,content_type='application/json',
                                  headers={'Access-Control-Allow-Origin':'*'},
                                  body=json.dumps({'ok':True,'slots':[SLOT_C]},ensure_ascii=False))
                          events['blocked']+=1
                          return route.abort('blockedbyclient')
                      if u.hostname==REMOTE and req.method=='OPTIONS' and u.path in FIXTURES:
                          # Explicitly mock browser CORS preflight for synthetic admin X-Admin-Key GETs.
                          # This never reaches the Cloudflare Worker.
                          return route.fulfill(status=204,headers={
                              'Access-Control-Allow-Origin':'*',
                              'Access-Control-Allow-Methods':'GET, OPTIONS',
                              'Access-Control-Allow-Headers':'X-Admin-Key, X-Line-User-Id, Content-Type, Accept',
                              'Access-Control-Max-Age':'0'})
                      if u.hostname==REMOTE and req.method=='GET' and u.path=='/api/admin/clients/r261-c-a':
                          # Never reach network. Hold response A until synthetic client B has been selected.
                          assert req.headers.get('x-admin-key')=='1234'
                          deferred.append(route)
                          events['api']+=1
                          return
                      if u.hostname==REMOTE and req.method=='GET' and u.path in FIXTURES:
                          if u.path.startswith('/api/admin/') and req.headers.get('x-admin-key')!='1234':
                              events['blocked']+=1
                              return route.fulfill(status=403,content_type='application/json',
                                  headers={'Access-Control-Allow-Origin':'*'},
                                  body=json.dumps({'ok':False,'error':'SYNTHETIC_INVALID_CODE'}))
                          events['api']+=1
                          return route.fulfill(status=200,content_type='application/json',
                              headers={'Access-Control-Allow-Origin':'*'},
                              body=json.dumps(FIXTURES[u.path],ensure_ascii=False))
                      events['blocked']+=1
                      if req.method not in ('GET','HEAD','OPTIONS'):
                          events['mutations']+=1
                      return route.abort('blockedbyclient')
                  ctx.route('**/*',offline)
                  page=ctx.new_page()
                  errs=[]
                  page.on('pageerror',lambda e:errs.append(str(e)))
                  response=page.goto(ROOT+'/owner.html?demo=1',wait_until='domcontentloaded',timeout=15000)
                  assert response and response.status==200,(preset,'local source not loaded')
                  page.locator('#owner-app').wait_for(state='visible',timeout=15000)
                  page.locator('#owner-content').wait_for(state='visible',timeout=15000)
                  expect(page.locator('#owner-auth')).to_be_hidden(timeout=15000)
                  expect(page.locator('#owner-office-name')).to_have_text('R246架空税理士事務所',timeout=15000)
                  expect(page.locator('#metric-clients')).to_have_text('6',timeout=15000)
                  expect(page.locator('#metric-cases')).to_have_text('3',timeout=15000)
                  expect(page.locator('button[data-admin-view]')).to_have_count(9,timeout=15000)
                  expect(page.locator('#clients-table-body tr')).to_have_count(6,timeout=15000)
                  expect(page.locator('#cases-table-body tr')).to_have_count(3,timeout=15000)
                  expect(page.locator('#clients-table-body')).to_contain_text('架空会計テスト株式会社',timeout=15000)
                  expect(page.locator('#cases-table-body')).to_contain_text('架空の確定申告案件',timeout=15000)
