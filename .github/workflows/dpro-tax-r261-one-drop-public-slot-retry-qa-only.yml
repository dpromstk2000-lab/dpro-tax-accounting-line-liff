           'client_code':'HOJO-2026101501-E','client_type':'corporation','status':'active',
           'representative_name':'北条担当者','phone':'050-8877-6655',
           'phone_normalized':'05088776655','assigned_staff_id':None
          }
          FAKE_CASE={
           'id':'r245-case1','title':'架空の確定申告案件','case_code':'FAKE-CASE-001',
           'client_id':'r245-c1','case_type':'tax_return','status':'in_progress',
           'deadline_date':'2027-03-31','progress_percent':30,'deadline_is_confirmed':True,
           'next_action':'架空の確認作業','public_summary':'架空のテスト案件'
          }
          FAKE_CASE_A={
           'id':'r261-case-a','title':'青葉2026決算','case_code':'CASE-2026-A',
           'client_id':'r261-c-a','case_type':'corporate_tax_return','status':'in_progress',
           'deadline_date':'2027-03-31','progress_percent':25,'deadline_is_confirmed':True,
           'next_action':'架空の決算確認','public_summary':'青葉架空案件'
          }
          FAKE_CASE_B={
