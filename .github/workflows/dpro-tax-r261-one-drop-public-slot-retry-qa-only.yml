          SLOT_C={'start_at':DAY_C+'T11:00:00+09:00','local_time':'11:00','available':True}

          EVIDENCE.mkdir(exist_ok=True)
          VIEWS=['dashboard','clients','cases','documents','appointments','inquiries','tasks','staff','settings']
          FAKE_CLIENT={
           'id':'r245-c1','legal_name':'架空会計テスト株式会社','client_code':'TX-FAKE-001',
           'client_type':'corporation','status':'active','representative_name':'架空担当者',
           'phone':'090-1111-2201','phone_normalized':'09011112201',
           'assigned_staff_id':None
          }
          FAKE_CLIENT_A={
           'id':'r261-c-a','legal_name':'青葉2026会計サービス',
           'client_code':'AOBA-2026-X','client_type':'corporation','status':'active',
           'representative_name':'青葉担当者','phone':'080-2345-6789',
           'phone_normalized':'08023456789','assigned_staff_id':None
          }
          FAKE_CLIENT_B={
           'id':'r261-c-b','legal_name':'北川2026商事',
           'client_code':'KITA-2026-Y','client_type':'corporation','status':'active',
           'representative_name':'北川担当者','phone':'080-9876-5432',
           'phone_normalized':'08098765432','assigned_staff_id':None
          }
          FAKE_CLIENT_C={
           'id':'r261-c-c','legal_name':'緑2026会計支援',
           'client_code':'MIDORI-2026-Z','client_type':'corporation','status':'active',
           'representative_name':'緑担当者','phone':'070-3333-7788',
