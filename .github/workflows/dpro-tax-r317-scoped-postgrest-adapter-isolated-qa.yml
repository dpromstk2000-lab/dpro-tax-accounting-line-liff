name: DPRO TAX R317 Request-Scoped PostgREST Adapter Isolated QA

on:
  push:
    branches:
      - dpro-tax-r308-auth-tenant-integration-qa-20261020
    paths:
      - 'qa/r316/r317-scoped-postgrest-adapter.mjs'
      - 'qa/r316/r317-scoped-postgrest-adapter.test.mjs'
      - '.github/workflows/dpro-tax-r317-scoped-postgrest-adapter-isolated-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scoped-postgrest-offline:
    if: github.ref == 'refs/heads/dpro-tax-r308-auth-tenant-integration-qa-20261020'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout isolated QA branch (no retained credential)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify source integrity and isolated QA only
        shell: bash
        run: |
          set -euo pipefail
          test -s qa/r316/read-only-gateway.mjs
          test -s qa/r316/read-only-gateway.test.mjs
          test -s qa/r316/r317-scoped-postgrest-adapter.mjs
          test -s qa/r316/r317-scoped-postgrest-adapter.test.mjs
          test "$(git hash-object qa/r316/read-only-gateway.mjs)" = '3fd89237be45daf945a95b5692f402432ae25352'
          test "$(git hash-object qa/r316/read-only-gateway.test.mjs)" = '389e2da868b20ac44b69b0b80197a2d9b85628bb'
          ! grep -nE 'process\.env\.|wrangler deploy|wrangler publish|cloudflare deploy|\.supabase\.co' qa/r316/r317-scoped-postgrest-adapter.mjs
          node --check qa/r316/r317-scoped-postgrest-adapter.mjs
          node --check qa/r316/r317-scoped-postgrest-adapter.test.mjs
          echo 'R317: disconnected QA only - no secrets, live DB, Worker deploy, or LINE dispatch'

      - name: R316 executable gateway regression
        shell: bash
        run: |
          set -euo pipefail
          node qa/r316/read-only-gateway.test.mjs

      - name: R317 source-level scoped PostgREST adapter and real R316 integration (mock transport)
        shell: bash
        run: |
          set -euo pipefail
          node qa/r316/r317-scoped-postgrest-adapter.test.mjs
