          docker exec -i "$pgid" psql -X -U postgres -d r324_synthetic -v ON_ERROR_STOP=1 < /tmp/tests.sql
          docker exec -i "$pgid" psql -X -U postgres -d r324_synthetic -v ON_ERROR_STOP=1 < /tmp/r323_tests.sql
          echo 'R323_EPHEMERAL_PG17_IDENTITY_GUARD_COMPLETE: r321_r322_regression=PASS jwt_signature_verified=false guc_trust_unverified=true bypass_rls_is_not_user_safe=true real_supabase_queries=0 commercial_release=HOLD'
      - name: Run actual R316 ES256 signature verifier against the disposable PostgreSQL RLS database
        shell: bash
        run: |
          set -euo pipefail
          test -s qa/r316/read-only-gateway.mjs
          node --check qa/r316/read-only-gateway.mjs
          test "${{ github.ref }}" = 'refs/heads/dpro-tax-r308-auth-tenant-integration-qa-20261020'
          cat > /tmp/r324-integration.mjs <<'R324_NODE_SCRIPT'
          /**
           * DPRO TAX R324 - disposable PostgreSQL 17 + actual R316 ES256 verifier integration.
           * This is NOT Supabase Auth, a production Worker or a production PostgREST call.
           * All PostgreSQL queries target the ephemeral container in the GitHub Actions job.
           * DO NOT EXECUTE against shared Supabase. NEVER embed real credentials.
           */
          import assert from 'node:assert/strict';
          import {webcrypto} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          import {pathToFileURL} from 'node:url';
          import path from 'node:path';
          if (!globalThis.crypto) globalThis.crypto=webcrypto;
          const {createR316Gateway}=await import(pathToFileURL(path.resolve('qa/r316/read-only-gateway.mjs')).href);
          const {subtle}=globalThis.crypto;
          const ISS='https://synthetic-r324.invalid/auth/v1';
          const TIME=1792500000;
          const OA='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa';
          const OB='bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb';
          const USER={owner:'11111111-1111-4111-8111-111111111111',b:'22222222-2222-4222-8222-222222222222',dual:'33333333-3333-4333-8333-333333333333',revoked:'44444444-4444-4444-8444-444444444444',staff:'55555555-5555-4555-8555-555555555555',inactiveOffice:'66666666-6666-4666-8666-666666666666',demoOffice:'77777777-7777-4777-8777-777777777777',unknown:'99999999-9999-4999-8999-999999999999'};
          const b64=o=>Buffer.from(typeof o==='string'?o:JSON.stringify(o)).toString('base64url');
          const {publicKey,privateKey}=await subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign','verify']);
          const pub=await subtle.exportKey('jwk',publicKey);delete pub.d;
          const gateway=createR316Gateway({trustedPublicKeys:{fixture_kid:pub},issuer:ISS,db:Object.freeze({getOffice(){throw Error('DB_NOT_REQUIRED')},findStaffMemberships(){throw Error('DB_NOT_REQUIRED')},listClients(){throw Error('DB_NOT_REQUIRED')},getClient(){throw Error('DB_NOT_REQUIRED')}}),now:()=>TIME});
          async function sign(sub,overrides={},headerOverrides={}){
           const hd=b64({alg:'ES256',typ:'JWT',kid:'fixture_kid',...headerOverrides});
           const pl=b64({iss:ISS,aud:'authenticated',role:'authenticated',sub,iat:TIME-40,nbf:TIME-50,exp:TIME+900,...overrides});
           const sig=await subtle.sign({name:'ECDSA',hash:'SHA-256'},privateKey,Buffer.from(hd+'.'+pl));
           return hd+'.'+pl+'.'+Buffer.from(sig).toString('base64url');
          }
          let checks=0,postgresRoundTrips=0,jwtRejected=0,verifiedCalls=0;
          function check(name,value,expected){assert.deepEqual(value,expected,name);checks++;}
          const UUID=/^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
          const PGID=process.env.R324_PG_CONTAINER_ID||'';
          if (!process.env.R324_DRY_RUN && !/^[a-f0-9]{12,64}$/.test(PGID)) throw Error('EPHEMERAL_PG_CONTAINER_REQUIRED');
          const expected={
           [USER.owner]:{offices:1,clients:3,docs:3},
           [USER.b]:{offices:1,clients:1,docs:1},
           [USER.dual]:{offices:2,clients:1,docs:1},
           [USER.revoked]:{offices:0,clients:0,docs:0},
           [USER.staff]:{offices:1,clients:1,docs:1},
           [USER.inactiveOffice]:{offices:0,clients:0,docs:0},
           [USER.demoOffice]:{offices:0,clients:0,docs:0},
           [USER.unknown]:{offices:0,clients:0,docs:0},
          };
          function queryDB(verified,office=null){
           assert(UUID.test(verified.sub),'unverified or malformed DB subject');
           if (office!==null)assert(UUID.test(office),'invalid tenant filter');
           postgresRoundTrips++;
           if(process.env.R324_DRY_RUN){const x=expected[verified.sub];return office===null?x:(office===OA?({[USER.owner]:{offices:1,clients:3,docs:3},[USER.b]:{offices:0,clients:0,docs:0},[USER.dual]:{offices:1,clients:1,docs:1},[USER.staff]:{offices:1,clients:1,docs:1}}[verified.sub]||{offices:0,clients:0,docs:0}):({[USER.b]:{offices:1,clients:1,docs:1},[USER.dual]:{offices:1,clients:0,docs:0}}[verified.sub]||{offices:0,clients:0,docs:0}));}
           // PostgreSQL container accepts only synthetic UUIDs derived from the verified ES256 JWT.
           // SET LOCAL applies only within one transaction, so one user's identity cannot leak to the next.
           const filter=office?` WHERE office_id='${office}'::uuid`:'';
           const officeFilter=office?` WHERE id='${office}'::uuid`:'';
           const sql=`BEGIN;
          SET LOCAL ROLE authenticated;
          SELECT set_config('request.jwt.claim.sub','${verified.sub}',true);
          SELECT json_build_object('offices',(SELECT count(*) FROM public.taxacc_offices${officeFilter}),'clients',(SELECT count(*) FROM public.taxacc_clients${filter}),'docs',(SELECT count(*) FROM public.taxacc_document_submissions${filter}))::text;
          COMMIT;`;
           const raw=execFileSync('docker',['exec','-i',PGID,'psql','-X','-A','-t','-U','postgres','-d','r324_synthetic','-v','ON_ERROR_STOP=1'],{input:sql,encoding:'utf8',timeout:12000,maxBuffer:1048576});
           const result=raw.split(/\r?\n/).map(x=>x.trim()).filter(x=>x.startsWith('{')&&x.endsWith('}'));
           assert.equal(result.length,1,'PostgreSQL response must contain one JSON row');
           return JSON.parse(result[0]);
          }
          async function verifiedDB(token,office=null){const verified=await gateway.verifyJWT(token);verifiedCalls++;return queryDB(verified,office)}
          async function denied(name,token){const before=postgresRoundTrips;let wasDenied=false;try{await verifiedDB(token)}catch(e){wasDenied=true}check(name+'-jwt-denied',wasDenied,true);check(name+'-no-db-query',postgresRoundTrips,before);jwtRejected++}
          for(const [name,sub] of Object.entries(USER)){
           const t=await sign(sub);check(name+'-signed-token-db-scope',await verifiedDB(t),expected[sub]);
          }
          for(const [name,sub,office,row] of [
           ['owner-own-office',USER.owner,OA,{offices:1,clients:3,docs:3}],
           ['owner-other-office',USER.owner,OB,{offices:0,clients:0,docs:0}],
           ['staff-b-own-office',USER.b,OB,{offices:1,clients:1,docs:1}],
           ['staff-b-other-office',USER.b,OA,{offices:0,clients:0,docs:0}],
           ['dual-a',USER.dual,OA,{offices:1,clients:1,docs:1}],
           ['dual-b',USER.dual,OB,{offices:1,clients:0,docs:0}],
           ['staff-a',USER.staff,OA,{offices:1,clients:1,docs:1}],
           ['staff-b-no-a',USER.b,OA,{offices:0,clients:0,docs:0}],
          ]) check(name+'-verified-db-filter',await verifiedDB(await sign(sub),office),row);
          const signed=await sign(USER.owner);
          await denied('tampered-payload',signed.split('.')[0]+'.'+b64({sub:USER.b})+'.'+signed.split('.')[2]);
          await denied('tampered-signature',signed.slice(0,-1)+(signed.endsWith('A')?'B':'A'));
          await denied('expired',await sign(USER.owner,{exp:TIME-1}));
          await denied('future-nbf',await sign(USER.owner,{nbf:TIME+60}));
          await denied('wrong-audience',await sign(USER.owner,{aud:'anon'}));
          await denied('wrong-issuer',await sign(USER.owner,{iss:'https://untrusted.example.invalid'}));
          await denied('non-auth-role',await sign(USER.owner,{role:'service_role'}));
          await denied('missing-sub',await sign(USER.owner,{sub:null}));
          await denied('untrusted-kid',await sign(USER.owner,{}, {kid:'not_trusted'}));
          await denied('alg-none',await sign(USER.owner,{}, {alg:'none'}));
          await denied('noncanonical-token',signed+'=');
          await denied('empty-token','');
          // No implicit reuse of a prior user's verified sub across subsequent calls.
          check('owner-a-followed-by-staff-b',await verifiedDB(await sign(USER.b),OA),{offices:0,clients:0,docs:0});
          check('staff-b-followed-by-owner-a',await verifiedDB(await sign(USER.owner),OA),{offices:1,clients:3,docs:3});
          check('all-denial-cases-blocked-before-db',jwtRejected,12);
          check('real-container-required-in-ci',process.env.R324_DRY_RUN?true:PGID.length>=12,true);
          console.log(JSON.stringify({suite:'DPRO_TAX_R324_ES256_VERIFIED_IDENTITY_TO_DISPOSABLE_PG17_RLS',checks,verified_db_queries:postgresRoundTrips,signature_denials_without_db:jwtRejected,verification_calls:verifiedCalls,actual_r316_verifier_imported:true,actual_postgres_engine:!process.env.R324_DRY_RUN,synthetic_signing_keys_only:true,real_supabase_jwt:false,real_supabase_connection:false,production_worker_untouched:true,commercial_release:'HOLD'}));
          R324_NODE_SCRIPT
          node --check /tmp/r324-integration.mjs
          export R324_PG_CONTAINER_ID="${{ job.services.pg.id }}"
          test -n "$R324_PG_CONTAINER_ID"
          node /tmp/r324-integration.mjs
          echo 'R324_EPHEMERAL_PG17_ES256_IDENTITY_RLS_COMPLETE: actual_R316_verifier=true disposable_postgres_only=true live_supabase=false commercial_release=HOLD'
