      - name: Prepare R323 identity spoofing and membership revocation SQL in disposable PG17
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r323_tests.sql <<'R323_TESTS'
          -- DPRO TAX R323: disposable PostgreSQL 17 identity/privilege boundary QA.
          -- ONLY run inside an ephemeral CI database. NOT a production migration.
          -- The synthetic request.jwt.claim.sub GUC does NOT verify JWT signatures.
          \set ON_ERROR_STOP on
          RESET ROLE;
          RESET request.jwt.claim.sub;
          -- Mirror the already-existing live schema's authenticated staff binding uniqueness.
          CREATE UNIQUE INDEX r323_staff_auth_user_unique ON public.taxacc_staff (office_id,auth_user_id)
           WHERE auth_user_id IS NOT NULL;
          SELECT public.r321_assert('r323-auth-binding-unique-index',
           (SELECT count(*) FROM pg_indexes WHERE schemaname='public' AND tablename='taxacc_staff' AND indexname='r323_staff_auth_user_unique' AND indexdef LIKE '%WHERE (auth_user_id IS NOT NULL)%'),1);
          -- Check PostgreSQL itself prevents duplicate user association within one office.
          DO $r323_duplicate$
          DECLARE rejected boolean:=false;
          BEGIN
           BEGIN
            INSERT INTO public.taxacc_staff VALUES
             ('aaaa0000-0000-4000-8000-000000000099','aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',
              '11111111-1111-4111-8111-111111111111','owner',true,true);
           EXCEPTION WHEN unique_violation THEN rejected:=true;
           END;
           IF NOT rejected THEN RAISE EXCEPTION 'R323_FAIL: duplicate binding was accepted'; END IF;
           RAISE NOTICE 'R323_PASS: duplicated active user binding rejected';
          END $r323_duplicate$;
          SELECT public.r321_assert('r323-duplicate-row-not-inserted',
           (SELECT count(*) FROM public.taxacc_staff WHERE id='aaaa0000-0000-4000-8000-000000000099'),0);
          -- NULL user IDs are permitted but cannot authorize a session by themselves.
          INSERT INTO public.taxacc_staff VALUES
           ('aaaa0000-0000-4000-8000-000000000090','aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',NULL,'manager',true,true),
           ('aaaa0000-0000-4000-8000-000000000091','aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',NULL,'owner',true,true);
          SELECT public.r321_assert('r323-null-auth-id-rows-retained',(SELECT count(*) FROM public.taxacc_staff WHERE office_id='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa' AND auth_user_id IS NULL),2);
          SELECT public.r321_assert('r323-rules-still-select-only',
           (SELECT count(*) FROM pg_policies WHERE schemaname='public' AND tablename LIKE 'taxacc_%' AND cmd<>'SELECT'),0);
          SELECT public.r321_assert('r323-client-RLS-force',(SELECT count(*) FROM pg_class WHERE relname='taxacc_clients' AND relrowsecurity AND relforcerowsecurity),1);
          SELECT public.r321_assert('r323-credentials-helpers-pinned',
           (SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace WHERE n.nspname='r321_private' AND p.proname IN ('active_member','self_staff','can_read_client') AND 'search_path=pg_catalog'=ANY(p.proconfig)),3);
          SELECT public.r321_assert('r323-anon-cannot-create-private',has_schema_privilege('anon','r321_private','CREATE')::int,0);
          SELECT public.r321_assert('r323-auth-cannot-create-private',has_schema_privilege('authenticated','r321_private','CREATE')::int,0);
          SELECT public.r321_assert('r323-anon-cannot-execute-definers',
           (has_function_privilege('anon','r321_private.active_member(uuid)','EXECUTE')::int+
           has_function_privilege('anon','r321_private.self_staff(uuid,uuid)','EXECUTE')::int+
           has_function_privilege('anon','r321_private.can_read_client(uuid,uuid)','EXECUTE')::int),0);
          SELECT public.r321_assert('r323-role-auth-select-grant-present',has_table_privilege('authenticated','public.taxacc_clients','SELECT')::int,1);
          SELECT public.r321_assert('r323-role-anon-select-grant-present',has_table_privilege('anon','public.taxacc_clients','SELECT')::int,1);
          SELECT public.r321_assert('r323-no-anon-insert',has_table_privilege('anon','public.taxacc_clients','INSERT')::int,0);
          SELECT public.r321_assert('r323-no-auth-update',has_table_privilege('authenticated','public.taxacc_clients','UPDATE')::int,0);
          SELECT public.r321_assert('r323-no-auth-delete',has_table_privilege('authenticated','public.taxacc_clients','DELETE')::int,0);
          
          SET ROLE authenticated;
          RESET request.jwt.claim.sub;
          SELECT public.r321_assert('r323-missing-sub-offices',(SELECT count(*) FROM public.taxacc_offices),0);
          SELECT public.r321_assert('r323-missing-sub-clients',(SELECT count(*) FROM public.taxacc_clients),0);
          SELECT public.r321_assert('r323-missing-sub-docs',(SELECT count(*) FROM public.taxacc_document_submissions),0);
          SELECT public.r321_assert('r323-missing-sub-staff',(SELECT count(*) FROM public.taxacc_staff),0);
          -- Validly shaped but unknown identity must not grant data.
          SET request.jwt.claim.sub='99999999-9999-4999-8999-999999999999';
          SELECT public.r321_assert('r323-unknown-id-offices',(SELECT count(*) FROM public.taxacc_offices),0);
          SELECT public.r321_assert('r323-unknown-id-clients',(SELECT count(*) FROM public.taxacc_clients),0);
          SELECT public.r321_assert('r323-unknown-id-docs',(SELECT count(*) FROM public.taxacc_document_submissions),0);
          -- A real office-B staffer must not cross into office A.
          SET request.jwt.claim.sub='22222222-2222-4222-8222-222222222222';
          SELECT public.r321_assert('r323-staff-b-no-office-a',(SELECT count(*) FROM public.taxacc_offices WHERE id='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa'),0);
          SELECT public.r321_assert('r323-staff-b-no-a-clients',(SELECT count(*) FROM public.taxacc_clients WHERE office_id='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa'),0);
          SELECT public.r321_assert('r323-staff-b-no-a-docs',(SELECT count(*) FROM public.taxacc_document_submissions WHERE office_id='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa'),0);
          SELECT public.r321_assert('r323-staff-b-own-client',(SELECT count(*) FROM public.taxacc_clients WHERE office_id='bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb'),1);
          -- The synthetic owner identity can see its own non-demo office; JWT MUST be validated upstream.
          -- This is a POSITIVE CONTROL, not proof that the database verifies a JWT signature.
          SET request.jwt.claim.sub='11111111-1111-4111-8111-111111111111';
          SELECT public.r321_assert('r323-owner-a-office',(SELECT count(*) FROM public.taxacc_offices WHERE id='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa'),1);
          SELECT public.r321_assert('r323-owner-not-office-b',(SELECT count(*) FROM public.taxacc_offices WHERE id='bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb'),0);
          SELECT public.r321_assert('r323-owner-a-nondemo-clients',(SELECT count(*) FROM public.taxacc_clients),3);
          SELECT public.r321_assert('r323-owner-no-b-documents',(SELECT count(*) FROM public.taxacc_document_submissions WHERE office_id='bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb'),0);
          -- Explicitly demonstrate why a caller that can write request.jwt.claim.sub must never be trusted.
          -- A raw SQL connection with authenticated role can forge the claim GUC. This is a KNOWN
          -- EXTERNAL TRUST REQUIREMENT; the demonstration MUST NOT be reported as a passing auth test.
          SELECT public.r321_assert('r323-guc-is-not-jwt-signature-validation',
           (current_setting('request.jwt.claim.sub',true)='11111111-1111-4111-8111-111111111111')::int,1);
          RESET ROLE;
          -- Verify scope changes are effective, then restore fixture state.
          UPDATE public.taxacc_staff SET is_active=false WHERE id='aaaa0000-0000-4000-8000-000000000001';
          SET ROLE authenticated;
          SET request.jwt.claim.sub='11111111-1111-4111-8111-111111111111';
          SELECT public.r321_assert('r323-deactivated-owner-office-denied',(SELECT count(*) FROM public.taxacc_offices),0);
          SELECT public.r321_assert('r323-deactivated-owner-client-denied',(SELECT count(*) FROM public.taxacc_clients),0);
          RESET ROLE;
          UPDATE public.taxacc_staff SET is_active=true WHERE id='aaaa0000-0000-4000-8000-000000000001';
          UPDATE public.taxacc_offices SET production_guard=false WHERE id='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa';
          SET ROLE authenticated;
          SET request.jwt.claim.sub='11111111-1111-4111-8111-111111111111';
          SELECT public.r321_assert('r323-production-guard-off-owner-denied',(SELECT count(*) FROM public.taxacc_offices),0);
          SELECT public.r321_assert('r323-production-guard-off-doc-denied',(SELECT count(*) FROM public.taxacc_document_submissions),0);
          RESET ROLE;
          UPDATE public.taxacc_offices SET production_guard=true WHERE id='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa';
          UPDATE public.taxacc_staff SET can_view_all_clients=false WHERE id='aaaa0000-0000-4000-8000-000000000001';
          SET ROLE authenticated;
          SET request.jwt.claim.sub='11111111-1111-4111-8111-111111111111';
          SELECT public.r321_assert('r323-revoked-all-client-flag-denied',(SELECT count(*) FROM public.taxacc_clients),0);
          SELECT public.r321_assert('r323-revoked-all-client-docs-denied',(SELECT count(*) FROM public.taxacc_document_submissions),0);
          RESET ROLE;
          UPDATE public.taxacc_staff SET can_view_all_clients=true WHERE id='aaaa0000-0000-4000-8000-000000000001';
          -- Explicit anonymous-role spoofing must still return zero rows.
          SET ROLE anon;
          SET request.jwt.claim.sub='11111111-1111-4111-8111-111111111111';
          SELECT public.r321_assert('r323-anon-forged-sub-offices',(SELECT count(*) FROM public.taxacc_offices),0);
          SELECT public.r321_assert('r323-anon-forged-sub-clients',(SELECT count(*) FROM public.taxacc_clients),0);
          SELECT public.r321_assert('r323-anon-forged-sub-docs',(SELECT count(*) FROM public.taxacc_document_submissions),0);
          RESET ROLE;
          RESET request.jwt.claim.sub;
          -- A role with BYPASSRLS sees ALL tenant rows, by PostgreSQL design. Demonstrate this
          -- only with an artificial role in disposable DB. Do NOT give real user-facing API such a role.
          CREATE ROLE r324_synthetic_rls_bypass NOLOGIN BYPASSRLS;
          GRANT SELECT ON public.taxacc_offices,public.taxacc_clients TO r324_synthetic_rls_bypass;
          SELECT public.r321_assert('r323-bypass-role-flag', (SELECT rolbypassrls::int FROM pg_roles WHERE rolname='r324_synthetic_rls_bypass'),1);
          SET ROLE r324_synthetic_rls_bypass;
          SELECT public.r321_assert('r323-bypass-role-exposes-all-tenant-offices',(SELECT count(*) FROM public.taxacc_offices),4);
          SELECT public.r321_assert('r323-bypass-role-exposes-all-tenant-clients',(SELECT count(*) FROM public.taxacc_clients),5);
          RESET ROLE;
          SELECT 'R323_EPHEMERAL_PG17_IDENTITY_BOUNDARY_PASS_COMMERCIAL_HOLD' AS result;
          R323_TESTS
      - name: Execute all SQL in ephemeral PG17 and retain release HOLD
