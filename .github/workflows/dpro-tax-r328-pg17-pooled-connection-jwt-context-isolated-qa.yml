        SELECT public.r321_assert('r326-post-rollback-clients',(SELECT count(*) FROM public.taxacc_clients),5);
        SELECT public.r321_assert('r326-post-rollback-owner-staff-active',(SELECT count(*) FROM public.taxacc_staff WHERE id='aaaa0000-0000-4000-8000-000000000001'::uuid AND is_active IS TRUE AND role='owner' AND can_view_all_clients IS TRUE),1);
        SELECT 'R326_PG17_TRANSACTIONAL_REVOCATION_PASS_RELEASE_HOLD' AS result;
