    - name: R327 demonstrate privileged BYPASSRLS risks and least-privilege barriers in disposable PostgreSQL 17
      shell: bash
      run: |
        set -euo pipefail
        # Explicit user-safety warning: privileged BYPASSRLS reads ignore user RLS.
        # This is a synthetic disposable PostgreSQL security NEGATIVE demonstration, NOT an approval.
        cat > /tmp/r327_bypassrls.sql <<'R327_DISPOSABLE_SQL'
        \set ON_ERROR_STOP on
        -- R327: DISPOSABLE POSTGRESQL 17 ONLY. This fixture illustrates BYPASSRLS threat.
        -- It is NOT a migration, NOT a real Supabase connection, and NOT a release approval.
        CREATE ROLE r327_ci_bypass NOLOGIN BYPASSRLS;
        CREATE ROLE r327_ci_limited NOLOGIN;
        GRANT SELECT ON public.taxacc_offices, public.taxacc_staff,
         public.taxacc_clients, public.taxacc_document_submissions,
         public.taxacc_document_access_logs TO r327_ci_bypass,r327_ci_limited;

        -- Inspect only synthetic role traits and grants.
        SELECT public.r321_assert('r327-exact-one-bypass-role',
         (SELECT count(*) FROM pg_roles WHERE rolname='r327_ci_bypass' AND rolbypassrls),1);
        SELECT public.r321_assert('r327-plain-cannot-bypass',
         (SELECT count(*) FROM pg_roles WHERE rolname='r327_ci_limited' AND rolbypassrls),0);
        SELECT public.r321_assert('r327-authenticated-cannot-bypass',
         (SELECT count(*) FROM pg_roles WHERE rolname='authenticated' AND rolbypassrls),0);
        SELECT public.r321_assert('r327-anon-cannot-bypass',
         (SELECT count(*) FROM pg_roles WHERE rolname='anon' AND rolbypassrls),0);
        SELECT public.r321_assert('r327-plain-no-bypass-membership',
         pg_has_role('r327_ci_limited','r327_ci_bypass','MEMBER')::int,0);
        SELECT public.r321_assert('r327-auth-no-bypass-membership',
         pg_has_role('authenticated','r327_ci_bypass','MEMBER')::int,0);
        SELECT public.r321_assert('r327-anon-no-bypass-membership',
         pg_has_role('anon','r327_ci_bypass','MEMBER')::int,0);
        SELECT public.r321_assert('r327-force-rls-five',
         (SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
          WHERE n.nspname='public' AND c.relname IN ('taxacc_offices','taxacc_staff',
            'taxacc_clients','taxacc_document_submissions','taxacc_document_access_logs')
          AND c.relrowsecurity AND c.relforcerowsecurity),5);
        SELECT public.r321_assert('r327-write-policy-zero',
         (SELECT count(*) FROM pg_policies WHERE schemaname='public' AND tablename LIKE 'taxacc_%' AND cmd<>'SELECT'),0);
        SELECT public.r321_assert('r327-bypass-read-grant',
         has_table_privilege('r327_ci_bypass','public.taxacc_clients','SELECT')::int,1);
        SELECT public.r321_assert('r327-plain-read-grant',
         has_table_privilege('r327_ci_limited','public.taxacc_clients','SELECT')::int,1);
        SELECT public.r321_assert('r327-bypass-has-no-client-insert',
         has_table_privilege('r327_ci_bypass','public.taxacc_clients','INSERT')::int,0);
        SELECT public.r321_assert('r327-bypass-has-no-client-update',
         has_table_privilege('r327_ci_bypass','public.taxacc_clients','UPDATE')::int,0);
        SELECT public.r321_assert('r327-bypass-has-no-client-delete',
         has_table_privilege('r327_ci_bypass','public.taxacc_clients','DELETE')::int,0);
        SELECT public.r321_assert('r327-plain-has-no-client-update',
         has_table_privilege('r327_ci_limited','public.taxacc_clients','UPDATE')::int,0);
        SELECT public.r321_assert('r327-auth-no-write',
         has_table_privilege('authenticated','public.taxacc_document_submissions','UPDATE')::int,0);
        SELECT public.r321_assert('r327-anon-no-write',
         has_table_privilege('anon','public.taxacc_document_submissions','INSERT')::int,0);

        -- A role with SELECT GRANT but no RLS policy must see zero rows.
        SET ROLE r327_ci_limited;
        SELECT public.r321_assert('r327-plain-no-office-visible',(SELECT count(*) FROM public.taxacc_offices),0);
        SELECT public.r321_assert('r327-plain-no-staff-visible',(SELECT count(*) FROM public.taxacc_staff),0);
        SELECT public.r321_assert('r327-plain-no-clients-visible',(SELECT count(*) FROM public.taxacc_clients),0);
        SELECT public.r321_assert('r327-plain-no-documents-visible',(SELECT count(*) FROM public.taxacc_document_submissions),0);
        SELECT public.r321_assert('r327-plain-no-audit-visible',(SELECT count(*) FROM public.taxacc_document_access_logs),0);
        RESET ROLE;

        -- Elevated BYPASSRLS role bypasses FORCE RLS and exposes BOTH tenants, even audit.
        -- This is a test demonstrating why service credentials must never reach user paths.
        SET ROLE r327_ci_bypass;
        SELECT public.r321_assert('r327-bypass-sees-four-offices',(SELECT count(*) FROM public.taxacc_offices),4);
        SELECT public.r321_assert('r327-bypass-sees-eight-staff',(SELECT count(*) FROM public.taxacc_staff),8);
        SELECT public.r321_assert('r327-bypass-sees-five-clients',(SELECT count(*) FROM public.taxacc_clients),5);
        SELECT public.r321_assert('r327-bypass-sees-four-documents',(SELECT count(*) FROM public.taxacc_document_submissions),4);
        SELECT public.r321_assert('r327-bypass-sees-private-audit',(SELECT count(*) FROM public.taxacc_document_access_logs),1);
        SELECT public.r321_assert('r327-bypass-sees-office-a',(SELECT count(*) FROM public.taxacc_clients WHERE office_id='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa'),4);
        SELECT public.r321_assert('r327-bypass-sees-office-b',(SELECT count(*) FROM public.taxacc_clients WHERE office_id='bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb'),1);
        SET request.jwt.claim.sub='22222222-2222-4222-8222-222222222222';
        SELECT public.r321_assert('r327-bypass-ignores-user-a-clients',(SELECT count(*) FROM public.taxacc_clients WHERE office_id='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa'),4);
        RESET ROLE;

        -- In ordinary authenticated role, same spoofed claim can never cross tenants.
        SET ROLE authenticated;
        SET request.jwt.claim.sub='22222222-2222-4222-8222-222222222222';
        SELECT public.r321_assert('r327-auth-b-sees-own-office',(SELECT count(*) FROM public.taxacc_offices),1);
        SELECT public.r321_assert('r327-auth-b-sees-one-client',(SELECT count(*) FROM public.taxacc_clients),1);
        SELECT public.r321_assert('r327-auth-b-cannot-see-office-a-client',
         (SELECT count(*) FROM public.taxacc_clients WHERE office_id='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa'),0);
        SELECT public.r321_assert('r327-auth-b-cannot-see-office-a-doc',
         (SELECT count(*) FROM public.taxacc_document_submissions WHERE office_id='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa'),0);
        SELECT public.r321_assert('r327-auth-b-cannot-see-audit',(SELECT count(*) FROM public.taxacc_document_access_logs),0);
        RESET ROLE;
        SET ROLE anon;
        SET request.jwt.claim.sub='11111111-1111-4111-8111-111111111111';
        SELECT public.r321_assert('r327-anon-forged-owner-cannot-see-office',(SELECT count(*) FROM public.taxacc_offices),0);
        SELECT public.r321_assert('r327-anon-forged-owner-cannot-see-client',(SELECT count(*) FROM public.taxacc_clients),0);
        SELECT public.r321_assert('r327-anon-forged-owner-cannot-see-doc',(SELECT count(*) FROM public.taxacc_document_submissions),0);
        RESET ROLE;
        SELECT 'R327_EPHEMERAL_PG17_BYPASSRLS_THREAT_DEMONSTRATED_RELEASE_HOLD' AS result;
        R327_DISPOSABLE_SQL
        pgid="${{ job.services.pg.id }}"
        test -n "$pgid"
        docker exec -i "$pgid" psql -X -U postgres -d r325_synthetic -v ON_ERROR_STOP=1 < /tmp/r327_bypassrls.sql
        echo 'R327_EPHEMERAL_PG17_BYPASSRLS_RISK_CONFIRMED assertions=38 production_access=false commercial_release=HOLD'
    - name: R328 demonstrate transaction-local identity cleanup and detect unsafe session GUC carryover (disposable PG17)
      shell: bash
      run: |
        set -euo pipefail
        # Disposable PG17 only: proves SET LOCAL clears identity after COMMIT/ROLLBACK.
        # Also demonstrates why SESSION SET persists and is UNSAFE for reused connections.
        cat > /tmp/r328.sql <<'R328_DISPOSABLE_ONLY'
        \set ON_ERROR_STOP on
        -- R328 DISPOSABLE PG17 SESSION SCOPE TEST ONLY -- NEVER APPLY TO SHARED SUPABASE.
        -- request.jwt.claim.sub is a freely settable PG custom GUC in this fixture.
        -- It is NOT signature validation; ONLY upstream verified JWTs may supply identity.
        -- R327 already demonstrated BYPASSRLS bypass of even FORCE RLS.
        RESET ROLE;
        SET ROLE authenticated;
        RESET request.jwt.claim.sub;
        SELECT public.r321_assert('r328-id-empty-before-request', (auth.uid() IS NULL)::int,1);
        SELECT public.r321_assert('r328-no-clients-before-request',(SELECT count(*) FROM public.taxacc_clients),0);
        SELECT public.r321_assert('r328-no-offices-before-request',(SELECT count(*) FROM public.taxacc_offices),0);
        SELECT public.r321_assert('r328-no-docs-before-request',(SELECT count(*) FROM public.taxacc_document_submissions),0);
        -- Request A, using transaction-local identity on an existing connection.
        BEGIN;
        SET LOCAL request.jwt.claim.sub='11111111-1111-4111-8111-111111111111';
        SELECT public.r321_assert('r328-owner-a-identity',(auth.uid()='11111111-1111-4111-8111-111111111111'::uuid)::int,1);
        SELECT public.r321_assert('r328-owner-a-office',(SELECT count(*) FROM public.taxacc_offices),1);
        SELECT public.r321_assert('r328-owner-a-clients',(SELECT count(*) FROM public.taxacc_clients),3);
        SELECT public.r321_assert('r328-owner-a-docs',(SELECT count(*) FROM public.taxacc_document_submissions),3);
        SELECT public.r321_assert('r328-owner-a-no-b-client', (SELECT count(*) FROM public.taxacc_clients WHERE office_id='bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb'),0);
        COMMIT;
        SELECT public.r321_assert('r328-commit-clears-owner-a-identity',(auth.uid() IS NULL)::int,1);
        SELECT public.r321_assert('r328-commit-clears-owner-a-offices',(SELECT count(*) FROM public.taxacc_offices),0);
        SELECT public.r321_assert('r328-commit-clears-owner-a-clients',(SELECT count(*) FROM public.taxacc_clients),0);
        SELECT public.r321_assert('r328-commit-clears-owner-a-docs',(SELECT count(*) FROM public.taxacc_document_submissions),0);
        -- Reuse SAME backend as user B, without any owner A identity left.
        BEGIN;
        SET LOCAL request.jwt.claim.sub='22222222-2222-4222-8222-222222222222';
        SELECT public.r321_assert('r328-staff-b-identity',(auth.uid()='22222222-2222-4222-8222-222222222222'::uuid)::int,1);
        SELECT public.r321_assert('r328-staff-b-one-office',(SELECT count(*) FROM public.taxacc_offices),1);
        SELECT public.r321_assert('r328-staff-b-one-client',(SELECT count(*) FROM public.taxacc_clients),1);
        SELECT public.r321_assert('r328-staff-b-one-doc',(SELECT count(*) FROM public.taxacc_document_submissions),1);
        SELECT public.r321_assert('r328-staff-b-cannot-see-a-client',(SELECT count(*) FROM public.taxacc_clients WHERE office_id='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa'),0);
        COMMIT;
        SELECT public.r321_assert('r328-commit-clears-staff-b-identity',(auth.uid() IS NULL)::int,1);
        SELECT public.r321_assert('r328-commit-clears-staff-b-clients',(SELECT count(*) FROM public.taxacc_clients),0);
        SELECT public.r321_assert('r328-commit-clears-staff-b-docs',(SELECT count(*) FROM public.taxacc_document_submissions),0);
        -- Request C aborts: ROLLBACK MUST also restore no identity.
        BEGIN;
        SET LOCAL request.jwt.claim.sub='11111111-1111-4111-8111-111111111111';
        SELECT public.r321_assert('r328-rollback-inflight-owner-visible',(SELECT count(*) FROM public.taxacc_clients),3);
        ROLLBACK;
        SELECT public.r321_assert('r328-rollback-clears-identity',(auth.uid() IS NULL)::int,1);
        SELECT public.r321_assert('r328-rollback-clears-clients',(SELECT count(*) FROM public.taxacc_clients),0);
        SELECT public.r321_assert('r328-rollback-clears-offices',(SELECT count(*) FROM public.taxacc_offices),0);
        -- Another authenticated request has no sub: even with role, no tenant access.
        BEGIN;
        SELECT public.r321_assert('r328-missing-identity-denies-clients',(SELECT count(*) FROM public.taxacc_clients),0);
        SELECT public.r321_assert('r328-missing-identity-denies-docs',(SELECT count(*) FROM public.taxacc_document_submissions),0);
        COMMIT;
        -- Shared dual-tenant user is still limited by STAFF/CUSTOMER RLS, not by session residue.
        BEGIN;
        SET LOCAL request.jwt.claim.sub='33333333-3333-4333-8333-333333333333';
        SELECT public.r321_assert('r328-dual-member-two-offices',(SELECT count(*) FROM public.taxacc_offices),2);
        SELECT public.r321_assert('r328-dual-member-one-client',(SELECT count(*) FROM public.taxacc_clients),1);
        SELECT public.r321_assert('r328-dual-member-one-doc',(SELECT count(*) FROM public.taxacc_document_submissions),1);
        COMMIT;
        SELECT public.r321_assert('r328-dual-commit-identity-cleared',(auth.uid() IS NULL)::int,1);
        SELECT public.r321_assert('r328-dual-commit-clients-denied',(SELECT count(*) FROM public.taxacc_clients),0);
        -- Negative control: plain SET *persists* across a commit (danger to pooled sessions).
        SET request.jwt.claim.sub='11111111-1111-4111-8111-111111111111';
        BEGIN;
        SELECT public.r321_assert('r328-unsafe-set-owner-visible-in-transaction',(SELECT count(*) FROM public.taxacc_clients),3);
        COMMIT;
        SELECT public.r321_assert('r328-unsafe-set-identity-still-present',(auth.uid()='11111111-1111-4111-8111-111111111111'::uuid)::int,1);
        SELECT public.r321_assert('r328-unsafe-set-leak-detectable',(SELECT count(*) FROM public.taxacc_clients),3);
        -- Explicit reset restores fail-closed behavior.
        RESET request.jwt.claim.sub;
        SELECT public.r321_assert('r328-reset-after-unsafe-identity-absent',(auth.uid() IS NULL)::int,1);
        SELECT public.r321_assert('r328-reset-after-unsafe-client-deny',(SELECT count(*) FROM public.taxacc_clients),0);
        RESET ROLE;
        -- Anon cannot read a tenant even with a spoofed sub claim.
        SET ROLE anon;
        BEGIN;
        SET LOCAL request.jwt.claim.sub='11111111-1111-4111-8111-111111111111';
        SELECT public.r321_assert('r328-anon-owner-sub-offices-denied',(SELECT count(*) FROM public.taxacc_offices),0);
        SELECT public.r321_assert('r328-anon-owner-sub-clients-denied',(SELECT count(*) FROM public.taxacc_clients),0);
        SELECT public.r321_assert('r328-anon-owner-sub-docs-denied',(SELECT count(*) FROM public.taxacc_document_submissions),0);
        COMMIT;
        RESET ROLE;
        -- Validate that authenticated / anon are not privileged RLS-bypass roles.
        SELECT public.r321_assert('r328-authenticated-no-bypassrls',(SELECT count(*) FROM pg_roles WHERE rolname='authenticated' AND rolbypassrls),0);
        SELECT public.r321_assert('r328-anon-no-bypassrls',(SELECT count(*) FROM pg_roles WHERE rolname='anon' AND rolbypassrls),0);
        SELECT 'R328_EPHEMERAL_PG17_POOL_SESSION_GUC_ISOLATION_PASS_RELEASE_HOLD' AS result;
        R328_DISPOSABLE_ONLY
        pgid="${{ job.services.pg.id }}"
        test -n "$pgid"
        docker exec -i "$pgid" psql -X -U postgres -d r325_synthetic -v ON_ERROR_STOP=1 < /tmp/r328.sql
        echo 'R328_EPHEMERAL_PG17_POOL_CONTEXT_PASS checks=42 synthetic_only=true real_supabase=false commercial_release=HOLD'
