name: DPRO TAX R329 PG17 Default Deny 26 Tables QA - Fixture Fix V1.1
'on':
  push:
    branches:
      - dpro-tax-r308-auth-tenant-integration-qa-20261020
    paths:
      - '.github/workflows/dpro-tax-r329-pg17-26-table-readiness-hold-isolated-qa.yml'
  workflow_dispatch:
permissions: {}
jobs:
  r329-ephemeral-26-table-rls:
    if: github.ref == 'refs/heads/dpro-tax-r308-auth-tenant-integration-qa-20261020'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    services:
      pg:
        image: postgres:17
        env:
          POSTGRES_DB: r329_synthetic
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable_r329_ci_only
        options: >-
          --health-cmd "pg_isready -U postgres -d r329_synthetic"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    steps:
      - name: Prove synthetic 26-table default-deny against PG17 and retain commercial HOLD
        shell: bash
        run: |
          set -euo pipefail
          # Isolated ephemeral PostgreSQL only; NEVER run against shared Supabase.
          cat > /tmp/r329.sql <<'R329_SYNTHETIC_SQL'
          -- R329 SYNTHETIC PG17 ONLY. NEVER EXECUTE ON SHARED SUPABASE.
          \set ON_ERROR_STOP on
          CREATE ROLE anon NOLOGIN NOBYPASSRLS;
          CREATE ROLE authenticated NOLOGIN NOBYPASSRLS;
          CREATE ROLE qa_bypass_rls NOLOGIN BYPASSRLS;
          GRANT USAGE ON SCHEMA public TO anon,authenticated,qa_bypass_rls;
          -- Only 26 synthetic tables, mirroring public taxonomy; no production rows or auth.
          DO $r329_init$
          DECLARE tab text;
          BEGIN
           FOREACH tab IN ARRAY ARRAY['taxacc_activity_logs','taxacc_appointments','taxacc_business_hours','taxacc_cases','taxacc_client_contact_links','taxacc_clients','taxacc_closed_dates','taxacc_communications','taxacc_consultation_services','taxacc_contacts','taxacc_deadline_templates','taxacc_document_access_logs','taxacc_document_request_items','taxacc_document_request_templates','taxacc_document_requests','taxacc_document_submissions','taxacc_engagements','taxacc_inquiries','taxacc_link_tokens','taxacc_message_templates','taxacc_offices','taxacc_r91_review_events','taxacc_r9_monthly_review_batches','taxacc_r9_monthly_review_items','taxacc_staff','taxacc_tasks'] LOOP
            IF tab='taxacc_offices' THEN
             EXECUTE format('CREATE TABLE public.%I (id uuid PRIMARY KEY)',tab);
            ELSE
             EXECUTE format('CREATE TABLE public.%I (id uuid PRIMARY KEY, office_id uuid NOT NULL)',tab);
            END IF;
            EXECUTE format('ALTER TABLE public.%I ENABLE ROW LEVEL SECURITY',tab);
            IF tab='taxacc_offices' THEN
             EXECUTE format('INSERT INTO public.%I (id) VALUES (%L::uuid)',tab,'11111111-1111-4111-8111-111111111111');
            ELSE
             -- Every other synthetic table requires an office_id (matching its disposable NOT NULL fixture).
             EXECUTE format('INSERT INTO public.%I (id, office_id) VALUES (%L::uuid, %L::uuid)',tab,
              '11111111-1111-4111-8111-111111111111','aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa');
            END IF;
            EXECUTE format('GRANT SELECT ON public.%I TO anon,authenticated,qa_bypass_rls',tab);
           END LOOP;
          END
          $r329_init$;
          -- Catalog assertions must fail if table count, RLS settings, policy count or role flags drift.
          DO $r329_catalog$
          DECLARE tab text; seen int; policies int; enabled bool; forced bool;
          BEGIN
           SELECT count(*) INTO seen FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
           WHERE n.nspname='public' AND c.relkind='r' AND c.relname LIKE 'taxacc_%';
           IF seen <> 26 THEN RAISE EXCEPTION 'R329_CATALOG_TABLE_COUNT actual=%',seen; END IF;
           FOREACH tab IN ARRAY ARRAY['taxacc_activity_logs','taxacc_appointments','taxacc_business_hours','taxacc_cases','taxacc_client_contact_links','taxacc_clients','taxacc_closed_dates','taxacc_communications','taxacc_consultation_services','taxacc_contacts','taxacc_deadline_templates','taxacc_document_access_logs','taxacc_document_request_items','taxacc_document_request_templates','taxacc_document_requests','taxacc_document_submissions','taxacc_engagements','taxacc_inquiries','taxacc_link_tokens','taxacc_message_templates','taxacc_offices','taxacc_r91_review_events','taxacc_r9_monthly_review_batches','taxacc_r9_monthly_review_items','taxacc_staff','taxacc_tasks'] LOOP
            SELECT c.relrowsecurity,c.relforcerowsecurity, (SELECT count(*) FROM pg_policy p WHERE p.polrelid=c.oid)
            INTO enabled,forced,policies FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
            WHERE n.nspname='public' AND c.relname=tab;
            IF enabled IS DISTINCT FROM true OR forced IS DISTINCT FROM false OR policies <> 0
            THEN RAISE EXCEPTION 'R329_CATALOG_POLICY_MISMATCH %',tab; END IF;
           END LOOP;
           IF (SELECT rolbypassrls FROM pg_roles WHERE rolname='authenticated') THEN RAISE EXCEPTION 'R329_AUTH_BYPASS'; END IF;
           IF (SELECT rolbypassrls FROM pg_roles WHERE rolname='anon') THEN RAISE EXCEPTION 'R329_ANON_BYPASS'; END IF;
           IF NOT (SELECT rolbypassrls FROM pg_roles WHERE rolname='qa_bypass_rls') THEN RAISE EXCEPTION 'R329_THREAT_MODEL_NOT_CONFIGURED'; END IF;
           RAISE NOTICE 'R329_PASS: 26 synthetic tables RLS ON no policies, roles audited';
          END
          $r329_catalog$;
          -- Enforce real PostgreSQL role+RLS behavior; 26 auth + 26 anon + 26 bypass checks.
          SET ROLE authenticated;
          DO $r329_auth$
          DECLARE tab text; n bigint; passed int:=0;
          BEGIN
           FOREACH tab IN ARRAY ARRAY['taxacc_activity_logs','taxacc_appointments','taxacc_business_hours','taxacc_cases','taxacc_client_contact_links','taxacc_clients','taxacc_closed_dates','taxacc_communications','taxacc_consultation_services','taxacc_contacts','taxacc_deadline_templates','taxacc_document_access_logs','taxacc_document_request_items','taxacc_document_request_templates','taxacc_document_requests','taxacc_document_submissions','taxacc_engagements','taxacc_inquiries','taxacc_link_tokens','taxacc_message_templates','taxacc_offices','taxacc_r91_review_events','taxacc_r9_monthly_review_batches','taxacc_r9_monthly_review_items','taxacc_staff','taxacc_tasks'] LOOP
            EXECUTE format('SELECT count(*) FROM public.%I',tab) INTO n;
            IF n<>0 THEN RAISE EXCEPTION 'R329_AUTH_TENANT_DATA_EXPOSED %',tab; END IF;
            passed:=passed+1;
           END LOOP;
           RAISE NOTICE 'R329_PASS authenticated_default_deny=%',passed;
          END
          $r329_auth$;
          RESET ROLE;
          SET ROLE anon;
          DO $r329_anon$
          DECLARE tab text; n bigint; passed int:=0;
          BEGIN
           FOREACH tab IN ARRAY ARRAY['taxacc_activity_logs','taxacc_appointments','taxacc_business_hours','taxacc_cases','taxacc_client_contact_links','taxacc_clients','taxacc_closed_dates','taxacc_communications','taxacc_consultation_services','taxacc_contacts','taxacc_deadline_templates','taxacc_document_access_logs','taxacc_document_request_items','taxacc_document_request_templates','taxacc_document_requests','taxacc_document_submissions','taxacc_engagements','taxacc_inquiries','taxacc_link_tokens','taxacc_message_templates','taxacc_offices','taxacc_r91_review_events','taxacc_r9_monthly_review_batches','taxacc_r9_monthly_review_items','taxacc_staff','taxacc_tasks'] LOOP
            EXECUTE format('SELECT count(*) FROM public.%I',tab) INTO n;
            IF n<>0 THEN RAISE EXCEPTION 'R329_ANON_TENANT_DATA_EXPOSED %',tab; END IF;
            passed:=passed+1;
           END LOOP;
           RAISE NOTICE 'R329_PASS anon_default_deny=%',passed;
          END
          $r329_anon$;
          RESET ROLE;
          SET ROLE qa_bypass_rls;
          DO $r329_bypass$
          DECLARE tab text; n bigint; passed int:=0;
          BEGIN
           FOREACH tab IN ARRAY ARRAY['taxacc_activity_logs','taxacc_appointments','taxacc_business_hours','taxacc_cases','taxacc_client_contact_links','taxacc_clients','taxacc_closed_dates','taxacc_communications','taxacc_consultation_services','taxacc_contacts','taxacc_deadline_templates','taxacc_document_access_logs','taxacc_document_request_items','taxacc_document_request_templates','taxacc_document_requests','taxacc_document_submissions','taxacc_engagements','taxacc_inquiries','taxacc_link_tokens','taxacc_message_templates','taxacc_offices','taxacc_r91_review_events','taxacc_r9_monthly_review_batches','taxacc_r9_monthly_review_items','taxacc_staff','taxacc_tasks'] LOOP
            EXECUTE format('SELECT count(*) FROM public.%I',tab) INTO n;
            IF n<>1 THEN RAISE EXCEPTION 'R329_BYPASS_THREAT_MISMATCH %',tab; END IF;
            passed:=passed+1;
           END LOOP;
           RAISE NOTICE 'R329_PASS bypass_rls_threat_model=%',passed;
          END
          $r329_bypass$;
          RESET ROLE;
          SELECT 'R329_EPHEMERAL_PG17_26_TABLE_DEFAULT_DENY_78_CHECKS_PASS__COMMERCIAL_RELEASE_HOLD' AS result;
          R329_SYNTHETIC_SQL
          pgid="${{ job.services.pg.id }}"
          test -n "$pgid"
          docker exec -i "$pgid" psql -X -U postgres -d r329_synthetic -v ON_ERROR_STOP=1 < /tmp/r329.sql
          echo 'R329_EPHEMERAL_PG17_DEFAULT_DENY_GAP_GATE 26_tables=verified 78_role_checks=passed live_supabase_queries=0 real_rls_policy_ready=false commercial_release=HOLD'
