    - name: R332 prepare positive and negative tenant FK tests (1/1)
      shell: bash
      run: "set -euo pipefail\ncat > /tmp/02_graph_fk_tests.sql <<'R332_SQL_2_1'\n\\set ON_ERROR_STOP on\nCREATE TEMP TABLE\
        \ qa_edges(child text,col text,parent text,pk text);\nINSERT INTO qa_edges(child,col,parent,pk) VALUES\n('taxacc_appointments','client_id','taxacc_clients','id'),\n\
        ('taxacc_appointments','contact_id','taxacc_contacts','id'),\n('taxacc_appointments','service_id','taxacc_consultation_services','id'),\n\
        ('taxacc_appointments','assigned_staff_id','taxacc_staff','id'),\n('taxacc_cases','assigned_staff_id','taxacc_staff','id'),\n\
        ('taxacc_cases','client_id','taxacc_clients','id'),\n('taxacc_cases','deadline_confirmed_by','taxacc_staff','id'),\n\
        ('taxacc_cases','engagement_id','taxacc_engagements','id'),\n('taxacc_cases','reviewer_staff_id','taxacc_staff','id'),\n\
        ('taxacc_client_contact_links','client_id','taxacc_clients','id'),\n('taxacc_client_contact_links','contact_id','taxacc_contacts','id'),\n\
        ('taxacc_clients','assigned_staff_id','taxacc_staff','id'),\n('taxacc_clients','reviewer_staff_id','taxacc_staff','id'),\n\
        ('taxacc_communications','appointment_id','taxacc_appointments','id'),\n('taxacc_communications','case_id','taxacc_cases','id'),\n\
        ('taxacc_communications','client_id','taxacc_clients','id'),\n('taxacc_communications','contact_id','taxacc_contacts','id'),\n\
        ('taxacc_communications','inquiry_id','taxacc_inquiries','id'),\n('taxacc_communications','handled_by','taxacc_staff','id'),\n\
        ('taxacc_contacts','line_link_approved_by','taxacc_staff','id'),\n('taxacc_document_access_logs','submission_id','taxacc_document_submissions','id'),\n\
        ('taxacc_document_request_items','request_id','taxacc_document_requests','id'),\n('taxacc_document_requests','case_id','taxacc_cases','id'),\n\
        ('taxacc_document_requests','client_id','taxacc_clients','id'),\n('taxacc_document_requests','requested_by','taxacc_staff','id'),\n\
        ('taxacc_document_submissions','case_id','taxacc_cases','id'),\n('taxacc_document_submissions','client_id','taxacc_clients','id'),\n\
        ('taxacc_document_submissions','contact_id','taxacc_contacts','id'),\n('taxacc_document_submissions','request_item_id','taxacc_document_request_items','id'),\n\
        ('taxacc_document_submissions','request_id','taxacc_document_requests','id'),\n('taxacc_document_submissions','reviewed_by','taxacc_staff','id'),\n\
        ('taxacc_engagements','assigned_staff_id','taxacc_staff','id'),\n('taxacc_engagements','client_id','taxacc_clients','id'),\n\
        ('taxacc_engagements','reviewer_staff_id','taxacc_staff','id'),\n('taxacc_inquiries','case_id','taxacc_cases','id'),\n\
        ('taxacc_inquiries','client_id','taxacc_clients','id'),\n('taxacc_inquiries','contact_id','taxacc_contacts','id'),\n\
        ('taxacc_inquiries','assigned_staff_id','taxacc_staff','id'),\n('taxacc_link_tokens','contact_id','taxacc_contacts','id'),\n\
        ('taxacc_link_tokens','created_by','taxacc_staff','id'),\n('taxacc_r91_review_events','batch_id','taxacc_r9_monthly_review_batches','id'),\n\
        ('taxacc_r91_review_events','actor_staff_id','taxacc_staff','id'),\n('taxacc_r9_monthly_review_batches','reviewed_by','taxacc_staff','id'),\n\
        ('taxacc_r9_monthly_review_batches','submitted_by','taxacc_staff','id'),\n('taxacc_r9_monthly_review_batches','template_code','taxacc_document_request_templates','template_code'),\n\
        ('taxacc_r9_monthly_review_items','batch_id','taxacc_r9_monthly_review_batches','id'),\n('taxacc_r9_monthly_review_items','client_id','taxacc_clients','id'),\n\
        ('taxacc_r9_monthly_review_items','duplicate_request_id','taxacc_document_requests','id'),\n('taxacc_r9_monthly_review_items','template_code','taxacc_document_request_templates','template_code'),\n\
        ('taxacc_tasks','assigned_staff_id','taxacc_staff','id'),\n('taxacc_tasks','case_id','taxacc_cases','id'),\n('taxacc_tasks','client_id','taxacc_clients','id');\n\
        DO $r332_meta$\nDECLARE t_count int; c_count int;\nBEGIN\n SELECT count(*) INTO t_count FROM pg_class t JOIN pg_namespace\
        \ n ON n.oid=t.relnamespace WHERE n.nspname='public' AND t.relkind='r' AND t.relname LIKE 'taxacc_%';\n IF t_count\
        \ <> 26 THEN RAISE EXCEPTION 'R332_TABLE_DRIFT: %',t_count; END IF;\n SELECT count(*) INTO c_count FROM pg_constraint\
        \ con WHERE con.conname LIKE 'r332_real_composite_fk_%' AND con.contype='f';\n IF c_count <> 52 THEN RAISE EXCEPTION\
        \ 'R332_COMPOSITE_FK_DRIFT: %',c_count; END IF;\n IF EXISTS(SELECT 1 FROM pg_class t JOIN pg_namespace n ON n.oid=t.relnamespace\
        \ WHERE n.nspname='public' AND t.relkind='r' AND t.relname LIKE 'taxacc_%' AND (NOT t.relrowsecurity OR NOT t.relforcerowsecurity))\
        \ THEN RAISE EXCEPTION 'R332_RLS_DISABLED'; END IF;\n IF EXISTS(SELECT 1 FROM pg_policies WHERE schemaname='public'\
        \ AND tablename LIKE 'taxacc_%') THEN RAISE EXCEPTION 'R332_UNEXPECTED_POLICY'; END IF;\n RAISE NOTICE 'R332_CATALOG_PASS:\
        \ tables=% composite_fk=% rls_force=all policies=zero',t_count,c_count;\nEND $r332_meta$;\nDO $r332_fk_tests$\nDECLARE\
        \ e record; p_a text; p_b text; hits int := 0; updated_n int;\nDECLARE a uuid := 'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa';\n\
        DECLARE b uuid := 'bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb';\nBEGIN\n FOR e IN SELECT * FROM qa_edges ORDER BY child,col,parent\
        \ LOOP\n  EXECUTE format('SELECT %I::text FROM public.%I WHERE office_id=$1',e.pk,e.parent) INTO p_a USING a;\n  EXECUTE\
        \ format('SELECT %I::text FROM public.%I WHERE office_id=$1',e.pk,e.parent) INTO p_b USING b;\n  IF p_a IS NULL OR\
        \ p_b IS NULL OR p_a=p_b THEN RAISE EXCEPTION 'R332_SYNTHETIC_PARENT_MISSING: %.%',e.parent,e.pk; END IF;\n  -- Authorized\
        \ same-office reference must be accepted.\n  EXECUTE format('UPDATE public.%I SET %I=%L WHERE office_id=%L',e.child,e.col,p_a,a);\n\
        \  GET DIAGNOSTICS updated_n=ROW_COUNT;\n  IF updated_n<>1 THEN RAISE EXCEPTION 'R332_VALID_RELATION_REJECTED: %.%',e.child,e.col;\
        \ END IF;\n  hits:=hits+1;\n  -- A child in office A must reject a pointer to a parent in office B.\n  BEGIN\n   EXECUTE\
        \ format('UPDATE public.%I SET %I=%L WHERE office_id=%L',e.child,e.col,p_b,a);\n   RAISE EXCEPTION 'R332_CROSS_OFFICE_ACCEPTED:\
        \ %.%',e.child,e.col;\n  EXCEPTION WHEN foreign_key_violation THEN NULL;\n  END;\n  hits:=hits+1;\n  EXECUTE format('SELECT\
        \ %I::text FROM public.%I WHERE office_id=%L',e.col,e.child,a) INTO p_b;\n  IF p_b IS DISTINCT FROM p_a THEN RAISE\
        \ EXCEPTION 'R332_FAILED_UPDATE_PERSISTED: %.%',e.child,e.col; END IF;\n  hits:=hits+1;\n END LOOP;\n RAISE NOTICE\
        \ 'R332_COMPOSITE_FK_POSITIVE_NEGATIVE_PASS: edges=% checks=%', (SELECT count(*) FROM qa_edges),hits;\nEND $r332_fk_tests$;\n\
        R332_SQL_2_1\n"
    - name: R332 prepare role RLS isolation checks (1/1)
      shell: bash
      run: "set -euo pipefail\ncat > /tmp/03_graph_rls_roles.sql <<'R332_SQL_3_1'\n\\set ON_ERROR_STOP on\nSET ROLE authenticated;\n\
        DO $r332_authenticated$\nDECLARE t text; n bigint; hits int := 0;\nBEGIN\n FOR t IN SELECT tablename FROM pg_tables\
        \ WHERE schemaname='public' AND tablename LIKE 'taxacc_%' ORDER BY tablename LOOP\n  EXECUTE format('SELECT count(*)\
        \ FROM public.%I',t) INTO n;\n  IF n<>0 THEN RAISE EXCEPTION 'R332_AUTH_UNEXPECTED_READ %: %',t,n; END IF;\n  hits:=hits+1;\n\
        \ END LOOP;\n RAISE NOTICE 'R332_AUTHENTICATED_DEFAULT_DENY_PASS checks=%',hits;\nEND $r332_authenticated$;\nRESET\
        \ ROLE;\nSET ROLE anon;\nDO $r332_anon$\nDECLARE t text; n bigint; hits int := 0;\nBEGIN\n FOR t IN SELECT tablename\
        \ FROM pg_tables WHERE schemaname='public' AND tablename LIKE 'taxacc_%' ORDER BY tablename LOOP\n  EXECUTE format('SELECT\
        \ count(*) FROM public.%I',t) INTO n;\n  IF n<>0 THEN RAISE EXCEPTION 'R332_ANON_UNEXPECTED_READ %: %',t,n; END IF;\n\
        \  hits:=hits+1;\n END LOOP;\n RAISE NOTICE 'R332_ANON_DEFAULT_DENY_PASS checks=%',hits;\nEND $r332_anon$;\nRESET\
        \ ROLE;\nSET ROLE qa_bypass_rls;\nDO $r332_bypass$\nDECLARE t text; n bigint; hits int := 0;\nBEGIN\n FOR t IN SELECT\
        \ tablename FROM pg_tables WHERE schemaname='public' AND tablename LIKE 'taxacc_%' ORDER BY tablename LOOP\n  EXECUTE\
        \ format('SELECT count(*) FROM public.%I',t) INTO n;\n  IF n<>2 THEN RAISE EXCEPTION 'R332_BYPASSRLS_THREAT_NOT_REPRODUCED\
        \ %: %',t,n; END IF;\n  hits:=hits+1;\n END LOOP;\n RAISE NOTICE 'R332_BYPASSRLS_THREAT_REPRODUCED checks=%',hits;\n\
        END $r332_bypass$;\nRESET ROLE;\nSELECT 'R332_SYNTHETIC_COMPOSITE_FK_GRAPH_RELEASE_HOLD' AS result;\nR332_SQL_3_1\n"
    - name: R332 execute isolated PG17 graph and prove default-deny and FK boundaries
      shell: bash
      run: "set -euo pipefail\npgid=\"${{ job.services.pg.id }}\"\ntest -n \"$pgid\"\ndocker exec -i \"$pgid\" psql -X -U\
        \ postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE r332_fk_synthetic'\nfor file in 01_graph_schema 02_graph_fk_tests\
        \ 03_graph_rls_roles; do\n docker exec -i \"$pgid\" psql -X -U postgres -d r332_fk_synthetic -v ON_ERROR_STOP=1 <\
        \ \"/tmp/${file}.sql\" > \"/tmp/r332_${file}.log\" 2>&1 || { tail -65 \"/tmp/r332_${file}.log\"; exit 1; }\n grep\
        \ -E 'R332_|RLS|HOLD' \"/tmp/r332_${file}.log\" | tail -7 || true\ndone\n"
