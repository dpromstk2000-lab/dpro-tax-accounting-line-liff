name: DPRO TAX R332 Isolated PG17 Verified FK Tenant Graph and R331 Regression
'on':
  push:
    branches:
    - dpro-tax-r308-auth-tenant-integration-qa-20261020
    paths:
    - .github/workflows/dpro-tax-r332-pg17-real-fk-tenant-graph-isolated-qa.yml
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  r332-fk-graph-isolated:
    if: github.ref == 'refs/heads/dpro-tax-r308-auth-tenant-integration-qa-20261020'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      pg:
        image: postgres:17
        env:
          POSTGRES_DB: r331_synthetic
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: r332_disposable_only
        options: --health-cmd "pg_isready -U postgres -d r331_synthetic" --health-interval 10s --health-timeout 5s --health-retries
          8
    steps:
    - name: Checkout isolated QA branch read-only and ephemeral
      uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Pin and restore R331 402 checks from original CI source
      shell: bash
      run: "set -euo pipefail\npython3 - <<'R332_EXTRACT_PY'\nimport re,hashlib,pathlib\nsource=pathlib.Path('.github/workflows/dpro-tax-r331-pg17-remaining19-policy-candidate-isolated-qa.yml')\n\
        if not source.is_file():raise SystemExit('R331_SOURCE_REQUIRED')\nraw=source.read_bytes()\nif hashlib.sha256(raw).hexdigest()!='564a94632e60f76d228501852298be347fe40fe8af4092026a3ea68478cca4c0':raise\
        \ SystemExit('R331_SOURCE_SHA_DRIFT_HOLD')\ns=raw.decode('utf-8')\nfor idx in range(1,10):\n label=f'R331_{idx:02}'\n\
        \ pattern=r\"^        cat > /tmp/([^\\n ]+) <<'\"+label+r\"'\\n(.*?)^        \"+label+r\"[ \\t]*$\"\n m=re.search(pattern,s,re.M|re.S)\n\
        \ if not m:raise SystemExit('R331_SCRIPT_EXTRACTION_FAILED_'+label)\n content='\\n'.join(line[8:] if line.startswith('\
        \        ') else line for line in m.group(2).split('\\n'))\n if not content.lstrip().startswith('\\\\set ON_ERROR_STOP\
        \ on'):raise SystemExit('R331_PSQL_FAIL_CLOSED_MISSING_'+label)\n output=pathlib.Path('/tmp')/m.group(1)\n if output.name!=f'{idx:02}_'+['core_schema','core_fixtures','core_assertions','r331_extension','r331_fixtures','r331_catalog','r331_roles_a','r331_roles_b','r331_revocation'][idx-1]+'.sql':raise\
        \ SystemExit('R331_SCRIPT_FILENAME_INVALID')\n output.write_text(content)\nprint('R332_R331_PINNED_SOURCE_RESTORED:\
        \ nine_sql_scripts=true')\nR332_EXTRACT_PY"
    - name: 'R331 regression: 104 plus 298 PostgreSQL checks (prior run pinned)'
      shell: bash
      run: "set -euo pipefail\npgid=\"${{ job.services.pg.id }}\"\ntest -n \"$pgid\"\nfor name in 01_core_schema 02_core_fixtures\
        \ 03_core_assertions 04_r331_extension 05_r331_fixtures 06_r331_catalog 07_r331_roles_a 08_r331_roles_b 09_r331_revocation;\
        \ do\n docker exec -i \"$pgid\" psql -X -U postgres -d r331_synthetic -v ON_ERROR_STOP=1 < \"/tmp/${name}.sql\" >\
        \ \"/tmp/r332_${name}.log\" 2>&1 || { tail -40 \"/tmp/r332_${name}.log\"; exit 1; }\n echo \"R332_R331_REGRESSION_PASS\
        \ $name\"\ndone\n"
    - name: R332 build 26-table synthetic FK graph (1/2)
