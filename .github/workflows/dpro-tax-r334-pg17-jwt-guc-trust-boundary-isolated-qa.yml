        SELECT public.r330_assert('r334-uid-decoder-trusts-unverified-GUC',(\n SELECT (qa_private.r330_uid()='00000005-0005-4005-8005-000000000005'::uuid)::int)::bigint,1);\n\
        -- Switch principal within the SAME SQL transaction; RLS follows untrusted GUC!\nSET LOCAL request.jwt.claim.sub='00000001-0001-4001-8001-000000000001';\n\
        SELECT public.r330_assert('r334-same-transaction-spoof-A-impersonated',(SELECT count(*) FROM public.taxacc_clients)::bigint,3);\n\
        COMMIT;\nBEGIN;\nSELECT public.r330_assert('r334-spoofed-local-GUC-cleared',(SELECT count(*) FROM public.taxacc_clients)::bigint,0);\n\
        COMMIT;\n-- Anti-pattern: session-scoped SET survives COMMIT and can influence subsequent request.\nSET request.jwt.claim.sub='00000005-0005-4005-8005-000000000005';\n\
        BEGIN;\nSELECT public.r330_assert('r334-session-set-visible',(SELECT count(*) FROM public.taxacc_clients)::bigint,1);\n\
        COMMIT;\nBEGIN;\nSELECT public.r330_assert('r334-session-set-still-present-next-tx',(SELECT count(*) FROM public.taxacc_clients)::bigint,1);\n\
        COMMIT;\nRESET request.jwt.claim.sub;\nBEGIN;\nSELECT public.r330_assert('r334-session-GUC-reset-denies',(SELECT count(*)\
        \ FROM public.taxacc_clients)::bigint,0);\nCOMMIT;\nRESET ROLE;\n-- Anonymous role cannot read even with injected\
        \ sub.\nSET ROLE anon;\nBEGIN;\nSET LOCAL request.jwt.claim.sub='00000001-0001-4001-8001-000000000001';\nDO $r334_anon$\
        \ BEGIN\n BEGIN\n  PERFORM count(*) FROM public.taxacc_clients;\n  RAISE EXCEPTION 'R334_UNSAFE_ANON_READ';\n EXCEPTION\
        \ WHEN insufficient_privilege THEN\n  RAISE NOTICE 'R334_PASS: anonymous claim spoof blocked by explicit SQL GRANT\
        \ barrier';\n END;\nEND $r334_anon$;\nCOMMIT;\nRESET ROLE;\n-- Invariant: DB helper has no JWT signature verifier;\
        \ immutable role claims MUST come\n-- from a signature-validating app/request boundary, not an untrusted SQL SET.\n\
        SELECT public.r333_gate();\nSELECT 'R334_SYNTHETIC_GUC_SPOOFABILITY_PROVED_APPLICATION_TRUST_GATE_REQUIRED__COMMERCIAL_HOLD'\
        \ AS result;\nR334_SQL\n"
