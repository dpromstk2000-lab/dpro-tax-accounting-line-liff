        const r=await fetch(''http://127.0.0.1:3000/r335_clients?select=id'',{headers:{authorization:''Bearer ''+jwt,accept:''application/json''},signal:AbortSignal.timeout(4500)});assert.equal(r.status,200);const
        rows=await r.json();assert.deepEqual(rows,[]);console.log(JSON.stringify({suite:''R335_REAL_POSTGREST_REVOCATION'',checks:2,identical_identity_can_no_longer_read:true,revocation_seen_next_request:true,commercial_release:''HOLD''}));

