        \ \\\n -e PGRST_DB_SCHEMAS='public' \\\n -e PGRST_DB_ANON_ROLE='anon' \\\n -e PGRST_JWT_SECRET='R335_SYNTHETIC_JWT_SIGNING_KEY_NOT_REAL_1234567890'\
