    - name: R335 create actual JWT-to-PostgREST-to-RLS HTTP tests (synthetic tokens only)
      shell: bash
      run: "set -euo pipefail\ncat > /tmp/r335_real_http.mjs <<'R335_HTTP'\nimport assert from 'node:assert/strict';\nimport\
        \ {createHmac} from 'node:crypto';\n\nconst BASE='http://127.0.0.1:3000';\nconst SECRET='R335_SYNTHETIC_JWT_SIGNING_KEY_NOT_REAL_1234567890';\n\
        const U={ownerA:'00000001-0001-4001-8001-000000000001',staffA:'00000002-0002-4002-8002-000000000002',ownerB:'00000003-0003-4003-8003-000000000003',disabled:'00000004-0004-4004-8004-000000000004',outsider:'00000005-0005-4005-8005-000000000005'};\n\
        const A='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',B='bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb';\nconst enc=obj=>Buffer.from(JSON.stringify(obj)).toString('base64url');\n\
        function token(sub,extra={},key=SECRET){\n const header=enc({alg:'HS256',typ:'JWT'});\n const payload=enc({sub,role:'authenticated',iat:Math.floor(Date.now()/1000)-10,exp:Math.floor(Date.now()/1000)+3600,...extra});\n\
        \ return [header,payload,createHmac('sha256',key).update(header+'.'+payload).digest('base64url')].join('.');\n}\n\
        const tok={ownerA:token(U.ownerA),staffA:token(U.staffA),ownerB:token(U.ownerB),disabled:token(U.disabled),outsider:token(U.outsider),wrongKey:token(U.ownerA,{},'WRONG_SYNTHETIC_SECRET_123456789012345'),expired:token(U.ownerA,{exp:Math.floor(Date.now()/1000)-3600}),invalidRole:token(U.ownerA,{role:'service_role'}),fakeOffice:token(U.ownerA,{office_id:B})};\n\
        let checks=0;\nfunction check(name,actual,expect){assert.deepEqual(actual,expect,name);checks++;}\nasync function\
        \ req(jwt,path='/r335_clients?select=id,office_id,title&order=id.asc',init={}){\n const h={'accept':'application/json',...(jwt?{authorization:'Bearer\
        \ '+jwt}:{}),...(init.headers||{})};\n const res=await fetch(BASE+path,{method:init.method||'GET',headers:h,body:init.body,redirect:'manual',signal:AbortSignal.timeout(4500)});\n\
        \ const content=await res.text();let body;try{body=JSON.parse(content)}catch{body={raw:content.slice(0,150)}}\n\
        \ return {status:res.status,body,headers:res.headers};\n}\nfunction ids(r){return r.body.map(x=>x.id)}\nfunction\
        \ allowStatus(label,r,statuses){assert.ok(statuses.includes(r.status),`${label}: expected ${statuses}, got ${r.status}\
        \ ${JSON.stringify(r.body).slice(0,300)}`);checks++}\nfunction visible(name,r,expected){check(name+'-status',r.status,200);assert.ok(Array.isArray(r.body),name+'\
        \ response array');check(name+'-visible-ids',ids(r),expected);checks++;}\nconst idA1='20000000-0000-4000-8000-000000000001',idA2='20000000-0000-4000-8000-000000000002',idB='20000000-0000-4000-8000-000000000003';\n\
        // Probe actual PostgREST before tests. Non-200 responses on the data table from anon are expected.\nlet healthy=false;\n\
        for(let i=0;i<40;i++){\n try{const r=await req(tok.ownerA,'/r335_claim_probe?select=verified_sub,legacy_sub,db_role');if(r.status===200&&Array.isArray(r.body)&&r.body.length===1){healthy=true;break}}\n\
        \ catch{}\n await new Promise(resolve=>setTimeout(resolve,500));\n}\nassert.ok(healthy,'PostgREST real server not\
        \ initialized within 20s');\nconst probe=await req(tok.ownerA,'/r335_claim_probe?select=verified_sub,legacy_sub,db_role');\n\
        check('signed-claims-sub',probe.body[0].verified_sub,U.ownerA);\ncheck('signed-claims-role',probe.body[0].db_role,'authenticated');\n\
        // Old per-claim GUC is not JWT trust proof; require JSON claims from the actual PostgREST server.\nconsole.log('R335_POSTGREST_CLAIM_SOURCE',JSON.stringify({claims_sub_matches:true,legacy_sub:probe.body[0].legacy_sub}));\n\
        visible('owner-A',await req(tok.ownerA),[idA1,idA2]);\nvisible('staff-A',await req(tok.staffA),[idA1]);\nvisible('owner-B',await\
        \ req(tok.ownerB),[idB]);\nvisible('disabled-staff',await req(tok.disabled),[]);\nvisible('non-member',await req(tok.outsider),[]);\n\
        visible('forged-office-claim-still-owner-A',await req(tok.fakeOffice),[idA1,idA2]);\nvisible('filter-other-office-denied',await\
        \ req(tok.ownerA,'/r335_clients?select=id,office_id,title&office_id=eq.'+B+'&order=id.asc'),[]);\nvisible('filter-other-office-denied-staff',await\
        \ req(tok.staffA,'/r335_clients?select=id,office_id,title&office_id=eq.'+B+'&order=id.asc'),[]);\nfor(const [label,jwt]\
        \ of [['missing-token',null],['wrong-hmac',tok.wrongKey],['expired',tok.expired],['role-no-db-grant',tok.invalidRole]]){\n\
        \ const r=await req(jwt);allowStatus(label,r,[401,403]);\n if(r.status===200)throw Error('R335_INVALID_JWT_ACCEPTED_'+label);\n\
        }\nconst [h,p,s]=tok.ownerA.split('.');const forgedPayload=enc({...JSON.parse(Buffer.from(p,'base64url').toString()),sub:U.ownerB});\n\
        allowStatus('jwt-payload-bitflip-with-old-signature',await req([h,forgedPayload,s].join('.')),[401,403]);\nconst\
        \ noAlg=enc({typ:'JWT',alg:'none'})+'.'+enc({sub:U.ownerA,role:'authenticated',exp:Math.floor(Date.now()/1000)+1000})+'.';\n\
        allowStatus('algorithm-none-denied',await req(noAlg),[401,403]);\nconst spoofHeaders={'request.jwt.claim.sub':U.ownerB,'x-office-id':B,'x-user-id':U.ownerB};\n\
        visible('fake-http-headers-cannot-change-identity',await req(tok.ownerA,undefined,{headers:spoofHeaders}),[idA1,idA2]);\n\
        for(const [label,method,body] of [['insert','POST',JSON.stringify({office_id:A,assigned_staff_id:'10000000-0000-4000-8000-000000000001',title:'synthetic\
        \ mutation'})],['update','PATCH',JSON.stringify({title:'changed'})],['delete','DELETE',null]]){\n const r=await\
        \ req(tok.ownerA,'/r335_clients?id=eq.'+idA1,{method,body,headers:{'content-type':'application/json'}});\n allowStatus('deny-'+label,r,[401,403,405]);\n\
        }\nvisible('no-writes-after-denial',await req(tok.ownerA),[idA1,idA2]);\nconst perms=[['ownerA',tok.ownerA,[idA1,idA2]],['ownerB',tok.ownerB,[idB]],['staffA',tok.staffA,[idA1]],['disabled',tok.disabled,[]]];\n\
        const all=await Promise.all(Array.from({length:24},async(_,i)=>{const [name,jwt,expect]=perms[i%4];return {name,expect,result:await\
        \ req(jwt)}}));\nfor(let i=0;i<all.length;i++)visible('parallel-'+i+'-'+all[i].name,all[i].result,all[i].expect);\n\
        check('parallel-requests',all.length,24);\n// Log a machine-readable pass attestation. Subsequent revocation verification\
        \ runs after SQL mutation.\nconsole.log(JSON.stringify({suite:'DPRO_TAX_R335_REAL_POSTGREST_V12_SYNTHETIC_JWT_PG17_RLS',phase:'pre_revocation',checks,parallel:24,real_postgrest:true,synthetic_jwt:true,synthetic_postgres:true,real_supabase:false,commercial_release:'HOLD'}));\n\
        R335_HTTP\nnode --check /tmp/r335_real_http.mjs\n"
    - name: R335 verify signed HTTP JWT, tenant RLS, negative auth and 24 parallel requests
