        \ THEN\n RAISE EXCEPTION 'R338_FINAL_RLS_MISSING'; END IF;\n RAISE NOTICE 'R338_FINAL_LOCKDOWN_PASS: no_authenticated_reference_grants,\
        \ 2xRLS_FORCE';\nEND $r338_revoke$;\nR338_3\ncat > /tmp/r338_reference_table_http.test.mjs <<'R338_4'\nimport assert\
        \ from 'node:assert/strict';\nimport {createHmac} from 'node:crypto';\n// R338 uses only localhost real PostgREST\
        \ and disposable PostgreSQL, no live secrets.\nconst phase=process.env.R338_PHASE;\nassert.ok(['locked','accidental_grant','restored'].includes(phase),'R338\
        \ invalid stage');\nconst BASE='http://127.0.0.1:3000';\nconst SECRET='R335_SYNTHETIC_JWT_SIGNING_KEY_NOT_REAL_1234567890';\n\
        const encode=o=>Buffer.from(JSON.stringify(o)).toString('base64url');\nfunction signed(sub){\n const a=encode({alg:'HS256',typ:'JWT'}),b=encode({sub,role:'authenticated',exp:4102444800});\n\
        \ return a+'.'+b+'.'+createHmac('sha256',SECRET).update(a+'.'+b).digest('base64url');\n}\nconst jwt={staffA:signed('00000002-0002-4002-8002-000000000002'),ownerB:signed('00000003-0003-4003-8003-000000000003')};\n\
        const id=n=>'20000000-0000-4000-8000-'+String(n).padStart(12,'0');\nconst expected={staffA:[1,4,5,6].map(id),ownerB:[3,7,8].map(id)};\n\
        let checks=0;function eq(label,actual,expect){assert.deepEqual(actual,expect,`${phase} ${label}`);checks++}\nfunction\
        \ ok(label,flag){assert.ok(flag,`${phase} ${label}`);checks++}\nasync function get(resource,token,method='GET',path=''){\n\
        \ const response=await fetch(`${BASE}/${resource}${path}`,{method,redirect:'manual',headers:{accept:'application/json',prefer:'count=exact',...(token?{authorization:'Bearer\
        \ '+token}:{})},signal:AbortSignal.timeout(6000)});\n const raw=await response.text();let data=null;\n if(method!=='HEAD'){try{data=JSON.parse(raw)}catch{throw\
        \ Error('R338_NONJSON_RESPONSE_'+resource+'_'+response.status)}}\n return {status:response.status,raw,data,range:response.headers.get('content-range')};\n\
        }\nfor(const [actor,token] of Object.entries(jwt)){\n // Hardening MUST NOT break the legitimate client API, including\
        \ tenant filter and row counts.\n const r=await get('r335_clients',token,'GET','?select=id&order=id.asc');\n eq(actor+'-visible-still-200',r.status,200);\n\
        \ eq(actor+'-client-ids',r.data.map(x=>x.id),expected[actor]);\n eq(actor+'-count',Number(r.range?.match(/\\/(\\d+)$/)?.[1]),expected[actor].length);\n\
        \ for(const resource of ['r335_staff','r335_offices']){\n  for(const method of ['GET','HEAD']){\n   const response=await\
        \ get(resource,token,method,'?select=*');\n   if(phase==='accidental_grant'){\n    eq(actor+'-'+resource+'-'+method+'-RLS-200',response.status,200);\n\
        \    if(method==='GET')eq(actor+'-'+resource+'-'+method+'-empty',response.data,[]);\n    else eq(actor+'-'+resource+'-head-no-body',response.raw,'');\n\
        \    eq(actor+'-'+resource+'-'+method+'-no-hidden-total',Number(response.range?.match(/\\/(\\d+)$/)?.[1]),0);\n  \
        \ }else{\n    ok(actor+'-'+resource+'-'+method+'-no-grant',response.status===401||response.status===403);\n    if(method==='HEAD')eq(actor+'-'+resource+'-head-no-body',response.raw,'');\n\
        \   }\n  }\n }\n}\nfor(const resource of ['r335_staff','r335_offices']){\n const anon=await get(resource,null,'GET','?select=*');\n\
        \ ok('anon-'+resource+'-denied',anon.status===401||anon.status===403);\n}\n// PostgREST exposed schema must never\
        \ provide direct RPC to private security definer.\nfor(const [actor,token] of Object.entries(jwt)){\n const r=await\
        \ get('rpc/may_read_client',token,'GET','?p_office=eq.aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa');\n ok(actor+'-private-rpc-not-routable',r.status===404||r.status===401||r.status===403||r.status===406);\n\
        }\nconsole.log(JSON.stringify({suite:'DPRO_TAX_R338_REFERENCE_TABLE_DEFENSE_IN_DEPTH_REAL_POSTGREST',phase,checks,real_postgrest_v12:process.env.R338_LOCAL_MOCK!=='true',local_mock:process.env.R338_LOCAL_MOCK==='true',ephemeral_pg17:process.env.R338_LOCAL_MOCK!=='true',synthetic_jwt:true,real_supabase:false,production_mutations:false,commercial_release:'HOLD'}));\n\
        R338_4\nnode --check /tmp/r338_reference_table_http.test.mjs\n"
