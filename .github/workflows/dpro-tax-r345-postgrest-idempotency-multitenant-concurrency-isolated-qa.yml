    - name: R342 create isolated NOLOGIN DB RPC executor and scoped atomic document-request function
      shell: bash
      run: "set -euo pipefail\ncat > /tmp/r342_scoped_rpc.sql <<'R342_SQL'\n\\set ON_ERROR_STOP on\n-- Everything below is\
        \ exclusively for disposable PostgreSQL 17 QA; no production DDL.\n-- A NOLOGIN, non-BYPASSRLS function owner limits\
        \ RPC escalation compared with postgres ownership.\nCREATE ROLE r342_executor NOLOGIN NOINHERIT;\nGRANT USAGE ON SCHEMA\
        \ public TO r342_executor;\nGRANT SELECT ON public.r335_staff,public.r335_offices,public.r335_clients TO r342_executor;\n\
        -- Internal read policies ONLY for the non-login executor. External user roles cannot assume it.\nCREATE POLICY r342_executor_staff_internal_read\
        \ ON public.r335_staff FOR SELECT TO r342_executor USING (true);\nCREATE POLICY r342_executor_office_internal_read\
        \ ON public.r335_offices FOR SELECT TO r342_executor USING (true);\nCREATE POLICY r342_executor_client_internal_read\
        \ ON public.r335_clients FOR SELECT TO r342_executor USING (true);\nCREATE UNIQUE INDEX r342_client_office_id_unique\
        \ ON public.r335_clients(office_id,id);\nCREATE TABLE public.r342_requests(\n id uuid PRIMARY KEY DEFAULT gen_random_uuid(),\n\
        \ office_id uuid NOT NULL,\n client_id uuid NOT NULL,\n actor_auth_id uuid NOT NULL,\n request_key text NOT NULL CHECK\
        \ (request_key ~ '^[A-Za-z0-9_-]{12,64}$'),\n status text NOT NULL DEFAULT 'requested' CHECK (status='requested'),\n\
        \ created_at timestamptz NOT NULL DEFAULT clock_timestamp(),\n UNIQUE(office_id,actor_auth_id,request_key),\n UNIQUE(office_id,id),\n\
        \ FOREIGN KEY (office_id,client_id) REFERENCES public.r335_clients(office_id,id) ON DELETE RESTRICT\n);\nCREATE TABLE\
        \ public.r342_audit(\n id uuid PRIMARY KEY DEFAULT gen_random_uuid(),\n office_id uuid NOT NULL,\n request_id uuid\
        \ NOT NULL,\n actor_auth_id uuid NOT NULL,\n action text NOT NULL CHECK (action='request_created'),\n created_at timestamptz\
        \ NOT NULL DEFAULT clock_timestamp(),\n FOREIGN KEY (office_id,request_id) REFERENCES public.r342_requests(office_id,id)\
        \ ON DELETE RESTRICT,\n UNIQUE(request_id,action)\n);\nALTER TABLE public.r342_requests ENABLE ROW LEVEL SECURITY;\n\
        ALTER TABLE public.r342_requests FORCE ROW LEVEL SECURITY;\nALTER TABLE public.r342_audit ENABLE ROW LEVEL SECURITY;\n\
        ALTER TABLE public.r342_audit FORCE ROW LEVEL SECURITY;\nREVOKE ALL ON public.r342_requests,public.r342_audit FROM\
        \ PUBLIC,anon,authenticated;\nGRANT SELECT,INSERT ON public.r342_requests,public.r342_audit TO r342_executor;\nCREATE\
        \ POLICY r342_executor_requests_read ON public.r342_requests FOR SELECT TO r342_executor USING (true);\nCREATE POLICY\
        \ r342_executor_requests_write ON public.r342_requests FOR INSERT TO r342_executor WITH CHECK (true);\nCREATE POLICY\
        \ r342_executor_audit_read ON public.r342_audit FOR SELECT TO r342_executor USING (true);\nCREATE POLICY r342_executor_audit_write\
        \ ON public.r342_audit FOR INSERT TO r342_executor WITH CHECK (true);\n\nCREATE FUNCTION public.r342_create_request(p_office\
        \ uuid,p_client uuid,p_key text)\nRETURNS jsonb LANGUAGE plpgsql VOLATILE SECURITY DEFINER SET search_path=pg_catalog\n\
        AS $r342_rpc$\nDECLARE\n v_claims jsonb; v_sub text; v_actor uuid; v_assignee uuid;\n v_allowed boolean; v_id uuid;\
        \ v_existing_client uuid; v_new boolean;\nBEGIN\n -- In live PostgREST, only PostgREST's JWT verifier sets these claims.\
        \ SQL GUC spoofing remains a distinct threat.\n v_claims:=nullif(current_setting('request.jwt.claims',true),'')::jsonb;\n\
        \ v_sub:=v_claims->>'sub';\n IF (v_claims->>'role') IS DISTINCT FROM 'authenticated'\n    OR v_sub IS NULL OR v_sub\
        \ !~* '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'\n THEN RAISE EXCEPTION 'R342_ACCESS_DENIED'\
        \ USING ERRCODE='42501'; END IF;\n IF p_office IS NULL OR p_client IS NULL OR p_key IS NULL OR p_key !~ '^[A-Za-z0-9_-]{12,64}$'\n\
        \ THEN RAISE EXCEPTION 'R342_INVALID_REQUEST' USING ERRCODE='22023'; END IF;\n v_actor:=v_sub::uuid;\n SELECT c.assigned_staff_id\
        \ INTO v_assignee\n FROM public.r335_clients c WHERE c.office_id=p_office AND c.id=p_client;\n IF NOT FOUND THEN RAISE\
        \ EXCEPTION 'R342_ACCESS_DENIED' USING ERRCODE='42501'; END IF;\n SELECT EXISTS(\n  SELECT 1 FROM public.r335_staff\
        \ s JOIN public.r335_offices o ON o.id=s.office_id\n  WHERE s.auth_user_id=v_actor AND s.office_id=p_office AND s.is_active\
        \ AND o.is_active\n    AND (s.role IN ('owner','admin') OR s.can_view_all_clients OR s.id=v_assignee)\n ) INTO v_allowed;\n\
        \ IF NOT v_allowed THEN RAISE EXCEPTION 'R342_ACCESS_DENIED' USING ERRCODE='42501'; END IF;\n -- Atomic and idempotent:\
        \ one creation + one audit row per (office,actor,key).\n INSERT INTO public.r342_requests(office_id,client_id,actor_auth_id,request_key)\n\
        \ VALUES(p_office,p_client,v_actor,p_key)\n ON CONFLICT(office_id,actor_auth_id,request_key) DO NOTHING\n RETURNING\
        \ id INTO v_id;\n v_new := v_id IS NOT NULL;\n IF NOT v_new THEN\n  SELECT id,client_id INTO v_id,v_existing_client\n\
        \  FROM public.r342_requests\n  WHERE office_id=p_office AND actor_auth_id=v_actor AND request_key=p_key;\n  IF v_id\
        \ IS NULL THEN RAISE EXCEPTION 'R342_RETRY_CONFLICT' USING ERRCODE='40001'; END IF;\n  IF v_existing_client<>p_client\
        \ THEN\n   RAISE EXCEPTION 'R342_IDEMPOTENCY_KEY_REUSE_FOR_DIFFERENT_CLIENT' USING ERRCODE='22023';\n  END IF;\n ELSE\n\
        \  INSERT INTO public.r342_audit(office_id,request_id,actor_auth_id,action)\n  VALUES(p_office,v_id,v_actor,'request_created');\n\
        \ END IF;\n RETURN jsonb_build_object('id',v_id,'created',v_new,'status','requested');\nEND;\n$r342_rpc$;\nALTER FUNCTION\
        \ public.r342_create_request(uuid,uuid,text) OWNER TO r342_executor;\nREVOKE ALL ON FUNCTION public.r342_create_request(uuid,uuid,text)\
        \ FROM PUBLIC,anon;\nGRANT EXECUTE ON FUNCTION public.r342_create_request(uuid,uuid,text) TO authenticated;\n-- Re-enable\
        \ office B only after ALL earlier R335-R341 tests completed (synthetic only).\nUPDATE public.r335_offices SET is_active=true\
        \ WHERE id='bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb'::uuid;\nDO $r342_guard$ DECLARE n int; BEGIN\n IF (SELECT rolbypassrls\
        \ OR rolcanlogin FROM pg_roles WHERE rolname='r342_executor') IS DISTINCT FROM false\n THEN RAISE EXCEPTION 'R342_EXECUTOR_ROLE_PRIVILEGES_UNSAFE';\
        \ END IF;\n IF has_table_privilege('authenticated','public.r342_requests','SELECT') OR\n    has_table_privilege('authenticated','public.r342_requests','INSERT')\
        \ OR\n    has_table_privilege('authenticated','public.r342_audit','SELECT') OR\n    has_table_privilege('anon','public.r342_requests','SELECT')\n\
        \ THEN RAISE EXCEPTION 'R342_DIRECT_DATA_GRANT'; END IF;\n IF (SELECT count(*) FROM pg_class WHERE oid IN ('public.r342_requests'::regclass,'public.r342_audit'::regclass)\n\
        \      AND relrowsecurity AND relforcerowsecurity)<>2 THEN RAISE EXCEPTION 'R342_FORCE_RLS_MISSING'; END IF;\n IF\
        \ (SELECT count(*) FROM public.r342_requests)<>0 OR (SELECT count(*) FROM public.r342_audit)<>0\n THEN RAISE EXCEPTION\
        \ 'R342_NONEMPTY_START'; END IF;\n IF (SELECT count(*) FROM pg_proc WHERE proname='r342_create_request' AND prosecdef)<>1\n\
        \ THEN RAISE EXCEPTION 'R342_DEFINER_MISSING'; END IF;\n RAISE NOTICE 'R342_SYNTHETIC_RESTRICTED_EXECUTOR_READY: NOLOGIN\
        \ no BYPASSRLS, direct table grants zero';\nEND $r342_guard$;\nR342_SQL\npgid=\"${{ job.services.pg.id }}\"\ntest\
        \ -n \"$pgid\"\ndocker exec -i \"$pgid\" psql -X -U postgres -d r331_synthetic -v ON_ERROR_STOP=1 < /tmp/r342_scoped_rpc.sql\n\
        docker restart r335-postgrest >/dev/null\n"
