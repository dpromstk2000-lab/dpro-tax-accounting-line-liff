    - name: R345 write exact 64-request concurrent multi-tenant JWT HTTP verifier
      shell: bash
      run: "set -euo pipefail\ncat >/tmp/r345_http.mjs <<'R345_HTTP'\nimport assert from 'node:assert/strict';\nimport {createHmac}\
        \ from 'node:crypto';\nconst HOST='http://127.0.0.1:3000';\nconst SECRET='R335_SYNTHETIC_JWT_SIGNING_KEY_NOT_REAL_1234567890';\n\
        const key='R345_MULTITENANT_COMMON_KEY_000001';\nconst actor={\n A:{sub:'00000002-0002-4002-8002-000000000002',office:'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',client:'20000000-0000-4000-8000-000000000004'},\n\
        \ B:{sub:'00000003-0003-4003-8003-000000000003',office:'bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb',client:'20000000-0000-4000-8000-000000000003'}\n\
        };\nlet checks=0;\nconst eq=(tag,a,b)=>{assert.deepEqual(a,b,tag);checks++};\nconst ok=(tag,x)=>{assert.ok(x,tag);checks++};\n\
        const enc=x=>Buffer.from(JSON.stringify(x)).toString('base64url');\nfunction jwt(sub,extras={}){const h=enc({alg:'HS256',typ:'JWT'}),p=enc({sub,role:'authenticated',exp:Math.floor(Date.now()/1000)+3600,...extras});return\
        \ [h,p,createHmac('sha256',SECRET).update(h+'.'+p).digest('base64url')].join('.')}\nasync function rpc(name,overrides={}){\n\
        \ const a=actor[name]; const payload={p_office:a.office,p_client:a.client,p_key:key,...overrides};\n const response=await\
        \ fetch(HOST+'/rpc/r342_create_request',{method:'POST',headers:{authorization:'Bearer '+jwt(a.sub),'content-type':'application/json',accept:'application/json'},body:JSON.stringify(payload),signal:AbortSignal.timeout(14000)});\n\
        \ const raw=await response.text(); let body;try{body=raw?JSON.parse(raw):null}catch{throw Error('R345_NON_JSON_REPLY_'+response.status+'_'+raw.slice(0,200))};\
        \ return {status:response.status,body};\n}\n// Both offices use *exactly* the same key simultaneously, without cross-tenant\
        \ collision.\nconst runs=await Promise.all(['A','B'].flatMap(name=>Array.from({length:32},()=>rpc(name).then(r=>({name,...r})))));\n\
        for(let i=0;i<runs.length;i++){\n const r=runs[i];eq('race-http-'+i,r.status,200);eq('race-state-'+i,r.body?.status,'requested');ok('race-uuid-'+i,/^[0-9a-f-]{36}$/i.test(r.body?.id??''));\n\
        }\nconst ids={};\nfor(const name of ['A','B']){\n const subset=runs.filter(r=>r.name===name);eq(name+'-32-requests',subset.length,32);\n\
        \ eq(name+'-one-winner',subset.filter(r=>r.body?.created===true).length,1);\n eq(name+'-all-same-id',new Set(subset.map(r=>r.body.id)).size,1);\n\
        \ ids[name]=subset[0].body.id;\n}\nok('no-cross-office-uuid-alias',ids.A!==ids.B);\n// Replay both keys while the\
        \ other tenant is active; no extra insert or audit row.\nconst again=await Promise.all(['A','B'].flatMap(name=>Array.from({length:8},()=>rpc(name).then(r=>({name,...r})))));\n\
        for(let i=0;i<again.length;i++){\n const r=again[i];eq('replay-status-'+i,r.status,200);eq('replay-not-new-'+i,r.body?.created,false);eq('replay-identity-'+i,r.body?.id,ids[r.name]);\n\
        }\n// A reused key with a DIFFERENT client must never silently return or retarget the existing request.\nconst mismatch=await\
        \ Promise.all(Array.from({length:16},()=>rpc('A',{p_client:'20000000-0000-4000-8000-000000000005'})));\nfor(let i=0;i<mismatch.length;i++){\n\
        \ const r=mismatch[i];eq('mismatch-http-'+i,r.status,400);eq('mismatch-sqlstate-'+i,r.body?.code,'22023');eq('mismatch-reason-'+i,r.body?.message,'R342_IDEMPOTENCY_KEY_REUSE_FOR_DIFFERENT_CLIENT');ok('mismatch-no-created-id-'+i,!r.body?.id);\n\
        }\n// Cross-tenant request body tampering is denied EVEN with a legitimate token.\nconst x=await Promise.all(Array.from({length:16},(_,i)=>i%2?rpc('A',{p_office:actor.B.office,p_client:actor.B.client}):rpc('B',{p_office:actor.A.office,p_client:actor.A.client})));\n\
        for(let i=0;i<x.length;i++){eq('cross-tenant-status-'+i,x[i].status,403);eq('cross-tenant-code-'+i,x[i].body?.code,'42501');ok('cross-tenant-no-id-'+i,!x[i].body?.id)}\n\
        console.log(JSON.stringify({suite:'R345_REAL_POSTGREST_MULTITENANT_IDEMPOTENCY_CONFLICT_CONCURRENCY',checks,race_requests:64,replays:16,wrong_client_retries:16,cross_tenant_spoofs:16,created_per_tenant:1,artificial_only:true,real_supabase:false,release:'HOLD'}));\n\
        R345_HTTP\nnode --check /tmp/r345_http.mjs\n"
