        \ FROM pg_class c WHERE c.relnamespace='public'::regnamespace\n AND c.relkind='r' AND c.relname LIKE 'taxacc\\_%'\
        \ ESCAPE '\\' AND has_table_privilege('anon',c.oid,'SELECT'))::bigint,0);\nSELECT public.r330_assert('r334-21-readonly-policies',(\n\
        \ SELECT count(*) FROM pg_policies WHERE schemaname='public' AND cmd='SELECT' AND tablename LIKE 'taxacc\\_%' ESCAPE\
        \ '\\')::bigint,21);\nSELECT public.r330_assert('r334-authenticated-nobypassrls',(\n SELECT rolbypassrls::int FROM\
        \ pg_roles WHERE rolname='authenticated')::bigint,0);\n-- Four SECURITY DEFINER helpers hard pin search_path to pg_catalog.\
        \ Only synthetic functions.\nSELECT public.r330_assert('r334-definer-functions-fixed-searchpath',(\n SELECT count(*)\
        \ FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace\n WHERE n.nspname='qa_private' AND p.prosecdef AND 'search_path=pg_catalog'=ANY(p.proconfig))::bigint,4);\n\
        -- Verify legitimate, baseline tenant-local reads before deliberately spoofing sub.\nSET ROLE authenticated;\nBEGIN;\n\
        SET LOCAL request.jwt.claim.sub='00000001-0001-4001-8001-000000000001';\nSELECT public.r330_assert('r334-baseline-owner-A-three',(SELECT\
        \ count(*) FROM public.taxacc_clients)::bigint,3);\nSELECT public.r330_assert('r334-baseline-owner-A-cannot-see-B',(SELECT\
        \ count(*) FROM public.taxacc_clients WHERE office_id='bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb')::bigint,0);\nCOMMIT;\n\
        -- No claim should leak beyond COMMIT with SET LOCAL.\nBEGIN;\nSELECT public.r330_assert('r334-local-sub-cleared-after-commit',(SELECT\
        \ count(*) FROM public.taxacc_clients)::bigint,0);\nCOMMIT;\n-- ATTACK EMULATION: assuming untrusted SQL execution\
        \ as the `authenticated` role,\n-- an arbitrary SET LOCAL claim changes the RLS principal. This is a known trust boundary.\n\
        -- DO NOT interpret this as proof that the actual PostgREST API allows arbitrary SET.\nBEGIN;\nSET LOCAL request.jwt.claim.sub='00000005-0005-4005-8005-000000000005';\n\
        SELECT public.r330_assert('r334-sql-claim-spoof-B-impersonated',(SELECT count(*) FROM public.taxacc_clients)::bigint,1);\n\
        SELECT public.r330_assert('r334-sql-claim-spoof-B-no-office-A',(SELECT count(*) FROM public.taxacc_clients WHERE office_id='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa')::bigint,0);\n\
        SELECT public.r330_assert('r334-uid-decoder-trusts-unverified-GUC',(\n SELECT (qa_private.r330_uid()='00000005-0005-4005-8005-000000000005'::uuid)::int)::bigint,1);\n\
        -- Switch principal within the SAME SQL transaction; RLS follows untrusted GUC!\nSET LOCAL request.jwt.claim.sub='00000001-0001-4001-8001-000000000001';\n\
        SELECT public.r330_assert('r334-same-transaction-spoof-A-impersonated',(SELECT count(*) FROM public.taxacc_clients)::bigint,3);\n\
        COMMIT;\nBEGIN;\nSELECT public.r330_assert('r334-spoofed-local-GUC-cleared',(SELECT count(*) FROM public.taxacc_clients)::bigint,0);\n\
        COMMIT;\n-- Anti-pattern: session-scoped SET survives COMMIT and can influence subsequent request.\nSET request.jwt.claim.sub='00000005-0005-4005-8005-000000000005';\n\
        BEGIN;\nSELECT public.r330_assert('r334-session-set-visible',(SELECT count(*) FROM public.taxacc_clients)::bigint,1);\n\
        COMMIT;\nBEGIN;\nSELECT public.r330_assert('r334-session-set-still-present-next-tx',(SELECT count(*) FROM public.taxacc_clients)::bigint,1);\n\
        COMMIT;\nRESET request.jwt.claim.sub;\nBEGIN;\nSELECT public.r330_assert('r334-session-GUC-reset-denies',(SELECT count(*)\
        \ FROM public.taxacc_clients)::bigint,0);\nCOMMIT;\nRESET ROLE;\n-- Anonymous role cannot read even with injected\
        \ sub.\nSET ROLE anon;\nBEGIN;\nSET LOCAL request.jwt.claim.sub='00000001-0001-4001-8001-000000000001';\nDO $r334_anon$\
        \ BEGIN\n BEGIN\n  PERFORM count(*) FROM public.taxacc_clients;\n  RAISE EXCEPTION 'R334_UNSAFE_ANON_READ';\n EXCEPTION\
        \ WHEN insufficient_privilege THEN\n  RAISE NOTICE 'R334_PASS: anonymous claim spoof blocked by explicit SQL GRANT\
