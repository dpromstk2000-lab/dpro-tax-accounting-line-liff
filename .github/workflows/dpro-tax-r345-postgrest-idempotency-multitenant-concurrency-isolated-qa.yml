        \ else {eq(actor+'-read-kept',r.status,200);ok(actor+'-rows-positive',Array.isArray(r.json)&&r.json.length>0);ok(actor+'-not-mutated',!r.raw.includes('R341_UNAUTHORIZED_SYNTHETIC_WRITE'));}\n\
