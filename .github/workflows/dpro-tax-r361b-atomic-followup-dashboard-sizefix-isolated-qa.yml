    - name: R334 run R316-R319 real offline verifier and scoped request-bridge tests
      shell: bash
      run: "set -euo pipefail\nfor test in qa/r316/read-only-gateway.test.mjs qa/r316/r317-scoped-postgrest-adapter.test.mjs qa/r316/r318-offline-request-bridge.test.mjs qa/r316/r319-adversarial-response-integrity.test.mjs; do\n test -f \"$test\" || { echo \"R334_QA_TEST_MISSING $test\"; exit 1; }\n node \"$test\" > /tmp/r334_node_qa.log 2>&1 || { tail -55 /tmp/r334_node_qa.log; exit 1; }\n echo \"R334_SIGNED_JWT_SOURCE_REGRESSION_PASS $test\"\ndone\n"
    - name: R334 create synthetic GUC spoof and connection-reuse SQL; demonstrate unresolved trust boundary
      shell: bash
      run: "set -euo pipefail\ncat > /tmp/r334_jwt_guc_boundary.sql <<'R334_SQL'\n\\set ON_ERROR_STOP on\n-- Disposable PostgreSQL only. Synthetic identities (no real JWTs or service-role keys).\n-- Important: SQL custom GUC (request.jwt.claim.sub) is not a cryptographic proof.\nSELECT public.r333_gate();\n-- R333 replay deliberately restored this baseline at its end.\nSELECT public.r330_assert('r334-26-tables-still-forced-rls',(\n SELECT count(*) FROM pg_class c WHERE c.relnamespace='public'::regnamespace\n AND c.relkind='r' AND c.relname LIKE 'taxacc\\_%' ESCAPE '\\' AND c.relrowsecurity AND c.relforcerowsecurity)::bigint,26);\nSELECT public.r330_assert('r334-anon-no-readable-tables',(\n SELECT count(*) FROM pg_class c WHERE c.relnamespace='public'::regnamespace\n AND c.relkind='r' AND c.relname LIKE 'taxacc\\_%' ESCAPE '\\' AND has_table_privilege('anon',c.oid,'SELECT'))::bigint,0);\nSELECT public.r330_assert('r334-21-readonly-policies',(\n SELECT count(*) FROM pg_policies WHERE schemaname='public' AND cmd='SELECT' AND tablename LIKE 'taxacc\\_%' ESCAPE '\\')::bigint,21);\nSELECT public.r330_assert('r334-authenticated-nobypassrls',(\n SELECT rolbypassrls::int FROM pg_roles WHERE rolname='authenticated')::bigint,0);\n-- Four SECURITY DEFINER helpers hard pin search_path to pg_catalog. Only synthetic functions.\nSELECT public.r330_assert('r334-definer-functions-fixed-searchpath',(\n SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace\n WHERE n.nspname='qa_private' AND p.prosecdef AND 'search_path=pg_catalog'=ANY(p.proconfig))::bigint,4);\n-- Verify legitimate, baseline tenant-local reads before deliberately spoofing sub.\nSET ROLE authenticated;\nBEGIN;\nSET LOCAL request.jwt.claim.sub='00000001-0001-4001-8001-000000000001';\nSELECT public.r330_assert('r334-baseline-owner-A-three',(SELECT count(*) FROM public.taxacc_clients)::bigint,3);\nSELECT public.r330_assert('r334-baseline-owner-A-cannot-see-B',(SELECT count(*) FROM public.taxacc_clients WHERE office_id='bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb')::bigint,0);\nCOMMIT;\n-- No claim should leak beyond COMMIT with SET LOCAL.\nBEGIN;\nSELECT public.r330_assert('r334-local-sub-cleared-after-commit',(SELECT count(*) FROM public.taxacc_clients)::bigint,0);\nCOMMIT;\n-- ATTACK EMULATION: assuming untrusted SQL execution as the `authenticated` role,\n-- an arbitrary SET LOCAL claim changes the RLS principal. This is a known trust boundary.\n-- DO NOT interpret this as proof that the actual PostgREST API allows arbitrary SET.\nBEGIN;\nSET LOCAL request.jwt.claim.sub='00000005-0005-4005-8005-000000000005';\nSELECT public.r330_assert('r334-sql-claim-spoof-B-impersonated',(SELECT count(*) FROM public.taxacc_clients)::bigint,1);\nSELECT public.r330_assert('r334-sql-claim-spoof-B-no-office-A',(SELECT count(*) FROM public.taxacc_clients WHERE office_id='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa')::bigint,0);\nSELECT public.r330_assert('r334-uid-decoder-trusts-unverified-GUC',(\n SELECT (qa_private.r330_uid()='00000005-0005-4005-8005-000000000005'::uuid)::int)::bigint,1);\n-- Switch principal within the SAME SQL transaction; RLS follows untrusted GUC!\nSET LOCAL request.jwt.claim.sub='00000001-0001-4001-8001-000000000001';\nSELECT public.r330_assert('r334-same-transaction-spoof-A-impersonated',(SELECT count(*) FROM public.taxacc_clients)::bigint,3);\nCOMMIT;\nBEGIN;\nSELECT public.r330_assert('r334-spoofed-local-GUC-cleared',(SELECT count(*) FROM public.taxacc_clients)::bigint,0);\nCOMMIT;\n-- Anti-pattern: session-scoped SET survives COMMIT and can influence subsequent request.\nSET request.jwt.claim.sub='00000005-0005-4005-8005-000000000005';\nBEGIN;\nSELECT public.r330_assert('r334-session-set-visible',(SELECT count(*) FROM public.taxacc_clients)::bigint,1);\nCOMMIT;\nBEGIN;\nSELECT public.r330_assert('r334-session-set-still-present-next-tx',(SELECT count(*) FROM public.taxacc_clients)::bigint,1);\nCOMMIT;\nRESET request.jwt.claim.sub;\nBEGIN;\nSELECT public.r330_assert('r334-session-GUC-reset-denies',(SELECT count(*) FROM public.taxacc_clients)::bigint,0);\nCOMMIT;\nRESET ROLE;\n-- Anonymous role cannot read even with injected sub.\nSET ROLE anon;\nBEGIN;\nSET LOCAL request.jwt.claim.sub='00000001-0001-4001-8001-000000000001';\nDO $r334_anon$ BEGIN\n BEGIN\n  PERFORM count(*) FROM public.taxacc_clients;\n  RAISE EXCEPTION 'R334_UNSAFE_ANON_READ';\n EXCEPTION WHEN insufficient_privilege THEN\n  RAISE NOTICE 'R334_PASS: anonymous claim spoof blocked by explicit SQL GRANT barrier';\n END;\nEND $r334_anon$;\nCOMMIT;\nRESET ROLE;\n-- Invariant: DB helper has no JWT signature verifier; immutable role claims MUST come\n-- from a signature-validating app/request boundary, not an untrusted SQL SET.\nSELECT public.r333_gate();\nSELECT 'R334_SYNTHETIC_GUC_SPOOFABILITY_PROVED_APPLICATION_TRUST_GATE_REQUIRED__COMMERCIAL_HOLD' AS result;\nR334_SQL\n"
