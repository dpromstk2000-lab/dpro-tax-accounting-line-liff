    - name: R353 install read-only, assigned-client-scoped aggregate RPC and verify grants
      shell: bash
      run: "set -euo pipefail\ncat >/tmp/r353_schema.sql <<'R353_R353_SCHEMA'\n\\set ON_ERROR_STOP on\n-- R353 is an isolated synthetic PG17 experiment, never a shared Supabase migration.\nDO $r353_before$ BEGIN\n IF (SELECT count(*) FROM public.r342_requests)<>19\n    OR (SELECT count(*) FROM public.r342_audit)<>19\n    OR (SELECT count(*) FROM public.r350_status_audit)<>3\n    OR (SELECT count(*) FROM public.r342_requests WHERE status='completed')<>3\n    OR (SELECT count(*) FROM public.r352_deadlines)<>19\n THEN RAISE EXCEPTION 'R353_R352_BASELINE_DRIFT'; END IF;\nEND $r353_before$;\n\n-- A read-only, client-scoped aggregate; avoids exposing request/client identifiers.\nCREATE FUNCTION public.r353_client_reminder_summary(p_office uuid,p_client uuid,p_as_of timestamptz)\nRETURNS jsonb LANGUAGE plpgsql STABLE SECURITY DEFINER SET search_path=pg_catalog\nAS $r353_rpc$\nDECLARE\n v_claims jsonb;v_sub text;v_actor uuid;v_staff uuid;v_broad boolean;\n v_today date;\n v_total bigint;v_completed bigint;v_overdue bigint;v_due_today bigint;\n v_day_before bigint;v_future bigint;\nBEGIN\n v_claims:=nullif(current_setting('request.jwt.claims',true),'')::jsonb;\n v_sub:=v_claims->>'sub';\n IF (v_claims->>'role') IS DISTINCT FROM 'authenticated'\n    OR v_sub IS NULL OR v_sub !~* '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'\n    OR p_office IS NULL OR p_client IS NULL\n THEN RAISE EXCEPTION 'R353_ACCESS_DENIED' USING ERRCODE='42501'; END IF;\n IF p_as_of IS NULL OR NOT isfinite(p_as_of)\n THEN RAISE EXCEPTION 'R353_INVALID_AS_OF' USING ERRCODE='22023'; END IF;\n v_actor:=v_sub::uuid;\n SELECT s.id,(s.role IN ('owner','admin') OR s.can_view_all_clients)\n INTO v_staff,v_broad\n FROM public.r335_staff s JOIN public.r335_offices o ON o.id=s.office_id\n WHERE s.office_id=p_office AND s.auth_user_id=v_actor AND s.is_active AND o.is_active\n LIMIT 1;\n IF v_staff IS NULL THEN RAISE EXCEPTION 'R353_ACCESS_DENIED' USING ERRCODE='42501'; END IF;\n IF NOT EXISTS(SELECT 1 FROM public.r335_clients c\n   WHERE c.office_id=p_office AND c.id=p_client\n     AND (v_broad OR c.assigned_staff_id=v_staff))\n THEN RAISE EXCEPTION 'R353_ACCESS_DENIED' USING ERRCODE='42501'; END IF;\n\n v_today:=(p_as_of AT TIME ZONE 'Asia/Tokyo')::date;\n SELECT count(*),\n        count(*) FILTER (WHERE r.status='completed'),\n        count(*) FILTER (WHERE r.status='requested' AND (d.due_at AT TIME ZONE 'Asia/Tokyo')::date < v_today),\n        count(*) FILTER (WHERE r.status='requested' AND (d.due_at AT TIME ZONE 'Asia/Tokyo')::date = v_today),\n        count(*) FILTER (WHERE r.status='requested' AND (d.due_at AT TIME ZONE 'Asia/Tokyo')::date = v_today+1),\n        count(*) FILTER (WHERE r.status='requested' AND (d.due_at AT TIME ZONE 'Asia/Tokyo')::date > v_today+1)\n INTO v_total,v_completed,v_overdue,v_due_today,v_day_before,v_future\n FROM public.r342_requests r JOIN public.r352_deadlines d\n   ON d.office_id=r.office_id AND d.request_id=r.id\n WHERE r.office_id=p_office AND r.client_id=p_client;\n IF v_total IS DISTINCT FROM (v_completed+v_overdue+v_due_today+v_day_before+v_future)\n THEN RAISE EXCEPTION 'R353_INVALID_REMINDER_GROUPING' USING ERRCODE='22023'; END IF;\n RETURN pg_catalog.jsonb_build_object(\n  'total',v_total,'completed',v_completed,'overdue',v_overdue,\n  'due_today',v_due_today,'day_before',v_day_before,'future',v_future,\n  'eligible',v_overdue+v_due_today+v_day_before,'preview_only',true,'scheduled',false);\nEND;\n$r353_rpc$;\nALTER FUNCTION public.r353_client_reminder_summary(uuid,uuid,timestamptz) OWNER TO r342_executor;\nREVOKE ALL ON FUNCTION public.r353_client_reminder_summary(uuid,uuid,timestamptz) FROM PUBLIC,anon;\nGRANT EXECUTE ON FUNCTION public.r353_client_reminder_summary(uuid,uuid,timestamptz) TO authenticated;\nNOTIFY pgrst,'reload schema';\n\nDO $r353_ready$ BEGIN\n IF (SELECT rolname FROM pg_roles WHERE oid=(SELECT proowner FROM pg_proc\n WHERE oid='public.r353_client_reminder_summary(uuid,uuid,timestamptz)'::regprocedure))<>'r342_executor'\n OR (SELECT rolcanlogin OR rolbypassrls FROM pg_roles WHERE rolname='r342_executor') IS DISTINCT FROM false\n OR has_function_privilege('anon','public.r353_client_reminder_summary(uuid,uuid,timestamptz)','EXECUTE')\n OR NOT has_function_privilege('authenticated','public.r353_client_reminder_summary(uuid,uuid,timestamptz)','EXECUTE')\n OR has_table_privilege('authenticated','public.r352_deadlines','SELECT')\n OR has_table_privilege('authenticated','public.r342_requests','SELECT')\n OR (SELECT count(*) FROM pg_class\n     WHERE oid IN ('public.r342_requests'::regclass,'public.r352_deadlines'::regclass)\n       AND relrowsecurity AND relforcerowsecurity)<>2\n THEN RAISE EXCEPTION 'R353_PRIVILEGE_OR_RLS_DRIFT'; END IF;\n RAISE NOTICE 'R353_SCOPED_CLIENT_SUMMARY_RPC_READY request_rows=19 deadlines=19 synthetic_only=true';\nEND $r353_ready$;\nR353_R353_SCHEMA\npgid=\"${{ job.services.pg.id }}\"\ntest -n \"$pgid\"\ndocker exec -i \"$pgid\" psql -X -U postgres -d r331_synthetic -v ON_ERROR_STOP=1 < /tmp/r353_schema.sql\n"
    - name: R353B assert true foreign-client assignment before negative HTTP tests
      shell: bash
      run: "set -euo pipefail\npgid=\"${{ job.services.pg.id }}\"\ndocker exec -i \"$pgid\" psql -X -U postgres -d r331_synthetic -v ON_ERROR_STOP=1 <<'R353B_PRECONDITIONS'\nDO $r353b$ BEGIN\n IF (SELECT assigned_staff_id FROM public.r335_clients\n       WHERE office_id='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa'::uuid\n         AND id='20000000-0000-4000-8000-000000000001'::uuid)\n    IS DISTINCT FROM '10000000-0000-4000-8000-000000000002'::uuid\n OR (SELECT assigned_staff_id FROM public.r335_clients\n       WHERE office_id='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa'::uuid\n         AND id='20000000-0000-4000-8000-000000000002'::uuid)\n    IS DISTINCT FROM '10000000-0000-4000-8000-000000000001'::uuid\n OR EXISTS(SELECT 1 FROM public.r342_requests\n       WHERE office_id='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa'::uuid\n         AND client_id='20000000-0000-4000-8000-000000000002'::uuid)\n THEN RAISE EXCEPTION 'R353B_FIXTURE_ASSIGNMENT_DRIFT_HOLD'; END IF;\n RAISE NOTICE 'R353B_REAL_PG17_FOREIGN_CLIENT_PRECONDITION_PASS';\nEND $r353b$;\nR353B_PRECONDITIONS\n"
    - name: R353B install corrected signed JWT real PostgREST fixture tests
      shell: bash
      run: "set -euo pipefail\ncat >/tmp/r353_http.mjs <<'R353_R353_HTTP'\nimport assert from 'node:assert/strict';\nimport {createHmac} from 'node:crypto';\nimport {readFileSync} from 'node:fs';\n\nconst DATA=JSON.parse(readFileSync('/tmp/r352_samples.json','utf8'));\nconst STAGE=process.env.R353_STAGE??'initial';\nconst HOST='http://127.0.0.1:3000';\nconst SECRET='R335_SYNTHETIC_JWT_SIGNING_KEY_NOT_REAL_1234567890';\nconst OA='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa';\nconst OB='bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb';\nconst STAFF='00000002-0002-4002-8002-000000000002';\nconst OWNER_A='00000005-0005-4005-8005-000000000005';\nconst OWNER_B='00000003-0003-4003-8003-000000000003';\n// Real PG17 fixture: client 001 belongs to staff 002, while client 002\n// belongs to original owner 001. A different client ID does not imply a\n// different assignee; R353's mock incorrectly made that assumption.\nconst UNASSIGNED_TO_STAFF='20000000-0000-4000-8000-000000000002';\nconst A='2028-02-29T03:00:00Z',B='2028-02-29T15:00:00Z';\nconst enc=x=>Buffer.from(JSON.stringify(x)).toString('base64url');\nfunction jwt(sub,extra={}){\n const h=enc({alg:'HS256',typ:'JWT'}),p=enc({sub,role:'authenticated',exp:4102444800,...extra});\n return h+'.'+p+'.'+createHmac('sha256',SECRET).update(h+'.'+p).digest('base64url');\n}\nlet checks=0;\nfunction eq(n,a,b){assert.deepEqual(a,b,n);checks++}\nfunction ok(n,a){assert.ok(a,n);checks++}\nasync function call(item,sub=item.actor_auth_id,office=item.office_id,client=item.client_id,asOf=A,token=jwt(sub)){\n const r=await fetch(HOST+'/rpc/r353_client_reminder_summary',{\n  method:'POST',headers:{'content-type':'application/json',accept:'application/json',\n   ...(token?{authorization:'Bearer '+token}:{})},\n  body:JSON.stringify({p_office:office,p_client:client,p_as_of:asOf}),\n  signal:AbortSignal.timeout(16000)});\n const raw=await r.text();let body;\n try{body=raw?JSON.parse(raw):null}catch{throw Error('R353_BAD_JSON_'+r.status+'_'+raw.slice(0,120))}\n return {code:r.status,body};\n}\nfunction expected(item,asOf=A){\n const today=asOf===A?'2028-02-29':'2028-03-01';\n const tomorrow=asOf===A?'2028-03-01':'2028-03-02';\n const rows=DATA.all.filter(x=>x.office_id===item.office_id&&x.client_id===item.client_id);\n const v={total:rows.length,completed:0,overdue:0,due_today:0,day_before:0,future:0};\n for(const x of rows){\n  if(x.status==='completed')v.completed++;\n  else if(x.due_day<today)v.overdue++;\n  else if(x.due_day===today)v.due_today++;\n  else if(x.due_day===tomorrow)v.day_before++;\n  else v.future++;\n }\n return {...v,eligible:v.overdue+v.due_today+v.day_before,preview_only:true,scheduled:false};\n}\nfunction yes(n,r,item,asOf=A){\n eq(n+'-200',r.code,200);\n const expectedKeys=['completed','day_before','due_today','eligible','future','overdue','preview_only','scheduled','total'];\n eq(n+'-keys',Object.keys(r.body).sort(),expectedKeys);\n const exp=expected(item,asOf);\n for(const k of expectedKeys)eq(n+'-'+k,r.body[k],exp[k]);\n eq(n+'-partition-invariant',r.body.completed+r.body.overdue+r.body.due_today+r.body.day_before+r.body.future,r.body.total);\n ok(n+'-no-office-request-client-identifier',!JSON.stringify(r.body).includes(item.office_id)&&\n    !JSON.stringify(r.body).includes(item.client_id));\n}\nfunction deny(n,r){\n eq(n+'-403',r.code,403);\n eq(n+'-sqlstate',r.body?.code,'42501');\n eq(n+'-generic',r.body?.message,'R353_ACCESS_DENIED');\n ok(n+'-no-count',r.body?.total===undefined);\n}\nconst staff=DATA.staff;\nconst ownerA=DATA.all.find(x=>x.office_id===OA&&x.client_id!==staff.client_id);\nconst ownerB=DATA.all.find(x=>x.office_id===OB&&x.actor_auth_id===OWNER_B);\nok('staff-present',staff?.actor_auth_id===STAFF);\nok('owner-a-distinct-client',!!ownerA);\nok('owner-b-present',!!ownerB);\n\nif(STAGE==='initial'){\n const samples=[{item:staff,sub:STAFF},{item:ownerA,sub:OWNER_A},{item:ownerB,sub:OWNER_B}];\n for(const [i,{item,sub}] of samples.entries()){\n  yes('client-summary-A-'+i,await call(item,sub),item);\n  yes('client-summary-B-'+i,await call(item,sub,item.office_id,item.client_id,B),item,B);\n }\n yes('office-owner-can-see-assigned-staff-client',await call(staff,OWNER_A),staff);\n const unassignedOwner=await call(ownerA,OWNER_A,OA,UNASSIGNED_TO_STAFF);\n eq('owner-empty-unassigned-client-200',unassignedOwner.code,200);\n eq('owner-empty-unassigned-client-zero',unassignedOwner.body?.total,0);\n eq('owner-empty-unassigned-client-eligible-zero',unassignedOwner.body?.eligible,0);\n eq('owner-empty-unassigned-client-safe-flags',\n    [unassignedOwner.body?.preview_only,unassignedOwner.body?.scheduled],[true,false]);\n for(let i=0;i<12;i++){\n  deny('cross-office-'+i,await call(staff,OWNER_B,OA));\n  deny('assigned-staff-foreign-client-'+i,await call(ownerA,STAFF,OA,UNASSIGNED_TO_STAFF));\n }\n const missing='00000000-0000-4000-8000-000000000000';\n deny('missing-client',await call(staff,STAFF,OA,missing));\n deny('foreign-office-id',await call(staff,STAFF,OB));\n deny('forged-admin-claim',await call(ownerA,STAFF,OA,UNASSIGNED_TO_STAFF,A,jwt(STAFF,{is_admin:true,office_id:OB})));\n const anon=await call(staff,STAFF,OA,staff.client_id,A,null);\n ok('anonymous-refused',[401,403,404].includes(anon.code));\n const spoofRole=await call(staff,STAFF,OA,staff.client_id,A,jwt(STAFF,{role:'anon'}));\n ok('wrong-role-refused',[401,403,404].includes(spoofRole.code));\n const bad=await call(staff,STAFF,OA,staff.client_id,null);\n eq('null-as-of-400',bad.code,400);eq('null-as-of-message',bad.body?.message,'R353_INVALID_AS_OF');\n const infinite=await call(staff,STAFF,OA,staff.client_id,'infinity');\n eq('infinite-as-of-400',infinite.code,400);\n const impossible=await call(staff,STAFF,OA,staff.client_id,'2028-02-30T12:00:00Z');\n eq('invalid-calendar-date-400',impossible.code,400);\n const parallel=await Promise.all(Array.from({length:64},()=>call(staff)));\n parallel.forEach((r,i)=>yes('parallel-'+i,r,staff));\n eq('parallel-no-drift',new Set(parallel.map(r=>JSON.stringify(r.body))).size,1);\n}else if(STAGE==='revoked'){\n for(let i=0;i<14;i++)deny('revoked-'+i,await call(staff));\n for(let i=0;i<7;i++)yes('owner-a-keeps-access-'+i,await call(staff,OWNER_A),staff);\n}else if(STAGE==='restored'){\n for(let i=0;i<14;i++)yes('staff-restored-'+i,await call(staff),staff);\n}else if(STAGE==='reassigned'){\n for(let i=0;i<14;i++)deny('lost-assignment-'+i,await call(staff));\n for(let i=0;i<7;i++)yes('owner-a-after-transfer-'+i,await call(staff,OWNER_A),staff);\n}else if(STAGE==='office_paused'){\n for(let i=0;i<14;i++)deny('paused-office-'+i,await call(staff));\n for(let i=0;i<7;i++)yes('other-office-unaffected-'+i,await call(ownerB),ownerB);\n}else if(STAGE==='final'){\n for(const [i,[item,sub]] of [[staff,STAFF],[ownerA,OWNER_A],[ownerB,OWNER_B]].entries())\n  yes('final-'+i,await call(item,sub),item);\n yes('owner-a-final-staff-client',await call(staff,OWNER_A),staff);\n const table=await fetch(HOST+'/r352_deadlines?select=*',{\n  headers:{authorization:'Bearer '+jwt(OWNER_A)},signal:AbortSignal.timeout(12000)});\n ok('direct-deadline-raw-table-denied',[401,403,404].includes(table.status));\n const patched=await fetch(HOST+'/r342_requests?select=*',{\n  headers:{authorization:'Bearer '+jwt(OWNER_A)},signal:AbortSignal.timeout(12000)});\n ok('direct-request-table-denied',[401,403,404].includes(patched.status));\n}else throw Error('R353_UNKNOWN_STAGE_'+STAGE);\nconsole.log(JSON.stringify({suite:'R353_SCOPED_CLIENT_REMINDER_COUNTS',stage:STAGE,checks,\n signed_jwt:true,synthetic_pg17:true,client_scope:true,notification_emitted:0,commercial_release:'HOLD'}));\nR353_R353_HTTP\nnode --check /tmp/r353_http.mjs\n"
