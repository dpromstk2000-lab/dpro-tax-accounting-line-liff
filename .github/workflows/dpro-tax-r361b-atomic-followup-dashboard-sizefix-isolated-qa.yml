    - name: R352 verify no request/audit drift, 19 deadlines, zero queue and restored staff
      shell: bash
      run: "set -euo pipefail\ncat >/tmp/r352_final.sql <<'R352_R352_FINAL'\n\\set ON_ERROR_STOP on\nDO $r352_final$ BEGIN\n IF (SELECT count(*) FROM public.r342_requests)<>19\n    OR (SELECT count(*) FROM public.r342_audit)<>19\n    OR (SELECT count(*) FROM public.r342_requests WHERE status='completed')<>3\n    OR (SELECT count(*) FROM public.r350_status_audit)<>3\n    OR (SELECT count(*) FROM public.r352_deadlines)<>19\n THEN RAISE EXCEPTION 'R352_BASELINE_OR_REMINDER_FIXTURE_MUTATED'; END IF;\n IF EXISTS(SELECT 1 FROM public.r352_deadlines d\n           LEFT JOIN public.r342_requests r ON r.id=d.request_id AND r.office_id=d.office_id\n           WHERE r.id IS NULL)\n THEN RAISE EXCEPTION 'R352_TENANT_SCOPE_FOREIGN_KEY_FAILURE'; END IF;\n IF EXISTS(SELECT 1 FROM public.r342_requests r\n           LEFT JOIN public.r342_audit a ON a.request_id=r.id WHERE a.request_id IS NULL)\n THEN RAISE EXCEPTION 'R352_CREATE_AUDIT_LOST'; END IF;\n IF EXISTS(SELECT 1 FROM public.r342_requests r\n           LEFT JOIN public.r350_status_audit a ON a.request_id=r.id\n           WHERE r.status='completed' AND a.request_id IS NULL)\n THEN RAISE EXCEPTION 'R352_COMPLETION_AUDIT_LOST'; END IF;\n IF (SELECT is_active FROM public.r335_staff\n     WHERE auth_user_id='00000002-0002-4002-8002-000000000002'::uuid) IS DISTINCT FROM true\n OR (SELECT is_active FROM public.r335_offices\n     WHERE id='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa'::uuid) IS DISTINCT FROM true\n OR (SELECT assigned_staff_id FROM public.r335_clients\n     WHERE id='20000000-0000-4000-8000-000000000004'::uuid)\n     IS DISTINCT FROM '10000000-0000-4000-8000-000000000002'::uuid\n THEN RAISE EXCEPTION 'R352_AUTHORIZATION_FIXTURE_NOT_RESTORED'; END IF;\n IF has_function_privilege('anon','public.r352_preview_reminder(uuid,uuid,timestamptz)','EXECUTE')\n OR has_table_privilege('authenticated','public.r352_deadlines','SELECT')\n OR has_table_privilege('authenticated','public.r352_deadlines','UPDATE')\n OR has_table_privilege('authenticated','public.r342_requests','SELECT')\n OR has_table_privilege('authenticated','public.r350_status_audit','SELECT')\n OR has_table_privilege('r342_executor','public.r352_deadlines','INSERT')\n OR has_table_privilege('r342_executor','public.r352_deadlines','UPDATE')\n OR has_table_privilege('r342_executor','public.r352_deadlines','DELETE')\n THEN RAISE EXCEPTION 'R352_READ_ONLY_GRANT_DRIFT'; END IF;\n RAISE NOTICE 'R352_READ_ONLY_JST_DEADLINE_PREVIEW_PASS requests=19 create_audit=19 completed=3 completion_audit=3 deadlines=19 queue_rows=0 external_notifications=0';\nEND $r352_final$;\nR352_R352_FINAL\npgid=\"${{ job.services.pg.id }}\"\ntest -n \"$pgid\"\ndocker exec -i \"$pgid\" psql -X -U postgres -d r331_synthetic -v ON_ERROR_STOP=1 < /tmp/r352_final.sql\n"
