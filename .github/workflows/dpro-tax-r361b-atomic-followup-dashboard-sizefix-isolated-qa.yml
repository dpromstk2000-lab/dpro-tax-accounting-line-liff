    - name: R360 install read-only scoped followup priority-page RPC
      shell: bash
      run: "set -euo pipefail\ncat >/tmp/r360_schema.sql <<'R360_R360_SCHEMA_SQL'\n\\set ON_ERROR_STOP on\n-- R360: deterministic, read-only candidate pages, disposable PG17 only.\n-- This is a preview. No queue table, scheduler, or notification dispatch.\nDO $r360_baseline$ BEGIN\n IF (SELECT count(*) FROM public.r342_requests)<>19\n OR (SELECT count(*) FROM public.r352_deadlines)<>19\n OR (SELECT count(*) FROM public.r355_visits)<>7\n THEN RAISE EXCEPTION 'R360_R359_FORMAL_BASELINE_DRIFT_HOLD'; END IF;\nEND $r360_baseline$;\n\nCREATE FUNCTION public.r360_preview_followup_queue(\n p_office uuid,p_as_of timestamptz,p_repeat_days integer,\n p_limit integer,p_offset integer)\nRETURNS jsonb LANGUAGE plpgsql STABLE SECURITY DEFINER SET search_path=pg_catalog\nAS $r360_rpc$\nDECLARE\n v_claims jsonb;v_sub text;v_actor uuid;v_staff uuid;v_broad boolean;\n v_today date;v_count integer;v_items jsonb;\nBEGIN\n v_claims:=nullif(current_setting('request.jwt.claims',true),'')::jsonb;\n v_sub:=v_claims->>'sub';\n IF v_claims->>'role' IS DISTINCT FROM 'authenticated'\n OR v_sub IS NULL\n OR v_sub !~* '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'\n OR p_office IS NULL\n THEN RAISE EXCEPTION 'R360_ACCESS_DENIED' USING ERRCODE='42501'; END IF;\n IF p_as_of IS NULL OR NOT isfinite(p_as_of)\n THEN RAISE EXCEPTION 'R360_INVALID_AS_OF' USING ERRCODE='22023'; END IF;\n IF p_repeat_days IS NULL OR p_repeat_days<1 OR p_repeat_days>30\n THEN RAISE EXCEPTION 'R360_INVALID_REPEAT' USING ERRCODE='22023'; END IF;\n IF p_limit IS NULL OR p_limit<1 OR p_limit>25\n THEN RAISE EXCEPTION 'R360_INVALID_LIMIT' USING ERRCODE='22023'; END IF;\n IF p_offset IS NULL OR p_offset<0 OR p_offset>500\n THEN RAISE EXCEPTION 'R360_INVALID_OFFSET' USING ERRCODE='22023'; END IF;\n\n v_actor:=v_sub::uuid;\n SELECT s.id,(s.role IN ('owner','admin') OR s.can_view_all_clients)\n INTO v_staff,v_broad\n FROM public.r335_staff s JOIN public.r335_offices o ON o.id=s.office_id\n WHERE s.office_id=p_office AND s.auth_user_id=v_actor AND s.is_active AND o.is_active\n LIMIT 1;\n IF v_staff IS NULL THEN RAISE EXCEPTION 'R360_ACCESS_DENIED' USING ERRCODE='42501'; END IF;\n\n v_today:=(p_as_of AT TIME ZONE 'Asia/Tokyo')::date;\n WITH visible AS (\n  SELECT r.id AS request_id,(d.due_at AT TIME ZONE 'Asia/Tokyo')::date AS due_day\n  FROM public.r342_requests r\n  JOIN public.r335_clients c ON c.office_id=r.office_id AND c.id=r.client_id\n  JOIN public.r352_deadlines d ON d.office_id=r.office_id AND d.request_id=r.id\n  WHERE r.office_id=p_office AND r.status='requested'\n    AND (v_broad OR c.assigned_staff_id=v_staff)\n ), classified AS (\n  SELECT request_id,due_day,(v_today-due_day) AS days_late\n  FROM visible\n ), candidates AS (\n  SELECT request_id,due_day,\n   CASE WHEN days_late>0 THEN 'overdue'\n        WHEN days_late=0 THEN 'due_today' ELSE 'day_before' END AS kind,\n   GREATEST(days_late,0) AS overdue_days,\n   CASE WHEN days_late>0 THEN 0 WHEN days_late=0 THEN 1 ELSE 2 END AS priority\n  FROM classified\n  WHERE (days_late>0 AND (days_late-1)%p_repeat_days=0)\n     OR days_late IN (0,-1)\n ), page AS (\n  SELECT request_id,due_day,kind,overdue_days,priority\n  FROM candidates ORDER BY priority,due_day,request_id\n  LIMIT p_limit OFFSET p_offset\n )\n SELECT (SELECT count(*)::integer FROM candidates),\n   (SELECT coalesce(pg_catalog.jsonb_agg(\n       pg_catalog.jsonb_build_object(\n        'request_id',request_id,'due_day',due_day::text,\n        'kind',kind,'overdue_days',overdue_days)\n       ORDER BY priority,due_day,request_id),'[]'::jsonb) FROM page)\n INTO v_count,v_items;\n\n RETURN pg_catalog.jsonb_build_object(\n  'as_of_day',v_today::text,'repeat_days',p_repeat_days,\n  'candidate_total',v_count,'limit',p_limit,'offset',p_offset,\n  'has_more',v_count>p_offset+pg_catalog.jsonb_array_length(v_items),\n  'items',v_items,'preview_only',true,'scheduled',false);\nEND;\n$r360_rpc$;\n\nALTER FUNCTION public.r360_preview_followup_queue(uuid,timestamptz,integer,integer,integer)\n OWNER TO r342_executor;\nREVOKE ALL ON FUNCTION public.r360_preview_followup_queue(uuid,timestamptz,integer,integer,integer)\n FROM PUBLIC,anon;\nGRANT EXECUTE ON FUNCTION public.r360_preview_followup_queue(uuid,timestamptz,integer,integer,integer)\n TO authenticated;\nNOTIFY pgrst,'reload schema';\n\nDO $r360_acl$ BEGIN\n IF (SELECT count(*) FROM pg_class WHERE oid IN (\n    'public.r355_visits'::regclass,'public.r342_requests'::regclass,\n    'public.r352_deadlines'::regclass) AND relrowsecurity AND relforcerowsecurity)<>3\n OR has_function_privilege('anon','public.r360_preview_followup_queue(uuid,timestamptz,integer,integer,integer)','EXECUTE')\n OR NOT has_function_privilege('authenticated','public.r360_preview_followup_queue(uuid,timestamptz,integer,integer,integer)','EXECUTE')\n OR (SELECT rolname FROM pg_roles WHERE oid=(SELECT proowner FROM pg_proc\n    WHERE oid='public.r360_preview_followup_queue(uuid,timestamptz,integer,integer,integer)'::regprocedure))<>'r342_executor'\n OR (SELECT rolcanlogin OR rolbypassrls FROM pg_roles WHERE rolname='r342_executor') IS DISTINCT FROM false\n OR has_table_privilege('authenticated','public.r342_requests','SELECT')\n OR has_table_privilege('authenticated','public.r352_deadlines','SELECT')\n OR has_table_privilege('authenticated','public.r342_requests','INSERT')\n THEN RAISE EXCEPTION 'R360_SCOPED_QUEUE_ACL_HOLD'; END IF;\n RAISE NOTICE 'R360_SYNTHETIC_CANDIDATE_PAGES_READY max_limit=25 max_offset=500 sends=0';\nEND $r360_acl$;\nR360_R360_SCHEMA_SQL\npgid=\"${{ job.services.pg.id }}\"\ntest -n \"$pgid\"\ndocker exec -i \"$pgid\" psql -X -U postgres -d r331_synthetic -v ON_ERROR_STOP=1 < /tmp/r360_schema.sql\n"
    - name: R360 install independent PG17 request and scope page oracle tests
      shell: bash
      run: "set -euo pipefail\ncat >/tmp/r360_http.mjs <<'R360_R360_HTTP_MJS'\nimport assert from 'node:assert/strict';\nimport {readFileSync} from 'node:fs';\nimport {createHmac} from 'node:crypto';\n\n// Actual HTTP over signed JWT to PostgREST; independent raw PG17 and\n// staff/client/office snapshots supply expected data, not the RPC under test.\nconst STAGE=process.env.R360_STAGE??'initial';\nconst HOST='http://127.0.0.1:3000';\nconst SECRET='R335_SYNTHETIC_JWT_SIGNING_KEY_NOT_REAL_1234567890';\nconst data=JSON.parse(readFileSync(process.env.R360_REQUEST_ORACLE_PATH??'/tmp/r356_oracle.json'));\nconst graph=JSON.parse(readFileSync(process.env.R360_SCOPE_ORACLE_PATH??'/tmp/r358c_scope_oracle.json'));\nconst clients=new Map(graph.clients.map(c=>[c.id,c]));\nconst offices=new Map(graph.offices.map(o=>[o.id,o]));\nconst OA='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa';\nconst OB='bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb';\nconst STAFF='00000002-0002-4002-8002-000000000002';\nconst OWNER_A='00000005-0005-4005-8005-000000000005';\nconst OWNER_B='00000003-0003-4003-8003-000000000003';\nconst REASSIGNED='20000000-0000-4000-8000-000000000004';\nconst TRANSFER_STAFF='10000000-0000-4000-8000-000000000005';\nconst AS_OF='2028-02-29T03:00:00Z';\nconst MARCH='2028-02-29T15:00:00Z';\nconst APRIL='2028-04-15T12:30:00Z';\nlet checks=0;\nfunction eq(name,actual,expected){assert.deepEqual(actual,expected,name);checks++}\nfunction ok(name,x){assert.ok(x,name);checks++}\nfunction day(value){\n const parts=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date(value));\n const d=Object.fromEntries(parts.filter(p=>['year','month','day'].includes(p.type)).map(p=>[p.type,p.value]));\n return `${d.year}-${d.month}-${d.day}`;\n}\nfunction diff(a,b){return (Date.parse(a+'T00:00:00Z')-Date.parse(b+'T00:00:00Z'))/86400000}\nfunction visible(office,subject){\n const off=offices.get(office);\n const s=graph.staff.find(x=>x.office_id===office&&x.auth_user_id===subject);\n if(!off?.is_active||!s?.is_active)return [];\n if(STAGE==='revoked'&&subject===STAFF)return [];\n if(STAGE==='office_paused'&&office===OA)return [];\n const broad=['owner','admin'].includes(s.role)||s.can_view_all_clients;\n return data.requests.filter(r=>{\n  if(r.office_id!==office||r.status!=='requested')return false;\n  const c=clients.get(r.client_id);\n  const assigned=STAGE==='reassigned'&&r.client_id===REASSIGNED?TRANSFER_STAFF:c?.assigned_staff_id;\n  return c?.office_id===office&&(broad||assigned===s.id);\n });\n}\nfunction expected(office,subject,asOf,repeat,limit,offset){\n const today=day(asOf);\n const candidates=visible(office,subject).flatMap(r=>{\n  const due=day(r.due_at),late=diff(today,due);\n  if(!(late>0&&(late-1)%repeat===0||late===0||late===-1))return [];\n  return [{request_id:r.id,due_day:due,\n   kind:late>0?'overdue':late===0?'due_today':'day_before',\n   overdue_days:Math.max(0,late),priority:late>0?0:late===0?1:2}];\n }).sort((a,b)=>a.priority-b.priority||a.due_day.localeCompare(b.due_day)||a.request_id.localeCompare(b.request_id));\n return {as_of_day:today,repeat_days:repeat,candidate_total:candidates.length,\n  limit,offset,has_more:candidates.length>offset+candidates.slice(offset,offset+limit).length,\n  items:candidates.slice(offset,offset+limit).map(({priority,...item})=>item),\n  preview_only:true,scheduled:false};\n}\nconst enc=x=>Buffer.from(JSON.stringify(x)).toString('base64url');\nfunction token(subject,claims={}){\n const a=enc({alg:'HS256',typ:'JWT'}),b=enc({sub:subject,role:'authenticated',exp:4102444800,...claims});\n return a+'.'+b+'.'+createHmac('sha256',SECRET).update(a+'.'+b).digest('base64url');\n}\nasync function call(office,subject=STAFF,asOf=AS_OF,repeat=7,limit=5,offset=0,jwt=token(subject)){\n const res=await fetch(HOST+'/rpc/r360_preview_followup_queue',{\n  method:'POST',headers:{'content-type':'application/json',accept:'application/json',\n   ...(jwt?{authorization:'Bearer '+jwt}:{})},\n  body:JSON.stringify({p_office:office,p_as_of:asOf,p_repeat_days:repeat,p_limit:limit,p_offset:offset}),\n  signal:AbortSignal.timeout(16000)});\n const raw=await res.text();let body;\n try{body=raw?JSON.parse(raw):null}catch{throw Error('R360_INVALID_JSON '+res.status+' '+raw.slice(0,180))}\n return {status:res.status,body};\n}\nconst expectedKeys=['as_of_day','candidate_total','has_more','items','limit','offset','preview_only','repeat_days','scheduled'];\nfunction yes(name,result,office,subject,asOf=AS_OF,repeat=7,limit=5,offset=0){\n eq(name+'-200',result.status,200);\n eq(name+'-keys',Object.keys(result.body).sort(),expectedKeys);\n eq(name+'-independent-pg17-page',result.body,expected(office,subject,asOf,repeat,limit,offset));\n ok(name+'-rows-only-authorized',result.body.items.every(x=>\n  visible(office,subject).some(r=>r.id===x.request_id)));\n ok(name+'-candidate-cap',result.body.items.length<=limit);\n ok(name+'-read-only',result.body.preview_only===true&&result.body.scheduled===false);\n eq(name+'-total-match-candidate-oracle',result.body.candidate_total,\n  expected(office,subject,asOf,repeat,25,0).candidate_total);\n}\nfunction deny(name,result){\n eq(name+'-403',result.status,403);\n eq(name+'-sqlstate',result.body?.code,'42501');\n eq(name+'-generic-message',result.body?.message,'R360_ACCESS_DENIED');\n ok(name+'-no-items',result.body?.items===undefined);\n}\n\neq('source-19-requests',data.requests.length,19);\neq('source-16-pending',data.requests.filter(r=>r.status==='requested').length,16);\neq('graph-2-offices',graph.offices.length,2);\nok('raw-scope-office-join',data.requests.every(r=>clients.get(r.client_id)?.office_id===r.office_id));\nok('real-pg17-staff-A-non-broad',graph.staff.find(s=>s.auth_user_id===STAFF)?.can_view_all_clients===false);\n\nif(STAGE==='initial'){\n for(const [label,office,subject] of [['owner-A',OA,OWNER_A],['staff-A',OA,STAFF],['owner-B',OB,OWNER_B]]){\n  for(const [asOf,dateLabel] of [[AS_OF,'leap-feb'],[MARCH,'jst-mar'],[APRIL,'late-april']]){\n   for(const repeat of [1,7,30]){\n    for(const [limit,offset] of [[1,0],[3,1],[25,0],[2,500]]){\n     yes(`${label}-${dateLabel}-repeat-${repeat}-page-${limit}-${offset}`,\n      await call(office,subject,asOf,repeat,limit,offset),office,subject,asOf,repeat,limit,offset);\n    }\n   }\n  }\n }\n for(let i=0;i<12;i++){\n  deny('staff-cross-office-'+i,await call(OB,STAFF));\n  deny('owner-cross-office-'+i,await call(OA,OWNER_B));\n }\n yes('forged-admin-no-escalation',await call(OA,STAFF,AS_OF,7,25,0,\n  token(STAFF,{is_admin:true,can_view_all_clients:true,office_id:OB})),OA,STAFF,AS_OF,7,25,0);\n deny('non-member',await call(OA,'00000000-0000-4000-8000-000000000009'));\n deny('malformed-uuid',await call(OA,'not-a-uuid'));\n deny('unknown-office',await call('00000000-0000-4000-8000-000000000000',STAFF));\n const anon=await call(OA,STAFF,AS_OF,7,5,0,null);\n ok('anonymous-denied',[401,403,404].includes(anon.status));\n const wrongRole=await call(OA,STAFF,AS_OF,7,5,0,token(STAFF,{role:'anon'}));\n ok('wrong-role-denied',[401,403,404].includes(wrongRole.status));\n for(const [label,asOf,repeat,limit,offset,error] of [\n  ['repeat-zero',AS_OF,0,5,0,'R360_INVALID_REPEAT'],\n  ['repeat-over-30',AS_OF,31,5,0,'R360_INVALID_REPEAT'],\n  ['repeat-null',AS_OF,null,5,0,'R360_INVALID_REPEAT'],\n  ['date-null',null,7,5,0,'R360_INVALID_AS_OF'],\n  ['date-infinity','infinity',7,5,0,'R360_INVALID_AS_OF'],\n  ['limit-zero',AS_OF,7,0,0,'R360_INVALID_LIMIT'],\n  ['limit-over',AS_OF,7,26,0,'R360_INVALID_LIMIT'],\n  ['limit-null',AS_OF,7,null,0,'R360_INVALID_LIMIT'],\n  ['offset-negative',AS_OF,7,5,-1,'R360_INVALID_OFFSET'],\n  ['offset-over',AS_OF,7,5,501,'R360_INVALID_OFFSET'],\n  ['offset-null',AS_OF,7,5,null,'R360_INVALID_OFFSET']]){\n  const r=await call(OA,STAFF,asOf,repeat,limit,offset);\n  eq(label+'-400',r.status,400);eq(label+'-code',r.body?.code,'22023');\n  eq(label+'-message',r.body?.message,error);\n }\n const batch=await Promise.all(Array.from({length:64},(_,i)=>{\n  const office=i%3===2?OB:OA,subject=i%3===0?STAFF:i%3===1?OWNER_A:OWNER_B;\n  return call(office,subject,i%2?AS_OF:MARCH,[1,7,30][i%3],(i%4)+1,i%7);\n }));\n batch.forEach((res,i)=>{\n  const office=i%3===2?OB:OA,subject=i%3===0?STAFF:i%3===1?OWNER_A:OWNER_B;\n  yes('parallel-'+i,res,office,subject,i%2?AS_OF:MARCH,[1,7,30][i%3],(i%4)+1,i%7);\n });\n}else if(STAGE==='revoked'){\n for(let i=0;i<12;i++)deny('revoked-staff-'+i,await call(OA,STAFF));\n for(let i=0;i<5;i++)yes('owner-unaffected-'+i,await call(OA,OWNER_A),OA,OWNER_A);\n}else if(STAGE==='restored'){\n for(let i=0;i<12;i++)yes('staff-restored-'+i,await call(OA,STAFF),OA,STAFF);\n}else if(STAGE==='reassigned'){\n for(let i=0;i<12;i++)yes('assignment-recomputed-'+i,await call(OA,STAFF),OA,STAFF);\n for(let i=0;i<5;i++)yes('owner-still-broad-'+i,await call(OA,OWNER_A),OA,OWNER_A);\n}else if(STAGE==='office_paused'){\n for(let i=0;i<12;i++)deny('office-paused-staff-'+i,await call(OA,STAFF));\n for(let i=0;i<6;i++)deny('office-paused-owner-'+i,await call(OA,OWNER_A));\n for(let i=0;i<5;i++)yes('other-office-continues-'+i,await call(OB,OWNER_B),OB,OWNER_B);\n}else if(STAGE==='final'){\n for(const [label,office,subject] of [['owner-A',OA,OWNER_A],['staff-A',OA,STAFF],['owner-B',OB,OWNER_B]])\n  yes('final-'+label,await call(office,subject),office,subject);\n for(const table of ['r335_staff','r342_requests','r352_deadlines']){\n  const res=await fetch(HOST+'/'+table+'?select=*',{\n   headers:{authorization:'Bearer '+token(OWNER_A)},signal:AbortSignal.timeout(12000)});\n  ok('direct-raw-table-closed-'+table,[401,403,404,405].includes(res.status));\n }\n}else throw Error('R360_UNKNOWN_STAGE_'+STAGE);\n\nconsole.log(JSON.stringify({suite:'R360_READ_ONLY_SCOPED_FOLLOWUP_QUEUE_PAGINATION',stage:STAGE,checks,\n signed_jwt:true,independent_pg17_raw_requests:true,independent_pg17_staff_client_graph:true,\n observed_staff_visible:visible(OA,STAFF).length,leap_year_jst:true,cadence:[1,7,30],\n stable_priority_order:true,limit_guard:25,offset_guard:500,parallel_64:true,\n read_only:true,notifications_scheduled:false,notifications_sent:0,production_mutations:0,commercial_release:'HOLD'}));\nR360_R360_HTTP_MJS\nnode --check /tmp/r360_http.mjs\n"
