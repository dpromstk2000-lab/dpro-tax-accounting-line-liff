PASS visits=7 scheduled_visits=5 cancelled=1 completed=1 sends=0 prior_requests=19 prior_deadlines=19';\nEND $r355_final$;\nR355_R355_FINAL_SQL\npgid=\"${{ job.services.pg.id }}\"\ntest -n \"$pgid\"\ndocker exec -i \"$pgid\" psql -X -U postgres -d r331_synthetic -v ON_ERROR_STOP=1 < /tmp/r355_final.sql\n"
