      run: "set -euo pipefail\necho R361_REAL_POSTGREST_ATOMIC_DASHBOARD_PASS real_pg17_requests=true real_pg17_staff_client_graph=true\necho R361_ISOLATED_QA_EVIDENCE formal_r360_pinned=true previous_r360_real_pass=true postgres=disposable_PG17 signed_jwt=true 64_parallel=true six_stages=true atomic_consistent_dashboard=true security_invoker=true notifications=0 queues=0 real_supabase=false real_worker=false real_line=false github_main=false commercial_release=HOLD\n"
