    - name: R358 verify unchanged records, staff restoration, deadlines, audit, ACL
      shell: bash
      run: "set -euo pipefail\ncat >/tmp/r358_final.sql <<'R358_R358_FINAL_SQL'\n\\set ON_ERROR_STOP on\n-- Final invariants after six actual JWT/PostgREST phases in disposable PG17.\nDO $r358_final$\nBEGIN\n IF (SELECT count(*) FROM public.r355_visits)<>7\n OR (SELECT count(*) FROM public.r355_visits WHERE visit_status='scheduled')<>5\n OR (SELECT count(*) FROM public.r355_visits WHERE visit_status='cancelled')<>1\n OR (SELECT count(*) FROM public.r355_visits WHERE visit_status='completed')<>1\n OR (SELECT count(*) FROM public.r342_requests)<>19\n OR (SELECT count(*) FROM public.r342_requests WHERE status='requested')<>16\n OR (SELECT count(*) FROM public.r342_requests WHERE status='completed')<>3\n OR (SELECT count(*) FROM public.r342_audit)<>19\n OR (SELECT count(*) FROM public.r350_status_audit)<>3\n OR (SELECT count(*) FROM public.r352_deadlines)<>19\n OR (SELECT count(*) FROM public.r335_staff WHERE auth_user_id='00000002-0002-4002-8002-000000000002'::uuid AND is_active)<>1\n OR (SELECT count(*) FROM public.r335_offices WHERE id='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa'::uuid AND is_active)<>1\n OR (SELECT assigned_staff_id FROM public.r335_clients WHERE office_id='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa'::uuid AND id='20000000-0000-4000-8000-000000000004'::uuid)\n    IS DISTINCT FROM '10000000-0000-4000-8000-000000000002'::uuid\n OR (SELECT count(*) FROM pg_class WHERE oid IN (\n   'public.r355_visits'::regclass,'public.r342_requests'::regclass,\n   'public.r352_deadlines'::regclass) AND relrowsecurity AND relforcerowsecurity)<>3\n OR has_table_privilege('authenticated','public.r355_visits','SELECT')\n OR has_table_privilege('authenticated','public.r342_requests','SELECT')\n OR has_table_privilege('authenticated','public.r352_deadlines','SELECT')\n OR has_table_privilege('authenticated','public.r342_requests','INSERT')\n OR has_table_privilege('authenticated','public.r352_deadlines','INSERT')\n OR has_function_privilege('anon','public.r358_preview_material_followups(uuid,timestamptz,integer,integer,integer)','EXECUTE')\n OR NOT has_function_privilege('authenticated','public.r358_preview_material_followups(uuid,timestamptz,integer,integer,integer)','EXECUTE')\n OR (SELECT rolname FROM pg_roles WHERE oid=(SELECT proowner FROM pg_proc WHERE\n   oid='public.r358_preview_material_followups(uuid,timestamptz,integer,integer,integer)'::regprocedure))<>'r342_executor'\n OR (SELECT rolcanlogin OR rolbypassrls FROM pg_roles WHERE rolname='r342_executor') IS DISTINCT FROM false\n THEN RAISE EXCEPTION 'R358_FINAL_INVARIANT_DRIFT_HOLD'; END IF;\n RAISE NOTICE 'R358_MATERIAL_FOLLOWUP_FINAL_PASS visits=7 requests=19 pending=16 completed=3 deadlines=19 sends=0 assignments_restored=true ACL=locked';\nEND $r358_final$;\nR358_R358_FINAL_SQL\npgid=\"${{ job.services.pg.id }}\"\ntest -n \"$pgid\"\ndocker exec -i \"$pgid\" psql -X -U postgres -d r331_synthetic -v ON_ERROR_STOP=1 < /tmp/r358_final.sql\n"
