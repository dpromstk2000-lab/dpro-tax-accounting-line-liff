    - name: R341 prepare real HTTP write attempts against disposable PostgreSQL only
      shell: bash
      run: "set -euo pipefail\ncat > /tmp/r341_http.mjs <<'R341_NODE'\nimport assert from 'node:assert/strict';\nimport {createHmac} from 'node:crypto';\nconst phase=process.env.R341_PHASE;\nassert.ok(['baseline','excessive_grant','restored'].includes(phase));\nconst host='http://127.0.0.1:3000';\nconst key='R335_SYNTHETIC_JWT_SIGNING_KEY_NOT_REAL_1234567890';\nconst b64=o=>Buffer.from(JSON.stringify(o)).toString('base64url');\nconst jwt=sub=>{let h=b64({alg:'HS256',typ:'JWT'}),p=b64({sub,role:'authenticated',iat:Math.floor(Date.now()/1000)-10,exp:Math.floor(Date.now()/1000)+3600});return `${h}.${p}.${createHmac('sha256',key).update(h+'.'+p).digest('base64url')}`;};\nconst office={A:'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',B:'bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb'};\nconst staff={A:'10000000-0000-4000-8000-000000000002',B:'10000000-0000-4000-8000-000000000003'};\nconst client=n=>'20000000-0000-4000-8000-'+String(n).padStart(12,'0');\nconst actors={staffA:jwt('00000002-0002-4002-8002-000000000002'),ownerB:jwt('00000003-0003-4003-8003-000000000003'),anon:null};\nlet checks=0;\nfunction eq(n,a,b){assert.deepEqual(a,b,`${phase} ${n}`);checks++}\nfunction ok(n,v){assert.ok(v,`${phase} ${n}`);checks++}\nasync function request(token,path,method='GET',body,prefer){\n const r=await fetch(host+path,{method,headers:{accept:'application/json',...(token?{authorization:'Bearer '+token}:{}),...(body?{'content-type':'application/json'}:{}),...(prefer?{prefer}:{})},body:body?JSON.stringify(body):undefined,redirect:'manual',signal:AbortSignal.timeout(6000)});\n const raw=await r.text();let json=null;if(raw){try{json=JSON.parse(raw)}catch{throw Error(`R341_NON_JSON_RESPONSE_${method}_${r.status}_${raw.slice(0,100)}`)}}\n return {status:r.status,raw,json};\n}\nconst createRow=(o,s,n)=>({id:client(n),office_id:o,assigned_staff_id:s,title:'R341_UNAUTHORIZED_SYNTHETIC_WRITE'});\nasync function noMutation(n,result,method){\n // INSERT and UPSERT must return a clear rejection. PATCH and DELETE may safely affect 0 rows.\n if(method==='POST'){\n  ok(n+'-write-rejected',[401,403].includes(result.status));\n }else if([401,403].includes(result.status)){\n  ok(n+'-write-rejected',true);\n }else{\n  ok(n+'-zero-row-success-status',[200,204].includes(result.status));\n  ok(n+'-zero-row-body',result.raw==='' || (Array.isArray(result.json) && result.json.length===0));\n }\n ok(n+'-no-secret-body',!result.raw.includes('R341_UNAUTHORIZED_SYNTHETIC_WRITE'));\n}\nfor(const [actor,token] of Object.entries(actors)){\n const o=actor==='ownerB'?office.B:office.A,s=actor==='ownerB'?staff.B:staff.A,target=actor==='ownerB'?client(3):client(1);\n const newRow=createRow(o,s,actor==='ownerB'?901:902);\n await noMutation(actor+'-insert',await request(token,'/r335_clients','POST',newRow,'return=representation'),'POST');\n const upsertRow={...newRow,id:target};\n await noMutation(actor+'-upsert',await request(token,'/r335_clients?on_conflict=id','POST',upsertRow,'resolution=merge-duplicates,return=representation'),'POST');\n await noMutation(actor+'-patch',await request(token,'/r335_clients?id=eq.'+target,'PATCH',{title:'R341_UNAUTHORIZED_SYNTHETIC_WRITE'},'return=representation'),'PATCH');\n await noMutation(actor+'-delete',await request(token,'/r335_clients?id=eq.'+target,'DELETE',undefined,'return=representation'),'DELETE');\n const r=await request(token,'/r335_clients?select=id,title&order=id.asc');\n if(actor==='anon')ok(actor+'-select-denied',[401,403].includes(r.status));\n else {eq(actor+'-read-kept',r.status,200);ok(actor+'-rows-positive',Array.isArray(r.json)&&r.json.length>0);ok(actor+'-not-mutated',!r.raw.includes('R341_UNAUTHORIZED_SYNTHETIC_WRITE'));}\n}\nconsole.log(JSON.stringify({suite:'DPRO_TAX_R341_REAL_POSTGREST_WRITE_BARRIER',phase,checks,actions:['POST','UPSERT','PATCH','DELETE'],actors:3,synthetic_postgresql17:true,actual_postgrest_v12:true,production:false,commercial_release:'HOLD'}));\nR341_NODE\nnode --check /tmp/r341_http.mjs\n"
