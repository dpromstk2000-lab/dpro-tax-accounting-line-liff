es.status===404);\n  ok(name+'-no-sensitive-response',!ids.some(i=>res.raw.includes(i)));\n  ok(name+'-no-fake-staff-count',res.body?.staff_count!==4);\n }\n}\n// Legitimate users must retain correctly scoped client API access after revocation.\nfor(const [name,token,visible] of [\n ['staffA',actors.staffA,['20000000-0000-4000-8000-000000000001','20000000-0000-4000-8000-000000000004','20000000-0000-4000-8000-000000000005','20000000-0000-4000-8000-000000000006']],\n ['ownerB',actors.ownerB,['20000000-0000-4000-8000-000000000003','20000000-0000-4000-8000-000000000007','20000000-0000-4000-8000-000000000008']]]){\n const r=await call('/r335_clients?select=id&order=id.asc',token);\n eq(name+'-legitimate-client-read',r.status,200);\n eq(name+'-client-scope-unchanged',r.body?.map(x=>x.id),visible);\n}\nconsole.log(JSON.stringify({suite:'DPRO_TAX_R339_REAL_POSTGREST_SECURITY_DEFINER_RPC_LEAK_AND_REVOCATION',stage,checks,synthetic_only:true,real_postgrest:process.env.R339_LOCAL_MOCK!=='true',real_supabase:false,commercial_release:'HOLD'}));\nR339_HTTP\nnode --check /tmp/r339_rpc_http.mjs\ncat > /tmp/r339_rpc_revoke.sql <<'R339_REVOKE'\n\\set ON_ERROR_STOP on\n-- Fail closed: revoke EXECUTE including the implicit PUBLIC default.\nREVOKE ALL ON FUNCTION public.r339_insecure_directory() FROM PUBLIC,anon,authenticated;\nDO $r339_lock$ BEGIN\n IF has_function_privilege('anon','public.r339_insecure_directory()','EXECUTE') THEN RAISE EXCEPTION 'R339_ANON_RPC_STILL_EXECUTABLE'; END IF;\n IF has_function_privilege('authenticated','public.r339_insecure_directory()','EXECUTE') THEN RAISE EXCEPTION 'R339_AUTH_RPC_STILL_EXECUTABLE'; END IF;\n IF has_table_privilege('authenticated','public.r335_staff','SELECT') OR has_table_privilege('authenticated','public.r335_offices','SELECT') THEN\n RAISE EXCEPTION 'R339_REFERENCE_SELECT_GRANT_REGRESSION'; END IF;\n IF (SELECT count(*) FROM pg_class WHERE oid IN ('public.r335_staff'::regclass,'public.r335_offices'::regclass)\n AND relrowsecurity AND 