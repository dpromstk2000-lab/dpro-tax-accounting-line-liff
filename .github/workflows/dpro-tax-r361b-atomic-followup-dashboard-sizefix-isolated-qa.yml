'-Content-Range',Number(r.count?.split('/').at(-1)),count);\n}\nconst resources={staff:'r340_leaky_staff_view',offices:'r340_leaky_offices_view',clients:'r340_leaky_clients_view'};\nfor(const [actor,token] of Object.entries(actors)){\n for(const [type,resource] of Object.entries(resources)){\n  const r=await get(resource,token);\n  if(phase==='exposed'){\n   const expected=type==='staff'?4:type==='offices'?2:8;\n   assertRows(`${actor}-${type}-UNSAFE_VISIBLE`,r,expected);\n   if(type==='staff'||type==='clients'){\n    eq(`${actor}-${type}-cross-office-A`,r.body.some(x=>x.office_id===A),true);\n    eq(`${actor}-${type}-cross-office-B`,r.body.some(x=>x.office_id===B),true);\n   }else eq(`${actor}-office-IDs`,r.body.map(x=>x.id),[A,B]);\n  } else if(phase==='invoker'||phase==='accidental_grant'){\n   if(type==='clients'&&actor!=='anon')assertRows(`${actor}-clients-security-invoker`,r,scopes[actor].length,scopes[actor]);\n   else if(phase==='accidental_grant'&&actor!=='anon'&&type!=='clients')assertRows(`${actor}-${type}-forced-RLS-empty`,r,0,[]);\n   else {ok(`${actor}-${type}-denied`,[401,403].includes(r.status));ok(`${actor}-${type}-no-cross-tenant-ids`,!r.raw.includes(A)&&!r.raw.includes(B));}\n  }else{\n   ok(`${actor}-${type}-view-revoked`,[401,403].includes(r.status));\n   ok(`${actor}-${type}-no-sensitive-json`,!r.raw.includes(A)&&!r.raw.includes(B));\n  }\n }\n // HEAD metadata protection: sample one vulnerable view and the client view.\n for(const type of ['staff','clients']){\n  const h=await get(resources[type],token,'HEAD');\n  eq(`${actor}-${type}-HEAD-no-response-body`,h.raw,'');\n  if(phase==='exposed'){\n   eq(`${actor}-${type}-HEAD-status`,h.status,200);\n   eq(`${actor}-${type}-HEAD-leaked-count`,Number(h.count?.split('/').at(-1)),type==='staff'?4:8);\n  }else if((phase==='invoker'||phase==='accidental_grant')&&type==='clients'&&actor!=='anon'){\n   eq(`${actor}-clients-HEAD-status`,h.status,200);\n   eq(`${actor}-clients-HEAD-count`,Number(h.count?.split('/').at(-1)),scopes[actor].length);\n  }else if(phase==='accidental_grant'&&type==='staff'&&actor!=='anon'){\n   eq(`${actor}-staff-HEAD-deny-leak`,h.status,200);\n   eq(`${actor}-staff-HEAD-zero`,Number(h.count?.split('/').at(-1)),0);\n  }else ok(`${actor}-${type}-HEAD-denied`,[401,403].includes(h.status));\n }\n if(actor!=='anon'){\n  const direct=await get('r335_clients',token);\n  assertRows(`${actor}-direct-RLS-unchanged`,direct,scopes[actor].length,scopes[actor]);\n }\n}\nconsole.log(JSON.stringify({suite:'DPRO_TAX_R340_REAL_POSTGREST_SECURITY_INVOKER_VIEW_RLS_BYPASS',phase,checks,real_postgrest_v12:true,synthetic_pg17:true,protected_tables:3,production:false,commercial_release:'HOLD'}));\nR340_NODE\nnode --check /tmp/r340_view_http.mjs\n"
