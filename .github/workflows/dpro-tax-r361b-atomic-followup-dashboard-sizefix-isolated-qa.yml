    - name: R354 verify immutable requests, audits, forced RLS and restored assignment
      shell: bash
      run: "set -euo pipefail\ncat >/tmp/r354_final.sql <<'R354_R354_FINAL_SQL'\n\\set ON_ERROR_STOP on\nDO $r354_final$ BEGIN\n IF (SELECT count(*) FROM public.r342_requests)<>19\n OR (SELECT count(*) FROM public.r342_audit)<>19\n OR (SELECT count(*) FROM public.r350_status_audit)<>3\n OR (SELECT count(*) FROM public.r342_requests WHERE status='completed')<>3\n OR (SELECT count(*) FROM public.r352_deadlines)<>19\n OR (SELECT is_active FROM public.r335_staff\n   WHERE auth_user_id='00000002-0002-4002-8002-000000000002'::uuid) IS DISTINCT FROM true\n OR (SELECT is_active FROM public.r335_offices\n   WHERE id='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa'::uuid) IS DISTINCT FROM true\n OR (SELECT assigned_staff_id FROM public.r335_clients\n   WHERE id='20000000-0000-4000-8000-000000000004'::uuid)\n IS DISTINCT FROM '10000000-0000-4000-8000-000000000002'::uuid\n OR (SELECT rolname FROM pg_roles WHERE oid=(SELECT proowner FROM pg_proc\n   WHERE oid='public.r354_office_reminder_digest(uuid,timestamptz)'::regprocedure))<>'r342_executor'\n OR (SELECT rolcanlogin OR rolbypassrls FROM pg_roles\n   WHERE rolname='r342_executor') IS DISTINCT FROM false\n OR has_function_privilege('anon','public.r354_office_reminder_digest(uuid,timestamptz)','EXECUTE')\n OR NOT has_function_privilege('authenticated','public.r354_office_reminder_digest(uuid,timestamptz)','EXECUTE')\n OR has_table_privilege('authenticated','public.r342_requests','SELECT')\n OR has_table_privilege('authenticated','public.r352_deadlines','SELECT')\n THEN RAISE EXCEPTION 'R354_AUDIT_SECURITY_OR_ASSIGNMENT_DRIFT_HOLD'; END IF;\n RAISE NOTICE 'R354_PG17_FINAL_IMMUTABLE_BASELINE_PASS requests=19 create_audit=19 completed=3 completion_audit=3 deadlines=19 sends=0';\nEND $r354_final$;\nR354_R354_FINAL_SQL\npgid=\"${{ job.services.pg.id }}\"\ntest -n \"$pgid\"\ndocker exec -i \"$pgid\" psql -X -U postgres -d r331_synthetic -v ON_ERROR_STOP=1 < /tmp/r354_final.sql\n"
