    - name: R351 install actual signed JWT creation retry HTTP assertions
      shell: bash
      run: "set -euo pipefail\ncat >/tmp/r351_http.mjs <<'R351_HTTP'\nimport assert from 'node:assert/strict';\nimport {createHmac} from 'node:crypto';\nimport {readFileSync} from 'node:fs';\nconst DATA=JSON.parse(readFileSync('/tmp/r351_samples.json','utf8'));\nconst HOST='http://127.0.0.1:3000', SECRET='R335_SYNTHETIC_JWT_SIGNING_KEY_NOT_REAL_1234567890';\nconst OA='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa';\nconst STAFF='00000002-0002-4002-8002-000000000002';\nconst OWNER_A='00000005-0005-4005-8005-000000000005';\nconst OWNER_B='00000003-0003-4003-8003-000000000003';\nconst STAGE=process.env.R351_STAGE||'before';\nconst enc=x=>Buffer.from(JSON.stringify(x)).toString('base64url');\nconst jwt=(sub,extra={})=>{const h=enc({alg:'HS256',typ:'JWT'}),p=enc({sub,role:'authenticated',exp:4102444800,...extra});return h+'.'+p+'.'+createHmac('sha256',SECRET).update(h+'.'+p).digest('base64url');};\nlet checks=0;function eq(n,a,b){assert.deepEqual(a,b,n);checks++}function ok(n,b){assert.ok(b,n);checks++}\nasync function call(item,sub=item.actor_auth_id,office=item.office_id,client=item.client_id,key=item.request_key,token=jwt(sub)){\n const r=await fetch(HOST+'/rpc/r342_create_request',{method:'POST',headers:{'content-type':'application/json',accept:'application/json',...(token?{authorization:'Bearer '+token}:{})},body:JSON.stringify({p_office:office,p_client:client,p_key:key}),signal:AbortSignal.timeout(14000)});\n const raw=await r.text();let body;try{body=raw?JSON.parse(raw):null}catch{throw Error('R351_NONJSON_'+r.status+'_'+raw.slice(0,90))}return {code:r.status,body};\n}\nfunction good(prefix,r,item,status){eq(prefix+'-http',r.code,200);eq(prefix+'-id',r.body?.id,item.id);eq(prefix+'-created',r.body?.created,false);eq(prefix+'-status',r.body?.status,status);eq(prefix+'-keys',Object.keys(r.body).sort(),['created','id','status']);}\nfunction deny(prefix,r){eq(prefix+'-403',r.code,403);eq(prefix+'-sqlstate',r.body?.code,'42501');eq(prefix+'-generic',r.body?.message,'R342_ACCESS_DENIED');ok(prefix+'-no-status',r.body?.status===undefined);}\nfor(let i=0;i<3;i++){\n ok('completed-fixture-'+i,DATA.completed[i]?.status==='completed');\n ok('requested-fixture-'+i,DATA.requested[i]?.status==='requested');\n}\nif(STAGE==='before'){\n // Prove the inherited defect exists. A passing BEFORE run is evidence of the wrong response.\n for(let i=0;i<3;i++){\n  const r=await call(DATA.completed[i]);good('before-completed-stale-'+i,r,DATA.completed[i],'requested');\n }\n for(let i=0;i<3;i++)good('before-requested-'+i,await call(DATA.requested[i]),DATA.requested[i],'requested');\n}else if(STAGE==='after'){\n for(let i=0;i<3;i++)good('completed-now-correct-'+i,await call(DATA.completed[i]),DATA.completed[i],'completed');\n for(let i=0;i<3;i++)good('requested-still-correct-'+i,await call(DATA.requested[i]),DATA.requested[i],'requested');\n const race=await Promise.all(Array.from({length:36},(_,i)=>{\n   const item=DATA.completed[i%3];return call(item).then(r=>({item,r}));\n }));\n race.forEach((x,i)=>good('parallel-completed-'+i,x.r,x.item,'completed'));\n const uncompleted=await Promise.all(Array.from({length:18},(_,i)=>call(DATA.requested[i%3])));\n uncompleted.forEach((r,i)=>good('parallel-requested-'+i,r,DATA.requested[i%3],'requested'));\n for(let i=0;i<8;i++){\n   const item=DATA.completed[i%3],wrong=item.office_id===OA?OWNER_B:OWNER_A;\n   deny('other-office-'+i,await call(item,wrong));\n }\n const invalid=await call(DATA.completed[0],DATA.completed[0].actor_auth_id,DATA.completed[0].office_id,DATA.completed[0].client_id,'R351 INVALID KEY');\n eq('invalid-key-code',invalid.code,400);eq('invalid-key-message',invalid.body?.message,'R342_INVALID_REQUEST');\n}else if(STAGE==='revoked'){\n const own=DATA.completed.find(x=>x.actor_auth_id===STAFF);\n ok('must-have-completed-staff-request',!!own);\n for(let i=0;i<12;i++)deny('staff-revoked-'+i,await call(own));\n for(let i=0;i<6;i++)good('owner-still-valid-'+i,await call(DATA.completed.find(x=>x.actor_auth_id===OWNER_B)),DATA.completed.find(x=>x.actor_auth_id===OWNER_B),'completed');\n}else if(STAGE==='restored'){\n const own=DATA.completed.find(x=>x.actor_auth_id===STAFF);ok('must-have-staff-request',!!own);\n for(let i=0;i<14;i++)good('staff-restored-'+i,await call(own),own,'completed');\n}else if(STAGE==='final'){\n for(let i=0;i<3;i++)good('final-completed-'+i,await call(DATA.completed[i]),DATA.completed[i],'completed');\n for(let i=0;i<3;i++)good('final-requested-'+i,await call(DATA.requested[i]),DATA.requested[i],'requested');\n}else throw Error('R351_STAGE_UNRECOGNIZED_'+STAGE);\nconsole.log(JSON.stringify({suite:'R351_REAL_POSTGREST_CREATION_RETRY_LIVE_COMPLETION_STATUS',stage:STAGE,checks,signed_jwt:true,synthetic_pg17:true,real_supabase:false,commercial_release:'HOLD'}));\nR351_HTTP\nnode --check /tmp/r351_http.mjs\n"
