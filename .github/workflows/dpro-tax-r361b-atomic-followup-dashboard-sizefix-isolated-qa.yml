    - name: R344 prepare exact audit-failure and recovery HTTP assertions
      shell: bash
      run: "set -euo pipefail\ncat >/tmp/r344_http.mjs <<'R344_HTTP'\nimport assert from 'node:assert/strict';\nimport {createHmac} from 'node:crypto';\nconst STAGE=process.env.R344_STAGE??'failure';\nconst secret='R335_SYNTHETIC_JWT_SIGNING_KEY_NOT_REAL_1234567890';\nconst enc=o=>Buffer.from(JSON.stringify(o)).toString('base64url');\nfunction token(sub){let h=enc({alg:'HS256',typ:'JWT'}),p=enc({sub,role:'authenticated',exp:Math.floor(Date.now()/1000)+3600});return `${h}.${p}.${createHmac('sha256',secret).update(h+'.'+p).digest('base64url')}`;}\nconst actors={staffA:{sub:'00000002-0002-4002-8002-000000000002',office:'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',client:'20000000-0000-4000-8000-000000000004',existing:'R343_AFTER_0000001',key:'R344_ATOMIC_A_000001'},ownerB:{sub:'00000003-0003-4003-8003-000000000003',office:'bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb',client:'20000000-0000-4000-8000-000000000003',existing:'R343_AFTER_0000002',key:'R344_ATOMIC_B_000001'}};\nlet checks=0;const eq=(name,a,b)=>{assert.deepEqual(a,b,name);checks++};const ok=(name,a)=>{assert.ok(a,name);checks++};\nasync function rpc(who,key){const a=actors[who];const res=await fetch('http://127.0.0.1:3000/rpc/r342_create_request',{method:'POST',headers:{accept:'application/json','content-type':'application/json',authorization:'Bearer '+token(a.sub)},body:JSON.stringify({p_office:a.office,p_client:a.client,p_key:key}),signal:AbortSignal.timeout(8500)});const raw=await res.text();let body;try{body=raw?JSON.parse(raw):null}catch{throw Error('R344_NON_JSON_REPLY_'+res.status+'_'+raw.slice(0,100))}return {status:res.status,body};}\nconst names=Object.keys(actors);\nif(STAGE==='failure'){\n for(const who of names){\n  // Existing idempotent requests need no new audit INSERT and should stay usable.\n  const old=await rpc(who,actors[who].existing);eq(who+'-old-http',old.status,200);eq(who+'-old-created',old.body?.created,false);ok(who+'-old-id',/^[0-9a-f-]{36}$/i.test(old.body?.id??''));\n }\n const responses=await Promise.all(names.flatMap(who=>Array.from({length:8},()=>rpc(who,actors[who].key).then(r=>({who,...r})))));\n for(const [i,r] of responses.entries()){\n  eq('failure-'+i+'-http',r.status,400);\n  eq('failure-'+i+'-sqlstate',r.body?.code,'23514');\n  eq('failure-'+i+'-exact-reason',r.body?.message,'R344_INJECTED_AUDIT_FAILURE');\n }\n}else if(STAGE==='recovered'){\n // Eight same-key concurrent POSTs per tenant: exactly one request and audit each.\n const responses=await Promise.all(names.flatMap(who=>Array.from({length:8},()=>rpc(who,actors[who].key).then(r=>({who,...r})))));\n for(const [i,r] of responses.entries()){\n  eq('recovery-'+i+'-http',r.status,200);\n  eq('recovery-'+i+'-state',r.body?.status,'requested');\n  ok('recovery-'+i+'-uuid',/^[0-9a-f-]{36}$/i.test(r.body?.id??''));\n }\n for(const who of names){\n  const group=responses.filter(r=>r.who===who);eq(who+'-one-created',group.filter(r=>r.body.created).length,1);\n  ok(who+'-same-id',group.every(r=>r.body.id===group[0].body.id));\n  const again=await rpc(who,actors[who].key);eq(who+'-retry-http',again.status,200);eq(who+'-retry-not-created',again.body?.created,false);eq(who+'-retry-same-id',again.body?.id,group[0].body.id);\n }\n}else throw Error('R344_INVALID_STAGE_'+STAGE);\nconsole.log(JSON.stringify({suite:'R344_REAL_POSTGREST_TRANSACTIONAL_AUDIT_ROLLBACK',stage:STAGE,checks,concurrent_attempts:16,synthetic_only:true,real_supabase:false,commercial_release:'HOLD'}));\nR344_HTTP\nnode --check /tmp/r344_http.mjs\n"
