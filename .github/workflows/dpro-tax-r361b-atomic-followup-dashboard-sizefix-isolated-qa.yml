FROM pg_roles WHERE rolname='r342_executor') IS DISTINCT FROM false\n THEN RAISE EXCEPTION 'R356_AUDIT_OR_PRIVILEGE_DRIFT_HOLD'; END IF;\n RAISE NOTICE 'R356_VISIT_MATERIAL_FINAL_PASS visits=7 requests=19 deadlines=19 sends=0 restored=true';\nEND $r356_final$;\nR356_R356_FINAL_SQL\npgid=\"${{ job.services.pg.id }}\"\ntest -n \"$pgid\"\ndocker exec -i \"$pgid\" psql -X -U postgres -d r331_synthetic -v ON_ERROR_STOP=1 < /tmp/r356_final.sql\n"
