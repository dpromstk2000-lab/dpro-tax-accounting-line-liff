    - name: R349 verify previous R348 source has not drifted and install scoped detail RPC
      shell: bash
      run: "set -euo pipefail\ncat >/tmp/r349_rpc.sql <<'R349_SQL'\n\\set ON_ERROR_STOP on\n-- Disposable PG17 only. This RPC is a design candidate, not a commercial migration.\nCREATE FUNCTION public.r349_get_request(p_office uuid,p_request uuid)\nRETURNS jsonb LANGUAGE plpgsql STABLE SECURITY DEFINER SET search_path=pg_catalog\nAS $r349_rpc$\nDECLARE\n v_claims jsonb; v_sub text; v_actor uuid; v_staff uuid; v_broad boolean;\n v_details jsonb;\nBEGIN\n v_claims:=nullif(current_setting('request.jwt.claims',true),'')::jsonb;\n v_sub:=v_claims->>'sub';\n IF (v_claims->>'role') IS DISTINCT FROM 'authenticated'\n    OR v_sub IS NULL OR v_sub !~* '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'\n    OR p_office IS NULL OR p_request IS NULL\n THEN RAISE EXCEPTION 'R349_ACCESS_DENIED' USING ERRCODE='42501'; END IF;\n v_actor:=v_sub::uuid;\n SELECT s.id,(s.role IN ('owner','admin') OR s.can_view_all_clients)\n INTO v_staff,v_broad\n FROM public.r335_staff s JOIN public.r335_offices o ON o.id=s.office_id\n WHERE s.office_id=p_office AND s.auth_user_id=v_actor AND s.is_active AND o.is_active\n LIMIT 1;\n IF v_staff IS NULL THEN RAISE EXCEPTION 'R349_ACCESS_DENIED' USING ERRCODE='42501'; END IF;\n SELECT jsonb_build_object('id',r.id,'client_id',r.client_id,'status',r.status,'created_at',r.created_at)\n INTO v_details\n FROM public.r342_requests r JOIN public.r335_clients c ON c.id=r.client_id AND c.office_id=r.office_id\n WHERE r.id=p_request AND r.office_id=p_office\n  AND (v_broad OR c.assigned_staff_id=v_staff)\n LIMIT 1;\n IF v_details IS NULL THEN RAISE EXCEPTION 'R349_ACCESS_DENIED' USING ERRCODE='42501'; END IF;\n RETURN v_details;\nEND;\n$r349_rpc$;\nALTER FUNCTION public.r349_get_request(uuid,uuid) OWNER TO r342_executor;\nREVOKE ALL ON FUNCTION public.r349_get_request(uuid,uuid) FROM PUBLIC,anon;\nGRANT EXECUTE ON FUNCTION public.r349_get_request(uuid,uuid) TO authenticated;\nNOTIFY pgrst, 'reload schema';\nDO $r349_guard$ BEGIN\n IF (SELECT count(*) FROM public.r342_requests)<>19 OR (SELECT count(*) FROM public.r342_audit)<>19 THEN RAISE EXCEPTION 'R349_R348_BASELINE_19'; END IF;\n IF (SELECT rolcanlogin OR rolbypassrls FROM pg_roles WHERE rolname='r342_executor') IS DISTINCT FROM false THEN RAISE EXCEPTION 'R349_EXECUTOR_DRIFT'; END IF;\n IF has_function_privilege('anon','public.r349_get_request(uuid,uuid)','EXECUTE') OR has_table_privilege('authenticated','public.r342_requests','SELECT') OR has_table_privilege('authenticated','public.r342_audit','SELECT') THEN RAISE EXCEPTION 'R349_PRIVATE_ROW_EXPOSED'; END IF;\n IF (SELECT count(*) FROM pg_proc WHERE proname='r349_get_request' AND prosecdef)<>1 THEN RAISE EXCEPTION 'R349_DEFINER_MISSING'; END IF;\n RAISE NOTICE 'R349_REQUEST_DETAIL_RPC_READY: request_rows=19 audit=19 return_columns=4';\nEND $r349_guard$;\nR349_SQL\npgid=\"${{ job.services.pg.id }}\"\n[ -n \"$pgid\" ]\ndocker exec -i \"$pgid\" psql -X -U postgres -d r331_synthetic -v ON_ERROR_STOP=1 < /tmp/r349_rpc.sql\n"
    - name: R349 install independent SQL detail oracle and signed JWT HTTP verifier
      shell: bash
      run: "set -euo pipefail\ncat >/tmp/r349_oracle.sql <<'R349_ORACLE'\n\\set ON_ERROR_STOP on\nWITH allrows AS (\n SELECT r.id,r.office_id,r.client_id,r.status,r.created_at,c.assigned_staff_id,\n        jsonb_build_object('id',r.id,'client_id',r.client_id,'status',r.status,'created_at',r.created_at) AS detail\n FROM public.r342_requests r JOIN public.r335_clients c ON c.id=r.client_id AND c.office_id=r.office_id\n)\nSELECT jsonb_build_object(\n 'ownerA',coalesce((SELECT jsonb_agg(detail ORDER BY created_at DESC,id DESC) FROM allrows WHERE office_id='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa'::uuid),'[]'::jsonb),\n 'ownerB',coalesce((SELECT jsonb_agg(detail ORDER BY created_at DESC,id DESC) FROM allrows WHERE office_id='bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb'::uuid),'[]'::jsonb),\n 'staffA',coalesce((SELECT jsonb_agg(detail ORDER BY created_at DESC,id DESC) FROM allrows WHERE office_id='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa'::uuid AND assigned_staff_id='10000000-0000-4000-8000-000000000002'::uuid),'[]'::jsonb),\n 'client4',coalesce((SELECT jsonb_agg(detail ORDER BY created_at DESC,id DESC) FROM allrows WHERE office_id='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa'::uuid AND client_id='20000000-0000-4000-8000-000000000004'::uuid),'[]'::jsonb),\n 'allids',coalesce((SELECT jsonb_agg(id ORDER BY id) FROM allrows),'[]'::jsonb)\n)::text;\nR349_ORACLE\ncat >/tmp/r349_http.mjs <<'R349_HTTP'\nimport assert from 'node:assert/strict';\nimport {createHmac} from 'node:crypto';\nimport {readFileSync} from 'node:fs';\nconst HOST='http://127.0.0.1:3000',SECRET='R335_SYNTHETIC_JWT_SIGNING_KEY_NOT_REAL_1234567890';\nconst A='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',B='bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb';\nconst ACTORS={ownerA:'00000005-0005-4005-8005-000000000005',ownerB:'00000003-0003-4003-8003-000000000003',staffA:'00000002-0002-4002-8002-000000000002',disabled:'00000004-0004-4004-8004-000000000004'};\nconst STAGE=process.env.R349_STAGE??'baseline';\nconst e=JSON.parse(readFileSync(process.env.R349_ORACLE??'/tmp/r349_oracle.json','utf8'));\nconst enc=x=>Buffer.from(JSON.stringify(x)).toString('base64url');\nconst jwt=(sub,extra={})=>{const a=enc({alg:'HS256',typ:'JWT'}),b=enc({sub,role:'authenticated',exp:4102444800,...extra});return a+'.'+b+'.'+createHmac('sha256',SECRET).update(a+'.'+b).digest('base64url');};\nconst tokens=Object.fromEntries(Object.entries(ACTORS).map(([k,v])=>[k,jwt(v)]));\nlet checks=0; const eq=(label,x,y)=>{assert.deepEqual(x,y,label);checks++};const ok=(label,x)=>{assert.ok(x,label);checks++};\nasync function api(who,office,id,token=tokens[who]){\n const resp=await fetch(HOST+'/rpc/r349_get_request',{method:'POST',headers:{accept:'application/json','content-type':'application/json',...(token?{authorization:'Bearer '+token}:{})},body:JSON.stringify({p_office:office,p_request:id}),signal:AbortSignal.timeout(12000)});\n const raw=await resp.text();let body=null;try{body=raw?JSON.parse(raw):null}catch{throw Error('R349_NON_JSON_'+resp.status+'_'+raw.slice(0,120))}return {status:resp.status,body};\n}\nfunction match(label,r,expected){eq(label+'-200',r.status,200);eq(label+'-record',r.body,expected);eq(label+'-safe-keys',Object.keys(r.body).sort(),['client_id','created_at','id','status']);eq(label+'-state',r.body.status,'requested');}\nfunction denied(label,r){eq(label+'-403',r.status,403);eq(label+'-sqlstate',r.body?.code,'42501');eq(label+'-generic',r.body?.message,'R349_ACCESS_DENIED');ok(label+'-no-details',r.body?.client_id===undefined);}\nconst empty='00000000-0000-4000-8000-000000000000';\nconst pick=(items,n)=>{ok('nonempty-'+n,items.length>0);return items[0];};\nconst staffItem=pick(e.staffA,'staff'),staffC4=pick(e.client4,'client4'),bItem=pick(e.ownerB,'officeB');\nif(STAGE==='baseline'||STAGE==='restored'){\n for(const [who,office,list] of [['ownerA',A,e.ownerA],['ownerB',B,e.ownerB],['staffA',A,e.staffA]]){\n  for(const [i,item] of list.entries())match('allowed-'+who+'-'+i,await api(who,office,item.id),item);\n }\n for(let i=0;i<12;i++){\n  denied('cross-ownerA-'+i,await api('ownerA',A,bItem.id));\n  denied('cross-ownerB-'+i,await api('ownerB',B,staffItem.id));\n  denied('cross-staffA-'+i,await api('staffA',A,bItem.id));\n  denied('foreign-office-'+i,await api('staffA',B,staffItem.id));\n  denied('missing-id-'+i,await api('ownerA',A,empty));\n  denied('disabled-'+i,await api('disabled',A,staffItem.id));\n }\n const unassigned=e.ownerA.find(x=>!e.staffA.some(s=>s.id===x.id));\n if(unassigned){for(let i=0;i<6;i++)denied('other-staff-client-'+i,await api('staffA',A,unassigned.id));}\n for(let i=0;i<8;i++)denied('null-id-'+i,await api('ownerA',A,null));\n const extra=jwt(ACTORS.staffA,{office_id:B,is_admin:true,can_view_all_clients:true});\n denied('jwt-claim-spoof',await api('staffA',B,bItem.id,extra));\n let noJWT=await api('ownerA',A,staffItem.id,null);ok('anonymous-blocked',[401,403,404].includes(noJWT.status));\n let invalidRole=await api('ownerA',A,staffItem.id,jwt(ACTORS.ownerA,{role:'anon'}));ok('wrong-role-blocked',[401,403,404].includes(invalidRole.status));\n if(STAGE==='baseline'){\n  const jobs=await Promise.all(Array.from({length:48},(_,i)=>{\n   if(i%3===0)return api('staffA',A,staffItem.id).then(r=>({type:'allow',r,expected:staffItem}));\n   if(i%3===1)return api('ownerA',A,bItem.id).then(r=>({type:'deny',r}));\n   return api('ownerB',B,bItem.id).then(r=>({type:'allow',r,expected:bItem}));\n  }));\n  jobs.forEach((t,i)=>t.type==='allow'?match('parallel-'+i,t.r,t.expected):denied('parallel-'+i,t.r));\n }\n}else if(STAGE==='revoked'){\n for(let i=0;i<16;i++)denied('revoked-staff-'+i,await api('staffA',A,staffItem.id));\n for(let i=0;i<8;i++)match('revoked-owner-'+i,await api('ownerA',A,staffItem.id),staffItem);\n for(let i=0;i<8;i++)denied('revoked-foreign-'+i,await api('ownerB',B,staffItem.id));\n}else if(STAGE==='reassigned'){\n for(let i=0;i<16;i++)denied('reassigned-staff-'+i,await api('staffA',A,staffC4.id));\n for(let i=0;i<8;i++)match('reassigned-owner-'+i,await api('ownerA',A,staffC4.id),staffC4);\n for(let i=0;i<8;i++)denied('reassigned-nonexistent-'+i,await api('staffA',A,empty));\n}else throw Error('R349_UNKNOWN_STAGE_'+STAGE);\nconsole.log(JSON.stringify({suite:'R349_REAL_POSTGREST_SINGLE_DETAIL_FAIL_CLOSED',stage:STAGE,checks,request_rows:19,read_only:true,not_found_equals_forbidden:true,synthetic_only:true,commercial_release:'HOLD'}));\nR349_HTTP\nnode --check /tmp/r349_http.mjs\npgid=\"${{ job.services.pg.id }}\"\ndocker exec -i \"$pgid\" psql -X -U postgres -d r331_synthetic -v ON_ERROR_STOP=1 -A -t < /tmp/r349_oracle.sql >/tmp/r349_oracle.json\npython -m json.tool /tmp/r349_oracle.json >/dev/null\necho R349_INDEPENDENT_SQL_ORACLE_READY\n"
