ent:client_id,p_key:key});}\nasync function accepted(label,who,off,c,k){const r=await invoke(who,off,c,k);eq(label+'-status',r.status,200);ok(label+'-uuid',typeof r.data?.id==='string'&&/^[0-9a-f-]{36}$/.test(r.data.id));eq(label+'-created',r.data.created,true);eq(label+'-state',r.data.status,'requested');created.push(r.data.id);return r;}\nasync function denied(label,who,off,c,k,codes=[400,401,403,404]){const r=await invoke(who,off,c,k);ok(label+'-rejected',codes.includes(r.status));ok(label+'-no-request-returned',!r.data?.id);return r;}\n// PostgREST schema cache refresh must expose the new function before testing.\nlet ready=false;for(let i=0;i<35;i++){const r=await http('/rpc/r342_create_request',t.staffA,'POST',{p_office:office.A,p_client:client(4),p_key:'short'});if(r.status!==404){ready=true;break}await new Promise(res=>setTimeout(res,400));}\nok('rpc-in-schema-cache',ready);\nconst first=await accepted('assigned-staff-A','staffA',office.A,client(4),'R342_A_REQ_000001');\nlet again=await invoke('staffA',office.A,client(4),'R342_A_REQ_000001');eq('repeat-status',again.status,200);eq('repeat-created',again.data.created,false);eq('repeat-id',again.data.id,first.data.id);\nawait denied('idempotency-key-other-client','staffA',office.A,client(5),'R342_A_REQ_000001',[400]);\nawait accepted('assigned-other-client','staffA',office.A,client(5),'R342_A_REQ_000002');\nawait accepted('owner-B','ownerB',office.B,client(3),'R342_B_REQ_000001');\nawait denied('cross-tenant-staff','staffA',office.B,client(3),'R342_CROSS_000001');\nawait denied('cross-tenant-owner','ownerB',office.A,client(4),'R342_CROSS_000002');\nawait denied('wrong-office-client-pair','staffA',office.A,client(3),'R342_CROSS_000003');\nawait denied('unassigned-client','staffA',office.A,client(2),'R342_OTHER_000001');\nawait denied('revoked-owner','revokedA',office.A,client(4),'R342_OTHER_000002');\nawait denied('inactive-staff','inactiveA',office.A,client(4),'R342_OTHER_000003');\nawait denied('outsider','outsider',office.A,client(4),'R342_OTHER_000004');\nawait denied('anonymous','anon',office.A,client(4),'R342_OTHER_000005');\nawait denied('bad-signature','wrong',office.A,client(4),'R342_OTHER_000006');\nawait denied('key-too-short','staffA',office.A,client(4),'short',[400]);\nawait denied('key-invalid','staffA',office.A,client(4),'R342_bad.key.0001',[400]);\nconst roleMismatch=token('00000002-0002-4002-8002-000000000002',{role:'anon'});const badRole=await http('/rpc/r342_create_request',roleMismatch,'POST',{p_office:office.A,p_client:client(4),p_key:'R342_OTHER_000007'});ok('wrong-signed-role-denied',[400,401,403,404].includes(badRole.status));\n// Public direct REST endpoints must refuse writes and SELECT even if RPC allows creation.\nfor(const name of ['r342_requests','r342_audit']){\n for(const who of ['staffA','anon']){\n  const r=await http('/'+name+'?select=*',t[who],'GET');ok(name+'-'+who+'-get-denied',[401,403].includes(r.status));\n  const w=await http('/'+name,t[who],'POST',{office_id:office.A,client_id:client(4),request_key:'R342_INJECTION_0001'});ok(name+'-'+who+'-post-denied',[400,401,403].includes(w.status));\n }\n}\n// Parallel retries with the same key must lead to one and only one created record.\nconst race=await Promise.all(Array.from({length:16},()=>invoke('staffA',office.A,client(4),'R342_PARALLEL_0001')));\nfor(let i=0;i<race.length;i++){eq('race-'+i+'-status',race[i].status,200);ok('race-'+i+'-uuid',!!race[i].data?.id)}\neq('race-one-unique-id',new Set(race.map(r=>r.data.id)).size,1);\neq('race-one-created',race.filter(r=>r.data.created).length,1);\nconsole.log(JSON.stringify({suite:'R342_SCOPED_AUDITED_IDEMPOTENT_WRITE_RPC_REAL_POSTGREST',checks,new_requests:4,concurrent_retries:16,signature_real_postgrest:true,nonlogin_definer:true,real_supabase:false,commercial_release:'HOLD'}));\nR342_JS\nnode --check /tmp/r342_rpc_http.mjs\nnode /tmp/r342_rpc_http.mjs\n"
