    - name: R354 create read-only tenant-scoped office digest and verify privileges
      shell: bash
      run: "set -euo pipefail\ncat >/tmp/r354_schema.sql <<'R354_R354_SCHEMA_SQL'\n\\set ON_ERROR_STOP on\n-- R354 synthetic PG17 only. This read-only office dashboard RPC is NEVER a shared Supabase migration.\nDO $r354_baseline$ BEGIN\n IF (SELECT count(*) FROM public.r342_requests)<>19\n OR (SELECT count(*) FROM public.r342_audit)<>19\n OR (SELECT count(*) FROM public.r350_status_audit)<>3\n OR (SELECT count(*) FROM public.r342_requests WHERE status='completed')<>3\n OR (SELECT count(*) FROM public.r352_deadlines)<>19\n THEN RAISE EXCEPTION 'R354_R353B_BASELINE_DRIFT_HOLD'; END IF;\nEND $r354_baseline$;\n\n-- Mirrors R353B's verified DB-backed office membership/assignment checks.\n-- Returns only counters, never client/request/staff IDs, and never queues a message.\nCREATE FUNCTION public.r354_office_reminder_digest(p_office uuid,p_as_of timestamptz)\nRETURNS jsonb LANGUAGE plpgsql STABLE SECURITY DEFINER SET search_path=pg_catalog\nAS $r354_rpc$\nDECLARE\n v_claims jsonb; v_sub text; v_actor uuid; v_staff uuid; v_broad boolean;\n v_today date; v_clients bigint; v_total bigint; v_completed bigint;\n v_overdue bigint; v_due_today bigint; v_day_before bigint; v_future bigint;\nBEGIN\n v_claims:=nullif(current_setting('request.jwt.claims',true),'')::jsonb;\n v_sub:=v_claims->>'sub';\n IF (v_claims->>'role') IS DISTINCT FROM 'authenticated'\n OR v_sub IS NULL OR v_sub !~* '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'\n OR p_office IS NULL\n THEN RAISE EXCEPTION 'R354_ACCESS_DENIED' USING ERRCODE='42501'; END IF;\n IF p_as_of IS NULL OR NOT isfinite(p_as_of)\n THEN RAISE EXCEPTION 'R354_INVALID_AS_OF' USING ERRCODE='22023'; END IF;\n v_actor:=v_sub::uuid;\n SELECT s.id,(s.role IN ('owner','admin') OR s.can_view_all_clients)\n INTO v_staff,v_broad\n FROM public.r335_staff s JOIN public.r335_offices o ON o.id=s.office_id\n WHERE s.office_id=p_office AND s.auth_user_id=v_actor AND s.is_active AND o.is_active\n LIMIT 1;\n IF v_staff IS NULL THEN RAISE EXCEPTION 'R354_ACCESS_DENIED' USING ERRCODE='42501'; END IF;\n\n SELECT count(*) INTO v_clients FROM public.r335_clients c\n WHERE c.office_id=p_office AND (v_broad OR c.assigned_staff_id=v_staff);\n v_today:=(p_as_of AT TIME ZONE 'Asia/Tokyo')::date;\n SELECT count(*),\n        count(*) FILTER (WHERE r.status='completed'),\n        count(*) FILTER (WHERE r.status='requested' AND (d.due_at AT TIME ZONE 'Asia/Tokyo')::date<v_today),\n        count(*) FILTER (WHERE r.status='requested' AND (d.due_at AT TIME ZONE 'Asia/Tokyo')::date=v_today),\n        count(*) FILTER (WHERE r.status='requested' AND (d.due_at AT TIME ZONE 'Asia/Tokyo')::date=v_today+1),\n        count(*) FILTER (WHERE r.status='requested' AND (d.due_at AT TIME ZONE 'Asia/Tokyo')::date>v_today+1)\n INTO v_total,v_completed,v_overdue,v_due_today,v_day_before,v_future\n FROM public.r342_requests r\n JOIN public.r352_deadlines d ON d.office_id=r.office_id AND d.request_id=r.id\n JOIN public.r335_clients c ON c.office_id=r.office_id AND c.id=r.client_id\n WHERE r.office_id=p_office AND (v_broad OR c.assigned_staff_id=v_staff);\n IF v_total IS DISTINCT FROM (v_completed+v_overdue+v_due_today+v_day_before+v_future)\n THEN RAISE EXCEPTION 'R354_INVALID_REMINDER_GROUPING' USING ERRCODE='22023'; END IF;\n RETURN pg_catalog.jsonb_build_object(\n  'client_count',v_clients,'total',v_total,'completed',v_completed,\n  'overdue',v_overdue,'due_today',v_due_today,'day_before',v_day_before,\n  'future',v_future,'eligible',v_overdue+v_due_today+v_day_before,\n  'preview_only',true,'scheduled',false);\nEND;\n$r354_rpc$;\n\nALTER FUNCTION public.r354_office_reminder_digest(uuid,timestamptz) OWNER TO r342_executor;\nREVOKE ALL ON FUNCTION public.r354_office_reminder_digest(uuid,timestamptz) FROM PUBLIC,anon;\nGRANT EXECUTE ON FUNCTION public.r354_office_reminder_digest(uuid,timestamptz) TO authenticated;\nNOTIFY pgrst,'reload schema';\n\nDO $r354_security$ BEGIN\n IF (SELECT rolname FROM pg_roles WHERE oid=(SELECT proowner FROM pg_proc\n       WHERE oid='public.r354_office_reminder_digest(uuid,timestamptz)'::regprocedure))<>'r342_executor'\n OR (SELECT rolcanlogin OR rolbypassrls FROM pg_roles WHERE rolname='r342_executor') IS DISTINCT FROM false\n OR has_function_privilege('anon','public.r354_office_reminder_digest(uuid,timestamptz)','EXECUTE')\n OR NOT has_function_privilege('authenticated','public.r354_office_reminder_digest(uuid,timestamptz)','EXECUTE')\n OR has_table_privilege('authenticated','public.r352_deadlines','SELECT')\n OR has_table_privilege('authenticated','public.r342_requests','SELECT')\n OR (SELECT count(*) FROM pg_class\n     WHERE oid IN ('public.r342_requests'::regclass,'public.r352_deadlines'::regclass)\n       AND relrowsecurity AND relforcerowsecurity)<>2\n THEN RAISE EXCEPTION 'R354_PRIVILEGE_OR_RLS_DRIFT_HOLD'; END IF;\n RAISE NOTICE 'R354_READ_ONLY_OFFICE_DIGEST_READY';\nEND $r354_security$;\nR354_R354_SCHEMA_SQL\npgid=\"${{ job.services.pg.id }}\"\ntest -n \"$pgid\"\ndocker exec -i \"$pgid\" psql -X -U postgres -d r331_synthetic -v ON_ERROR_STOP=1 < /tmp/r354_schema.sql\n"
    - name: R354 capture independent synthetic PostgreSQL oracle via superuser SELECT
      shell: bash
      run: "set -euo pipefail\ncat >/tmp/r354_oracle.sql <<'R354_R354_ORACLE_SQL'\n\\set ON_ERROR_STOP on\n-- Synthetic-only independent baseline. Read with disposable postgres superuser;\n-- save only in the GitHub runner's /tmp, never return raw identifiers via RPC.\nSELECT pg_catalog.jsonb_build_object(\n 'clients',(\n    SELECT COALESCE(pg_catalog.jsonb_agg(pg_catalog.jsonb_build_object(\n      'id',c.id,'office_id',c.office_id,'assigned_staff_id',c.assigned_staff_id)\n      ORDER BY c.office_id,c.id),'[]'::jsonb)\n    FROM public.r335_clients c),\n 'requests',(\n    SELECT COALESCE(pg_catalog.jsonb_agg(pg_catalog.jsonb_build_object(\n      'id',r.id,'office_id',r.office_id,'client_id',r.client_id,\n      'status',r.status,'due_at',d.due_at)\n      ORDER BY r.office_id,r.id),'[]'::jsonb)\n    FROM public.r342_requests r\n    JOIN public.r352_deadlines d\n      ON d.office_id=r.office_id AND d.request_id=r.id)\n)::text;\nR354_R354_ORACLE_SQL\npgid=\"${{ job.services.pg.id }}\"\ntest -n \"$pgid\"\ndocker exec -i \"$pgid\" psql -X -At -U postgres -d r331_synthetic -v ON_ERROR_STOP=1 < /tmp/r354_oracle.sql > /tmp/r354_oracle.json\nnode -e 'const x=JSON.parse(require(\"fs\").readFileSync(\"/tmp/r354_oracle.json\")); if(x.requests.length!==19||x.clients.length<4) process.exit(1); console.log(\"R354_INDEPENDENT_PG17_ORACLE_READY requests=\"+x.requests.length+\" clients=\"+x.clients.length)'\n"
    - name: R354 install independent-oracle signed-JWT PostgREST dashboard tests
      shell: bash
      run: "set -euo pipefail\ncat >/tmp/r354_http.mjs <<'R354_R354_HTTP_MJS'\nimport assert from 'node:assert/strict';\nimport {createHmac} from 'node:crypto';\nimport {readFileSync} from 'node:fs';\n\n// The independent oracle was captured from the isolated PostgreSQL 17 service\n// by a one-time superuser SELECT; API clients never receive its synthetic IDs.\nconst ORACLE=JSON.parse(readFileSync('/tmp/r354_oracle.json','utf8'));\nconst STAGE=process.env.R354_STAGE??'initial';\nconst HOST='http://127.0.0.1:3000';\nconst SECRET='R335_SYNTHETIC_JWT_SIGNING_KEY_NOT_REAL_1234567890';\nconst OA='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa';\nconst OB='bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb';\nconst STAFF='00000002-0002-4002-8002-000000000002';\nconst OWNER_A='00000005-0005-4005-8005-000000000005';\nconst OWNER_B='00000003-0003-4003-8003-000000000003';\nconst STAFF_ROW='10000000-0000-4000-8000-000000000002';\nconst OTHER_ROW='10000000-0000-4000-8000-000000000005';\nconst MOVED_CLIENT='20000000-0000-4000-8000-000000000004';\nconst A='2028-02-29T03:00:00Z',B='2028-02-29T15:00:00Z';\nconst enc=x=>Buffer.from(JSON.stringify(x)).toString('base64url');\nfunction jwt(sub,extra={}){\n const h=enc({alg:'HS256',typ:'JWT'}),p=enc({sub,role:'authenticated',exp:4102444800,...extra});\n return h+'.'+p+'.'+createHmac('sha256',SECRET).update(h+'.'+p).digest('base64url');\n}\nconst calendar=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'});\nfunction jstDay(date){\n const fields=Object.fromEntries(calendar.formatToParts(new Date(date)).map(x=>[x.type,x.value]));\n return `${fields.year}-${fields.month}-${fields.day}`;\n}\nlet checks=0;\nfunction eq(n,a,b){assert.deepEqual(a,b,n);checks++}\nfunction ok(n,a){assert.ok(a,n);checks++}\nasync function call(sub=STAFF,office=OA,asOf=A,token=jwt(sub)){\n const r=await fetch(HOST+'/rpc/r354_office_reminder_digest',{\n  method:'POST',headers:{'content-type':'application/json',accept:'application/json',\n   ...(token?{authorization:'Bearer '+token}:{})},\n  body:JSON.stringify({p_office:office,p_as_of:asOf}),signal:AbortSignal.timeout(16000)});\n const raw=await r.text();let body;\n try{body=raw?JSON.parse(raw):null}catch{throw Error('R354_BAD_JSON_'+r.status+'_'+raw.slice(0,120))}\n return {code:r.status,body};\n}\nfunction expected(office,scope,asOf=A){\n const today=jstDay(asOf);\n const next=new Date(new Date(asOf).valueOf()+24*60*60*1000);\n const tomorrow=jstDay(next);\n const clients=ORACLE.clients.map(c=>STAGE==='reassigned'&&c.id===MOVED_CLIENT\n    ?{...c,assigned_staff_id:OTHER_ROW}:c).filter(c=>c.office_id===office\n    &&(scope===null||c.assigned_staff_id===scope));\n const authorized=new Set(clients.map(c=>c.id));\n const rows=ORACLE.requests.filter(x=>x.office_id===office&&authorized.has(x.client_id));\n const out={client_count:clients.length,total:rows.length,completed:0,overdue:0,\n            due_today:0,day_before:0,future:0};\n for(const x of rows){\n  const due=jstDay(x.due_at);\n  if(x.status==='completed')out.completed++;\n  else if(x.status!=='requested')throw Error('R354_UNEXPECTED_SYNTHETIC_STATUS');\n  else if(due<today)out.overdue++;\n  else if(due===today)out.due_today++;\n  else if(due===tomorrow)out.day_before++;\n  else out.future++;\n }\n return {...out,eligible:out.overdue+out.due_today+out.day_before,\n         preview_only:true,scheduled:false};\n}\nconst expectedKeys=['client_count','completed','day_before','due_today','eligible','future',\n                    'overdue','preview_only','scheduled','total'];\nfunction yes(n,r,office,scope,asOf=A){\n eq(n+'-200',r.code,200);\n eq(n+'-keys',Object.keys(r.body).sort(),expectedKeys);\n const e=expected(office,scope,asOf);\n for(const k of expectedKeys)eq(n+'-'+k,r.body[k],e[k]);\n eq(n+'-partition',r.body.completed+r.body.overdue+r.body.due_today+\n    r.body.day_before+r.body.future,r.body.total);\n ok(n+'-no-identifiers',!ORACLE.clients.some(c=>JSON.stringify(r.body).includes(c.id))&&\n    !JSON.stringify(r.body).includes(office));\n}\nfunction deny(n,r){\n eq(n+'-403',r.code,403);eq(n+'-sqlstate',r.body?.code,'42501');\n eq(n+'-generic',r.body?.message,'R354_ACCESS_DENIED');\n ok(n+'-no-count',r.body?.total===undefined);\n}\n\nok('postgres-oracle-request-fixture',ORACLE.requests.length===19);\nok('postgres-oracle-staff-client-present',ORACLE.clients.some(c=>c.id===MOVED_CLIENT&&c.assigned_staff_id===STAFF_ROW));\nok('postgres-oracle-office-owner-has-more-clients',expected(OA,null).client_count>expected(OA,STAFF_ROW).client_count);\nok('postgres-oracle-two-tenant-partition',new Set(ORACLE.clients.map(c=>c.office_id)).size===2);\nif(STAGE==='initial'){\n for(const [sub,office,scope,name] of [[STAFF,OA,STAFF_ROW,'staff'],\n                                      [OWNER_A,OA,null,'ownerA'],[OWNER_B,OB,null,'ownerB']]){\n  yes('initial-'+name+'-A',await call(sub,office),office,scope);\n  yes('initial-'+name+'-B',await call(sub,office,B),office,scope,B);\n }\n for(let i=0;i<12;i++){\n  deny('cross-office-staff-'+i,await call(STAFF,OB));\n  deny('cross-office-owner-'+i,await call(OWNER_B,OA));\n }\n const forged=await call(STAFF,OA,A,jwt(STAFF,{is_admin:true,office_id:OB,can_view_all_clients:true}));\n yes('forged-claims-remain-staff-scoped',forged,OA,STAFF_ROW);\n deny('nonexistent-tenant',await call(STAFF,'00000000-0000-4000-8000-000000000000'));\n deny('forged-nonmember-sub',await call('00000000-0000-4000-8000-000000000009',OA));\n deny('invalid-uuid-sub',await call('not-a-uuid',OA));\n const noToken=await call(STAFF,OA,A,null);\n ok('anonymous-blocked',[401,403,404].includes(noToken.code));\n const wrongRole=await call(STAFF,OA,A,jwt(STAFF,{role:'anon'}));\n ok('non-authenticated-role-blocked',[401,403,404].includes(wrongRole.code));\n const bad=await call(STAFF,OA,null);\n eq('null-date-400',bad.code,400);eq('null-date-message',bad.body?.message,'R354_INVALID_AS_OF');\n eq('infinite-date-400',(await call(STAFF,OA,'infinity')).code,400);\n eq('invalid-calendar-400',(await call(STAFF,OA,'2028-02-30T12:00:00Z')).code,400);\n const parallel=await Promise.all(Array.from({length:64},(_,i)=>i%2===0?call(STAFF,OA):call(OWNER_B,OB)));\n parallel.forEach((r,i)=>i%2===0?yes('parallel-staff-'+i,r,OA,STAFF_ROW)\n                             :yes('parallel-ownerB-'+i,r,OB,null));\n eq('parallel-staff-consistent',new Set(parallel.filter((_,i)=>i%2===0).map(x=>JSON.stringify(x.body))).size,1);\n eq('parallel-ownerB-consistent',new Set(parallel.filter((_,i)=>i%2!==0).map(x=>JSON.stringify(x.body))).size,1);\n}else if(STAGE==='revoked'){\n for(let i=0;i<14;i++)deny('revoked-staff-'+i,await call(STAFF,OA));\n for(let i=0;i<7;i++)yes('owner-unaffected-'+i,await call(OWNER_A,OA),OA,null);\n}else if(STAGE==='restored'){\n for(let i=0;i<14;i++)yes('restored-staff-'+i,await call(STAFF,OA),OA,STAFF_ROW);\n}else if(STAGE==='reassigned'){\n for(let i=0;i<14;i++)yes('staff-lost-moved-client-'+i,await call(STAFF,OA),OA,STAFF_ROW);\n for(let i=0;i<7;i++)yes('office-owner-still-full-scope-'+i,await call(OWNER_A,OA),OA,null);\n}else if(STAGE==='office_paused'){\n for(let i=0;i<14;i++)deny('paused-staff-'+i,await call(STAFF,OA));\n for(let i=0;i<7;i++)deny('paused-owner-'+i,await call(OWNER_A,OA));\n for(let i=0;i<7;i++)yes('other-office-unaffected-'+i,await call(OWNER_B,OB),OB,null);\n}else if(STAGE==='final'){\n for(const [sub,office,scope,name] of [[STAFF,OA,STAFF_ROW,'staff'],\n                                      [OWNER_A,OA,null,'ownerA'],[OWNER_B,OB,null,'ownerB']])\n  yes('final-'+name,await call(sub,office),office,scope);\n for(const [path,sub] of [['/r342_requests?select=*',OWNER_A],['/r352_deadlines?select=*',STAFF]]){\n  const r=await fetch(HOST+path,{headers:{authorization:'Bearer '+jwt(sub)},signal:AbortSignal.timeout(12000)});\n  ok('base-raw-table-denied-'+path,[401,403,404].includes(r.status));\n }\n}else throw Error('R354_UNKNOWN_TEST_STAGE_'+STAGE);\nconsole.log(JSON.stringify({suite:'R354_READ_ONLY_SCOPED_OFFICE_DIGEST',stage:STAGE,checks,\n oracle:'independent_PG17_snapshot',signed_jwt:true,tenant_scope:true,\n scheduled_notifications:0,shared_supabase_changes:0,release:'HOLD'}));\nR354_R354_HTTP_MJS\nnode --check /tmp/r354_http.mjs\n"
    - name: R354 wait for PostgREST to reload the new RPC schema
