    - name: Verify hash-pinned R331 source and restore nine SQL scripts
      shell: bash
      run: "set -euo pipefail\npython3 - <<'R333_EXTRACT'\nimport re,hashlib,pathlib\np=pathlib.Path('.github/workflows/dpro-tax-r331-pg17-remaining19-policy-candidate-isolated-qa.yml')\nassert p.is_file(),'R331_PINNED_SOURCE_MISSING'\ns=p.read_bytes(); assert hashlib.sha256(s).hexdigest()=='564a94632e60f76d228501852298be347fe40fe8af4092026a3ea68478cca4c0','R331_SHA256_DRIFT_HOLD'\ntext=s.decode('utf-8')\nnames=['core_schema','core_fixtures','core_assertions','r331_extension','r331_fixtures','r331_catalog','r331_roles_a','r331_roles_b','r331_revocation']\nfor idx,name in enumerate(names,1):\n label=f'R331_{idx:02}'\n match=re.search(r\"^        cat > /tmp/([^\\n ]+) <<'\"+label+r\"'\\n(.*?)^        \"+label+r\"[ \\t]*$\",text,re.M|re.S)\n if not match: raise SystemExit('R333_R331_SCRIPT_NOT_FOUND_'+label)\n output=pathlib.Path('/tmp')/(f'{idx:02}_'+name+'.sql')\n if match.group(1)!=output.name:raise SystemExit('R333_FILENAME_CHANGED_'+label)\n content='\\n'.join(line[8:] if line.startswith('        ') else line for line in match.group(2).split('\\n'))\n if not content.lstrip().startswith('\\\\set ON_ERROR_STOP on'):raise SystemExit('R333_PSQL_FAIL_CLOSED_MISSING_'+label)\n output.write_text(content)\nprint('R333_R331_SCRIPTS_PINNED=true sha256_verified=true count=9')\nR333_EXTRACT"
