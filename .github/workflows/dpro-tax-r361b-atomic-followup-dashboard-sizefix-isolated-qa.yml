    - name: R355 install synthetic visits, forced RLS and read-only preview RPC
      shell: bash
      run: "set -euo pipefail\ncat >/tmp/r355_schema.sql <<'R355_R355_SCHEMA_SQL'\n\\set ON_ERROR_STOP on\n-- R355 is a disposable synthetic Postgres17 QA feature, NOT a production migration.\nDO $r355_before$ BEGIN\n IF (SELECT count(*) FROM public.r342_requests)<>19\n OR (SELECT count(*) FROM public.r342_audit)<>19\n OR (SELECT count(*) FROM public.r350_status_audit)<>3\n OR (SELECT count(*) FROM public.r342_requests WHERE status='completed')<>3\n OR (SELECT count(*) FROM public.r352_deadlines)<>19\n THEN RAISE EXCEPTION 'R355_R354_BASELINE_DRIFT_HOLD'; END IF;\nEND $r355_before$;\n\nCREATE TABLE public.r355_visits(\n office_id uuid NOT NULL,\n id uuid NOT NULL,\n client_id uuid NOT NULL,\n visit_at timestamptz NOT NULL,\n visit_status text NOT NULL CHECK(visit_status IN ('scheduled','cancelled','completed')),\n PRIMARY KEY(office_id,id)\n);\nALTER TABLE public.r355_visits ENABLE ROW LEVEL SECURITY;\nALTER TABLE public.r355_visits FORCE ROW LEVEL SECURITY;\nREVOKE ALL ON TABLE public.r355_visits FROM PUBLIC,anon,authenticated;\nGRANT SELECT ON TABLE public.r355_visits TO r342_executor;\n-- The NOLOGIN/NOBYPASSRLS executor may see this synthetic table only from its\n-- narrowly authorized RPC; authenticated/anon have no direct table grants.\nCREATE POLICY r355_executor_select ON public.r355_visits\n FOR SELECT TO r342_executor USING (true);\n\nINSERT INTO public.r355_visits(office_id,id,client_id,visit_at,visit_status) VALUES\n('aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa','35500000-0000-4000-8000-000000000001','20000000-0000-4000-8000-000000000004','2028-03-01T00:00:00Z','scheduled'),\n('aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa','35500000-0000-4000-8000-000000000002','20000000-0000-4000-8000-000000000001','2028-02-29T07:00:00Z','scheduled'),\n('aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa','35500000-0000-4000-8000-000000000003','20000000-0000-4000-8000-000000000002','2028-03-01T03:00:00Z','scheduled'),\n('bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb','35500000-0000-4000-8000-000000000004','20000000-0000-4000-8000-000000000003','2028-03-01T01:00:00Z','scheduled'),\n('aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa','35500000-0000-4000-8000-000000000005','20000000-0000-4000-8000-000000000004','2028-03-01T02:00:00Z','cancelled'),\n('aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa','35500000-0000-4000-8000-000000000006','20000000-0000-4000-8000-000000000004','2028-03-01T04:00:00Z','completed'),\n('aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa','35500000-0000-4000-8000-000000000007','20000000-0000-4000-8000-000000000004','2028-03-05T00:00:00Z','scheduled');\n\nCREATE FUNCTION public.r355_preview_next_visit(p_office uuid,p_visit uuid,p_as_of timestamptz)\nRETURNS jsonb LANGUAGE plpgsql STABLE SECURITY DEFINER SET search_path=pg_catalog\nAS $r355_rpc$\nDECLARE\n v_claims jsonb;v_sub text;v_actor uuid;v_staff uuid;v_broad boolean;\n v_visit_at timestamptz;v_status text;v_visit_day date;v_today date;v_phase text;\nBEGIN\n v_claims:=nullif(current_setting('request.jwt.claims',true),'')::jsonb;\n v_sub:=v_claims->>'sub';\n IF (v_claims->>'role') IS DISTINCT FROM 'authenticated'\n OR v_sub IS NULL OR v_sub !~* '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'\n OR p_office IS NULL OR p_visit IS NULL\n THEN RAISE EXCEPTION 'R355_ACCESS_DENIED' USING ERRCODE='42501'; END IF;\n IF p_as_of IS NULL OR NOT isfinite(p_as_of)\n THEN RAISE EXCEPTION 'R355_INVALID_AS_OF' USING ERRCODE='22023'; END IF;\n v_actor:=v_sub::uuid;\n SELECT s.id,(s.role IN ('owner','admin') OR s.can_view_all_clients)\n INTO v_staff,v_broad\n FROM public.r335_staff s JOIN public.r335_offices o ON o.id=s.office_id\n WHERE s.office_id=p_office AND s.auth_user_id=v_actor AND s.is_active AND o.is_active\n LIMIT 1;\n IF v_staff IS NULL THEN RAISE EXCEPTION 'R355_ACCESS_DENIED' USING ERRCODE='42501'; END IF;\n SELECT v.visit_at,v.visit_status INTO v_visit_at,v_status\n FROM public.r355_visits v\n JOIN public.r335_clients c ON c.office_id=v.office_id AND c.id=v.client_id\n WHERE v.office_id=p_office AND v.id=p_visit\n   AND (v_broad OR c.assigned_staff_id=v_staff)\n LIMIT 1;\n IF NOT FOUND THEN RAISE EXCEPTION 'R355_ACCESS_DENIED' USING ERRCODE='42501'; END IF;\n v_today:=(p_as_of AT TIME ZONE 'Asia/Tokyo')::date;\n v_visit_day:=(v_visit_at AT TIME ZONE 'Asia/Tokyo')::date;\n IF v_status='cancelled' THEN v_phase:='cancelled';\n ELSIF v_status='completed' THEN v_phase:='completed';\n ELSIF v_visit_day<v_today THEN v_phase:='passed';\n ELSIF v_visit_day=v_today THEN v_phase:='today';\n ELSIF v_visit_day=v_today+1 THEN v_phase:='day_before';\n ELSE v_phase:='future'; END IF;\n RETURN pg_catalog.jsonb_build_object(\n  'visit_day',v_visit_day::text,'phase',v_phase,\n  'eligible',v_phase='day_before','preview_only',true,\n  'notification_scheduled',false);\nEND;\n$r355_rpc$;\n\nALTER FUNCTION public.r355_preview_next_visit(uuid,uuid,timestamptz) OWNER TO r342_executor;\nREVOKE ALL ON FUNCTION public.r355_preview_next_visit(uuid,uuid,timestamptz) FROM PUBLIC,anon;\nGRANT EXECUTE ON FUNCTION public.r355_preview_next_visit(uuid,uuid,timestamptz) TO authenticated;\nNOTIFY pgrst,'reload schema';\n\nDO $r355_security$ BEGIN\n IF (SELECT count(*) FROM public.r355_visits)<>7\n OR (SELECT count(*) FROM pg_class WHERE oid='public.r355_visits'::regclass\n       AND relrowsecurity AND relforcerowsecurity)<>1\n OR has_table_privilege('anon','public.r355_visits','SELECT')\n OR has_table_privilege('authenticated','public.r355_visits','SELECT')\n OR NOT has_table_privilege('r342_executor','public.r355_visits','SELECT')\n OR has_function_privilege('anon','public.r355_preview_next_visit(uuid,uuid,timestamptz)','EXECUTE')\n OR NOT has_function_privilege('authenticated','public.r355_preview_next_visit(uuid,uuid,timestamptz)','EXECUTE')\n OR (SELECT rolname FROM pg_roles WHERE oid=(SELECT proowner FROM pg_proc\n     WHERE oid='public.r355_preview_next_visit(uuid,uuid,timestamptz)'::regprocedure))<>'r342_executor'\n OR (SELECT rolcanlogin OR rolbypassrls FROM pg_roles WHERE rolname='r342_executor') IS DISTINCT FROM false\n THEN RAISE EXCEPTION 'R355_VISIT_PRIVILEGE_OR_RLS_HOLD'; END IF;\n RAISE NOTICE 'R355_SYNTHETIC_JST_NEXT_VISIT_PREVIEW_READY visits=7 sends=0';\nEND $r355_security$;\nR355_R355_SCHEMA_SQL\npgid=\"${{ job.services.pg.id }}\"\ntest -n \"$pgid\"\ndocker exec -i \"$pgid\" psql -X -U postgres -d r331_synthetic -v ON_ERROR_STOP=1 < /tmp/r355_schema.sql\n"
    - name: R355 install signed-JWT real PostgREST JST visit preview assertions
      shell: bash
      run: "set -euo pipefail\ncat >/tmp/r355_http.mjs <<'R355_R355_HTTP_MJS'\nimport assert from 'node:assert/strict';\nimport {createHmac} from 'node:crypto';\n\nconst STAGE=process.env.R355_STAGE??'initial';\nconst HOST='http://127.0.0.1:3000';\nconst SECRET='R335_SYNTHETIC_JWT_SIGNING_KEY_NOT_REAL_1234567890';\nconst OA='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa';\nconst OB='bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb';\nconst STAFF='00000002-0002-4002-8002-000000000002';\nconst OWNER_A='00000005-0005-4005-8005-000000000005';\nconst OWNER_B='00000003-0003-4003-8003-000000000003';\nconst CLIENT_ASSIGNED='20000000-0000-4000-8000-000000000004';\nconst CLIENT_ALSO_ASSIGNED='20000000-0000-4000-8000-000000000001';\nconst CLIENT_OWNER_ONLY='20000000-0000-4000-8000-000000000002';\nconst CLIENT_B='20000000-0000-4000-8000-000000000003';\nconst A='2028-02-29T03:00:00Z';\nconst END_OF_FEB='2028-02-29T14:59:59Z';\nconst START_OF_MAR='2028-02-29T15:00:00Z';\nconst DAY_BEFORE_LEAP='2028-02-28T14:59:59Z';\nconst VISITS=[\n {id:'35500000-0000-4000-8000-000000000001',office:OA,client:CLIENT_ASSIGNED,day:'2028-03-01',status:'scheduled'},\n {id:'35500000-0000-4000-8000-000000000002',office:OA,client:CLIENT_ALSO_ASSIGNED,day:'2028-02-29',status:'scheduled'},\n {id:'35500000-0000-4000-8000-000000000003',office:OA,client:CLIENT_OWNER_ONLY,day:'2028-03-01',status:'scheduled'},\n {id:'35500000-0000-4000-8000-000000000004',office:OB,client:CLIENT_B,day:'2028-03-01',status:'scheduled'},\n {id:'35500000-0000-4000-8000-000000000005',office:OA,client:CLIENT_ASSIGNED,day:'2028-03-01',status:'cancelled'},\n {id:'35500000-0000-4000-8000-000000000006',office:OA,client:CLIENT_ASSIGNED,day:'2028-03-01',status:'completed'},\n {id:'35500000-0000-4000-8000-000000000007',office:OA,client:CLIENT_ASSIGNED,day:'2028-03-05',status:'scheduled'}\n];\nconst [nextVisit,todayVisit,ownerOnly,otherOffice,cancelled,completed,futureVisit]=VISITS;\nconst enc=o=>Buffer.from(JSON.stringify(o)).toString('base64url');\nfunction jwt(sub,extra={}){\n const h=enc({alg:'HS256',typ:'JWT'}),p=enc({sub,role:'authenticated',exp:4102444800,...extra});\n return h+'.'+p+'.'+createHmac('sha256',SECRET).update(h+'.'+p).digest('base64url');\n}\nlet checks=0;\nfunction eq(n,a,b){assert.deepEqual(a,b,n);checks++}\nfunction ok(n,v){assert.ok(v,n);checks++}\nasync function call(visit,sub=STAFF,office=visit.office,asOf=A,token=jwt(sub)){\n const r=await fetch(HOST+'/rpc/r355_preview_next_visit',{\n  method:'POST',headers:{'content-type':'application/json',accept:'application/json',\n   ...(token?{authorization:'Bearer '+token}:{})},\n  body:JSON.stringify({p_office:office,p_visit:visit.id,p_as_of:asOf}),\n  signal:AbortSignal.timeout(16000)});\n const raw=await r.text();let body;\n try{body=raw?JSON.parse(raw):null}catch{throw Error('R355_BAD_JSON_'+r.status+'_'+raw.slice(0,180))}\n return {code:r.status,body};\n}\nfunction expected(visit,asOf=A){\n const today=asOf===START_OF_MAR?'2028-03-01':\n             asOf===DAY_BEFORE_LEAP?'2028-02-28':'2028-02-29';\n const tomorrow=today==='2028-02-28'?'2028-02-29':\n                today==='2028-02-29'?'2028-03-01':'2028-03-02';\n let phase;\n if(visit.status==='cancelled')phase='cancelled';\n else if(visit.status==='completed')phase='completed';\n else if(visit.day<today)phase='passed';\n else if(visit.day===today)phase='today';\n else if(visit.day===tomorrow)phase='day_before';\n else phase='future';\n return {visit_day:visit.day,phase,eligible:phase==='day_before',\n         preview_only:true,notification_scheduled:false};\n}\nconst keys=['eligible','notification_scheduled','phase','preview_only','visit_day'];\nfunction yes(n,r,visit,asOf=A){\n eq(n+'-200',r.code,200);\n eq(n+'-keys',Object.keys(r.body).sort(),keys);\n const e=expected(visit,asOf);\n for(const k of keys)eq(n+'-'+k,r.body[k],e[k]);\n ok(n+'-no-identifiers',!JSON.stringify(r.body).includes(visit.id)&&\n    !JSON.stringify(r.body).includes(visit.client)&&!JSON.stringify(r.body).includes(visit.office));\n}\nfunction deny(n,r){\n eq(n+'-403',r.code,403);eq(n+'-sqlstate',r.body?.code,'42501');\n eq(n+'-generic',r.body?.message,'R355_ACCESS_DENIED');\n ok(n+'-no-phase',r.body?.phase===undefined);\n}\n\neq('seven-unique-test-visits',new Set(VISITS.map(x=>x.id)).size,7);\neq('correctly-assigned-client-fixture',VISITS.filter(x=>x.client===CLIENT_ASSIGNED).length,4);\nif(STAGE==='initial'){\n for(const [i,item] of VISITS.entries()){\n  const sub=item.office===OB?OWNER_B:item.client===CLIENT_OWNER_ONLY?OWNER_A:STAFF;\n  yes('visit-'+i+'-A',await call(item,sub),item);\n  yes('visit-'+i+'-JST-midnight',await call(item,sub,item.office,START_OF_MAR),item,START_OF_MAR);\n }\n yes('day-before-ending-second',await call(nextVisit,STAFF,OA,END_OF_FEB),nextVisit,END_OF_FEB);\n yes('before-leap-day-visit',await call(todayVisit,STAFF,OA,DAY_BEFORE_LEAP),todayVisit,DAY_BEFORE_LEAP);\n yes('owner-office-wide-visit',await call(nextVisit,OWNER_A),nextVisit);\n for(let i=0;i<12;i++){\n  deny('staff-must-not-read-owner-client-'+i,await call(ownerOnly,STAFF));\n  deny('cross-office-staff-'+i,await call(otherOffice,STAFF,OB));\n  deny('cross-office-owner-'+i,await call(nextVisit,OWNER_B,OA));\n }\n deny('forged-admin-claim',await call(ownerOnly,STAFF,OA,A,jwt(STAFF,{is_admin:true,office_id:OA,can_view_all_clients:true})));\n deny('non-member-sub',await call(nextVisit,'00000000-0000-4000-8000-000000000009'));\n deny('invalid-sub',await call(nextVisit,'invalid-uuid'));\n deny('missing-visit',await call({...nextVisit,id:'35500000-0000-4000-8000-000000000099'}));\n deny('missing-office',await call(nextVisit,STAFF,'00000000-0000-4000-8000-000000000000'));\n const anon=await call(nextVisit,STAFF,OA,A,null);\n ok('anon-blocked',[401,403,404].includes(anon.code));\n const wrongRole=await call(nextVisit,STAFF,OA,A,jwt(STAFF,{role:'anon'}));\n ok('wrong-role-blocked',[401,403,404].includes(wrongRole.code));\n const bad=await call(nextVisit,STAFF,OA,null);\n eq('null-asof-400',bad.code,400);eq('null-asof-message',bad.body?.message,'R355_INVALID_AS_OF');\n eq('infinite-asof-400',(await call(nextVisit,STAFF,OA,'infinity')).code,400);\n eq('invalid-day-400',(await call(nextVisit,STAFF,OA,'2028-02-30T12:00:00Z')).code,400);\n const parallel=await Promise.all(Array.from({length:64},(_,i)=>i%2===0?call(nextVisit):call(otherOffice,OWNER_B)));\n parallel.forEach((r,i)=>yes('parallel-'+i,r,i%2===0?nextVisit:otherOffice));\n eq('parallel-staff-stability',new Set(parallel.filter((_,i)=>i%2===0).map(x=>JSON.stringify(x.body))).size,1);\n eq('parallel-other-office-stability',new Set(parallel.filter((_,i)=>i%2===1).map(x=>JSON.stringify(x.body))).size,1);\n}else if(STAGE==='revoked'){\n for(let i=0;i<14;i++)deny('revoked-staff-'+i,await call(nextVisit));\n for(let i=0;i<7;i++)yes('office-owner-remains-'+i,await call(nextVisit,OWNER_A),nextVisit);\n}else if(STAGE==='restored'){\n for(let i=0;i<14;i++)yes('restored-staff-'+i,await call(nextVisit),nextVisit);\n}else if(STAGE==='reassigned'){\n for(let i=0;i<14;i++)deny('old-assignee-loses-visit-'+i,await call(nextVisit));\n for(let i=0;i<7;i++)yes('other-assigned-client-remains-'+i,await call(todayVisit),todayVisit);\n for(let i=0;i<7;i++)yes('office-owner-retains-visit-'+i,await call(nextVisit,OWNER_A),nextVisit);\n}else if(STAGE==='office_paused'){\n for(let i=0;i<14;i++)deny('paused-staff-'+i,await call(nextVisit));\n for(let i=0;i<7;i++)deny('paused-owner-'+i,await call(nextVisit,OWNER_A));\n for(let i=0;i<7;i++)yes('other-tenant-still-active-'+i,await call(otherOffice,OWNER_B),otherOffice);\n}else if(STAGE==='final'){\n for(const [i,item] of VISITS.entries()){\n  const sub=item.office===OB?OWNER_B:item.client===CLIENT_OWNER_ONLY?OWNER_A:STAFF;\n  yes('final-'+i,await call(item,sub),item);\n }\n for(const action of ['GET','POST']){\n  const r=await fetch(HOST+'/r355_visits'+(action==='GET'?'?select=*':''),{\n   method:action,headers:{authorization:'Bearer '+jwt(OWNER_A),\n    ...(action==='POST'?{'content-type':'application/json'}:{})},\n   ...(action==='POST'?{body:JSON.stringify({id:'35500000-0000-4000-8000-000000000099'})}:{}),\n   signal:AbortSignal.timeout(12000)});\n  ok('no-direct-visit-table-'+action,[401,403,404,405].includes(r.status));\n }\n}else throw Error('R355_UNKNOWN_STAGE_'+STAGE);\nconsole.log(JSON.stringify({suite:'R355_JST_NEXT_VISIT_DAY_BEFORE_PREVIEW',stage:STAGE,checks,\n signed_jwt:true,tenant_assignment_scope:true,synthetic_pg17:true,\n notifications_sent:0,notification_scheduled:false,commercial_release:'HOLD'}));\nR355_R355_HTTP_MJS\nnode --check /tmp/r355_http.mjs\n"
