    - name: R351 make original audited creator report locked real DB status, keep grants and owner
      shell: bash
      run: "set -euo pipefail\ncat >/tmp/r351_fix.sql <<'R351_FIX_SQL'\n\\set ON_ERROR_STOP on\n-- Disposable PG17 only; production unchanged.\nDO $r351_baseline$ BEGIN\n IF (SELECT count(*) FROM public.r342_requests)<>19 OR (SELECT count(*) FROM public.r342_audit)<>19 OR\n    (SELECT count(*) FROM public.r342_requests WHERE status='completed')<>3 OR\n    (SELECT count(*) FROM public.r350_status_audit)<>3\n THEN RAISE EXCEPTION 'R351_BASELINE_NOT_R350'; END IF;\n IF NOT has_function_privilege('authenticated','public.r342_create_request(uuid,uuid,text)','EXECUTE') OR\n    has_function_privilege('anon','public.r342_create_request(uuid,uuid,text)','EXECUTE')\n THEN RAISE EXCEPTION 'R351_UNSAFE_CREATOR_GRANTS'; END IF;\n RAISE NOTICE 'R351_STALE_STATUS_BEFORE_PATCH_EXPECTED completed=3';\nEND $r351_baseline$;\nCREATE OR REPLACE FUNCTION public.r342_create_request(p_office uuid,p_client uuid,p_key text)\nRETURNS jsonb LANGUAGE plpgsql VOLATILE SECURITY DEFINER SET search_path=pg_catalog\nAS $r342_rpc$\nDECLARE\n v_claims jsonb; v_sub text; v_actor uuid; v_assignee uuid;\n v_allowed boolean; v_id uuid; v_existing_client uuid; v_new boolean; v_current_status text;\nBEGIN\n -- In live PostgREST, only PostgREST's JWT verifier sets these claims. SQL GUC spoofing remains a distinct threat.\n v_claims:=nullif(current_setting('request.jwt.claims',true),'')::jsonb;\n v_sub:=v_claims->>'sub';\n IF (v_claims->>'role') IS DISTINCT FROM 'authenticated'\n    OR v_sub IS NULL OR v_sub !~* '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'\n THEN RAISE EXCEPTION 'R342_ACCESS_DENIED' USING ERRCODE='42501'; END IF;\n IF p_office IS NULL OR p_client IS NULL OR p_key IS NULL OR p_key !~ '^[A-Za-z0-9_-]{12,64}$'\n THEN RAISE EXCEPTION 'R342_INVALID_REQUEST' USING ERRCODE='22023'; END IF;\n v_actor:=v_sub::uuid;\n SELECT c.assigned_staff_id INTO v_assignee\n FROM public.r335_clients c WHERE c.office_id=p_office AND c.id=p_client;\n IF NOT FOUND THEN RAISE EXCEPTION 'R342_ACCESS_DENIED' USING ERRCODE='42501'; END IF;\n SELECT EXISTS(\n  SELECT 1 FROM public.r335_staff s JOIN public.r335_offices o ON o.id=s.office_id\n  WHERE s.auth_user_id=v_actor AND s.office_id=p_office AND s.is_active AND o.is_active\n    AND (s.role IN ('owner','admin') OR s.can_view_all_clients OR s.id=v_assignee)\n ) INTO v_allowed;\n IF NOT v_allowed THEN RAISE EXCEPTION 'R342_ACCESS_DENIED' USING ERRCODE='42501'; END IF;\n -- Atomic and idempotent: one creation + one audit row per (office,actor,key).\n INSERT INTO public.r342_requests(office_id,client_id,actor_auth_id,request_key)\n VALUES(p_office,p_client,v_actor,p_key)\n ON CONFLICT(office_id,actor_auth_id,request_key) DO NOTHING\n RETURNING id INTO v_id;\n v_new := v_id IS NOT NULL;\n IF NOT v_new THEN\n  SELECT id,client_id INTO v_id,v_existing_client\n  FROM public.r342_requests\n  WHERE office_id=p_office AND actor_auth_id=v_actor AND request_key=p_key;\n  IF v_id IS NULL THEN RAISE EXCEPTION 'R342_RETRY_CONFLICT' USING ERRCODE='40001'; END IF;\n  IF v_existing_client<>p_client THEN\n   RAISE EXCEPTION 'R342_IDEMPOTENCY_KEY_REUSE_FOR_DIFFERENT_CLIENT' USING ERRCODE='22023';\n  END IF;\n ELSE\n  INSERT INTO public.r342_audit(office_id,request_id,actor_auth_id,action)\n  VALUES(p_office,v_id,v_actor,'request_created');\n END IF;\n -- Exact latest state after serialization with concurrent completion. No status literal.\n SELECT status INTO v_current_status FROM public.r342_requests\n WHERE id=v_id AND office_id=p_office AND actor_auth_id=v_actor FOR UPDATE;\n IF v_current_status IS NULL OR v_current_status NOT IN ('requested','completed')\n THEN RAISE EXCEPTION 'R351_INVALID_CURRENT_STATUS' USING ERRCODE='22023'; END IF;\n RETURN jsonb_build_object('id',v_id,'created',v_new,'status',v_current_status);\nEND;\n$r342_rpc$;\n-- SECURITY DEFINER owner and grants MUST remain unchanged (CREATE OR REPLACE).\nDO $r351_after$ BEGIN\n IF (SELECT rolname FROM pg_roles WHERE oid=(SELECT proowner FROM pg_proc WHERE oid='public.r342_create_request(uuid,uuid,text)'::regprocedure))<>'r342_executor'\n THEN RAISE EXCEPTION 'R351_FUNCTION_OWNER_DRIFT'; END IF;\n IF (SELECT prosecdef FROM pg_proc WHERE oid='public.r342_create_request(uuid,uuid,text)'::regprocedure) IS DISTINCT FROM true\n THEN RAISE EXCEPTION 'R351_DEFINER_CHANGED'; END IF;\n IF has_function_privilege('anon','public.r342_create_request(uuid,uuid,text)','EXECUTE') OR\n    has_table_privilege('authenticated','public.r342_requests','SELECT') OR\n    has_table_privilege('authenticated','public.r342_requests','INSERT') OR\n    has_table_privilege('authenticated','public.r350_status_audit','SELECT')\n THEN RAISE EXCEPTION 'R351_PERMISSION_DRIFT'; END IF;\n IF (SELECT rolcanlogin OR rolbypassrls FROM pg_roles WHERE rolname='r342_executor') IS DISTINCT FROM false\n THEN RAISE EXCEPTION 'R351_EXECUTOR_PRIVILEGE_DRIFT'; END IF;\n RAISE NOTICE 'R351_CREATOR_LATEST_STATUS_FIX_APPLIED owner=NOLOGIN grants_unchanged=true';\nEND $r351_after$;\nNOTIFY pgrst,'reload schema';\nR351_FIX_SQL\npgid=\"${{ job.services.pg.id }}\"\n[ -n \"$pgid\" ]\ndocker exec -i \"$pgid\" psql -X -U postgres -d r331_synthetic -v ON_ERROR_STOP=1 < /tmp/r351_fix.sql\n"
