    - name: R359 install read-only tenant-scoped material followup summary RPC
      shell: bash
      run: "set -euo pipefail\ncat >/tmp/r359_schema.sql <<'R359_R359_SCHEMA_SQL'\n\\set ON_ERROR_STOP on\n-- R359: read-only material follow-up DASHBOARD, in disposable PG17 only.\n-- Counts are preview candidates, never messages queued or sent.\nDO $r359_baseline$ BEGIN\n IF (SELECT count(*) FROM public.r342_requests)<>19\n OR (SELECT count(*) FROM public.r352_deadlines)<>19\n OR (SELECT count(*) FROM public.r355_visits)<>7\n OR (SELECT count(*) FROM public.r342_requests WHERE status='completed')<>3\n THEN RAISE EXCEPTION 'R359_R358C_FORMAL_BASELINE_DRIFT_HOLD'; END IF;\nEND $r359_baseline$;\n\nCREATE FUNCTION public.r359_preview_followup_summary(\n p_office uuid,p_as_of timestamptz,p_repeat_days integer)\nRETURNS jsonb LANGUAGE plpgsql STABLE SECURITY DEFINER SET search_path=pg_catalog\nAS $r359_rpc$\nDECLARE\n v_claims jsonb;v_sub text;v_actor uuid;v_staff uuid;v_broad boolean;\n v_today date;v_due date;v_late integer;v_row record;\n v_total integer:=0;v_overdue integer:=0;v_overdue_candidates integer:=0;\n v_today_due integer:=0;v_tomorrow_due integer:=0;v_future integer:=0;\nBEGIN\n v_claims:=nullif(current_setting('request.jwt.claims',true),'')::jsonb;\n v_sub:=v_claims->>'sub';\n IF (v_claims->>'role') IS DISTINCT FROM 'authenticated'\n OR v_sub IS NULL\n OR v_sub !~* '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'\n OR p_office IS NULL\n THEN RAISE EXCEPTION 'R359_ACCESS_DENIED' USING ERRCODE='42501'; END IF;\n IF p_as_of IS NULL OR NOT isfinite(p_as_of)\n THEN RAISE EXCEPTION 'R359_INVALID_AS_OF' USING ERRCODE='22023'; END IF;\n IF p_repeat_days IS NULL OR p_repeat_days<1 OR p_repeat_days>30\n THEN RAISE EXCEPTION 'R359_INVALID_REPEAT' USING ERRCODE='22023'; END IF;\n\n v_actor:=v_sub::uuid;\n SELECT s.id,(s.role IN ('owner','admin') OR s.can_view_all_clients)\n INTO v_staff,v_broad\n FROM public.r335_staff s JOIN public.r335_offices o ON o.id=s.office_id\n WHERE s.office_id=p_office AND s.auth_user_id=v_actor AND s.is_active AND o.is_active\n LIMIT 1;\n IF v_staff IS NULL THEN RAISE EXCEPTION 'R359_ACCESS_DENIED' USING ERRCODE='42501'; END IF;\n\n v_today:=(p_as_of AT TIME ZONE 'Asia/Tokyo')::date;\n FOR v_row IN\n  SELECT d.due_at\n  FROM public.r342_requests r\n  JOIN public.r335_clients c ON c.office_id=r.office_id AND c.id=r.client_id\n  JOIN public.r352_deadlines d ON d.office_id=r.office_id AND d.request_id=r.id\n  WHERE r.office_id=p_office AND r.status='requested'\n  AND (v_broad OR c.assigned_staff_id=v_staff)\n LOOP\n  v_total:=v_total+1;\n  v_due:=(v_row.due_at AT TIME ZONE 'Asia/Tokyo')::date;\n  IF v_due<v_today THEN\n   v_overdue:=v_overdue+1;\n   v_late:=v_today-v_due;\n   IF (v_late-1)%p_repeat_days=0 THEN\n    v_overdue_candidates:=v_overdue_candidates+1;\n   END IF;\n  ELSIF v_due=v_today THEN\n   v_today_due:=v_today_due+1;\n  ELSIF v_due=v_today+1 THEN\n   v_tomorrow_due:=v_tomorrow_due+1;\n  ELSE\n   v_future:=v_future+1;\n  END IF;\n END LOOP;\n RETURN pg_catalog.jsonb_build_object(\n  'as_of_day',v_today::text,'repeat_days',p_repeat_days,\n  'total_visible',v_total,'candidate_total',v_overdue_candidates+v_today_due+v_tomorrow_due,\n  'overdue_total',v_overdue,'overdue_candidates',v_overdue_candidates,\n  'due_today_total',v_today_due,'day_before_total',v_tomorrow_due,\n  'future_total',v_future,'preview_only',true,'scheduled',false);\nEND;\n$r359_rpc$;\n\nALTER FUNCTION public.r359_preview_followup_summary(uuid,timestamptz,integer)\n OWNER TO r342_executor;\nREVOKE ALL ON FUNCTION public.r359_preview_followup_summary(uuid,timestamptz,integer)\n FROM PUBLIC,anon;\nGRANT EXECUTE ON FUNCTION public.r359_preview_followup_summary(uuid,timestamptz,integer)\n TO authenticated;\nNOTIFY pgrst,'reload schema';\n\nDO $r359_acl$ BEGIN\n IF (SELECT count(*) FROM pg_class WHERE oid IN (\n   'public.r355_visits'::regclass,'public.r342_requests'::regclass,\n   'public.r352_deadlines'::regclass) AND relrowsecurity AND relforcerowsecurity)<>3\n OR has_function_privilege('anon','public.r359_preview_followup_summary(uuid,timestamptz,integer)','EXECUTE')\n OR NOT has_function_privilege('authenticated','public.r359_preview_followup_summary(uuid,timestamptz,integer)','EXECUTE')\n OR (SELECT rolname FROM pg_roles WHERE oid=(SELECT proowner FROM pg_proc\n      WHERE oid='public.r359_preview_followup_summary(uuid,timestamptz,integer)'::regprocedure))<>'r342_executor'\n OR (SELECT rolcanlogin OR rolbypassrls FROM pg_roles WHERE rolname='r342_executor') IS DISTINCT FROM false\n OR has_table_privilege('authenticated','public.r342_requests','SELECT')\n OR has_table_privilege('authenticated','public.r352_deadlines','SELECT')\n OR has_table_privilege('authenticated','public.r342_requests','INSERT')\n THEN RAISE EXCEPTION 'R359_PREVIEW_SUMMARY_ACL_HOLD'; END IF;\n RAISE NOTICE 'R359_SYNTHETIC_FOLLOWUP_SUMMARY_READY source_requests=19 sends=0';\nEND $r359_acl$;\nR359_R359_SCHEMA_SQL\npgid=\"${{ job.services.pg.id }}\"\ntest -n \"$pgid\"\ndocker exec -i \"$pgid\" psql -X -U postgres -d r331_synthetic -v ON_ERROR_STOP=1 < /tmp/r359_schema.sql\n"
    - name: R359 install independent PG17 scope and deadline HTTP summary assertions
      shell: bash
      run: "set -euo pipefail\ncat >/tmp/r359_http.mjs <<'R359_R359_HTTP_MJS'\nimport assert from 'node:assert/strict';\nimport {readFileSync} from 'node:fs';\nimport {createHmac} from 'node:crypto';\n\n// Cross-check real signed-JWT PostgREST against independent privileged PG17\n// request/deadline AND client/staff/office SELECT snapshots.\nconst STAGE=process.env.R359_STAGE??'initial';\nconst HOST='http://127.0.0.1:3000';\nconst SECRET='R335_SYNTHETIC_JWT_SIGNING_KEY_NOT_REAL_1234567890';\nconst data=JSON.parse(readFileSync(process.env.R359_REQUEST_ORACLE_PATH??'/tmp/r356_oracle.json'));\nconst scope=JSON.parse(readFileSync(process.env.R359_SCOPE_ORACLE_PATH??'/tmp/r358c_scope_oracle.json'));\nconst clients=new Map(scope.clients.map(c=>[c.id,c]));\nconst offices=new Map(scope.offices.map(o=>[o.id,o]));\nconst OA='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa';\nconst OB='bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb';\nconst STAFF='00000002-0002-4002-8002-000000000002';\nconst OWNER_A='00000005-0005-4005-8005-000000000005';\nconst OWNER_B='00000003-0003-4003-8003-000000000003';\nconst REASSIGNED='20000000-0000-4000-8000-000000000004';\nconst TRANSFER_STAFF='10000000-0000-4000-8000-000000000005';\nconst AS_OF='2028-02-29T03:00:00Z';\nconst MARCH='2028-02-29T15:00:00Z';\nconst APRIL='2028-04-15T12:30:00Z';\nlet checks=0;\nfunction eq(name,actual,expected){assert.deepEqual(actual,expected,name);checks++}\nfunction ok(name,x){assert.ok(x,name);checks++}\nfunction day(value){\n const parts=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date(value));\n const d=Object.fromEntries(parts.filter(p=>['year','month','day'].includes(p.type)).map(p=>[p.type,p.value]));\n return `${d.year}-${d.month}-${d.day}`;\n}\nfunction diff(a,b){return (Date.parse(a+'T00:00:00Z')-Date.parse(b+'T00:00:00Z'))/86400000}\nfunction visible(office,subject){\n const off=offices.get(office);\n const s=scope.staff.find(x=>x.office_id===office&&x.auth_user_id===subject);\n if(!off?.is_active||!s?.is_active)return [];\n if(STAGE==='revoked'&&subject===STAFF)return [];\n if(STAGE==='office_paused'&&office===OA)return [];\n const broad=['owner','admin'].includes(s.role)||s.can_view_all_clients;\n return data.requests.filter(r=>{\n  if(r.office_id!==office||r.status!=='requested')return false;\n  const c=clients.get(r.client_id);\n  const a=(STAGE==='reassigned'&&r.client_id===REASSIGNED)?TRANSFER_STAFF:c?.assigned_staff_id;\n  return c?.office_id===office&&(broad||a===s.id);\n });\n}\nfunction expected(office,subject,asOf,repeat){\n const rows=visible(office,subject),today=day(asOf);\n const counts={overdue_total:0,overdue_candidates:0,due_today_total:0,day_before_total:0,future_total:0};\n for(const row of rows){\n  const late=diff(today,day(row.due_at));\n  if(late>0){counts.overdue_total++;if((late-1)%repeat===0)counts.overdue_candidates++}\n  else if(late===0)counts.due_today_total++;\n  else if(late===-1)counts.day_before_total++;\n  else counts.future_total++;\n }\n return {as_of_day:today,repeat_days:repeat,total_visible:rows.length,\n  candidate_total:counts.overdue_candidates+counts.due_today_total+counts.day_before_total,\n  ...counts,preview_only:true,scheduled:false};\n}\nconst enc=x=>Buffer.from(JSON.stringify(x)).toString('base64url');\nfunction token(subject,claims={}){\n const a=enc({alg:'HS256',typ:'JWT'}),b=enc({sub:subject,role:'authenticated',exp:4102444800,...claims});\n return a+'.'+b+'.'+createHmac('sha256',SECRET).update(a+'.'+b).digest('base64url');\n}\nasync function call(office,subject=STAFF,asOf=AS_OF,repeat=7,jwt=token(subject)){\n const res=await fetch(HOST+'/rpc/r359_preview_followup_summary',{\n  method:'POST',headers:{'content-type':'application/json',accept:'application/json',\n   ...(jwt?{authorization:'Bearer '+jwt}:{})},\n  body:JSON.stringify({p_office:office,p_as_of:asOf,p_repeat_days:repeat}),\n  signal:AbortSignal.timeout(16000)});\n const raw=await res.text();let body;\n try{body=raw?JSON.parse(raw):null}catch{throw Error('R359_INVALID_JSON '+res.status+' '+raw.slice(0,180))}\n return {status:res.status,body};\n}\nconst expectedKeys=['as_of_day','candidate_total','day_before_total','due_today_total','future_total',\n 'overdue_candidates','overdue_total','preview_only','repeat_days','scheduled','total_visible'];\nfunction yes(name,result,office,subject,asOf=AS_OF,repeat=7){\n eq(name+'-200',result.status,200);\n eq(name+'-keys',Object.keys(result.body).sort(),expectedKeys);\n eq(name+'-independent-raw-pg17-summary',result.body,expected(office,subject,asOf,repeat));\n ok(name+'-no-sensitive-ids',![OA,OB,STAFF,OWNER_A,OWNER_B,\n  ...data.requests.map(x=>x.id),...scope.clients.map(x=>x.id)]\n  .some(id=>JSON.stringify(result.body).includes(id)));\n eq(name+'-phase-partition',result.body.overdue_total+result.body.due_today_total+\n  result.body.day_before_total+result.body.future_total,result.body.total_visible);\n eq(name+'-candidate-subset',result.body.candidate_total,\n  result.body.overdue_candidates+result.body.due_today_total+result.body.day_before_total);\n ok(name+'-preview-never-send',result.body.preview_only===true&&result.body.scheduled===false);\n}\nfunction deny(name,result){\n eq(name+'-403',result.status,403);\n eq(name+'-sqlstate',result.body?.code,'42501');\n eq(name+'-generic-message',result.body?.message,'R359_ACCESS_DENIED');\n ok(name+'-no-count',result.body?.total_visible===undefined);\n}\n\neq('source-19-requests',data.requests.length,19);\neq('source-16-pending',data.requests.filter(r=>r.status==='requested').length,16);\neq('scope-2-offices',scope.offices.length,2);\nok('scope-all-requests-join-client-office',data.requests.every(r=>clients.get(r.client_id)?.office_id===r.office_id));\nok('scope-staff-A-not-broad',scope.staff.find(s=>s.auth_user_id===STAFF)?.can_view_all_clients===false);\nok('scope-staff-A-role',scope.staff.find(s=>s.auth_user_id===STAFF)?.role==='staff');\n\nif(STAGE==='initial'){\n for(const [label,office,subject] of [['owner-A',OA,OWNER_A],['staff-A',OA,STAFF],['owner-B',OB,OWNER_B]]){\n  for(const [asOf,dateLabel] of [[AS_OF,'leap-feb'],[MARCH,'jst-mar'],[APRIL,'late-april']]){\n   for(const repeat of [1,7,30]){\n    yes(`${label}-${dateLabel}-repeat-${repeat}`,await call(office,subject,asOf,repeat),office,subject,asOf,repeat);\n   }\n  }\n }\n for(let i=0;i<12;i++){\n  deny('staff-cross-office-'+i,await call(OB,STAFF));\n  deny('owner-cross-office-'+i,await call(OA,OWNER_B));\n }\n yes('forged-admin-claims-no-escalation',await call(OA,STAFF,AS_OF,7,\n  token(STAFF,{is_admin:true,can_view_all_clients:true,office_id:OB})),OA,STAFF);\n deny('non-member',await call(OA,'00000000-0000-4000-8000-000000000009'));\n deny('malformed-uuid',await call(OA,'not-a-uuid'));\n deny('unknown-office',await call('00000000-0000-4000-8000-000000000000',STAFF));\n const anon=await call(OA,STAFF,AS_OF,7,null);\n ok('anonymous-denied',[401,403,404].includes(anon.status));\n const wrongRole=await call(OA,STAFF,AS_OF,7,token(STAFF,{role:'anon'}));\n ok('wrong-role-denied',[401,403,404].includes(wrongRole.status));\n for(const [label,asOf,repeat,error] of [\n  ['repeat-zero',AS_OF,0,'R359_INVALID_REPEAT'],\n  ['repeat-over-30',AS_OF,31,'R359_INVALID_REPEAT'],\n  ['repeat-null',AS_OF,null,'R359_INVALID_REPEAT'],\n  ['date-null',null,7,'R359_INVALID_AS_OF'],\n  ['date-infinity','infinity',7,'R359_INVALID_AS_OF']]){\n  const r=await call(OA,STAFF,asOf,repeat);\n  eq(label+'-400',r.status,400);eq(label+'-code',r.body?.code,'22023');\n  eq(label+'-message',r.body?.message,error);\n }\n const batch=await Promise.all(Array.from({length:64},(_,i)=>{\n  const office=i%3===2?OB:OA,subject=i%3===0?STAFF:i%3===1?OWNER_A:OWNER_B;\n  return call(office,subject,i%2?AS_OF:MARCH,[1,7,30][i%3]);\n }));\n batch.forEach((result,i)=>{\n  const office=i%3===2?OB:OA,subject=i%3===0?STAFF:i%3===1?OWNER_A:OWNER_B;\n  yes('parallel-'+i,result,office,subject,i%2?AS_OF:MARCH,[1,7,30][i%3]);\n });\n}else if(STAGE==='revoked'){\n for(let i=0;i<12;i++)deny('revoked-staff-'+i,await call(OA,STAFF));\n for(let i=0;i<5;i++)yes('owner-unaffected-'+i,await call(OA,OWNER_A),OA,OWNER_A);\n}else if(STAGE==='restored'){\n for(let i=0;i<12;i++)yes('staff-restored-'+i,await call(OA,STAFF),OA,STAFF);\n}else if(STAGE==='reassigned'){\n for(let i=0;i<12;i++)yes('assignment-recomputed-'+i,await call(OA,STAFF),OA,STAFF);\n for(let i=0;i<5;i++)yes('owner-still-broad-'+i,await call(OA,OWNER_A),OA,OWNER_A);\n}else if(STAGE==='office_paused'){\n for(let i=0;i<12;i++)deny('office-paused-staff-'+i,await call(OA,STAFF));\n for(let i=0;i<6;i++)deny('office-paused-owner-'+i,await call(OA,OWNER_A));\n for(let i=0;i<5;i++)yes('other-office-continues-'+i,await call(OB,OWNER_B),OB,OWNER_B);\n}else if(STAGE==='final'){\n for(const [label,office,subject] of [['owner-A',OA,OWNER_A],['staff-A',OA,STAFF],['owner-B',OB,OWNER_B]]){\n  yes('final-'+label,await call(office,subject),office,subject);\n }\n for(const table of ['r335_staff','r342_requests','r352_deadlines']){\n  const res=await fetch(HOST+'/'+table+'?select=*',{\n   headers:{authorization:'Bearer '+token(OWNER_A)},signal:AbortSignal.timeout(12000)});\n  ok('direct-raw-table-closed-'+table,[401,403,404,405].includes(res.status));\n }\n}else throw Error('R359_UNKNOWN_STAGE_'+STAGE);\n\nconsole.log(JSON.stringify({suite:'R359_SCOPED_MATERIAL_FOLLOWUP_SUMMARY',stage:STAGE,checks,\n signed_jwt:true,independent_pg17_raw_requests:true,independent_pg17_scope:true,\n observed_staff_visible:visible(OA,STAFF).length,leap_year_jst:true,\n cadence:[1,7,30],parallel_64:true,read_only:true,notifications_scheduled:false,\n notifications_sent:0,production_mutations:0,commercial_release:'HOLD'}));\nR359_R359_HTTP_MJS\nnode --check /tmp/r359_http.mjs\n"
