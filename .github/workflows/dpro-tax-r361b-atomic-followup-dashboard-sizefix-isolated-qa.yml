    - name: R357 create read-only assignment-scoped paginated visit/material worklist RPC
      shell: bash
      run: "set -euo pipefail\ncat >/tmp/r357_schema.sql <<'R357_R357_SCHEMA_SQL'\n\\set ON_ERROR_STOP on\n-- R357 disposable PG17/PostgREST ONLY: paginated, actionable but read-only\n-- visit/material worklist. Never execute against shared/production Supabase.\nDO $r357_baseline$ BEGIN\n IF (SELECT count(*) FROM public.r355_visits)<>7\n OR (SELECT count(*) FROM public.r342_requests)<>19\n OR (SELECT count(*) FROM public.r342_audit)<>19\n OR (SELECT count(*) FROM public.r350_status_audit)<>3\n OR (SELECT count(*) FROM public.r352_deadlines)<>19\n OR (SELECT count(*) FROM public.r342_requests WHERE status='completed')<>3\n THEN RAISE EXCEPTION 'R357_R356B_FORMAL_BASELINE_DRIFT_HOLD'; END IF;\nEND $r357_baseline$;\n\nCREATE FUNCTION public.r357_preview_visit_worklist(\n p_office uuid,p_as_of timestamptz,p_limit integer,p_offset integer)\nRETURNS jsonb LANGUAGE plpgsql STABLE SECURITY DEFINER SET search_path=pg_catalog\nAS $r357_rpc$\nDECLARE\n v_claims jsonb;v_sub text;v_actor uuid;v_staff uuid;v_broad boolean;\n v_today date;v_total bigint;v_items jsonb:='[]'::jsonb;\n v_preview jsonb;v_visit record;\nBEGIN\n v_claims:=nullif(current_setting('request.jwt.claims',true),'')::jsonb;\n v_sub:=v_claims->>'sub';\n IF (v_claims->>'role') IS DISTINCT FROM 'authenticated'\n OR v_sub IS NULL\n OR v_sub !~* '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'\n OR p_office IS NULL\n THEN RAISE EXCEPTION 'R357_ACCESS_DENIED' USING ERRCODE='42501'; END IF;\n IF p_as_of IS NULL OR NOT isfinite(p_as_of)\n THEN RAISE EXCEPTION 'R357_INVALID_AS_OF' USING ERRCODE='22023'; END IF;\n IF p_limit IS NULL OR p_limit<1 OR p_limit>25\n OR p_offset IS NULL OR p_offset<0 OR p_offset>1000\n THEN RAISE EXCEPTION 'R357_INVALID_PAGE' USING ERRCODE='22023'; END IF;\n\n v_actor:=v_sub::uuid;\n SELECT s.id,(s.role IN ('owner','admin') OR s.can_view_all_clients)\n INTO v_staff,v_broad\n FROM public.r335_staff s JOIN public.r335_offices o ON o.id=s.office_id\n WHERE s.office_id=p_office AND s.auth_user_id=v_actor AND s.is_active AND o.is_active\n LIMIT 1;\n IF v_staff IS NULL THEN RAISE EXCEPTION 'R357_ACCESS_DENIED' USING ERRCODE='42501'; END IF;\n v_today:=(p_as_of AT TIME ZONE 'Asia/Tokyo')::date;\n\n SELECT count(*) INTO v_total\n FROM public.r355_visits v\n JOIN public.r335_clients c ON c.office_id=v.office_id AND c.id=v.client_id\n WHERE v.office_id=p_office AND v.visit_status='scheduled'\n AND (v.visit_at AT TIME ZONE 'Asia/Tokyo')::date>=v_today\n AND (v_broad OR c.assigned_staff_id=v_staff);\n\n FOR v_visit IN\n  SELECT v.id,v.client_id,v.visit_at\n  FROM public.r355_visits v\n  JOIN public.r335_clients c ON c.office_id=v.office_id AND c.id=v.client_id\n  WHERE v.office_id=p_office AND v.visit_status='scheduled'\n  AND (v.visit_at AT TIME ZONE 'Asia/Tokyo')::date>=v_today\n  AND (v_broad OR c.assigned_staff_id=v_staff)\n  ORDER BY v.visit_at,v.id\n  LIMIT p_limit OFFSET p_offset\n LOOP\n  -- Reuse the independently R356B-verified single-visit RPC rather than\n  -- duplicate eligibility / deadline logic. This function owns no writes.\n  v_preview:=public.r356_preview_visit_materials(p_office,v_visit.id,p_as_of);\n  v_items:=v_items || pg_catalog.jsonb_build_array(\n   v_preview || pg_catalog.jsonb_build_object(\n    'visit_id',v_visit.id,'client_id',v_visit.client_id));\n END LOOP;\n\n RETURN pg_catalog.jsonb_build_object(\n  'as_of_day',v_today::text,\n  'total_visible',v_total,\n  'page_limit',p_limit,'page_offset',p_offset,\n  'items',v_items,\n  'preview_only',true,'notification_scheduled',false);\nEND;\n$r357_rpc$;\n\nALTER FUNCTION public.r357_preview_visit_worklist(uuid,timestamptz,integer,integer)\n OWNER TO r342_executor;\nREVOKE ALL ON FUNCTION public.r357_preview_visit_worklist(uuid,timestamptz,integer,integer)\n FROM PUBLIC,anon;\nGRANT EXECUTE ON FUNCTION public.r357_preview_visit_worklist(uuid,timestamptz,integer,integer)\n TO authenticated;\nNOTIFY pgrst,'reload schema';\n\nDO $r357_acl$ BEGIN\n IF (SELECT count(*) FROM pg_class WHERE oid IN (\n  'public.r355_visits'::regclass,'public.r342_requests'::regclass,\n  'public.r352_deadlines'::regclass) AND relrowsecurity AND relforcerowsecurity)<>3\n OR has_table_privilege('authenticated','public.r355_visits','SELECT')\n OR has_table_privilege('authenticated','public.r342_requests','SELECT')\n OR has_table_privilege('authenticated','public.r352_deadlines','SELECT')\n OR has_table_privilege('authenticated','public.r355_visits','INSERT')\n OR has_table_privilege('authenticated','public.r342_requests','INSERT')\n OR has_table_privilege('authenticated','public.r352_deadlines','INSERT')\n OR has_function_privilege('anon','public.r357_preview_visit_worklist(uuid,timestamptz,integer,integer)','EXECUTE')\n OR NOT has_function_privilege('authenticated','public.r357_preview_visit_worklist(uuid,timestamptz,integer,integer)','EXECUTE')\n OR (SELECT rolname FROM pg_roles WHERE oid=(SELECT proowner FROM pg_proc WHERE\n  oid='public.r357_preview_visit_worklist(uuid,timestamptz,integer,integer)'::regprocedure))<>'r342_executor'\n OR (SELECT rolcanlogin OR rolbypassrls FROM pg_roles WHERE rolname='r342_executor') IS DISTINCT FROM false\n THEN RAISE EXCEPTION 'R357_VISIT_WORKLIST_ACL_HOLD'; END IF;\n RAISE NOTICE 'R357_SYNTHETIC_VISIT_WORKLIST_READY visits=7 deadline_rows=19 sends=0';\nEND $r357_acl$;\nR357_R357_SCHEMA_SQL\npgid=\"${{ job.services.pg.id }}\"\ntest -n \"$pgid\"\ndocker exec -i \"$pgid\" psql -X -U postgres -d r331_synthetic -v ON_ERROR_STOP=1 < /tmp/r357_schema.sql\n"
    - name: R357 install signed JWT and independent PG17 oracle HTTP worklist assertions
      shell: bash
      run: "set -euo pipefail\ncat >/tmp/r357_http.mjs <<'R357_R357_HTTP_MJS'\nimport assert from 'node:assert/strict';\nimport {readFileSync} from 'node:fs';\nimport {createHmac} from 'node:crypto';\n\n// Verifies real signed-JWT PostgREST HTTP against disposable PostgreSQL 17.\n// Independent visit and deadline raw rows came from PG17 superuser SELECT.\nconst STAGE=process.env.R357_STAGE??'initial';\nconst HOST='http://127.0.0.1:3000';\nconst SECRET='R335_SYNTHETIC_JWT_SIGNING_KEY_NOT_REAL_1234567890';\nconst oracle=JSON.parse(readFileSync(process.env.R357_ORACLE_PATH??'/tmp/r356_oracle.json','utf8'));\nconst OA='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa';\nconst OB='bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb';\nconst STAFF='00000002-0002-4002-8002-000000000002';\nconst OWNER_A='00000005-0005-4005-8005-000000000005';\nconst OWNER_B='00000003-0003-4003-8003-000000000003';\nconst CLIENT_ASSIGNED='20000000-0000-4000-8000-000000000004';\nconst CLIENT_ALSO_ASSIGNED='20000000-0000-4000-8000-000000000001';\nconst CLIENT_OWNER_ONLY='20000000-0000-4000-8000-000000000002';\nconst AS_OF='2028-02-29T03:00:00Z';\nconst JST_MARCH='2028-02-29T15:00:00Z';\n\nconst enc=x=>Buffer.from(JSON.stringify(x)).toString('base64url');\nfunction jwt(subject,claims={}){\n const h=enc({alg:'HS256',typ:'JWT'}),p=enc({sub:subject,role:'authenticated',exp:4102444800,...claims});\n return h+'.'+p+'.'+createHmac('sha256',SECRET).update(h+'.'+p).digest('base64url');\n}\nfunction jstDay(v){\n const parts=new Intl.DateTimeFormat('en-US',{\n  timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'\n }).formatToParts(new Date(v));\n const x=Object.fromEntries(parts.filter(p=>['year','month','day'].includes(p.type)).map(p=>[p.type,p.value]));\n return `${x.year}-${x.month}-${x.day}`;\n}\nfunction tomorrow(day){const d=new Date(day+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+1);return d.toISOString().slice(0,10)}\nfunction expectedSingle(v,asOf){\n const today=jstDay(asOf),visitDay=jstDay(v.visit_at);\n const phase=v.status==='cancelled'?'cancelled':v.status==='completed'?'completed':\n  visitDay<today?'passed':visitDay===today?'today':visitDay===tomorrow(today)?'day_before':'future';\n const all=oracle.requests.filter(r=>r.office_id===v.office_id&&r.client_id===v.client_id);\n const pending=all.filter(r=>r.status==='requested'),completed=all.filter(r=>r.status==='completed');\n const due=pending.filter(r=>jstDay(r.due_at)<=visitDay).length;\n const overdue=pending.filter(r=>jstDay(r.due_at)<today).length;\n return {client_id:v.client_id,visit_id:v.id,visit_day:visitDay,phase,\n  visit_reminder_eligible:phase==='day_before',\n  material_followup_eligible:phase==='day_before'&&due>0,\n  total_materials:all.length,pending_materials:pending.length,\n  completed_materials:completed.length,due_by_visit:due,overdue_as_of:overdue,\n  preview_only:true,notification_scheduled:false};\n}\nfunction visible(office,subject,asOf){\n return oracle.visits.filter(v=>v.office_id===office&&v.status==='scheduled'&&\n  jstDay(v.visit_at)>=jstDay(asOf)&&(\n  (office===OA&&subject===OWNER_A)||(office===OB&&subject===OWNER_B)||\n  (office===OA&&subject===STAFF&&STAGE!=='revoked'&&\n   [CLIENT_ASSIGNED,CLIENT_ALSO_ASSIGNED].includes(v.client_id)&&\n   !(STAGE==='reassigned'&&v.client_id===CLIENT_ASSIGNED))\n )).sort((a,b)=>a.visit_at.localeCompare(b.visit_at)||a.id.localeCompare(b.id));\n}\nlet checks=0;\nfunction eq(n,a,b){assert.deepEqual(a,b,n);checks++}\nfunction ok(n,v){assert.ok(v,n);checks++}\nasync function call(office,subject=STAFF,asOf=AS_OF,limit=25,offset=0,token=jwt(subject)){\n const res=await fetch(HOST+'/rpc/r357_preview_visit_worklist',{\n  method:'POST',headers:{'content-type':'application/json',accept:'application/json',\n   ...(token?{authorization:'Bearer '+token}:{})},\n  body:JSON.stringify({p_office:office,p_as_of:asOf,p_limit:limit,p_offset:offset}),\n  signal:AbortSignal.timeout(16000)});\n const raw=await res.text();let body;\n try{body=raw?JSON.parse(raw):null}catch{throw Error('R357_INVALID_HTTP_JSON_'+res.status+'_'+raw.slice(0,160))}\n return {status:res.status,body};\n}\nconst outerKeys=['as_of_day','items','notification_scheduled','page_limit','page_offset','preview_only','total_visible'];\nconst innerKeys=['client_id','completed_materials','due_by_visit','material_followup_eligible',\n 'notification_scheduled','overdue_as_of','pending_materials','phase','preview_only',\n 'total_materials','visit_day','visit_id','visit_reminder_eligible'];\nfunction yes(name,res,office,subject,asOf=AS_OF,limit=25,offset=0){\n eq(name+'-200',res.status,200);\n eq(name+'-outer-keys',Object.keys(res.body).sort(),outerKeys);\n eq(name+'-asof',res.body.as_of_day,jstDay(asOf));\n eq(name+'-limit',res.body.page_limit,limit);\n eq(name+'-offset',res.body.page_offset,offset);\n eq(name+'-preview-only',res.body.preview_only,true);\n eq(name+'-no-notification',res.body.notification_scheduled,false);\n const all=visible(office,subject,asOf),expected=all.slice(offset,offset+limit);\n eq(name+'-total-visible',res.body.total_visible,all.length);\n eq(name+'-page-size',res.body.items.length,expected.length);\n for(const [i,v] of expected.entries()){\n  const item=res.body.items[i];\n  eq(name+'-row-keys-'+i,Object.keys(item).sort(),innerKeys);\n  eq(name+'-row-'+i,item,expectedSingle(v,asOf));\n  ok(name+'-no-office-id-'+i,!JSON.stringify(item).includes(office));\n  ok(name+'-no-material-id-'+i,!oracle.requests.some(r=>JSON.stringify(item).includes(r.id)));\n }\n eq(name+'-unique-page-visits',new Set(res.body.items.map(x=>x.visit_id)).size,expected.length);\n ok(name+'-no-cross-office-client',res.body.items.every(x=>all.some(v=>v.client_id===x.client_id)));\n}\nfunction deny(name,r){\n eq(name+'-status',r.status,403);\n eq(name+'-sqlstate',r.body?.code,'42501');\n eq(name+'-generic',r.body?.message,'R357_ACCESS_DENIED');\n ok(name+'-no-items',r.body?.items===undefined);\n}\n\neq('oracle-seven-visits',oracle.visits.length,7);\neq('oracle-nineteen-material-deadlines',oracle.requests.length,19);\neq('office-a-scheduled-four',oracle.visits.filter(v=>v.office_id===OA&&v.status==='scheduled').length,4);\neq('owner-only-client',oracle.visits.find(v=>v.client_id===CLIENT_OWNER_ONLY)?.office_id,OA);\neq('cancelled-excluded',oracle.visits.filter(v=>v.status==='cancelled').length,1);\neq('completed-excluded',oracle.visits.filter(v=>v.status==='completed').length,1);\n\nif(STAGE==='initial'){\n for(const [label,office,subject] of [['owner-a',OA,OWNER_A],['staff-a',OA,STAFF],['owner-b',OB,OWNER_B]]){\n  for(const [limit,offset] of [[1,0],[2,0],[2,1],[5,0],[25,0],[25,3],[25,99]]){\n   yes(`${label}-page-${limit}-${offset}`,await call(office,subject,AS_OF,limit,offset),office,subject,AS_OF,limit,offset);\n  }\n  yes(`${label}-march`,await call(office,subject,JST_MARCH),office,subject,JST_MARCH);\n }\n for(let i=0;i<8;i++){\n  deny('staff-cross-tenant-'+i,await call(OB,STAFF));\n  deny('owner-b-cross-tenant-'+i,await call(OA,OWNER_B));\n }\n yes('forged-owner-claims-do-not-escalate',await call(OA,STAFF,AS_OF,25,0,\n  jwt(STAFF,{is_admin:true,can_view_all_clients:true,office_id:OA})),OA,STAFF);\n deny('missing-membership',await call(OA,'00000000-0000-4000-8000-000000000009'));\n deny('malformed-sub',await call(OA,'not-a-uuid'));\n deny('absent-office',await call('00000000-0000-4000-8000-000000000000',STAFF));\n const anonymous=await call(OA,STAFF,AS_OF,25,0,null);\n ok('anonymous-closed',[401,403,404].includes(anonymous.status));\n const wrongRole=await call(OA,STAFF,AS_OF,25,0,jwt(STAFF,{role:'anon'}));\n ok('wrong-role-closed',[401,403,404].includes(wrongRole.status));\n for(const [label,asOf,limit,offset,err] of [\n  ['limit-zero',AS_OF,0,0,'R357_INVALID_PAGE'],\n  ['limit-too-large',AS_OF,26,0,'R357_INVALID_PAGE'],\n  ['negative-offset',AS_OF,25,-1,'R357_INVALID_PAGE'],\n  ['huge-offset',AS_OF,25,1001,'R357_INVALID_PAGE'],\n  ['null-limit',AS_OF,null,0,'R357_INVALID_PAGE'],\n  ['null-offset',AS_OF,25,null,'R357_INVALID_PAGE'],\n  ['null-asof',null,25,0,'R357_INVALID_AS_OF'],\n  ['infinity','infinity',25,0,'R357_INVALID_AS_OF']\n ]){\n  const r=await call(OA,STAFF,asOf,limit,offset);\n  eq(label+'-400',r.status,400);eq(label+'-code',r.body?.code,'22023');\n  eq(label+'-generic',r.body?.message,err);\n }\n const parallel=await Promise.all(Array.from({length:64},(_,i)=>{\n  const office=i%3===0?OA:i%3===1?OA:OB;\n  const subject=i%3===0?STAFF:i%3===1?OWNER_A:OWNER_B;\n  return call(office,subject,AS_OF,2,i%2);\n }));\n parallel.forEach((r,i)=>{\n  const office=i%3===2?OB:OA,subject=i%3===0?STAFF:i%3===1?OWNER_A:OWNER_B;\n  yes('parallel-'+i,r,office,subject,AS_OF,2,i%2);\n });\n}else if(STAGE==='revoked'){\n for(let i=0;i<12;i++)deny('staff-revoked-'+i,await call(OA,STAFF));\n for(let i=0;i<6;i++)yes('owner-unaffected-'+i,await call(OA,OWNER_A),OA,OWNER_A);\n}else if(STAGE==='restored'){\n for(let i=0;i<12;i++)yes('staff-restored-'+i,await call(OA,STAFF),OA,STAFF);\n}else if(STAGE==='reassigned'){\n for(let i=0;i<12;i++)yes('transferred-client-removed-'+i,await call(OA,STAFF),OA,STAFF);\n for(let i=0;i<6;i++)yes('owner-broad-'+i,await call(OA,OWNER_A),OA,OWNER_A);\n}else if(STAGE==='office_paused'){\n for(let i=0;i<12;i++)deny('office-paused-staff-'+i,await call(OA,STAFF));\n for(let i=0;i<6;i++)deny('office-paused-owner-'+i,await call(OA,OWNER_A));\n for(let i=0;i<6;i++)yes('other-office-works-'+i,await call(OB,OWNER_B),OB,OWNER_B);\n}else if(STAGE==='final'){\n for(const [label,office,subject] of [['owner-a',OA,OWNER_A],['staff-a',OA,STAFF],['owner-b',OB,OWNER_B]]){\n  yes(label+'-restored',await call(office,subject),office,subject);\n }\n for(const table of ['r355_visits','r342_requests','r352_deadlines']){\n  const r=await fetch(HOST+'/'+table+'?select=*',{\n   headers:{authorization:'Bearer '+jwt(OWNER_A)},signal:AbortSignal.timeout(12000)});\n  ok('raw-table-'+table+'-read-denied',[401,403,404,405].includes(r.status));\n }\n}else throw Error('R357_UNKNOWN_STAGE_'+STAGE);\n\nconsole.log(JSON.stringify({suite:'R357_VISIT_MATERIAL_WORKLIST',stage:STAGE,checks,\n signed_jwt:true,independent_pg17_oracle:true,scope:'tenant_and_assignment',\n pagination:'deterministic',notification_scheduled:false,notifications_sent:0,\n production_changes:0,commercial_release:'HOLD'}));\nR357_R357_HTTP_MJS\nnode --check /tmp/r357_http.mjs\n"
    - name: R357 allow PostgREST to observe newly created RPC schema
      shell: bash
      run: "set -euo pipefail\nsleep 2\necho R357_POSTGREST_SCHEMA_RELOAD_SETTLED\n"
    - name: R357 real HTTP scoped worklist paging, leap day, 64 parallel and auth denial
      shell: bash
      run: "R357_STAGE=initial node /tmp/r357_http.mjs\n"
    - name: R357 revoke synthetic assigned staff in disposable PG17
      shell: bash
      run: "set -euo pipefail\ncat >/tmp/r357_revoke.sql <<'R357_SQL'\n\\set ON_ERROR_STOP on\nUPDATE public.r335_staff SET is_active=false WHERE auth_user_id='00000002-0002-4002-8002-000000000002'::uuid;\nDO $guard$ BEGIN\n IF (SELECT is_active FROM public.r335_staff WHERE auth_user_id='00000002-0002-4002-8002-000000000002'::uuid) IS DISTINCT FROM false\n THEN RAISE EXCEPTION 'R357_REVOKE_FAILED'; END IF;\nEND $guard$;\nR357_SQL\npgid=\"${{ job.services.pg.id }}\"\ntest -n \"$pgid\"\ndocker exec -i \"$pgid\" psql -X -U postgres -d r331_synthetic -v ON_ERROR_STOP=1 < /tmp/r357_revoke.sql\n"
