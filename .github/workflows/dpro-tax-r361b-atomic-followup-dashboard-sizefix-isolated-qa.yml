es')) THEN\n RAISE EXCEPTION 'R338_REFERENCE_POLICY_MUST_STAY_EMPTY'; END IF;\n IF has_table_privilege('authenticated','public.r335_staff','SELECT') OR has_table_privilege('authenticated','public.r335_offices','SELECT') THEN\n RAISE EXCEPTION 'R338_EXCESSIVE_GRANT_PERSISTED'; END IF;\n RAISE NOTICE 'R338_REFERENCE_TABLE_RLS_HARDENED: 2 tables force_rls enabled, 0 policies, no public grants';\nEND $r338_after$;\n-- With RLS enabled, even an ACCIDENTAL excessive SQL GRANT cannot expose rows.\nBEGIN;\nGRANT SELECT ON public.r335_staff,public.r335_offices TO authenticated;\nSET LOCAL ROLE authenticated;\nDO $r338_protect$ DECLARE a int; b int; BEGIN\n SELECT count(*) INTO a FROM public.r335_staff;\n SELECT count(*) INTO b FROM public.r335_offices;\n IF a<>0 OR b<>0 THEN RAISE EXCEPTION 'R338_REFERENCE_RLS_LEAK staff=% offices=%',a,b; END IF;\n RAISE NOTICE 'R338_ACCIDENTAL_GRANT_BLOCKED_BY_RLS: both_tables_zero_visible';\nEND $r338_protect$;\nRESET ROLE;\nROLLBACK;\n-- The PostgREST-only accidental-grant phase is performed after this script.\nR338_1\ncat > /tmp/r338_sql_disposable_grant.sql <<'R338_2'\n\\set ON_ERROR_STOP on\n-- Synthetic test only. The workflow itself runs in a disposable container.\nGRANT SELECT ON public.r335_staff,public.r335_offices TO authenticated;\nDO $r338_grant$ BEGIN\n IF NOT has_table_privilege('authenticated','public.r335_staff','SELECT') OR NOT has_table_privilege('authenticated','public.r335_offices','SELECT') THEN\n RAISE EXCEPTION 'R338_TEST_GRANT_MISSING'; END IF;\n IF (SELECT count(*) FROM pg_class WHERE oid IN ('public.r335_staff'::regclass,'public.r335_offices'::regclass) AND relrowsecurity AND relforcerowsecurity)<>2 THEN\n RAISE EXCEPTION 'R338_RLS_PROTECTION_MISSING'; END IF;\n RAISE NOTICE 'R338_DISPOSABLE_HTTP_ACCIDENTAL_GRANT_ENABLED_AND_RLS_STILL_ON';\nEND $r338_grant$;\nR338_2\ncat > /tmp/r338_sql_restore_grant.sql <<'R338_3'\n\\set ON_ERROR_STOP on\nREVOKE SELECT ON public.r335_staff,public.r335_offices FROM authenticated;\