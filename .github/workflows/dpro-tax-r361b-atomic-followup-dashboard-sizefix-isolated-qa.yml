      shell: bash
      run: "R357_STAGE=revoked node /tmp/r357_http.mjs\n"
    - name: R357 restore synthetic staff active state
      shell: bash
      run: "set -euo pipefail\ncat >/tmp/r357_restore_staff.sql <<'R357_SQL'\n\\set ON_ERROR_STOP on\nUPDATE public.r335_staff SET is_active=true WHERE auth_user_id='00000002-0002-4002-8002-000000000002'::uuid;\nR357_SQL\npgid=\"${{ job.services.pg.id }}\"\ntest -n \"$pgid\"\ndocker exec -i \"$pgid\" psql -X -U postgres -d r331_synthetic -v ON_ERROR_STOP=1 < /tmp/r357_restore_staff.sql\n"
