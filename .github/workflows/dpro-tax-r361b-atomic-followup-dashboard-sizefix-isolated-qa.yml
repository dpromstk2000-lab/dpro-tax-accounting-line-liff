    - name: R348 install scoped NOLOGIN owner request-list RPC into disposable PG17 only
      shell: bash
      run: "set -euo pipefail\ncat >/tmp/r348_rpc.sql <<'R348_SCHEMA'\n\\set ON_ERROR_STOP on\n-- Synthetic isolated PG17 only. Login and BYPASSRLS never granted to RPC owner.\nCREATE FUNCTION public.r348_list_requests(\n  p_office uuid,\n  p_client uuid DEFAULT NULL,\n  p_limit integer DEFAULT 10,\n  p_offset integer DEFAULT 0\n) RETURNS jsonb\nLANGUAGE plpgsql STABLE SECURITY DEFINER SET search_path=pg_catalog\nAS $r348_rpc$\nDECLARE\n v_claims jsonb; v_sub text; v_actor uuid; v_staff uuid; v_broad boolean;\n v_total bigint; v_items jsonb;\nBEGIN\n v_claims:=nullif(current_setting('request.jwt.claims',true),'')::jsonb;\n v_sub:=v_claims->>'sub';\n IF (v_claims->>'role') IS DISTINCT FROM 'authenticated'\n    OR v_sub IS NULL OR v_sub !~* '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'\n THEN RAISE EXCEPTION 'R348_ACCESS_DENIED' USING ERRCODE='42501'; END IF;\n IF p_limit IS NULL OR p_limit<1 OR p_limit>50 OR p_offset IS NULL OR p_offset<0 OR p_offset>1000\n THEN RAISE EXCEPTION 'R348_INVALID_PAGE' USING ERRCODE='22023'; END IF;\n IF p_office IS NULL THEN RAISE EXCEPTION 'R348_ACCESS_DENIED' USING ERRCODE='42501'; END IF;\n v_actor:=v_sub::uuid;\n SELECT s.id,(s.role IN ('owner','admin') OR s.can_view_all_clients)\n INTO v_staff,v_broad\n FROM public.r335_staff s JOIN public.r335_offices o ON o.id=s.office_id\n WHERE s.office_id=p_office AND s.auth_user_id=v_actor AND s.is_active AND o.is_active\n LIMIT 1;\n IF v_staff IS NULL THEN RAISE EXCEPTION 'R348_ACCESS_DENIED' USING ERRCODE='42501'; END IF;\n IF p_client IS NOT NULL AND NOT EXISTS(\n   SELECT 1 FROM public.r335_clients c\n   WHERE c.office_id=p_office AND c.id=p_client\n     AND (v_broad OR c.assigned_staff_id=v_staff)\n ) THEN RAISE EXCEPTION 'R348_ACCESS_DENIED' USING ERRCODE='42501'; END IF;\n SELECT count(*) INTO v_total FROM public.r342_requests r\n WHERE r.office_id=p_office AND (p_client IS NULL OR r.client_id=p_client)\n   AND (v_broad OR EXISTS (SELECT 1 FROM public.r335_clients c\n         WHERE c.office_id=r.office_id AND c.id=r.client_id AND c.assigned_staff_id=v_staff));\n SELECT coalesce(jsonb_agg(jsonb_build_object(\n    'id',t.id,'client_id',t.client_id,'status',t.status,'created_at',t.created_at)\n    ORDER BY t.created_at DESC,t.id DESC),'[]'::jsonb)\n INTO v_items\n FROM (SELECT r.id,r.client_id,r.status,r.created_at FROM public.r342_requests r\n       WHERE r.office_id=p_office AND (p_client IS NULL OR r.client_id=p_client)\n         AND (v_broad OR EXISTS(SELECT 1 FROM public.r335_clients c\n                WHERE c.office_id=r.office_id AND c.id=r.client_id AND c.assigned_staff_id=v_staff))\n       ORDER BY r.created_at DESC,r.id DESC LIMIT p_limit OFFSET p_offset) t;\n RETURN jsonb_build_object('items',v_items,'total',v_total,'limit',p_limit,'offset',p_offset);\nEND;\n$r348_rpc$;\nALTER FUNCTION public.r348_list_requests(uuid,uuid,integer,integer) OWNER TO r342_executor;\nREVOKE ALL ON FUNCTION public.r348_list_requests(uuid,uuid,integer,integer) FROM PUBLIC,anon;\nGRANT EXECUTE ON FUNCTION public.r348_list_requests(uuid,uuid,integer,integer) TO authenticated;\nNOTIFY pgrst, 'reload schema';\nDO $r348_guard$ BEGIN\n IF (SELECT count(*) FROM public.r342_requests)<>19 OR (SELECT count(*) FROM public.r342_audit)<>19 THEN RAISE EXCEPTION 'R348_R347_BASELINE_19'; END IF;\n IF (SELECT rolcanlogin OR rolbypassrls FROM pg_roles WHERE rolname='r342_executor') IS DISTINCT FROM false THEN RAISE EXCEPTION 'R348_EXECUTOR_PRIVILEGE_DRIFT'; END IF;\n IF has_table_privilege('authenticated','public.r342_requests','SELECT') OR has_table_privilege('authenticated','public.r342_audit','SELECT') OR has_function_privilege('anon','public.r348_list_requests(uuid,uuid,integer,integer)','EXECUTE') THEN RAISE EXCEPTION 'R348_PUBLIC_READ_EXPOSURE'; END IF;\n RAISE NOTICE 'R348_READ_RPC_READY: executor=NOLOGIN count=19 direct_grants=0 returned_columns=4';\nEND $r348_guard$;\nR348_SCHEMA\npgid=\"${{ job.services.pg.id }}\"\ntest -n \"$pgid\"\ndocker exec -i \"$pgid\" psql -X -U postgres -d r331_synthetic -v ON_ERROR_STOP=1 < /tmp/r348_rpc.sql\n"
    - name: R348 prepare read-only expected SQL oracle and signed JWT HTTP checks
      shell: bash
      run: "set -euo pipefail\ncat >/tmp/r348_expected.sql <<'R348_EXPECTED'\n\\set ON_ERROR_STOP on\n-- SQL oracle uses raw fixture row sets; the HTTP suite independently verifies enforcement.\nSELECT jsonb_build_object(\n 'ownerA', (SELECT coalesce(jsonb_agg(id ORDER BY created_at DESC,id DESC),'[]'::jsonb) FROM public.r342_requests WHERE office_id='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa'::uuid),\n 'ownerB', (SELECT coalesce(jsonb_agg(id ORDER BY created_at DESC,id DESC),'[]'::jsonb) FROM public.r342_requests WHERE office_id='bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb'::uuid),\n 'staffA', (SELECT coalesce(jsonb_agg(r.id ORDER BY r.created_at DESC,r.id DESC),'[]'::jsonb) FROM public.r342_requests r JOIN public.r335_clients c ON c.office_id=r.office_id AND c.id=r.client_id WHERE r.office_id='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa'::uuid AND c.assigned_staff_id='10000000-0000-4000-8000-000000000002'::uuid),\n 'client4', (SELECT coalesce(jsonb_agg(id ORDER BY created_at DESC,id DESC),'[]'::jsonb) FROM public.r342_requests WHERE office_id='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa'::uuid AND client_id='20000000-0000-4000-8000-000000000004'::uuid),\n 'clientB', (SELECT coalesce(jsonb_agg(id ORDER BY created_at DESC,id DESC),'[]'::jsonb) FROM public.r342_requests WHERE office_id='bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb'::uuid AND client_id='20000000-0000-4000-8000-000000000003'::uuid)\n)::text;\nR348_EXPECTED\ncat >/tmp/r348_http.mjs <<'R348_HTTP'\nimport assert from 'node:assert/strict';\nimport {createHmac} from 'node:crypto';\nimport {readFileSync} from 'node:fs';\nconst HOST='http://127.0.0.1:3000',SECRET='R335_SYNTHETIC_JWT_SIGNING_KEY_NOT_REAL_1234567890';\nconst A='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',B='bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb';\nconst CLIENT4='20000000-0000-4000-8000-000000000004',CLIENTB='20000000-0000-4000-8000-000000000003';\nconst ACTORS={staffA:'00000002-0002-4002-8002-000000000002',ownerA:'00000005-0005-4005-8005-000000000005',ownerB:'00000003-0003-4003-8003-000000000003',disabled:'00000004-0004-4004-8004-000000000004'};\nconst STAGE=process.env.R348_STAGE??'baseline';\nconst exp=JSON.parse(readFileSync(process.env.R348_EXPECTED??'/tmp/r348_expected.json','utf8'));\nconst enc=x=>Buffer.from(JSON.stringify(x)).toString('base64url');\nconst jwt=(sub,extras={})=>{const a=enc({alg:'HS256',typ:'JWT'}),b=enc({sub,role:'authenticated',exp:4102444800,...extras});return a+'.'+b+'.'+createHmac('sha256',SECRET).update(a+'.'+b).digest('base64url');};\nconst tok=Object.fromEntries(Object.entries(ACTORS).map(([k,v])=>[k,jwt(v)]));\nlet checks=0;const eq=(label,x,y)=>{assert.deepEqual(x,y,label);checks++};const ok=(label,x)=>{assert.ok(x,label);checks++};\nasync function api(actor,body,token=tok[actor]){\n const res=await fetch(HOST+'/rpc/r348_list_requests',{method:'POST',headers:{accept:'application/json','content-type':'application/json',...(token?{authorization:'Bearer '+token}:{})},body:JSON.stringify(body),signal:AbortSignal.timeout(10000)});\n const t=await res.text();let value=null;try{value=t?JSON.parse(t):null}catch{throw Error('R348_NON_JSON_'+res.status+'_'+t.slice(0,150))}return {status:res.status,body:value};\n}\nfunction matches(label,r,ids,lim,off){\n eq(label+'-http',r.status,200);eq(label+'-total',r.body?.total,ids.length);eq(label+'-limit',r.body?.limit,lim);eq(label+'-offset',r.body?.offset,off);\n ok(label+'-array',Array.isArray(r.body?.items));eq(label+'-page-ids',r.body.items.map(x=>x.id),ids.slice(off,off+lim));\n for(const [i,item] of r.body.items.entries()){\n   eq(label+'-allowed-columns-'+i,Object.keys(item).sort(),['client_id','created_at','id','status']);\n   eq(label+'-status-'+i,item.status,'requested');\n   ok(label+'-uuid-'+i,/^[0-9a-f-]{36}$/.test(item.client_id));\n }\n}\nfunction denied(label,r){eq(label+'-403',r.status,403);eq(label+'-42501',r.body?.code,'42501');eq(label+'-reason',r.body?.message,'R348_ACCESS_DENIED');ok(label+'-no-items',r.body?.items===undefined);}\nconst valid=[['ownerA',A,exp.ownerA],['ownerB',B,exp.ownerB],['staffA',A,exp.staffA]];\nif(STAGE==='revoked'){\n for(let i=0;i<12;i++)denied('revoked-staff-'+i,await api('staffA',{p_office:A,p_limit:25,p_offset:i}));\n for(let i=0;i<8;i++)matches('revoked-owner-'+i,await api('ownerA',{p_office:A,p_limit:10,p_offset:0}),exp.ownerA,10,0);\n}else if(STAGE==='reassigned'){\n for(let i=0;i<12;i++)denied('reassigned-client4-'+i,await api('staffA',{p_office:A,p_client:CLIENT4,p_limit:10,p_offset:0}));\n for(let i=0;i<8;i++)matches('reassigned-staff-'+i,await api('staffA',{p_office:A,p_limit:10,p_offset:0}),exp.staffA,10,0);\n for(let i=0;i<8;i++)matches('reassigned-owner-'+i,await api('ownerA',{p_office:A,p_limit:10,p_offset:0}),exp.ownerA,10,0);\n}else if(['baseline','restored'].includes(STAGE)){\n for(const [name,office,ids] of valid){\n  const slices=[{p_limit:1,p_offset:0},{p_limit:3,p_offset:1},{p_limit:10,p_offset:0},{p_limit:50,p_offset:0},{p_limit:5,p_offset:ids.length},{p_limit:2,p_offset:0}];\n  for(let i=0;i<slices.length;i++){let v=slices[i];matches(name+'-page-'+i,await api(name,{p_office:office,...v}),ids,v.p_limit,v.p_offset);}\n }\n for(const [who,office,client,ids] of [['ownerA',A,CLIENT4,exp.client4],['staffA',A,CLIENT4,exp.client4],['ownerB',B,CLIENTB,exp.clientB]]){\n  matches('filter-'+who,await api(who,{p_office:office,p_client:client,p_limit:50,p_offset:0}),ids,50,0);\n }\n for(let i=0;i<8;i++){denied('foreign-office-'+i,await api('staffA',{p_office:B,p_limit:2,p_offset:0}));denied('foreign-client-'+i,await api('ownerA',{p_office:A,p_client:CLIENTB,p_limit:5,p_offset:0}));}\n for(let i=0;i<8;i++)denied('disabled-'+i,await api('disabled',{p_office:A,p_limit:10,p_offset:0}));\n for(let i=0;i<8;i++){\n  const params=[{p_limit:0,p_offset:0},{p_limit:51,p_offset:0},{p_limit:10,p_offset:-1},{p_limit:10,p_offset:1001},{p_limit:null,p_offset:0},{p_limit:10,p_offset:null},{p_limit:-5,p_offset:0},{p_limit:999,p_offset:0}][i];\n  const r=await api('ownerA',{p_office:A,...params});eq('page-invalid-'+i,r.status,400);eq('page-code-'+i,r.body?.code,'22023');eq('page-reason-'+i,r.body?.message,'R348_INVALID_PAGE');\n }\n const fake=jwt(ACTORS.staffA,{office_id:B,admin:true,can_view_all_clients:true});\n matches('jwt-extra-claims-still-staff',await api('staffA',{p_office:A,p_limit:50,p_offset:0},fake),exp.staffA,50,0);\n let noJwt=await api('ownerA',{p_office:A,p_limit:10,p_offset:0},null);ok('anon-rejected',[401,403,404].includes(noJwt.status));\n let wrongRole=await api('ownerA',{p_office:A,p_limit:10,p_offset:0},jwt(ACTORS.ownerA,{role:'anon'}));ok('signed-anon-role-rejected',[401,403,404].includes(wrongRole.status));\n const missing=await api('ownerA',{p_office:A,p_client:'00000000-0000-4000-8000-000000000000',p_limit:10,p_offset:0});denied('missing-client',missing);\n if(STAGE==='baseline'){\n  const parallel=await Promise.all(Array.from({length:36},(_,i)=>{const [name,office,ids]=valid[i%3];const lim=3,off=i%6;return api(name,{p_office:office,p_limit:lim,p_offset:off}).then(r=>({name,ids,off,r}));}));\n  parallel.forEach((t,i)=>matches('parallel-'+i,t.r,t.ids,3,t.off));\n }\n}else throw Error('R348_INVALID_STAGE_'+STAGE);\nconsole.log(JSON.stringify({suite:'R348_REAL_POSTGREST_SCOPED_REQUEST_LIST_PAGINATION',stage:STAGE,checks,actors:3,request_rows:19,read_only:true,token_authenticated:true,synthetic_only:true,real_supabase:false,commercial_release:'HOLD'}));\nR348_HTTP\nnode --check /tmp/r348_http.mjs\n"
