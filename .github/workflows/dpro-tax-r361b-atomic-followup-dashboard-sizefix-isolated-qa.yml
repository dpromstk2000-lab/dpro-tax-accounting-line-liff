      run: "set -euo pipefail\necho R357_REAL_POSTGREST_ASSIGNMENT_SCOPED_WORKLIST_PASS read_only=true\necho R357_ISOLATED_QA_EVIDENCE postgres=disposable_PG17 signed_jwt=true visit_material_worklist=true jst_leap_day=true owner_staff_scope=true tenant_isolation=true stable_pagination=true page_bounds_enforced=true 64_parallel=true revoke_reassign_office_pause=true direct_table_closed=true no_real_sends=true no_queue_entries=true production_worker=false shared_supabase=false line_sends=0 github_main=false commercial_release=HOLD\n"
    - name: R358 create read-only scoped material-deadline periodic followup preview RPC
      shell: bash
      run: "set -euo pipefail\ncat >/tmp/r358_schema.sql <<'R358_R358_SCHEMA_SQL'\n\\set ON_ERROR_STOP on\n-- R358 ephemeral PG17 ONLY: no dispatch/queue/production state changes.\n-- Read-only follow-up preview for required material deadlines, with selectable\n-- repetition interval. Cadence is an explicit synthetic test input, not an\n-- approved production notification rule.\nDO $r358_baseline$ BEGIN\n IF (SELECT count(*) FROM public.r355_visits)<>7\n OR (SELECT count(*) FROM public.r342_requests)<>19\n OR (SELECT count(*) FROM public.r342_audit)<>19\n OR (SELECT count(*) FROM public.r350_status_audit)<>3\n OR (SELECT count(*) FROM public.r352_deadlines)<>19\n OR (SELECT count(*) FROM public.r342_requests WHERE status='completed')<>3\n THEN RAISE EXCEPTION 'R358_R357_FORMAL_BASELINE_DRIFT_HOLD'; END IF;\nEND $r358_baseline$;\n\nCREATE FUNCTION public.r358_preview_material_followups(\n p_office uuid,p_as_of timestamptz,p_limit integer,p_offset integer,p_repeat_days integer)\nRETURNS jsonb LANGUAGE plpgsql STABLE SECURITY DEFINER SET search_path=pg_catalog\nAS $r358_rpc$\nDECLARE\n v_claims jsonb;v_sub text;v_actor uuid;v_staff uuid;v_broad boolean;\n v_today date;v_total bigint;v_items jsonb:='[]'::jsonb;\n v_request record;v_base jsonb;v_phase text;v_due date;v_days_late integer;\n v_candidate boolean;\nBEGIN\n v_claims:=nullif(current_setting('request.jwt.claims',true),'')::jsonb;\n v_sub:=v_claims->>'sub';\n IF (v_claims->>'role') IS DISTINCT FROM 'authenticated'\n OR v_sub IS NULL\n OR v_sub !~* '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'\n OR p_office IS NULL\n THEN RAISE EXCEPTION 'R358_ACCESS_DENIED' USING ERRCODE='42501'; END IF;\n IF p_as_of IS NULL OR NOT isfinite(p_as_of)\n THEN RAISE EXCEPTION 'R358_INVALID_AS_OF' USING ERRCODE='22023'; END IF;\n IF p_limit IS NULL OR p_limit<1 OR p_limit>25\n OR p_offset IS NULL OR p_offset<0 OR p_offset>1000\n OR p_repeat_days IS NULL OR p_repeat_days<1 OR p_repeat_days>30\n THEN RAISE EXCEPTION 'R358_INVALID_OPTIONS' USING ERRCODE='22023'; END IF;\n\n v_actor:=v_sub::uuid;\n SELECT s.id,(s.role IN ('owner','admin') OR s.can_view_all_clients)\n INTO v_staff,v_broad\n FROM public.r335_staff s JOIN public.r335_offices o ON o.id=s.office_id\n WHERE s.office_id=p_office AND s.auth_user_id=v_actor AND s.is_active AND o.is_active\n LIMIT 1;\n IF v_staff IS NULL THEN RAISE EXCEPTION 'R358_ACCESS_DENIED' USING ERRCODE='42501'; END IF;\n v_today:=(p_as_of AT TIME ZONE 'Asia/Tokyo')::date;\n\n SELECT count(*) INTO v_total\n FROM public.r342_requests r\n JOIN public.r335_clients c ON c.office_id=r.office_id AND c.id=r.client_id\n JOIN public.r352_deadlines d ON d.office_id=r.office_id AND d.request_id=r.id\n WHERE r.office_id=p_office AND r.status='requested'\n AND (v_broad OR c.assigned_staff_id=v_staff);\n\n FOR v_request IN\n  SELECT r.id,r.client_id,d.due_at\n  FROM public.r342_requests r\n  JOIN public.r335_clients c ON c.office_id=r.office_id AND c.id=r.client_id\n  JOIN public.r352_deadlines d ON d.office_id=r.office_id AND d.request_id=r.id\n  WHERE r.office_id=p_office AND r.status='requested'\n  AND (v_broad OR c.assigned_staff_id=v_staff)\n  ORDER BY d.due_at,r.id\n  LIMIT p_limit OFFSET p_offset\n LOOP\n  -- R352 was previously verified with real signed JWT/PostgREST and shares\n  -- the NOLOGIN/NOBYPASSRLS owner. Reuse its due-day/phase oracle.\n  v_base:=public.r352_preview_reminder(p_office,v_request.id,p_as_of);\n  v_phase:=v_base->>'phase';\n  v_due:=(v_request.due_at AT TIME ZONE 'Asia/Tokyo')::date;\n  v_days_late:=GREATEST(v_today-v_due,0);\n  v_candidate:=v_phase IN ('day_before','due_today')\n    OR (v_phase='overdue' AND v_days_late>=1\n     AND ((v_days_late-1)%p_repeat_days)=0);\n  v_items:=v_items || pg_catalog.jsonb_build_array(\n    pg_catalog.jsonb_build_object(\n     'request_id',v_request.id,'client_id',v_request.client_id,\n     'due_day',v_due::text,\n     'phase',CASE WHEN v_phase='none' THEN 'future' ELSE v_phase END,\n     'overdue_days',v_days_late,'candidate_followup',v_candidate,\n     'preview_only',true,'scheduled',false));\n END LOOP;\n\n RETURN pg_catalog.jsonb_build_object(\n  'as_of_day',v_today::text,'total_visible',v_total,\n  'page_limit',p_limit,'page_offset',p_offset,\n  'repeat_days',p_repeat_days,'items',v_items,\n  'preview_only',true,'scheduled',false);\nEND;\n$r358_rpc$;\n\nALTER FUNCTION public.r358_preview_material_followups(uuid,timestamptz,integer,integer,integer)\n OWNER TO r342_executor;\nREVOKE ALL ON FUNCTION public.r358_preview_material_followups(uuid,timestamptz,integer,integer,integer)\n FROM PUBLIC,anon;\nGRANT EXECUTE ON FUNCTION public.r358_preview_material_followups(uuid,timestamptz,integer,integer,integer)\n TO authenticated;\nNOTIFY pgrst,'reload schema';\n\nDO $r358_acl$ BEGIN\n IF (SELECT count(*) FROM pg_class WHERE oid IN (\n  'public.r355_visits'::regclass,'public.r342_requests'::regclass,\n  'public.r352_deadlines'::regclass) AND relrowsecurity AND relforcerowsecurity)<>3\n OR has_table_privilege('authenticated','public.r342_requests','SELECT')\n OR has_table_privilege('authenticated','public.r352_deadlines','SELECT')\n OR has_table_privilege('authenticated','public.r342_requests','INSERT')\n OR has_table_privilege('authenticated','public.r352_deadlines','INSERT')\n OR has_function_privilege('anon','public.r358_preview_material_followups(uuid,timestamptz,integer,integer,integer)','EXECUTE')\n OR NOT has_function_privilege('authenticated','public.r358_preview_material_followups(uuid,timestamptz,integer,integer,integer)','EXECUTE')\n OR (SELECT rolname FROM pg_roles WHERE oid=(SELECT proowner FROM pg_proc WHERE\n  oid='public.r358_preview_material_followups(uuid,timestamptz,integer,integer,integer)'::regprocedure))<>'r342_executor'\n OR (SELECT rolcanlogin OR rolbypassrls FROM pg_roles WHERE rolname='r342_executor') IS DISTINCT FROM false\n THEN RAISE EXCEPTION 'R358_MATERIAL_FOLLOWUP_ACL_HOLD'; END IF;\n RAISE NOTICE 'R358_SYNTHETIC_MATERIAL_FOLLOWUP_READY requests=19 pending=16 sends=0';\nEND $r358_acl$;\nR358_R358_SCHEMA_SQL\npgid=\"${{ job.services.pg.id }}\"\ntest -n \"$pgid\"\ndocker exec -i \"$pgid\" psql -X -U postgres -d r331_synthetic -v ON_ERROR_STOP=1 < /tmp/r358_schema.sql\n"
    - name: R358C capture real synthetic client-staff-office assignment graph from PG17
      shell: bash
      run: "set -euo pipefail\ncat >/tmp/r358c_scope_oracle.sql <<'R358C_REAL_SCOPE_SQL'\n\\set ON_ERROR_STOP on\n-- Independent PG17 SUPERUSER snapshot of the real synthetic authorization graph.\n-- It is written only to the isolated runner; never exposed through PostgREST.\n-- This supplements the separate R356 raw request/deadline oracle.\nSELECT pg_catalog.jsonb_build_object(\n 'clients',(\n  SELECT COALESCE(pg_catalog.jsonb_agg(pg_catalog.jsonb_build_object(\n   'id',c.id,'office_id',c.office_id,'assigned_staff_id',c.assigned_staff_id)\n   ORDER BY c.office_id,c.id),'[]'::jsonb)\n  FROM public.r335_clients c),\n 'staff',(\n  SELECT COALESCE(pg_catalog.jsonb_agg(pg_catalog.jsonb_build_object(\n   'id',s.id,'office_id',s.office_id,'auth_user_id',s.auth_user_id,\n   'role',s.role,'can_view_all_clients',s.can_view_all_clients,'is_active',s.is_active)\n   ORDER BY s.office_id,s.id),'[]'::jsonb)\n  FROM public.r335_staff s),\n 'offices',(\n  SELECT COALESCE(pg_catalog.jsonb_agg(pg_catalog.jsonb_build_object(\n   'id',o.id,'is_active',o.is_active)\n   ORDER BY o.id),'[]'::jsonb)\n  FROM public.r335_offices o)\n)::text;\nR358C_REAL_SCOPE_SQL\npgid=\"${{ job.services.pg.id }}\"\ntest -n \"$pgid\"\ndocker exec -i \"$pgid\" psql -X -At -U postgres -d r331_synthetic -v ON_ERROR_STOP=1 < /tmp/r358c_scope_oracle.sql > /tmp/r358c_scope_oracle.json\nnode -e 'const x=JSON.parse(require(\"fs\").readFileSync(\"/tmp/r358c_scope_oracle.json\")); if(x.offices.length!==2||x.staff.length<5||x.clients.length<6) process.exit(1); console.log(\"R358C_INDEPENDENT_PG17_SCOPE_ORACLE_READY offices=\"+x.offices.length+\" staff=\"+x.staff.length+\" clients=\"+x.clients.length)'\n"
    - name: R358C install signed-JWT assertions with independently measured assignment graph
      shell: bash
      run: "set -euo pipefail\ncat >/tmp/r358_http.mjs <<'R358_R358_HTTP_MJS'\nimport assert from 'node:assert/strict';\nimport {readFileSync} from 'node:fs';\nimport {createHmac} from 'node:crypto';\n\n// Real signed-JWT/PostgREST assertions. Both request rows AND the authorization\n// graph are independently selected by PG17 superuser, not guessed by a mock.\nconst STAGE=process.env.R358_STAGE??'initial';\nconst HOST='http://127.0.0.1:3000';\nconst SECRET='R335_SYNTHETIC_JWT_SIGNING_KEY_NOT_REAL_1234567890';\nconst oracle=JSON.parse(readFileSync(process.env.R358_ORACLE_PATH??'/tmp/r356_oracle.json','utf8'));\nconst scope=JSON.parse(readFileSync(process.env.R358_SCOPE_PATH??'/tmp/r358c_scope_oracle.json','utf8'));\nconst OA='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa';\nconst OB='bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb';\nconst STAFF='00000002-0002-4002-8002-000000000002';\nconst OWNER_A='00000005-0005-4005-8005-000000000005';\nconst OWNER_B='00000003-0003-4003-8003-000000000003';\nconst ASSIGNED='20000000-0000-4000-8000-000000000004';\nconst ALSO='20000000-0000-4000-8000-000000000001';\nconst REASSIGNED_TO='10000000-0000-4000-8000-000000000005';\nconst AS_OF='2028-02-29T03:00:00Z';\nconst JST_MARCH='2028-02-29T15:00:00Z';\nconst clientsById=new Map(scope.clients.map(c=>[c.id,c]));\nconst officesById=new Map(scope.offices.map(o=>[o.id,o]));\n\nconst enc=x=>Buffer.from(JSON.stringify(x)).toString('base64url');\nfunction jwt(subject,claims={}){\n const h=enc({alg:'HS256',typ:'JWT'}),p=enc({sub:subject,role:'authenticated',exp:4102444800,...claims});\n return h+'.'+p+'.'+createHmac('sha256',SECRET).update(h+'.'+p).digest('base64url');\n}\nfunction jstDay(v){\n const parts=new Intl.DateTimeFormat('en-US',{\n  timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'\n }).formatToParts(new Date(v));\n const x=Object.fromEntries(parts.filter(p=>['year','month','day'].includes(p.type)).map(p=>[p.type,p.value]));\n return `${x.year}-${x.month}-${x.day}`;\n}\nfunction tomorrow(day){const d=new Date(day+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+1);return d.toISOString().slice(0,10)}\nfunction dayDiff(a,b){return (Date.parse(a+'T00:00:00Z')-Date.parse(b+'T00:00:00Z'))/86400000}\nfunction single(r,asOf,repeat){\n const today=jstDay(asOf),due=jstDay(r.due_at),late=Math.max(dayDiff(today,due),0);\n const phase=due<today?'overdue':due===today?'due_today':due===tomorrow(today)?'day_before':'future';\n const candidate=phase==='due_today'||phase==='day_before'||\n  (phase==='overdue'&&late>=1&&(late-1)%repeat===0);\n return {request_id:r.id,client_id:r.client_id,due_day:due,phase,\n  overdue_days:late,candidate_followup:candidate,preview_only:true,scheduled:false};\n}\nfunction visible(office,subject){\n const o=officesById.get(office);\n if(!o?.is_active||(STAGE==='office_paused'&&office===OA))return [];\n const s=scope.staff.find(x=>x.office_id===office&&x.auth_user_id===subject);\n if(!s?.is_active||(STAGE==='revoked'&&subject===STAFF))return [];\n const broad=['owner','admin'].includes(s.role)||s.can_view_all_clients;\n return oracle.requests.filter(r=>{\n  if(r.office_id!==office||r.status!=='requested')return false;\n  const c=clientsById.get(r.client_id);\n  if(!c||c.office_id!==office)return false;\n  const assigned=(STAGE==='reassigned'&&c.id===ASSIGNED)?REASSIGNED_TO:c.assigned_staff_id;\n  return broad||assigned===s.id;\n }).sort((a,b)=>a.due_at.localeCompare(b.due_at)||a.id.localeCompare(b.id));\n}\nlet checks=0;\nfunction eq(n,a,b){assert.deepEqual(a,b,n);checks++}\nfunction ok(n,v){assert.ok(v,n);checks++}\nasync function call(office,subject=STAFF,asOf=AS_OF,limit=25,offset=0,repeat=7,token=jwt(subject)){\n const res=await fetch(HOST+'/rpc/r358_preview_material_followups',{\n  method:'POST',headers:{'content-type':'application/json',accept:'application/json',\n   ...(token?{authorization:'Bearer '+token}:{})},\n  body:JSON.stringify({p_office:office,p_as_of:asOf,p_limit:limit,p_offset:offset,p_repeat_days:repeat}),\n  signal:AbortSignal.timeout(16000)});\n const raw=await res.text();let body;\n try{body=raw?JSON.parse(raw):null}catch{throw Error('R358C_INVALID_HTTP_JSON_'+res.status+'_'+raw.slice(0,160))}\n return {status:res.status,body};\n}\nconst outerKeys=['as_of_day','items','page_limit','page_offset','preview_only','repeat_days','scheduled','total_visible'];\nconst innerKeys=['candidate_followup','client_id','due_day','overdue_days','phase','preview_only','request_id','scheduled'];\nfunction yes(name,r,office,subject,asOf=AS_OF,limit=25,offset=0,repeat=7){\n eq(name+'-200',r.status,200);\n eq(name+'-outer-keys',Object.keys(r.body).sort(),outerKeys);\n eq(name+'-asof',r.body.as_of_day,jstDay(asOf));\n eq(name+'-limit',r.body.page_limit,limit);\n eq(name+'-offset',r.body.page_offset,offset);\n eq(name+'-repeat',r.body.repeat_days,repeat);\n eq(name+'-preview-only',r.body.preview_only,true);\n eq(name+'-no-scheduled',r.body.scheduled,false);\n const all=visible(office,subject),page=all.slice(offset,offset+limit);\n eq(name+'-total-visible',r.body.total_visible,all.length);\n eq(name+'-page-size',r.body.items.length,page.length);\n for(const [i,v] of page.entries()){\n  const item=r.body.items[i];\n  eq(name+'-row-keys-'+i,Object.keys(item).sort(),innerKeys);\n  eq(name+'-row-'+i,item,single(v,asOf,repeat));\n  ok(name+'-no-office-id-'+i,!JSON.stringify(item).includes(office));\n  ok(name+'-no-auth-id-'+i,![STAFF,OWNER_A,OWNER_B].some(id=>JSON.stringify(item).includes(id)));\n }\n eq(name+'-unique-page-requests',new Set(r.body.items.map(x=>x.request_id)).size,page.length);\n ok(name+'-no-cross-office-or-assignment',r.body.items.every(x=>all.some(v=>v.id===x.request_id)));\n}\nfunction deny(name,r){\n eq(name+'-403',r.status,403);\n eq(name+'-sqlstate',r.body?.code,'42501');\n eq(name+'-generic',r.body?.message,'R358_ACCESS_DENIED');\n ok(name+'-no-items',r.body?.items===undefined);\n}\n\neq('oracle-seven-visits',oracle.visits.length,7);\neq('oracle-nineteen-material-deadlines',oracle.requests.length,19);\neq('oracle-pending-sixteen',oracle.requests.filter(r=>r.status==='requested').length,16);\neq('oracle-unique-request-ids',new Set(oracle.requests.map(r=>r.id)).size,19);\neq('oracle-both-offices',new Set(oracle.requests.map(r=>r.office_id)).size,2);\neq('completed-excluded',oracle.requests.filter(r=>r.status==='completed').length,3);\neq('scope-two-offices',scope.offices.length,2);\nok('scope-unique-clients',scope.clients.length>0&&clientsById.size===scope.clients.length);\nok('scope-unique-auth-memberships',new Set(scope.staff.map(s=>s.office_id+':'+s.auth_user_id)).size===scope.staff.length);\nok('scope-requests-all-have-valid-office-clients',oracle.requests.every(r=>clientsById.get(r.client_id)?.office_id===r.office_id));\nok('scope-clients-have-real-assignees',scope.clients.every(c=>scope.staff.some(s=>s.office_id===c.office_id&&s.id===c.assigned_staff_id)));\neq('scope-staff-a-is-assignment-restricted',scope.staff.find(s=>s.auth_user_id===STAFF)?.can_view_all_clients,false);\neq('scope-staff-a-role',scope.staff.find(s=>s.auth_user_id===STAFF)?.role,'staff');\neq('scope-staff-a-assigned-client-004',clientsById.get(ASSIGNED)?.assigned_staff_id,scope.staff.find(s=>s.auth_user_id===STAFF)?.id);\neq('scope-staff-a-assigned-client-001',clientsById.get(ALSO)?.assigned_staff_id,scope.staff.find(s=>s.auth_user_id===STAFF)?.id);\nok('staff-visible-only-actual-assigned-clients',visible(OA,STAFF).every(r=>\n clientsById.get(r.client_id)?.assigned_staff_id===scope.staff.find(s=>s.auth_user_id===STAFF)?.id));\nok('owner-own-office-superset',visible(OA,OWNER_A).length>=visible(OA,STAFF).length);\n\nif(STAGE==='initial'){\n for(const [label,office,subject] of [['owner-a',OA,OWNER_A],['staff-a',OA,STAFF],['owner-b',OB,OWNER_B]]){\n  for(const [limit,offset] of [[1,0],[2,0],[2,1],[5,0],[25,0],[25,4],[25,99]]){\n   yes(`${label}-page-${limit}-${offset}`,await call(office,subject,AS_OF,limit,offset),office,subject,AS_OF,limit,offset);\n  }\n  for(const repeat of [1,7,30]){\n   yes(`${label}-repeat-${repeat}`,await call(office,subject,AS_OF,25,0,repeat),office,subject,AS_OF,25,0,repeat);\n  }\n  yes(`${label}-march`,await call(office,subject,JST_MARCH),office,subject,JST_MARCH);\n }\n for(let i=0;i<8;i++){\n  deny('staff-cross-tenant-'+i,await call(OB,STAFF));\n  deny('owner-b-cross-tenant-'+i,await call(OA,OWNER_B));\n }\n yes('forged-owner-claims-no-escalation',await call(OA,STAFF,AS_OF,25,0,7,\n  jwt(STAFF,{is_admin:true,can_view_all_clients:true,office_id:OA})),OA,STAFF);\n deny('missing-membership',await call(OA,'00000000-0000-4000-8000-000000000009'));\n deny('malformed-sub',await call(OA,'not-a-uuid'));\n deny('unknown-office',await call('00000000-0000-4000-8000-000000000000',STAFF));\n const anonymous=await call(OA,STAFF,AS_OF,25,0,7,null);\n ok('anonymous-closed',[401,403,404].includes(anonymous.status));\n const wrongRole=await call(OA,STAFF,AS_OF,25,0,7,jwt(STAFF,{role:'anon'}));\n ok('wrong-role-closed',[401,403,404].includes(wrongRole.status));\n for(const [label,asOf,limit,offset,repeat,err] of [\n  ['limit-zero',AS_OF,0,0,7,'R358_INVALID_OPTIONS'],\n  ['limit-too-large',AS_OF,26,0,7,'R358_INVALID_OPTIONS'],\n  ['negative-offset',AS_OF,25,-1,7,'R358_INVALID_OPTIONS'],\n  ['huge-offset',AS_OF,25,1001,7,'R358_INVALID_OPTIONS'],\n  ['null-limit',AS_OF,null,0,7,'R358_INVALID_OPTIONS'],\n  ['null-offset',AS_OF,25,null,7,'R358_INVALID_OPTIONS'],\n  ['zero-repeat',AS_OF,25,0,0,'R358_INVALID_OPTIONS'],\n  ['large-repeat',AS_OF,25,0,31,'R358_INVALID_OPTIONS'],\n  ['null-repeat',AS_OF,25,0,null,'R358_INVALID_OPTIONS'],\n  ['null-asof',null,25,0,7,'R358_INVALID_AS_OF'],\n  ['infinity','infinity',25,0,7,'R358_INVALID_AS_OF']\n ]){\n  const r=await call(OA,STAFF,asOf,limit,offset,repeat);\n  eq(label+'-400',r.status,400);eq(label+'-code',r.body?.code,'22023');\n  eq(label+'-generic',r.body?.message,err);\n }\n const parallel=await Promise.all(Array.from({length:64},(_,i)=>{\n  const office=i%3===2?OB:OA,subject=i%3===0?STAFF:i%3===1?OWNER_A:OWNER_B;\n  return call(office,subject,AS_OF,2,i%2,i%3===0?1:i%3===1?7:30);\n }));\n parallel.forEach((r,i)=>{\n  const office=i%3===2?OB:OA,subject=i%3===0?STAFF:i%3===1?OWNER_A:OWNER_B;\n  yes('parallel-'+i,r,office,subject,AS_OF,2,i%2,i%3===0?1:i%3===1?7:30);\n });\n}else if(STAGE==='revoked'){\n for(let i=0;i<12;i++)deny('staff-revoked-'+i,await call(OA,STAFF));\n for(let i=0;i<6;i++)yes('owner-unaffected-'+i,await call(OA,OWNER_A),OA,OWNER_A);\n}else if(STAGE==='restored'){\n for(let i=0;i<12;i++)yes('staff-restored-'+i,await call(OA,STAFF),OA,STAFF);\n}else if(STAGE==='reassigned'){\n for(let i=0;i<12;i++)yes('transferred-client-removed-'+i,await call(OA,STAFF),OA,STAFF);\n for(let i=0;i<6;i++)yes('owner-broad-'+i,await call(OA,OWNER_A),OA,OWNER_A);\n}else if(STAGE==='office_paused'){\n for(let i=0;i<12;i++)deny('office-paused-staff-'+i,await call(OA,STAFF));\n for(let i=0;i<6;i++)deny('office-paused-owner-'+i,await call(OA,OWNER_A));\n for(let i=0;i<6;i++)yes('other-office-works-'+i,await call(OB,OWNER_B),OB,OWNER_B);\n}else if(STAGE==='final'){\n for(const [label,office,subject] of [['owner-a',OA,OWNER_A],['staff-a',OA,STAFF],['owner-b',OB,OWNER_B]]){\n  yes(label+'-restored',await call(office,subject),office,subject);\n }\n for(const table of ['r355_visits','r342_requests','r352_deadlines']){\n  const r=await fetch(HOST+'/'+table+'?select=*',{\n   headers:{authorization:'Bearer '+jwt(OWNER_A)},signal:AbortSignal.timeout(12000)});\n  ok('raw-table-'+table+'-read-denied',[401,403,404,405].includes(r.status));\n }\n}else throw Error('R358C_UNKNOWN_STAGE_'+STAGE);\n\nconsole.log(JSON.stringify({suite:'R358C_MATERIAL_DEADLINE_PERIODIC_FOLLOWUP',stage:STAGE,checks,\n signed_jwt:true,independent_pg17_request_oracle:true,independent_pg17_scope_oracle:true,\n verified_staff_visible:visible(OA,STAFF).length,\n scope:'tenant_and_verified_assignment',repeat_days_explicit_preview_only:true,\n notifications_scheduled:false,notifications_sent:0,production_changes:0,commercial_release:'HOLD'}));\nR358_R358_HTTP_MJS\nnode --check /tmp/r358_http.mjs\n"
    - name: R358 allow PostgREST to observe new followup RPC
      shell: bash
      run: "set -euo pipefail\nsleep 2\necho R358_POSTGREST_SCHEMA_RELOAD_SETTLED\n"
    - name: R358 real HTTP deadline phases, 1/7/30 cadence, pagination, 64 parallel, auth denial
      shell: bash
      run: "R358_STAGE=initial node /tmp/r358_http.mjs\n"
