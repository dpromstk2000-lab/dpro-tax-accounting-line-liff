    - name: R352 create synthetic UTC/JST deadline metadata with FORCE RLS and read-only preview RPC
      shell: bash
      run: "set -euo pipefail\ncat >/tmp/r352_schema.sql <<'R352_R352_SCHEMA'\n\\set ON_ERROR_STOP on\n-- R352 operates in the disposable PG17 service only. Never apply to shared Supabase.\nDO $guard$ BEGIN\n IF (SELECT count(*) FROM public.r342_requests)<>19\n    OR (SELECT count(*) FROM public.r342_audit)<>19\n    OR (SELECT count(*) FROM public.r350_status_audit)<>3\n    OR (SELECT count(*) FROM public.r342_requests WHERE status='completed')<>3\n THEN RAISE EXCEPTION 'R352_R351_BASELINE_DRIFT'; END IF;\nEND $guard$;\n\n-- The fixture is purposefully synthetic; a production deadline model is NOT inferred.\nCREATE TABLE public.r352_deadlines (\n office_id uuid NOT NULL,\n request_id uuid PRIMARY KEY,\n due_at timestamptz NOT NULL CHECK (isfinite(due_at)),\n FOREIGN KEY (office_id,request_id)\n   REFERENCES public.r342_requests(office_id,id) ON DELETE RESTRICT\n);\nALTER TABLE public.r352_deadlines ENABLE ROW LEVEL SECURITY;\nALTER TABLE public.r352_deadlines FORCE ROW LEVEL SECURITY;\nREVOKE ALL ON public.r352_deadlines FROM PUBLIC,anon,authenticated;\nGRANT SELECT ON public.r352_deadlines TO r342_executor;\nCREATE POLICY r352_executor_deadline_read ON public.r352_deadlines\n FOR SELECT TO r342_executor USING (true);\n\nWITH ranked AS (\n SELECT r.id,r.office_id,r.status,\n        row_number() OVER (PARTITION BY r.status ORDER BY r.office_id,r.actor_auth_id,r.id) rn\n FROM public.r342_requests r\n)\nINSERT INTO public.r352_deadlines(office_id,request_id,due_at)\nSELECT office_id,id,\n CASE WHEN status='completed' THEN '2028-02-29 09:00+09'\n      WHEN rn=1 THEN '2028-02-28 23:59+09'\n      WHEN rn=2 THEN '2028-02-29 00:00+09'\n      WHEN rn=3 THEN '2028-03-01 00:00+09'\n      WHEN rn=4 THEN '2028-03-02 00:00+09'\n      WHEN rn=5 THEN '2028-02-29 23:59+09'\n      ELSE '2028-03-03 09:00+09' END::timestamptz\nFROM ranked;\n\n-- Every preview is an isolated snapshot. Nothing is enqueued, transmitted or updated.\nCREATE FUNCTION public.r352_preview_reminder(p_office uuid,p_request uuid,p_as_of timestamptz)\nRETURNS jsonb LANGUAGE plpgsql STABLE SECURITY DEFINER SET search_path=pg_catalog\nAS $r352_rpc$\nDECLARE\n v_claims jsonb;v_sub text;v_actor uuid;v_staff uuid;v_broad boolean;\n v_client uuid;v_status text;v_due timestamptz;\n v_day date;v_today date;v_phase text;v_reason text;v_eligible boolean;\nBEGIN\n v_claims:=nullif(current_setting('request.jwt.claims',true),'')::jsonb;\n v_sub:=v_claims->>'sub';\n IF (v_claims->>'role') IS DISTINCT FROM 'authenticated'\n    OR v_sub IS NULL OR v_sub !~* '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'\n    OR p_office IS NULL OR p_request IS NULL\n THEN RAISE EXCEPTION 'R352_ACCESS_DENIED' USING ERRCODE='42501'; END IF;\n IF p_as_of IS NULL OR NOT isfinite(p_as_of)\n THEN RAISE EXCEPTION 'R352_INVALID_AS_OF' USING ERRCODE='22023'; END IF;\n v_actor:=v_sub::uuid;\n SELECT s.id,(s.role IN ('owner','admin') OR s.can_view_all_clients)\n INTO v_staff,v_broad\n FROM public.r335_staff s JOIN public.r335_offices o ON o.id=s.office_id\n WHERE s.office_id=p_office AND s.auth_user_id=v_actor AND s.is_active AND o.is_active\n LIMIT 1;\n IF v_staff IS NULL THEN RAISE EXCEPTION 'R352_ACCESS_DENIED' USING ERRCODE='42501'; END IF;\n SELECT r.client_id,r.status,d.due_at INTO v_client,v_status,v_due\n FROM public.r342_requests r JOIN public.r352_deadlines d\n   ON d.request_id=r.id AND d.office_id=r.office_id\n WHERE r.office_id=p_office AND r.id=p_request;\n IF NOT FOUND THEN RAISE EXCEPTION 'R352_ACCESS_DENIED' USING ERRCODE='42501'; END IF;\n IF NOT EXISTS(SELECT 1 FROM public.r335_clients c\n               WHERE c.office_id=p_office AND c.id=v_client\n                 AND (v_broad OR c.assigned_staff_id=v_staff))\n THEN RAISE EXCEPTION 'R352_ACCESS_DENIED' USING ERRCODE='42501'; END IF;\n\n v_day:=(v_due AT TIME ZONE 'Asia/Tokyo')::date;\n v_today:=(p_as_of AT TIME ZONE 'Asia/Tokyo')::date;\n v_eligible:=false;v_phase:='none';v_reason:='not_yet';\n IF v_status='completed' THEN\n   v_reason:='completed';\n ELSIF v_status='requested' AND v_day<v_today THEN\n   v_eligible:=true;v_phase:='overdue';v_reason:='eligible';\n ELSIF v_status='requested' AND v_day=v_today THEN\n   v_eligible:=true;v_phase:='due_today';v_reason:='eligible';\n ELSIF v_status='requested' AND v_day=v_today+1 THEN\n   v_eligible:=true;v_phase:='day_before';v_reason:='eligible';\n ELSIF v_status IS DISTINCT FROM 'requested' THEN\n   RAISE EXCEPTION 'R352_INVALID_STATE' USING ERRCODE='22023';\n END IF;\n RETURN pg_catalog.jsonb_build_object(\n   'eligible',v_eligible,'phase',v_phase,'reason',v_reason,\n   'due_day',pg_catalog.to_char(v_day,'YYYY-MM-DD'),\n   'preview_only',true,'scheduled',false);\nEND;\n$r352_rpc$;\nALTER FUNCTION public.r352_preview_reminder(uuid,uuid,timestamptz) OWNER TO r342_executor;\nREVOKE ALL ON FUNCTION public.r352_preview_reminder(uuid,uuid,timestamptz) FROM PUBLIC,anon;\nGRANT EXECUTE ON FUNCTION public.r352_preview_reminder(uuid,uuid,timestamptz) TO authenticated;\nNOTIFY pgrst,'reload schema';\n\nDO $guard$ BEGIN\n IF (SELECT count(*) FROM public.r352_deadlines)<>19\n OR (SELECT count(*) FROM pg_class WHERE oid IN ('public.r342_requests'::regclass,'public.r352_deadlines'::regclass)\n        AND relrowsecurity AND relforcerowsecurity)<>2\n OR (SELECT rolname FROM pg_roles WHERE oid=(SELECT proowner FROM pg_proc\n        WHERE oid='public.r352_preview_reminder(uuid,uuid,timestamptz)'::regprocedure))<>'r342_executor'\n OR (SELECT rolcanlogin OR rolbypassrls FROM pg_roles WHERE rolname='r342_executor') IS DISTINCT FROM false\n OR has_function_privilege('anon','public.r352_preview_reminder(uuid,uuid,timestamptz)','EXECUTE')\n OR NOT has_function_privilege('authenticated','public.r352_preview_reminder(uuid,uuid,timestamptz)','EXECUTE')\n OR has_table_privilege('authenticated','public.r352_deadlines','SELECT')\n OR has_table_privilege('authenticated','public.r352_deadlines','UPDATE')\n OR has_table_privilege('authenticated','public.r342_requests','SELECT')\n THEN RAISE EXCEPTION 'R352_GRANT_RLS_OWNER_DRIFT'; END IF;\n RAISE NOTICE 'R352_READ_ONLY_REMINDER_PREVIEW_READY deadline_rows=19 synthetic_only=true';\nEND $guard$;\nR352_R352_SCHEMA\npgid=\"${{ job.services.pg.id }}\"\ntest -n \"$pgid\"\ndocker exec -i \"$pgid\" psql -X -U postgres -d r331_synthetic -v ON_ERROR_STOP=1 < /tmp/r352_schema.sql\n"
    - name: R352 export only synthetic deadline test fixtures
      shell: bash
      run: "set -euo pipefail\npgid=\"${{ job.services.pg.id }}\"\ntest -n \"$pgid\"\ndocker exec \"$pgid\" psql -X -U postgres -d r331_synthetic -At -v ON_ERROR_STOP=1 -c \"\nSELECT COALESCE(jsonb_agg(jsonb_build_object(\n  'id',r.id,'office_id',r.office_id,'client_id',r.client_id,\n  'actor_auth_id',r.actor_auth_id,'status',r.status,\n  'due_day',to_char(d.due_at AT TIME ZONE 'Asia/Tokyo','YYYY-MM-DD'))\n  ORDER BY r.actor_auth_id,r.id),'[]'::jsonb)::text\nFROM public.r342_requests r JOIN public.r352_deadlines d\nON d.request_id=r.id AND d.office_id=r.office_id;\n\" >/tmp/r352_all.json\nnode - <<'NODE'\nconst fs=require('node:fs');\nconst rows=JSON.parse(fs.readFileSync('/tmp/r352_all.json','utf8'));\nconst original=JSON.parse(fs.readFileSync('/tmp/r351_samples.json','utf8'));\nif(rows.length!==19)throw Error('R352_DEADLINE_FIXTURE_COUNT');\nconst requested=['2028-02-28','2028-02-29','2028-03-01'].map(day=>\n rows.find(x=>x.status==='requested'&&x.due_day===day));\nconst completed=original.completed.map(x=>rows.find(r=>r.id===x.id));\nconst staff=completed.find(x=>x?.actor_auth_id==='00000002-0002-4002-8002-000000000002');\nif(requested.some(x=>!x)||completed.some(x=>!x)||!staff)throw Error('R352_FIXTURE_MISMATCH');\nfs.writeFileSync('/tmp/r352_samples.json',JSON.stringify({all:rows,requested,completed,staff}));\nconsole.log('R352_SYNTHETIC_JST_DEADLINE_FIXTURES_READY count=19');\nNODE\n"
    - name: R352 install signed-JWT live PostgREST reminder preview assertions
      shell: bash
      run: "set -euo pipefail\ncat >/tmp/r352_http.mjs <<'R352_R352_HTTP'\nimport assert from 'node:assert/strict';\nimport {createHmac} from 'node:crypto';\nimport {readFileSync} from 'node:fs';\n\nconst DATA=JSON.parse(readFileSync('/tmp/r352_samples.json','utf8'));\nconst HOST='http://127.0.0.1:3000';\nconst SECRET='R335_SYNTHETIC_JWT_SIGNING_KEY_NOT_REAL_1234567890';\nconst OA='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa';\nconst OB='bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb';\nconst STAFF='00000002-0002-4002-8002-000000000002';\nconst OWNER_A='00000005-0005-4005-8005-000000000005';\nconst OWNER_B='00000003-0003-4003-8003-000000000003';\nconst STAGE=process.env.R352_STAGE??'initial';\nconst A='2028-02-29T03:00:00Z',B='2028-02-29T15:00:00Z';\nconst enc=x=>Buffer.from(JSON.stringify(x)).toString('base64url');\nfunction jwt(sub,extra={}) {\n const h=enc({alg:'HS256',typ:'JWT'}),p=enc({sub,role:'authenticated',exp:4102444800,...extra});\n return h+'.'+p+'.'+createHmac('sha256',SECRET).update(h+'.'+p).digest('base64url');\n}\nlet checks=0;\nfunction eq(n,x,y){assert.deepEqual(x,y,n);checks++}\nfunction ok(n,x){assert.ok(x,n);checks++}\nasync function call(item,sub=item.actor_auth_id,office=item.office_id,asOf=A,token=jwt(sub)) {\n const r=await fetch(HOST+'/rpc/r352_preview_reminder',{\n  method:'POST',headers:{'content-type':'application/json',accept:'application/json',\n    ...(token?{authorization:'Bearer '+token}:{})},\n  body:JSON.stringify({p_office:office,p_request:item.id,p_as_of:asOf}),\n  signal:AbortSignal.timeout(16000)});\n const raw=await r.text();let body;\n try {body=raw?JSON.parse(raw):null}\n catch {throw Error('R352_NON_JSON_'+r.status+'_'+raw.slice(0,120))}\n return {code:r.status,body};\n}\nfunction classify(item,asOf=A){\n const today=asOf===A?'2028-02-29':'2028-03-01';\n const tomorrow=asOf===A?'2028-03-01':'2028-03-02';\n if(item.status==='completed')return {eligible:false,phase:'none',reason:'completed'};\n if(item.due_day<today)return {eligible:true,phase:'overdue',reason:'eligible'};\n if(item.due_day===today)return {eligible:true,phase:'due_today',reason:'eligible'};\n if(item.due_day===tomorrow)return {eligible:true,phase:'day_before',reason:'eligible'};\n return {eligible:false,phase:'none',reason:'not_yet'};\n}\nfunction yes(n,r,item,asOf=A){\n const exp=classify(item,asOf);\n eq(n+'-http',r.code,200);\n eq(n+'-keys',Object.keys(r.body).sort(),['due_day','eligible','phase','preview_only','reason','scheduled']);\n for(const k of ['eligible','phase','reason'])eq(n+'-'+k,r.body[k],exp[k]);\n eq(n+'-date',r.body.due_day,item.due_day);\n eq(n+'-preview',r.body.preview_only,true);\n eq(n+'-no-queue',r.body.scheduled,false);\n ok(n+'-no-identifier',!JSON.stringify(r.body).includes(item.id));\n}\nfunction deny(n,r){\n eq(n+'-http',r.code,403);eq(n+'-sqlstate',r.body?.code,'42501');\n eq(n+'-generic',r.body?.message,'R352_ACCESS_DENIED');\n ok(n+'-no-data',r.body?.due_day===undefined&&r.body?.phase===undefined);\n}\nconst requested=DATA.requested,completed=DATA.completed;\nok('requested-fixtures',requested.length===3);\nok('completed-fixtures',completed.length===3);\nconst staff=DATA.staff;\nok('staff-sample',staff?.actor_auth_id===STAFF);\nconst ownerB=DATA.all.find(x=>x.office_id===OB&&x.actor_auth_id===OWNER_B);\nok('owner-b-sample',!!ownerB);\n\nif(STAGE==='initial'){\n for(let i=0;i<3;i++){\n  yes('requested-A-'+i,await call(requested[i]),requested[i]);\n  yes('requested-B-'+i,await call(requested[i],requested[i].actor_auth_id,requested[i].office_id,B),requested[i],B);\n  yes('completed-'+i,await call(completed[i]),completed[i]);\n }\n for(let i=0;i<10;i++){\n  deny('cross-office-'+i,await call(requested[i%3],OWNER_B,OA));\n  deny('wrong-office-'+i,await call(requested[i%3],OWNER_A,OB));\n }\n const missing={...requested[0],id:'00000000-0000-4000-8000-000000000000'};\n deny('missing-same-office',await call(missing));\n const injected=jwt(STAFF,{office_id:OB,is_admin:true});\n deny('untrusted-admin-claim',await call(staff,STAFF,OB,A,injected));\n let noToken=await call(staff,STAFF,OA,A,null);\n ok('missing-bearer-rejected',[401,403,404].includes(noToken.code));\n let wrongRole=await call(staff,STAFF,OA,A,jwt(STAFF,{role:'anon'}));\n ok('wrong-role-rejected',[401,403,404].includes(wrongRole.code));\n let invalid=await call(requested[0],requested[0].actor_auth_id,requested[0].office_id,null);\n eq('invalid-time-code',invalid.code,400);\n eq('invalid-time-detail',invalid.body?.message,'R352_INVALID_AS_OF');\n const infinite=await call(requested[0],requested[0].actor_auth_id,requested[0].office_id,'infinity');\n eq('infinite-time-code',infinite.code,400);\n eq('infinite-time-detail',infinite.body?.message,'R352_INVALID_AS_OF');\n const impossible=await call(requested[0],requested[0].actor_auth_id,requested[0].office_id,'2028-02-30T12:00:00Z');\n eq('impossible-calendar-date-rejected',impossible.code,400);\n const race=await Promise.all(Array.from({length:42},()=>call(requested[0])));\n race.forEach((r,i)=>yes('parallel-stable-'+i,r,requested[0]));\n eq('all-responses-same',new Set(race.map(r=>JSON.stringify(r.body))).size,1);\n} else if(STAGE==='revoked'){\n for(let i=0;i<12;i++)deny('revoked-'+i,await call(staff));\n for(let i=0;i<6;i++)yes('owner-b-remains-'+i,await call(ownerB),ownerB);\n} else if(STAGE==='restored'){\n for(let i=0;i<14;i++)yes('restored-'+i,await call(staff),staff);\n} else if(STAGE==='reassigned'){\n for(let i=0;i<12;i++)deny('client-reassigned-'+i,await call(staff));\n for(let i=0;i<6;i++)yes('owner-a-still-authorized-'+i,await call(staff,OWNER_A),staff);\n} else if(STAGE==='office_paused'){\n for(let i=0;i<12;i++)deny('office-paused-'+i,await call(staff));\n for(let i=0;i<6;i++)yes('other-office-unaffected-'+i,await call(ownerB),ownerB);\n} else if(STAGE==='final'){\n for(const [i,item] of [...requested,...completed].entries())yes('final-'+i,await call(item),item);\n yes('staff-after-office-restore',await call(staff),staff);\n const raw=await fetch(HOST+'/r352_deadlines?select=*',{\n  headers:{authorization:'Bearer '+jwt(OWNER_A)},signal:AbortSignal.timeout(12000)});\n ok('direct-deadline-select-denied',[401,403,404].includes(raw.status));\n const patch=await fetch(HOST+'/r352_deadlines?request_id=eq.'+staff.id,{\n  method:'PATCH',headers:{authorization:'Bearer '+jwt(OWNER_A),'content-type':'application/json'},\n  body:JSON.stringify({due_at:'2030-01-01T00:00:00Z'}),signal:AbortSignal.timeout(12000)});\n ok('direct-deadline-edit-denied',[400,401,403,404].includes(patch.status));\n} else throw Error('R352_STAGE_UNKNOWN_'+STAGE);\nconsole.log(JSON.stringify({suite:'R352_READ_ONLY_JST_REMINDER_PREVIEW',stage:STAGE,checks,\n synthetic_pg17:true,signed_jwt:true,real_line:false,scheduled_notifications:0,commercial_release:'HOLD'}));\nR352_R352_HTTP\nnode --check /tmp/r352_http.mjs\n"
