    - name: R335 build synthetic DB users, RLS policy and fixtures for actual PostgREST 12.2.8
      shell: bash
      run: "set -euo pipefail\ncat > /tmp/r335_fixture.sql <<'R335_FIXTURE'\n\\set ON_ERROR_STOP on\n-- Disposable PostgreSQL fixture. Real PostgREST, but NEVER shared Supabase.\n-- R331/R333 replay has already created these roles. Do not weaken or replace them.\nDO $r335_roles$ BEGIN\n IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='anon') OR NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='authenticated') THEN\n  RAISE EXCEPTION 'R335_BASELINE_ROLES_MISSING';\n END IF;\nEND $r335_roles$;\nCREATE ROLE r335_authenticator LOGIN NOINHERIT PASSWORD 'r335_fake_disposable_pw_1';\nGRANT anon, authenticated TO r335_authenticator;\nGRANT USAGE ON SCHEMA public TO anon, authenticated, r335_authenticator;\nCREATE SCHEMA r335_private;\nREVOKE ALL ON SCHEMA r335_private FROM PUBLIC, anon;\nCREATE TABLE public.r335_offices (\n  id uuid PRIMARY KEY, is_active boolean NOT NULL\n);\nCREATE TABLE public.r335_staff (\n  id uuid PRIMARY KEY, office_id uuid NOT NULL REFERENCES public.r335_offices(id),\n  auth_user_id uuid NOT NULL, role text NOT NULL,\n  is_active boolean NOT NULL, can_view_all_clients boolean NOT NULL,\n  UNIQUE(office_id,id)\n);\nCREATE TABLE public.r335_clients (\n  id uuid PRIMARY KEY, office_id uuid NOT NULL REFERENCES public.r335_offices(id),\n  assigned_staff_id uuid NOT NULL, title text NOT NULL,\n  FOREIGN KEY (office_id,assigned_staff_id) REFERENCES public.r335_staff(office_id,id)\n);\nINSERT INTO public.r335_offices VALUES\n('aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',true),('bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb',true);\nINSERT INTO public.r335_staff VALUES\n('10000000-0000-4000-8000-000000000001','aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa','00000001-0001-4001-8001-000000000001','owner',true,true),\n('10000000-0000-4000-8000-000000000002','aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa','00000002-0002-4002-8002-000000000002','staff',true,false),\n('10000000-0000-4000-8000-000000000003','bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb','00000003-0003-4003-8003-000000000003','owner',true,true),\n('10000000-0000-4000-8000-000000000004','aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa','00000004-0004-4004-8004-000000000004','staff',false,false);\nINSERT INTO public.r335_clients VALUES\n('20000000-0000-4000-8000-000000000001','aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa','10000000-0000-4000-8000-000000000002','synthetic A assigned'),\n('20000000-0000-4000-8000-000000000002','aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa','10000000-0000-4000-8000-000000000001','synthetic A owner'),\n('20000000-0000-4000-8000-000000000003','bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb','10000000-0000-4000-8000-000000000003','synthetic B owner');\n-- PostgREST v12+ uses full JSON request.jwt.claims (not SQL-authenticated legacy `request.jwt.claim.sub`).\nCREATE FUNCTION r335_private.may_read_client(p_office uuid,p_assignee uuid)\nRETURNS boolean LANGUAGE sql STABLE SECURITY DEFINER SET search_path=pg_catalog AS $r335_policy$\n SELECT EXISTS (\n  SELECT 1 FROM public.r335_staff s JOIN public.r335_offices o ON o.id=s.office_id\n  WHERE s.auth_user_id::text = (nullif(current_setting('request.jwt.claims',true),'')::jsonb->>'sub')\n    AND s.office_id=p_office AND o.is_active AND s.is_active\n    AND (s.role IN ('owner','admin') OR s.can_view_all_clients OR s.id=p_assignee)\n );\n$r335_policy$;\nREVOKE ALL ON FUNCTION r335_private.may_read_client(uuid,uuid) FROM PUBLIC, anon;\nGRANT USAGE ON SCHEMA r335_private TO authenticated;\nGRANT EXECUTE ON FUNCTION r335_private.may_read_client(uuid,uuid) TO authenticated;\nALTER TABLE public.r335_clients ENABLE ROW LEVEL SECURITY;\nALTER TABLE public.r335_clients FORCE ROW LEVEL SECURITY;\nCREATE POLICY r335_clients_authenticated_read ON public.r335_clients FOR SELECT TO authenticated\nUSING (r335_private.may_read_client(office_id, assigned_staff_id));\nREVOKE ALL ON public.r335_clients, public.r335_staff, public.r335_offices FROM PUBLIC, anon, authenticated;\nGRANT SELECT ON public.r335_clients TO authenticated;\n-- Show actual request JWT claims and role for authenticated traffic in a synthetic test-only view.\nCREATE VIEW public.r335_claim_probe WITH (security_invoker=true) AS SELECT\n (nullif(current_setting('request.jwt.claims',true),'')::jsonb->>'sub')::text AS verified_sub,\n coalesce(nullif(current_setting('request.jwt.claim.sub',true),''),'UNSET')::text AS legacy_sub,\n current_user::text AS db_role;\nREVOKE ALL ON public.r335_claim_probe FROM PUBLIC, anon;\nGRANT SELECT ON public.r335_claim_probe TO authenticated;\n-- Catalog invariants: no exposed write grants, only 1 policy, no anon reads.\nDO $r335_checks$ BEGIN\n IF (SELECT count(*) FROM pg_policies WHERE tablename='r335_clients')<>1 THEN RAISE EXCEPTION 'R335_POLICY_COUNT'; END IF;\n IF has_table_privilege('anon','public.r335_clients','SELECT') THEN RAISE EXCEPTION 'R335_ANON_READABLE'; END IF;\n IF has_table_privilege('authenticated','public.r335_clients','INSERT,UPDATE,DELETE') THEN RAISE EXCEPTION 'R335_WRITE_GRANT'; END IF;\n IF (SELECT count(*) FROM pg_roles WHERE rolname IN ('anon','authenticated') AND rolbypassrls)<>0 THEN RAISE EXCEPTION 'R335_ROLE_BYPASS'; END IF;\n IF (SELECT count(*) FROM public.r335_clients)<>3 THEN RAISE EXCEPTION 'R335_FIXTURES'; END IF;\n RAISE NOTICE 'R335_DB_FIXTURES_PASS: 2 synthetic offices 3 clients 4 staff, direct anon no grant, authenticated SELECT only';\nEND $r335_checks$;\nR335_FIXTURE\npgid=\"${{ job.services.pg.id }}\"\ntest -n \"$pgid\"\ndocker exec -i \"$pgid\" psql -X -U postgres -d r331_synthetic -v ON_ERROR_STOP=1 < /tmp/r335_fixture.sql >/tmp/r335_db.log 2>&1 || { tail -80 /tmp/r335_db.log; exit 1; }\ngrep 'R335_DB_FIXTURES_PASS' /tmp/r335_db.log\n"
    - name: R339 prepare intentionally unsafe synthetic definer RPC before PostgREST schema cache
