      run: "set -euo pipefail\ncat > /tmp/r339_exposed_rpc.sql <<'R339_RPC_CREATE'\n\\set ON_ERROR_STOP on\n-- DANGEROUS FUNCTION IS INTENTIONALLY CREATED ONLY INSIDE DISPOSABLE QA DB.\n-- The demonstration must NEVER be installed on a production or shared project.\n-- Mimic an accidentally published SECURITY DEFINER endpoint that bypasses RLS.\nCREATE FUNCTION public.r339_insecure_directory()\nRETURNS jsonb LANGUAGE sql STABLE SECURITY DEFINER SET search_path=pg_catalog AS $r339$\n SELECT jsonb_build_object(\n  'staff_count',(SELECT count(*) FROM public.r335_staff),\n  'office_count',(SELECT count(*) FROM public.r335_offices),\n  'office_ids',(SELECT jsonb_agg(x.id ORDER BY x.id) FROM public.r335_offices x)\n );\n$r339$;\n-- SECURITY DEFINER defaults to executable by PUBLIC unless explicitly revoked.\n-- Explicitly grant to model a common accidentally exposed API, synthetic only.\nGRANT EXECUTE ON FUNCTION public.r339_insecure_directory() TO PUBLIC,anon,authenticated;\nDO $r339_assert$ DECLARE a int;b int; BEGIN\n IF NOT has_function_privilege('anon','public.r339_insecure_directory()','EXECUTE') THEN RAISE EXCEPTION 'R339_EXPECTED_ANON_EXEC_MISSING'; END IF;\n IF NOT has_function_privilege('authenticated','public.r339_insecure_directory()','EXECUTE') THEN RAISE EXCEPTION 'R339_EXPECTED_AUTH_EXEC_MISSING'; END IF;\n SELECT count(*) INTO a FROM public.r335_staff;\n SELECT count(*) INTO b FROM public.r335_offices;\n IF a<>4 OR b<>2 THEN RAISE EXCEPTION 'R339_BAD_FIXTURE staff=% offices=%',a,b; END IF;\n RAISE NOTICE 'R339_DISPOSABLE_INSECURE_RPC_READY fake_staff=4 fake_offices=2 only_synthetic=true';\nEND $r339_assert$;\nR339_RPC_CREATE\npgid=\"${{ job.services.pg.id }}\"\ntest -n \"$pgid\"\ndocker exec -i \"$pgid\" psql -X -U postgres -d r331_synthetic -v ON_ERROR_STOP=1 < /tmp/r339_exposed_rpc.sql\n"
