    - name: R350 install synthetic completion status RPC and dedicated audit table
      shell: bash
      run: "set -euo pipefail\ncat >/tmp/r350_schema.sql <<'R350_SCHEMA_SQL'\n\\set ON_ERROR_STOP on\n-- EPHEMERAL PG17 ONLY: no changes to live Supabase/Worker/LINE/main.\nDO $r350_before$ BEGIN\n IF (SELECT count(*) FROM public.r342_requests)<>19 OR (SELECT count(*) FROM public.r342_audit)<>19 THEN RAISE EXCEPTION 'R350_PREVIOUS_DATA_DRIFT'; END IF;\n IF EXISTS(SELECT 1 FROM public.r342_requests WHERE status<>'requested') THEN RAISE EXCEPTION 'R350_UNEXPECTED_PRIOR_STATUS'; END IF;\n IF has_table_privilege('authenticated','public.r342_requests','UPDATE') THEN RAISE EXCEPTION 'R350_EXTERNAL_UPDATE_GRANT'; END IF;\nEND $r350_before$;\nALTER TABLE public.r342_requests DROP CONSTRAINT r342_requests_status_check;\nALTER TABLE public.r342_requests ADD CONSTRAINT r350_request_status_check CHECK(status IN ('requested','completed'));\nGRANT UPDATE(status) ON public.r342_requests TO r342_executor;\nCREATE POLICY r350_executor_request_update ON public.r342_requests FOR UPDATE TO r342_executor USING (true) WITH CHECK (true);\nCREATE TABLE public.r350_status_audit(\n id uuid PRIMARY KEY DEFAULT gen_random_uuid(),\n office_id uuid NOT NULL,\n request_id uuid NOT NULL,\n actor_auth_id uuid NOT NULL,\n action text NOT NULL DEFAULT 'request_completed' CHECK (action='request_completed'),\n created_at timestamptz NOT NULL DEFAULT clock_timestamp(),\n FOREIGN KEY(office_id,request_id) REFERENCES public.r342_requests(office_id,id) ON DELETE RESTRICT,\n UNIQUE(request_id,action)\n);\nALTER TABLE public.r350_status_audit ENABLE ROW LEVEL SECURITY;\nALTER TABLE public.r350_status_audit FORCE ROW LEVEL SECURITY;\nREVOKE ALL ON public.r350_status_audit FROM PUBLIC,anon,authenticated;\nGRANT SELECT,INSERT ON public.r350_status_audit TO r342_executor;\nCREATE POLICY r350_executor_audit_read ON public.r350_status_audit FOR SELECT TO r342_executor USING (true);\nCREATE POLICY r350_executor_audit_insert ON public.r350_status_audit FOR INSERT TO r342_executor WITH CHECK (true);\n\nCREATE FUNCTION public.r350_complete_request(p_office uuid,p_request uuid)\nRETURNS jsonb LANGUAGE plpgsql VOLATILE SECURITY DEFINER SET search_path=pg_catalog\nAS $r350_rpc$\nDECLARE\n v_claims jsonb;v_sub text;v_actor uuid;v_staff uuid;v_broad boolean;\n v_client uuid;v_status text;v_changed boolean;\nBEGIN\n v_claims:=nullif(current_setting('request.jwt.claims',true),'')::jsonb;\n v_sub:=v_claims->>'sub';\n IF (v_claims->>'role') IS DISTINCT FROM 'authenticated'\n    OR v_sub IS NULL OR v_sub !~* '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'\n    OR p_office IS NULL OR p_request IS NULL\n THEN RAISE EXCEPTION 'R350_ACCESS_DENIED' USING ERRCODE='42501'; END IF;\n v_actor:=v_sub::uuid;\n SELECT s.id,(s.role IN ('owner','admin') OR s.can_view_all_clients)\n INTO v_staff,v_broad\n FROM public.r335_staff s JOIN public.r335_offices o ON o.id=s.office_id\n WHERE s.office_id=p_office AND s.auth_user_id=v_actor AND s.is_active AND o.is_active\n LIMIT 1;\n IF v_staff IS NULL THEN RAISE EXCEPTION 'R350_ACCESS_DENIED' USING ERRCODE='42501'; END IF;\n -- Lock the row to serialize simultaneous completion requests.\n SELECT r.client_id,r.status INTO v_client,v_status\n FROM public.r342_requests r\n WHERE r.office_id=p_office AND r.id=p_request\n FOR UPDATE OF r;\n IF NOT FOUND THEN RAISE EXCEPTION 'R350_ACCESS_DENIED' USING ERRCODE='42501'; END IF;\n IF NOT EXISTS(SELECT 1 FROM public.r335_clients c\n               WHERE c.office_id=p_office AND c.id=v_client\n                 AND (v_broad OR c.assigned_staff_id=v_staff))\n THEN RAISE EXCEPTION 'R350_ACCESS_DENIED' USING ERRCODE='42501'; END IF;\n IF v_status NOT IN('requested','completed') THEN RAISE EXCEPTION 'R350_INVALID_TRANSITION' USING ERRCODE='22023'; END IF;\n v_changed:=(v_status='requested');\n IF v_changed THEN\n  UPDATE public.r342_requests SET status='completed' WHERE office_id=p_office AND id=p_request;\n  INSERT INTO public.r350_status_audit(office_id,request_id,actor_auth_id)\n  VALUES(p_office,p_request,v_actor);\n END IF;\n RETURN jsonb_build_object('id',p_request,'status','completed','changed',v_changed);\nEND;\n$r350_rpc$;\nALTER FUNCTION public.r350_complete_request(uuid,uuid) OWNER TO r342_executor;\nREVOKE ALL ON FUNCTION public.r350_complete_request(uuid,uuid) FROM PUBLIC,anon;\nGRANT EXECUTE ON FUNCTION public.r350_complete_request(uuid,uuid) TO authenticated;\nNOTIFY pgrst,'reload schema';\nDO $r350_ready$ BEGIN\n IF (SELECT rolcanlogin OR rolbypassrls FROM pg_roles WHERE rolname='r342_executor') IS DISTINCT FROM false THEN RAISE EXCEPTION 'R350_EXECUTOR_UNSAFE'; END IF;\n IF has_table_privilege('authenticated','public.r342_requests','UPDATE') OR has_table_privilege('authenticated','public.r350_status_audit','SELECT') OR has_function_privilege('anon','public.r350_complete_request(uuid,uuid)','EXECUTE') THEN RAISE EXCEPTION 'R350_EXTERNAL_DIRECT_GRANT'; END IF;\n IF (SELECT count(*) FROM pg_class WHERE oid IN ('public.r342_requests'::regclass,'public.r350_status_audit'::regclass) AND relforcerowsecurity)<>2 THEN RAISE EXCEPTION 'R350_FORCE_RLS_MISSING'; END IF;\n RAISE NOTICE 'R350_COMPLETION_RPC_READY synthetic_only=true baseline=19 completion_rows=0';\nEND $r350_ready$;\nR350_SCHEMA_SQL\npgid=\"${{ job.services.pg.id }}\"\ntest -n \"$pgid\"\ndocker exec -i \"$pgid\" psql -X -U postgres -d r331_synthetic -v ON_ERROR_STOP=1 < /tmp/r350_schema.sql\n"
    - name: R350 install signed JWT completion HTTP verifier
      shell: bash
      run: "set -euo pipefail\ncat >/tmp/r350_http.mjs <<'R350_HTTP'\nimport assert from 'node:assert/strict';\nimport {createHmac} from 'node:crypto';\nimport {readFileSync} from 'node:fs';\nconst HOST='http://127.0.0.1:3000',SECRET='R335_SYNTHETIC_JWT_SIGNING_KEY_NOT_REAL_1234567890';\nconst OA='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',OB='bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb';\nconst SUB={staffA:'00000002-0002-4002-8002-000000000002',ownerA:'00000005-0005-4005-8005-000000000005',ownerB:'00000003-0003-4003-8003-000000000003',disabled:'00000004-0004-4004-8004-000000000004'};\nconst oracle=JSON.parse(readFileSync('/tmp/r349_oracle.json','utf8'));\nconst one=oracle.staffA[0],two=oracle.ownerA.find(x=>x.id!==one.id),three=oracle.ownerB[0];\nassert.ok(one&&two&&three,'R350_MISSING_FIXTURE');\nconst STAGE=process.env.R350_STAGE??'initial';\nconst enc=x=>Buffer.from(JSON.stringify(x)).toString('base64url');\nfunction jwt(sub,extra={}){let h=enc({alg:'HS256',typ:'JWT'}),p=enc({sub,role:'authenticated',exp:4102444800,...extra});return `${h}.${p}.${createHmac('sha256',SECRET).update(h+'.'+p).digest('base64url')}`;}\nconst tok=Object.fromEntries(Object.entries(SUB).map(([n,v])=>[n,jwt(v)]));\nlet checks=0;const eq=(msg,a,b)=>{assert.deepEqual(a,b,msg);checks++};const ok=(msg,v)=>{assert.ok(v,msg);checks++};\nasync function call(actor,office,id,token=tok[actor]){\n const resp=await fetch(HOST+'/rpc/r350_complete_request',{method:'POST',headers:{accept:'application/json','content-type':'application/json',...(token?{authorization:'Bearer '+token}:{})},body:JSON.stringify({p_office:office,p_request:id}),signal:AbortSignal.timeout(14000)});\n const raw=await resp.text();let body=null;try{body=raw?JSON.parse(raw):null}catch{throw Error('R350_BAD_JSON_'+resp.status+'_'+raw.slice(0,100))}return {status:resp.status,body};\n}\nfunction yes(msg,r,item,changed){eq(msg+'-status',r.status,200);eq(msg+'-id',r.body?.id,item.id);eq(msg+'-value',r.body?.status,'completed');eq(msg+'-changed',r.body?.changed,changed);eq(msg+'-keys',Object.keys(r.body).sort(),['changed','id','status']);}\nfunction no(msg,r){eq(msg+'-http',r.status,403);eq(msg+'-code',r.body?.code,'42501');eq(msg+'-generic',r.body?.message,'R350_ACCESS_DENIED');ok(msg+'-no-id',r.body?.id===undefined);}\nconst missing='00000000-0000-4000-8000-000000000000';\nif(STAGE==='initial'){\n for(let i=0;i<6;i++){\n  no('cross-ownerA-'+i,await call('ownerA',OA,three.id));\n  no('cross-ownerB-'+i,await call('ownerB',OB,one.id));\n  no('staff-foreign-office-'+i,await call('staffA',OB,one.id));\n  no('missing-'+i,await call('ownerA',OA,missing));\n  no('disabled-'+i,await call('disabled',OA,one.id));\n }\n const claimSpoof=jwt(SUB.staffA,{role:'authenticated',office_id:OB,is_admin:true});\n no('spoof-foreign-office',await call('staffA',OB,three.id,claimSpoof));\n let anon=await call('staffA',OA,one.id,null);ok('anonymous-rejected',[401,403,404].includes(anon.status));\n let wrong=await call('staffA',OA,one.id,jwt(SUB.staffA,{role:'anon'}));ok('wrong-role-rejected',[401,403,404].includes(wrong.status));\n yes('assigned-staff-completes',await call('staffA',OA,one.id),one,true);\n yes('assigned-staff-replay',await call('staffA',OA,one.id),one,false);\n yes('ownerB-completes',await call('ownerB',OB,three.id),three,true);\n const race=await Promise.all(Array.from({length:24},()=>call('ownerA',OA,two.id)));\n for(const [i,r] of race.entries()){\n  eq('race-http-'+i,r.status,200);eq('race-id-'+i,r.body?.id,two.id);eq('race-status-'+i,r.body?.status,'completed');\n }\n eq('race-single-winner',race.filter(x=>x.body?.changed===true).length,1);\n eq('race-replayed-count',race.filter(x=>x.body?.changed===false).length,23);\n for(let i=0;i<5;i++){no('owner-spoof-'+i,await call('ownerB',OA,one.id));}\n}else if(STAGE==='revoked'){\n for(let i=0;i<14;i++)no('revoked-staff-'+i,await call('staffA',OA,one.id));\n for(let i=0;i<6;i++)yes('owner-after-revocation-'+i,await call('ownerA',OA,one.id),one,false);\n}else if(STAGE==='restored'){\n for(let i=0;i<12;i++)yes('staff-restored-'+i,await call('staffA',OA,one.id),one,false);\n}else if(STAGE==='reassigned'){\n for(let i=0;i<14;i++)no('transferred-client-'+i,await call('staffA',OA,one.id));\n for(let i=0;i<6;i++)yes('owner-still-allowed-'+i,await call('ownerA',OA,one.id),one,false);\n}else if(STAGE==='final'){\n for(let i=0;i<8;i++)yes('staff-final-'+i,await call('staffA',OA,one.id),one,false);\n for(let i=0;i<8;i++)yes('ownerB-final-'+i,await call('ownerB',OB,three.id),three,false);\n const direct=await fetch(HOST+'/r342_requests?id=eq.'+one.id,{method:'PATCH',headers:{authorization:'Bearer '+tok.ownerA,'content-type':'application/json'},body:JSON.stringify({status:'requested'}),signal:AbortSignal.timeout(12000)});\n ok('direct-patch-denied',[400,401,403].includes(direct.status));\n const raw=await fetch(HOST+'/r350_status_audit?select=*',{method:'GET',headers:{authorization:'Bearer '+tok.ownerA},signal:AbortSignal.timeout(12000)});\n ok('direct-audit-read-denied',[401,403].includes(raw.status));\n}else throw Error('R350_BAD_STAGE_'+STAGE);\nconsole.log(JSON.stringify({suite:'R350_REAL_POSTGREST_SCOPED_COMPLETION_AUDIT',stage:STAGE,checks,synthetic_pg17:true,signed_jwt:true,original_create_audit_immutable:true,commercial_release:'HOLD'}));\nR350_HTTP\nnode --check /tmp/r350_http.mjs\n"
