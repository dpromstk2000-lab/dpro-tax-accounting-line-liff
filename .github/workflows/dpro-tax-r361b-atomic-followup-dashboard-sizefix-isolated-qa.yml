equest',who,'POST',{p_office:O[who],p_client:C[who],p_key:key});\nasync function accepted(who,key,created){const r=await rpc(who,key);equals(`${STAGE}-${who}-${key}-http`,r.status,200);equals(`${STAGE}-${who}-${key}-created`,r.data.created,created);ensure(`${STAGE}-${who}-${key}-id`,/^[0-9a-f-]{36}$/i.test(r.data.id));equals(`${STAGE}-${who}-${key}-state`,r.data.status,'requested');return r.data.id;}\nasync function denied(who,key){const r=await rpc(who,key);ensure(`${STAGE}-${who}-${key}-reject`,[400,401,403].includes(r.status));equals(`${STAGE}-${who}-${key}-access-denied`,r.data?.code,'42501');ensure(`${STAGE}-${who}-${key}-no-id`,!r.data?.id);}\nconst owners=['staffA','ownerB'];\nif(STAGE==='before'){\n const ids={};for(const who of owners){ids[who]=await accepted(who,SHARE,true);await accepted(who,OLD[who],false)}\n ensure('cross-office-same-key-independent',ids.staffA!==ids.ownerB);\n writeFileSync('/tmp/r343_created.json',JSON.stringify(ids));\n}else if(STAGE==='revoked'){\n for(const who of owners){await denied(who,OLD[who]);await denied(who,SHARE);await denied(who,NEW[who]);}\n}else if(STAGE==='restored'){\n const ids=JSON.parse(readFileSync('/tmp/r343_created.json','utf8'));\n for(const who of owners){const original=await accepted(who,SHARE,false);equals(`${who}-idempotent-same-id`,original,ids[who]);await accepted(who,NEW[who],true);}\n}else if(STAGE==='grant_drift'){\n for(const who of owners){for(const table of ['r342_requests','r342_audit']){\n   const get=await http(`/${table}?select=*&order=id.asc`,who);equals(`${who}-${table}-get-rls-empty-status`,get.status,200);equals(`${who}-${table}-get-rls-empty-rows`,get.data,[]);\n   // Valid complete payload: a failure must come from RLS, not column errors.\n   const fake=table==='r342_requests'?{office_id:O[who],client_id:C[who],actor_auth_id:SUB[who],request_key:'R343_INJECTION_'+(who==='staffA'?'A':'B')+'_001'}:{office_id:O[who],request_id:JSON.parse(readFileSync('/tmp/r343_created.json','utf8'))[who],actor_auth_id:SUB[who],action:'request_created'};\n   const post=await http('/'+table,who,'POST',fake);ensure(`${who}-${table}-insert-rejected`,[400,401,403].includes(post.status));equals(`${who}-${table}-insert-rls-error`,post.data?.code,'42501');\n }\n const valid=await accepted(who,SHARE,false);equals(`${who}-rpc-retains-access-during-grant-drift`,valid,JSON.parse(readFileSync('/tmp/r343_created.json','utf8'))[who]);}\n}else if(STAGE==='locked'){\n for(const who of owners){for(const table of ['r342_requests','r342_audit']){const r=await http('/'+table+'?select=*',who);ensure(`${who}-${table}-direct-get-denied-after-revoke`,[401,403].includes(r.status));}\n await accepted(who,NEW[who],false);}\n}else throw Error('INVALID_R343_STAGE_'+STAGE);\nconsole.log(JSON.stringify({suite:'R343_SIGNED_JWT_POSTGREST_RPC_REVOCATION_GRANT_DRIFT',stage:STAGE,checks,real_postgrest:true,ephemeral_pg17:true,real_supabase:false,commercial_release:'HOLD'}));\nR343_JS\nnode --check /tmp/r343_http.mjs\n"
