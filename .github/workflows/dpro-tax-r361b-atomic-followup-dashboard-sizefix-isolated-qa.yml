    - name: R361 install SECURITY INVOKER atomic summary plus page dashboard
      shell: bash
      run: "set -euo pipefail\ncat >/tmp/r361_schema.sql <<'R361_R361_SCHEMA_SQL'\n\\set ON_ERROR_STOP on\n-- R361: one read-only API response for summary + page from one query snapshot.\n-- SECURITY INVOKER, no direct table access; inherited functions enforce scope.\nDO $r361_baseline$ BEGIN\n IF (SELECT count(*) FROM public.r342_requests)<>19\n OR (SELECT count(*) FROM public.r352_deadlines)<>19\n OR (SELECT count(*) FROM public.r355_visits)<>7\n OR NOT has_function_privilege('authenticated',\n    'public.r359_preview_followup_summary(uuid,timestamptz,integer)','EXECUTE')\n OR NOT has_function_privilege('authenticated',\n    'public.r360_preview_followup_queue(uuid,timestamptz,integer,integer,integer)','EXECUTE')\n THEN RAISE EXCEPTION 'R361_R359_R360_FORMAL_BASELINE_DRIFT_HOLD'; END IF;\nEND $r361_baseline$;\n\nCREATE FUNCTION public.r361_preview_material_dashboard(\n p_office uuid,p_as_of timestamptz,p_repeat_days integer,\n p_limit integer,p_offset integer)\nRETURNS jsonb LANGUAGE plpgsql STABLE SECURITY INVOKER SET search_path=pg_catalog\nAS $r361_rpc$\nDECLARE\n v_summary jsonb;v_page jsonb;\nBEGIN\n -- Both child STABLE functions see the same PostgreSQL statement snapshot.\n -- No SQL table SELECT and no authority gain from this wrapper.\n v_summary:=public.r359_preview_followup_summary(\n  p_office,p_as_of,p_repeat_days);\n v_page:=public.r360_preview_followup_queue(\n  p_office,p_as_of,p_repeat_days,p_limit,p_offset);\n IF (v_summary->>'candidate_total')::integer\n    IS DISTINCT FROM (v_page->>'candidate_total')::integer\n OR (v_summary->>'as_of_day') IS DISTINCT FROM (v_page->>'as_of_day')\n OR (v_summary->>'repeat_days') IS DISTINCT FROM (v_page->>'repeat_days')\n OR (v_summary->>'preview_only') IS DISTINCT FROM 'true'\n OR (v_page->>'preview_only') IS DISTINCT FROM 'true'\n OR (v_summary->>'scheduled') IS DISTINCT FROM 'false'\n OR (v_page->>'scheduled') IS DISTINCT FROM 'false'\n THEN RAISE EXCEPTION 'R361_SUMMARY_PAGE_MISMATCH_HOLD' USING ERRCODE='22023';\n END IF;\n RETURN pg_catalog.jsonb_build_object(\n  'summary',v_summary,'page',v_page,\n  'consistent',true,'preview_only',true,'scheduled',false);\nEND;\n$r361_rpc$;\n\nREVOKE ALL ON FUNCTION public.r361_preview_material_dashboard(uuid,timestamptz,integer,integer,integer)\n FROM PUBLIC,anon;\nGRANT EXECUTE ON FUNCTION public.r361_preview_material_dashboard(uuid,timestamptz,integer,integer,integer)\n TO authenticated;\nNOTIFY pgrst,'reload schema';\n\nDO $r361_acl$ BEGIN\n IF (SELECT prosecdef FROM pg_proc WHERE oid=\n   'public.r361_preview_material_dashboard(uuid,timestamptz,integer,integer,integer)'::regprocedure)\n OR NOT has_function_privilege('authenticated',\n   'public.r361_preview_material_dashboard(uuid,timestamptz,integer,integer,integer)','EXECUTE')\n OR has_function_privilege('anon',\n   'public.r361_preview_material_dashboard(uuid,timestamptz,integer,integer,integer)','EXECUTE')\n OR has_table_privilege('authenticated','public.r342_requests','SELECT')\n OR has_table_privilege('authenticated','public.r352_deadlines','SELECT')\n OR has_table_privilege('authenticated','public.r355_visits','SELECT')\n THEN RAISE EXCEPTION 'R361_DASHBOARD_ACL_HOLD'; END IF;\n RAISE NOTICE 'R361_SYNTHETIC_ATOMIC_DASHBOARD_PREVIEW_READY security_invoker=true sends=0';\nEND $r361_acl$;\nR361_R361_SCHEMA_SQL\npgid=\"${{ job.services.pg.id }}\"\ntest -n \"$pgid\"\ndocker exec -i \"$pgid\" psql -X -U postgres -d r331_synthetic -v ON_ERROR_STOP=1 < /tmp/r361_schema.sql\n"
    - name: R361 install independent PG17 atomic summary/page reconciliation tests
      shell: bash
      run: "set -euo pipefail\ncat >/tmp/r361_http.mjs <<'R361_R361_HTTP_MJS'\nimport assert from 'node:assert/strict';\nimport {readFileSync} from 'node:fs';\nimport {createHmac} from 'node:crypto';\n\n// Compare one atomic PostgREST dashboard response with independent raw PG17\n// request/deadline and live staff/client/office oracles in each QA phase.\nconst STAGE=process.env.R361_STAGE??'initial';\nconst HOST='http://127.0.0.1:3000';\nconst SECRET='R335_SYNTHETIC_JWT_SIGNING_KEY_NOT_REAL_1234567890';\nconst data=JSON.parse(readFileSync(process.env.R361_REQUEST_ORACLE_PATH??'/tmp/r356_oracle.json'));\nconst graph=JSON.parse(readFileSync(process.env.R361_SCOPE_ORACLE_PATH??'/tmp/r358c_scope_oracle.json'));\nconst clients=new Map(graph.clients.map(c=>[c.id,c]));\nconst offices=new Map(graph.offices.map(o=>[o.id,o]));\nconst OA='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa';\nconst OB='bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb';\nconst STAFF='00000002-0002-4002-8002-000000000002';\nconst OWNER_A='00000005-0005-4005-8005-000000000005';\nconst OWNER_B='00000003-0003-4003-8003-000000000003';\nconst REASSIGNED='20000000-0000-4000-8000-000000000004';\nconst TRANSFER_STAFF='10000000-0000-4000-8000-000000000005';\nconst AS_OF='2028-02-29T03:00:00Z';\nconst MARCH='2028-02-29T15:00:00Z';\nconst APRIL='2028-04-15T12:30:00Z';\nlet checks=0;\nfunction eq(name,actual,expected){assert.deepEqual(actual,expected,name);checks++}\nfunction ok(name,value){assert.ok(value,name);checks++}\nfunction day(value){\n const parts=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date(value));\n const d=Object.fromEntries(parts.filter(p=>['year','month','day'].includes(p.type)).map(p=>[p.type,p.value]));\n return `${d.year}-${d.month}-${d.day}`;\n}\nfunction diff(a,b){return (Date.parse(a+'T00:00:00Z')-Date.parse(b+'T00:00:00Z'))/86400000}\nfunction visible(office,subject){\n const o=offices.get(office);\n const s=graph.staff.find(x=>x.office_id===office&&x.auth_user_id===subject);\n if(!o?.is_active||!s?.is_active)return [];\n if(STAGE==='revoked'&&subject===STAFF)return [];\n if(STAGE==='office_paused'&&office===OA)return [];\n const broad=['owner','admin'].includes(s.role)||s.can_view_all_clients;\n return data.requests.filter(r=>{\n  if(r.office_id!==office||r.status!=='requested')return false;\n  const c=clients.get(r.client_id);\n  const assigned=STAGE==='reassigned'&&r.client_id===REASSIGNED?TRANSFER_STAFF:c?.assigned_staff_id;\n  return c?.office_id===office&&(broad||assigned===s.id);\n });\n}\nfunction expected(office,subject,asOf,repeat,limit,offset){\n const today=day(asOf),rows=visible(office,subject);\n const c={overdue_total:0,overdue_candidates:0,due_today_total:0,day_before_total:0,future_total:0};\n const candidates=[];\n for(const r of rows){\n  const due=day(r.due_at),late=diff(today,due);\n  if(late>0){c.overdue_total++;if((late-1)%repeat===0)c.overdue_candidates++}\n  else if(late===0)c.due_today_total++;\n  else if(late===-1)c.day_before_total++;\n  else c.future_total++;\n  if(!(late>0&&(late-1)%repeat===0||late===0||late===-1))continue;\n  candidates.push({request_id:r.id,due_day:due,kind:late>0?'overdue':late===0?'due_today':'day_before',\n   overdue_days:Math.max(0,late),priority:late>0?0:late===0?1:2});\n }\n candidates.sort((a,b)=>a.priority-b.priority||a.due_day.localeCompare(b.due_day)||a.request_id.localeCompare(b.request_id));\n const items=candidates.slice(offset,offset+limit).map(({priority,...item})=>item);\n const summary={as_of_day:today,repeat_days:repeat,total_visible:rows.length,\n  candidate_total:c.overdue_candidates+c.due_today_total+c.day_before_total,\n  ...c,preview_only:true,scheduled:false};\n const page={as_of_day:today,repeat_days:repeat,candidate_total:candidates.length,\n  limit,offset,has_more:candidates.length>offset+items.length,\n  items,preview_only:true,scheduled:false};\n return {summary,page,consistent:true,preview_only:true,scheduled:false};\n}\nconst enc=x=>Buffer.from(JSON.stringify(x)).toString('base64url');\nfunction token(subject,claims={}){\n const a=enc({alg:'HS256',typ:'JWT'}),b=enc({sub:subject,role:'authenticated',exp:4102444800,...claims});\n return a+'.'+b+'.'+createHmac('sha256',SECRET).update(a+'.'+b).digest('base64url');\n}\nasync function call(office,subject=STAFF,asOf=AS_OF,repeat=7,limit=5,offset=0,jwt=token(subject)){\n const res=await fetch(HOST+'/rpc/r361_preview_material_dashboard',{\n  method:'POST',headers:{'content-type':'application/json',accept:'application/json',\n   ...(jwt?{authorization:'Bearer '+jwt}:{})},\n  body:JSON.stringify({p_office:office,p_as_of:asOf,p_repeat_days:repeat,p_limit:limit,p_offset:offset}),\n  signal:AbortSignal.timeout(16000)});\n const raw=await res.text();let body;\n try{body=raw?JSON.parse(raw):null}catch{throw Error('R361_INVALID_JSON '+res.status+' '+raw.slice(0,180))}\n return {status:res.status,body};\n}\nconst wrapperKeys=['consistent','page','preview_only','scheduled','summary'];\nfunction yes(name,result,office,subject,asOf=AS_OF,repeat=7,limit=5,offset=0){\n eq(name+'-200',result.status,200);\n eq(name+'-keys',Object.keys(result.body).sort(),wrapperKeys);\n eq(name+'-independent-pg17-summary-page',result.body,expected(office,subject,asOf,repeat,limit,offset));\n eq(name+'-summary-page-total-reconciled',result.body.summary.candidate_total,result.body.page.candidate_total);\n eq(name+'-common-jst-date',result.body.summary.as_of_day,result.body.page.as_of_day);\n eq(name+'-common-repeat',result.body.summary.repeat_days,result.body.page.repeat_days);\n ok(name+'-authorized-row-identifiers-only',result.body.page.items.every(x=>\n  visible(office,subject).some(r=>r.id===x.request_id)));\n ok(name+'-no-send',result.body.consistent&&result.body.preview_only&&\n   !result.body.scheduled&&!result.body.summary.scheduled&&!result.body.page.scheduled);\n}\nfunction deny(name,result){\n eq(name+'-403',result.status,403);\n eq(name+'-sqlstate',result.body?.code,'42501');\n eq(name+'-generic-message',result.body?.message,'R359_ACCESS_DENIED');\n ok(name+'-no-data',result.body?.summary===undefined&&result.body?.page===undefined);\n}\n\neq('source-19-requests',data.requests.length,19);\neq('source-16-pending',data.requests.filter(r=>r.status==='requested').length,16);\neq('graph-2-offices',graph.offices.length,2);\nok('real-pg17-request-client-office-join',data.requests.every(r=>clients.get(r.client_id)?.office_id===r.office_id));\nok('real-pg17-staff-A-non-broad',graph.staff.find(s=>s.auth_user_id===STAFF)?.can_view_all_clients===false);\n\nif(STAGE==='initial'){\n for(const [label,office,subject] of [['owner-A',OA,OWNER_A],['staff-A',OA,STAFF],['owner-B',OB,OWNER_B]]){\n  for(const [asOf,dateLabel] of [[AS_OF,'leap-feb'],[MARCH,'jst-mar'],[APRIL,'late-april']]){\n   for(const repeat of [1,7,30]){\n    for(const [limit,offset] of [[1,0],[3,1],[25,0],[2,500]]){\n     yes(`${label}-${dateLabel}-repeat-${repeat}-page-${limit}-${offset}`,\n      await call(office,subject,asOf,repeat,limit,offset),office,subject,asOf,repeat,limit,offset);\n    }\n   }\n  }\n }\n for(let i=0;i<12;i++){\n  deny('staff-cross-office-'+i,await call(OB,STAFF));\n  deny('owner-cross-office-'+i,await call(OA,OWNER_B));\n }\n yes('forged-admin-claims-ignored',await call(OA,STAFF,AS_OF,7,25,0,\n  token(STAFF,{is_admin:true,can_view_all_clients:true,office_id:OB})),OA,STAFF,AS_OF,7,25,0);\n deny('non-member',await call(OA,'00000000-0000-4000-8000-000000000009'));\n deny('malformed-sub',await call(OA,'not-a-uuid'));\n deny('unknown-office',await call('00000000-0000-4000-8000-000000000000',STAFF));\n ok('anonymous-denied',[401,403,404].includes((await call(OA,STAFF,AS_OF,7,5,0,null)).status));\n ok('wrong-role-denied',[401,403,404].includes((await call(OA,STAFF,AS_OF,7,5,0,token(STAFF,{role:'anon'}))).status));\n for(const [label,asOf,repeat,limit,offset,error] of [\n  ['repeat-zero',AS_OF,0,5,0,'R359_INVALID_REPEAT'],\n  ['repeat-over',AS_OF,31,5,0,'R359_INVALID_REPEAT'],\n  ['repeat-null',AS_OF,null,5,0,'R359_INVALID_REPEAT'],\n  ['date-null',null,7,5,0,'R359_INVALID_AS_OF'],\n  ['date-infinity','infinity',7,5,0,'R359_INVALID_AS_OF'],\n  ['limit-zero',AS_OF,7,0,0,'R360_INVALID_LIMIT'],\n  ['limit-over',AS_OF,7,26,0,'R360_INVALID_LIMIT'],\n  ['limit-null',AS_OF,7,null,0,'R360_INVALID_LIMIT'],\n  ['offset-negative',AS_OF,7,5,-1,'R360_INVALID_OFFSET'],\n  ['offset-over',AS_OF,7,5,501,'R360_INVALID_OFFSET'],\n  ['offset-null',AS_OF,7,5,null,'R360_INVALID_OFFSET']]){\n  const r=await call(OA,STAFF,asOf,repeat,limit,offset);\n  eq(label+'-400',r.status,400);eq(label+'-code',r.body?.code,'22023');\n  eq(label+'-message',r.body?.message,error);\n }\n const batch=await Promise.all(Array.from({length:64},(_,i)=>{\n  const office=i%3===2?OB:OA,subject=i%3===0?STAFF:i%3===1?OWNER_A:OWNER_B;\n  return call(office,subject,i%2?AS_OF:MARCH,[1,7,30][i%3],(i%4)+1,i%7);\n }));\n batch.forEach((res,i)=>{\n  const office=i%3===2?OB:OA,subject=i%3===0?STAFF:i%3===1?OWNER_A:OWNER_B;\n  yes('parallel-'+i,res,office,subject,i%2?AS_OF:MARCH,[1,7,30][i%3],(i%4)+1,i%7);\n });\n}else if(STAGE==='revoked'){\n for(let i=0;i<12;i++)deny('revoked-staff-'+i,await call(OA,STAFF));\n for(let i=0;i<5;i++)yes('owner-unaffected-'+i,await call(OA,OWNER_A),OA,OWNER_A);\n}else if(STAGE==='restored'){\n for(let i=0;i<12;i++)yes('staff-restored-'+i,await call(OA,STAFF),OA,STAFF);\n}else if(STAGE==='reassigned'){\n for(let i=0;i<12;i++)yes('assignment-recomputed-'+i,await call(OA,STAFF),OA,STAFF);\n for(let i=0;i<5;i++)yes('owner-still-broad-'+i,await call(OA,OWNER_A),OA,OWNER_A);\n}else if(STAGE==='office_paused'){\n for(let i=0;i<12;i++)deny('office-paused-staff-'+i,await call(OA,STAFF));\n for(let i=0;i<6;i++)deny('office-paused-owner-'+i,await call(OA,OWNER_A));\n for(let i=0;i<5;i++)yes('other-office-continues-'+i,await call(OB,OWNER_B),OB,OWNER_B);\n}else if(STAGE==='final'){\n for(const [label,office,subject] of [['owner-A',OA,OWNER_A],['staff-A',OA,STAFF],['owner-B',OB,OWNER_B]])\n  yes('final-'+label,await call(office,subject),office,subject);\n for(const table of ['r335_staff','r342_requests','r352_deadlines','r355_visits']){\n  const res=await fetch(HOST+'/'+table+'?select=*',{\n   headers:{authorization:'Bearer '+token(OWNER_A)},signal:AbortSignal.timeout(12000)});\n  ok('raw-table-denied-'+table,[401,403,404,405].includes(res.status));\n }\n}else throw Error('R361_UNKNOWN_STAGE_'+STAGE);\n\nconsole.log(JSON.stringify({suite:'R361_ATOMIC_SCOPED_DASHBOARD_SUMMARY_PAGE_RECONCILIATION',stage:STAGE,checks,\n signed_jwt:true,independent_pg17_raw_requests:true,independent_pg17_staff_client_graph:true,\n observed_staff_visible:visible(OA,STAFF).length,leap_year_jst:true,cadence:[1,7,30],\n atomic_summary_page:true,stable_priority_order:true,parallel_64:true,security_invoker:true,\n read_only:true,notifications_scheduled:false,notifications_sent:0,production_mutations:0,commercial_release:'HOLD'}));\nR361_R361_HTTP_MJS\nnode --check /tmp/r361_http.mjs\n"
    - name: R361 wait for actual PostgREST schema reload
      shell: bash
      run: "set -euo pipefail\nsleep 2\necho R361_POSTGREST_SCHEMA_READY\n"
    - name: R361 verify atomic summary-page totals, JST, cadence, paging, 64 parallel
      shell: bash
      run: "R361_STAGE=initial node /tmp/r361_http.mjs\n"
    - name: R361 revoke synthetic assigned staff
      shell: bash
      run: "set -euo pipefail\ncat >/tmp/r361_revoke_staff.sql <<'R361_EDIT_SQL'\n\\set ON_ERROR_STOP on\nUPDATE public.r335_staff SET is_active=false WHERE auth_user_id='00000002-0002-4002-8002-000000000002'::uuid;\nDO $g$ BEGIN IF (SELECT is_active FROM public.r335_staff WHERE auth_user_id='00000002-0002-4002-8002-000000000002'::uuid) IS DISTINCT FROM false\n THEN RAISE EXCEPTION 'R361_STAFF_REVOKE_FAILED'; END IF; END $g$;\nR361_EDIT_SQL\npgid=\"${{ job.services.pg.id }}\"\ntest -n \"$pgid\"\ndocker exec -i \"$pgid\" psql -X -U postgres -d r331_synthetic -v ON_ERROR_STOP=1 < /tmp/r361_revoke_staff.sql\n"
    - name: R361 both dashboard summary and page deny revoked staff
      shell: bash
      run: "R361_STAGE=revoked node /tmp/r361_http.mjs\n"
    - name: R361 restore synthetic staff active status
      shell: bash
      run: "set -euo pipefail\ncat >/tmp/r361_restore_staff.sql <<'R361_EDIT_SQL'\n\\set ON_ERROR_STOP on\nUPDATE public.r335_staff SET is_active=true WHERE auth_user_id='00000002-0002-4002-8002-000000000002'::uuid;\nR361_EDIT_SQL\npgid=\"${{ job.services.pg.id }}\"\ntest -n \"$pgid\"\ndocker exec -i \"$pgid\" psql -X -U postgres -d r331_synthetic -v ON_ERROR_STOP=1 < /tmp/r361_restore_staff.sql\n"
    - name: R361 restore atomic dashboard access with unchanged JWT
      shell: bash
      run: "R361_STAGE=restored node /tmp/r361_http.mjs\n"
    - name: R361 reassign synthetic client to another staff
      shell: bash
      run: "set -euo pipefail\ncat >/tmp/r361_reassign.sql <<'R361_EDIT_SQL'\n\\set ON_ERROR_STOP on\nUPDATE public.r335_clients\nSET assigned_staff_id='10000000-0000-4000-8000-000000000005'::uuid\nWHERE office_id='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa'::uuid AND id='20000000-0000-4000-8000-000000000004'::uuid;\nDO $g$ BEGIN IF (SELECT assigned_staff_id FROM public.r335_clients WHERE id='20000000-0000-4000-8000-000000000004'::uuid)\n IS DISTINCT FROM '10000000-0000-4000-8000-000000000005'::uuid\n THEN RAISE EXCEPTION 'R361_CLIENT_REASSIGN_FAILED'; END IF; END $g$;\nR361_EDIT_SQL\npgid=\"${{ job.services.pg.id }}\"\ntest -n \"$pgid\"\ndocker exec -i \"$pgid\" psql -X -U postgres -d r331_synthetic -v ON_ERROR_STOP=1 < /tmp/r361_reassign.sql\n"
    - name: R361 reconcile summary and page after live synthetic client reassignment
      shell: bash
      run: "R361_STAGE=reassigned node /tmp/r361_http.mjs\n"
    - name: R361 restore original synthetic client assignment
      shell: bash
      run: "set -euo pipefail\ncat >/tmp/r361_restore_client.sql <<'R361_EDIT_SQL'\n\\set ON_ERROR_STOP on\nUPDATE public.r335_clients SET assigned_staff_id='10000000-0000-4000-8000-000000000002'::uuid\nWHERE office_id='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa'::uuid AND id='20000000-0000-4000-8000-000000000004'::uuid;\nR361_EDIT_SQL\npgid=\"${{ job.services.pg.id }}\"\ntest -n \"$pgid\"\ndocker exec -i \"$pgid\" psql -X -U postgres -d r331_synthetic -v ON_ERROR_STOP=1 < /tmp/r361_restore_client.sql\n"
    - name: R361 pause synthetic office A only
      shell: bash
      run: "set -euo pipefail\ncat >/tmp/r361_pause_office.sql <<'R361_EDIT_SQL'\n\\set ON_ERROR_STOP on\nUPDATE public.r335_offices SET is_active=false WHERE id='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa'::uuid;\nR361_EDIT_SQL\npgid=\"${{ job.services.pg.id }}\"\ntest -n \"$pgid\"\ndocker exec -i \"$pgid\" psql -X -U postgres -d r331_synthetic -v ON_ERROR_STOP=1 < /tmp/r361_pause_office.sql\n"
    - name: R361 deny paused tenant, preserve other office dashboard
      shell: bash
      run: "R361_STAGE=office_paused node /tmp/r361_http.mjs\n"
    - name: R361 restore synthetic office A
      shell: bash
      run: "set -euo pipefail\ncat >/tmp/r361_restore_office.sql <<'R361_EDIT_SQL'\n\\set ON_ERROR_STOP on\nUPDATE public.r335_offices SET is_active=true WHERE id='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa'::uuid;\nR361_EDIT_SQL\npgid=\"${{ job.services.pg.id }}\"\ntest -n \"$pgid\"\ndocker exec -i \"$pgid\" psql -X -U postgres -d r331_synthetic -v ON_ERROR_STOP=1 < /tmp/r361_restore_office.sql\n"
    - name: R361 final signed-JWT atomic dashboard and denied base table access
      shell: bash
      run: "R361_STAGE=final node /tmp/r361_http.mjs\n"
    - name: R361 final fixture restoration and invoker ACL audit
      shell: bash
      run: "set -euo pipefail\ncat >/tmp/r361_final.sql <<'R361_R361_FINAL_SQL'\n\\set ON_ERROR_STOP on\n-- Confirm all fixtures restored, invoker wrapper and no notification side effects.\nDO $r361_final$ BEGIN\n IF (SELECT count(*) FROM public.r342_requests)<>19\n OR (SELECT count(*) FROM public.r342_audit)<>19\n OR (SELECT count(*) FROM public.r350_status_audit)<>3\n OR (SELECT count(*) FROM public.r352_deadlines)<>19\n OR (SELECT count(*) FROM public.r355_visits)<>7\n OR (SELECT count(*) FROM public.r342_requests WHERE status='completed')<>3\n OR (SELECT count(*) FROM public.r335_offices WHERE is_active)<>2\n OR (SELECT count(*) FROM public.r335_staff\n    WHERE auth_user_id='00000002-0002-4002-8002-000000000002'::uuid AND is_active)<>1\n OR (SELECT assigned_staff_id FROM public.r335_clients\n    WHERE id='20000000-0000-4000-8000-000000000004'::uuid)\n    IS DISTINCT FROM '10000000-0000-4000-8000-000000000002'::uuid\n OR (SELECT prosecdef FROM pg_proc WHERE oid=\n    'public.r361_preview_material_dashboard(uuid,timestamptz,integer,integer,integer)'::regprocedure)\n OR has_function_privilege('anon',\n    'public.r361_preview_material_dashboard(uuid,timestamptz,integer,integer,integer)','EXECUTE')\n OR NOT has_function_privilege('authenticated',\n    'public.r361_preview_material_dashboard(uuid,timestamptz,integer,integer,integer)','EXECUTE')\n OR NOT has_function_privilege('authenticated',\n    'public.r359_preview_followup_summary(uuid,timestamptz,integer)','EXECUTE')\n OR NOT has_function_privilege('authenticated',\n    'public.r360_preview_followup_queue(uuid,timestamptz,integer,integer,integer)','EXECUTE')\n OR has_table_privilege('authenticated','public.r342_requests','SELECT')\n OR has_table_privilege('authenticated','public.r352_deadlines','SELECT')\n OR has_table_privilege('authenticated','public.r355_visits','SELECT')\n THEN RAISE EXCEPTION 'R361_FINAL_SCOPE_ATOMIC_DASHBOARD_HOLD'; END IF;\n RAISE NOTICE 'R361_FINAL_REAL_PG17_PASS scoped_atomic_dashboard=true security_invoker=true restored=true sends=0';\nEND $r361_final$;\nR361_R361_FINAL_SQL\npgid=\"${{ job.services.pg.id }}\"\ntest -n \"$pgid\"\ndocker exec -i \"$pgid\" psql -X -U postgres -d r331_synthetic -v ON_ERROR_STOP=1 < /tmp/r361_final.sql\n"
    - name: R361 retain NO_GO HOLD after real PG17 atomic dashboard QA
