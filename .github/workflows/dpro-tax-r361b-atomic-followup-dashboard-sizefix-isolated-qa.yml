    - name: Prepare R333 anonymous grant hardening SQL (disposable only)
      shell: bash
      run: "set -euo pipefail\ncat > /tmp/r333_stage1.sql <<'R333_STAGE1'\n\\set ON_ERROR_STOP on\n-- ALL DATA IN THIS SUITE IS SYNTHETIC AND LOCAL TO EPHEMERAL POSTGRES 17.\n-- NEVER APPLY TO PRODUCTION SUPABASE.\n-- R331 tests end with office A intentionally disabled; restore ONLY disposable fixtures here.\nUPDATE public.taxacc_offices SET production_guard=true WHERE id='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa';\nUPDATE public.taxacc_staff SET can_manage_settings=true WHERE id='10000000-0000-4000-8000-000000000001';\nSELECT public.r330_assert('r333-baseline-taxacc-tables',(SELECT count(*) FROM pg_class c WHERE c.relnamespace='public'::regnamespace AND c.relkind='r' AND c.relname LIKE 'taxacc\\_%' ESCAPE '\\')::bigint,26);\nSELECT public.r330_assert('r333-original-anon-select-grants',(SELECT count(*) FROM pg_class c WHERE c.relnamespace='public'::regnamespace AND c.relkind='r' AND c.relname LIKE 'taxacc\\_%' ESCAPE '\\' AND has_table_privilege('anon',c.oid,'SELECT'))::bigint,21);\nSELECT public.r330_assert('r333-original-auth-select-grants',(SELECT count(*) FROM pg_class c WHERE c.relnamespace='public'::regnamespace AND c.relkind='r' AND c.relname LIKE 'taxacc\\_%' ESCAPE '\\' AND has_table_privilege('authenticated',c.oid,'SELECT'))::bigint,21);\n-- Before hardening: accidental PUBLIC permissive policy is enough to reveal synthetic clients to anon because SELECT grant already exists.\nCREATE POLICY r333_intentionally_unsafe_public_read ON public.taxacc_clients FOR SELECT TO PUBLIC USING (true);\nSET ROLE anon;\nSELECT public.r330_assert('r333-pre-hardening-public-policy-exposes-five-synthetic-clients',(SELECT count(*) FROM public.taxacc_clients)::bigint,5);\nRESET ROLE;\nDROP POLICY r333_intentionally_unsafe_public_read ON public.taxacc_clients;\n-- Defense in depth: drop anonymous SELECT table grants, not just RLS visibility.\nDO $revoke_anon$\nDECLARE t record;\nBEGIN\n FOR t IN SELECT c.relname FROM pg_class c WHERE c.relnamespace='public'::regnamespace AND c.relkind='r' AND c.relname LIKE 'taxacc\\_%' ESCAPE '\\' LOOP\n  EXECUTE format('REVOKE SELECT ON TABLE public.%I FROM anon,PUBLIC',t.relname);\n END LOOP;\nEND $revoke_anon$;\nSELECT public.r330_assert('r333-hardened-anon-no-select-any-of-26',(SELECT count(*) FROM pg_class c WHERE c.relnamespace='public'::regnamespace AND c.relkind='r' AND c.relname LIKE 'taxacc\\_%' ESCAPE '\\' AND has_table_privilege('anon',c.oid,'SELECT'))::bigint,0);\nSELECT public.r330_assert('r333-hardened-auth-still-readable-21',(SELECT count(*) FROM pg_class c WHERE c.relnamespace='public'::regnamespace AND c.relkind='r' AND c.relname LIKE 'taxacc\\_%' ESCAPE '\\' AND has_table_privilege('authenticated',c.oid,'SELECT'))::bigint,21);\n-- Even if a PUBLIC permissive policy appears again, anon has no SELECT privilege.\nCREATE POLICY r333_intentionally_unsafe_public_read ON public.taxacc_clients FOR SELECT TO PUBLIC USING (true);\nSET ROLE anon;\nDO $anon_denied$\nBEGIN\n BEGIN\n  PERFORM count(*) FROM public.taxacc_clients;\n  RAISE EXCEPTION 'R333_ANON_READ_NOT_DENIED';\n EXCEPTION WHEN insufficient_privilege THEN\n  RAISE NOTICE 'R333_PASS: anon grant removed; permissive PUBLIC policy alone cannot expose table';\n END;\nEND $anon_denied$;\nRESET ROLE;\nDROP POLICY r333_intentionally_unsafe_public_read ON public.taxacc_clients;\n-- Baseline owner must still have legitimate access after anon hardening.\nSET ROLE authenticated;\nBEGIN;\nSET LOCAL request.jwt.claim.sub='00000001-0001-4001-8001-000000000001';\nSELECT public.r330_assert('r333-hardened-owner-a-sees-three-own-clients',(SELECT count(*) FROM public.taxacc_clients)::bigint,3);\nSELECT public.r330_assert('r333-hardened-owner-a-no-other-office',(SELECT count(*) FROM public.taxacc_clients WHERE office_id='bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb')::bigint,0);\nCOMMIT;\nRESET ROLE;\nSELECT 'R333_ANON_GRANT_HARDENING_REPRODUCED_IN_DISPOSABLE_DB_ONLY' AS stage;\n\nR333_STAGE1\n"
    - name: Execute R333 anonymous grant vulnerability and correction in disposable PostgreSQL 17
      shell: bash
      run: "set -euo pipefail\npgid=\"${{ job.services.pg.id }}\"\ntest -n \"$pgid\"\ndocker exec -i \"$pgid\" psql -X -U postgres -d r331_synthetic -v ON_ERROR_STOP=1 < /tmp/r333_stage1.sql > /tmp/r333_result_1.log 2>&1 || { tail -85 /tmp/r333_result_1.log; exit 1; }\ngrep -E 'R333_(PASS|GATE|MUTATION|ANON|UNSAFE)' /tmp/r333_result_1.log | tail -32 || true\n"
    - name: Prepare R333 12 security policy mutations SQL (disposable only)
      shell: bash
      run: "set -euo pipefail\ncat > /tmp/r333_stage2.sql <<'R333_STAGE2'\n\\set ON_ERROR_STOP on\n-- QA release gate is DENY-ON-DRIFT, never a real production migration.\n-- Freeze EXACT policy SQL definitions so same-count policy edits are also detected.\nCREATE TABLE qa_private.r333_expected_policies AS\n SELECT tablename,policyname,roles::text[] AS roles,cmd,permissive,qual,with_check\n FROM pg_policies WHERE schemaname='public' AND tablename LIKE 'taxacc\\_%' ESCAPE '\\';\nREVOKE ALL ON qa_private.r333_expected_policies FROM PUBLIC,anon,authenticated;\nCREATE FUNCTION public.r333_gate() RETURNS void LANGUAGE plpgsql AS $r333_guard$\nDECLARE t record; n int; protected boolean;\nBEGIN\n SELECT count(*) INTO n FROM pg_class c WHERE c.relnamespace='public'::regnamespace AND c.relkind='r' AND c.relname LIKE 'taxacc\\_%' ESCAPE '\\';\n IF n<>26 THEN RAISE EXCEPTION 'R333_GATE_TABLE_COUNT_%',n USING ERRCODE='check_violation'; END IF;\n SELECT count(*) INTO n FROM pg_class c WHERE c.relnamespace='public'::regnamespace AND c.relkind='r' AND c.relname LIKE 'taxacc\\_%' ESCAPE '\\' AND c.relrowsecurity AND c.relforcerowsecurity;\n IF n<>26 THEN RAISE EXCEPTION 'R333_GATE_RLS_ENABLED_FORCE_%',n USING ERRCODE='check_violation'; END IF;\n SELECT count(*) INTO n FROM pg_policies WHERE schemaname='public' AND tablename LIKE 'taxacc\\_%' ESCAPE '\\' AND cmd='SELECT';\n IF n<>21 THEN RAISE EXCEPTION 'R333_GATE_READ_POLICY_COUNT_%',n USING ERRCODE='check_violation'; END IF;\n IF EXISTS (\n  SELECT 1 FROM (\n   (SELECT tablename,policyname,roles::text[] AS roles,cmd,permissive,qual,with_check FROM pg_policies\n      WHERE schemaname='public' AND tablename LIKE 'taxacc\\_%' ESCAPE '\\'\n    EXCEPT SELECT tablename,policyname,roles,cmd,permissive,qual,with_check FROM qa_private.r333_expected_policies)\n   UNION ALL\n   (SELECT tablename,policyname,roles,cmd,permissive,qual,with_check FROM qa_private.r333_expected_policies\n    EXCEPT SELECT tablename,policyname,roles::text[] AS roles,cmd,permissive,qual,with_check FROM pg_policies\n      WHERE schemaname='public' AND tablename LIKE 'taxacc\\_%' ESCAPE '\\')\n  ) policy_diff\n ) THEN RAISE EXCEPTION 'R333_GATE_POLICY_DEFINITION_DRIFT' USING ERRCODE='check_violation'; END IF;\n SELECT count(*) INTO n FROM pg_policies WHERE schemaname='public' AND tablename LIKE 'taxacc\\_%' ESCAPE '\\' AND cmd<>'SELECT';\n IF n<>0 THEN RAISE EXCEPTION 'R333_GATE_WRITE_POLICY_PRESENT_%',n USING ERRCODE='check_violation'; END IF;\n IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname IN ('anon','authenticated') AND rolbypassrls) THEN\n  RAISE EXCEPTION 'R333_GATE_BYPASSRLS_ROLE' USING ERRCODE='check_violation';\n END IF;\n IF has_schema_privilege('anon','qa_private','USAGE') THEN\n  RAISE EXCEPTION 'R333_GATE_ANON_PRIVATE_SCHEMA_USAGE' USING ERRCODE='check_violation';\n END IF;\n IF has_function_privilege('anon','qa_private.r330_client(uuid,uuid)','EXECUTE') THEN\n  RAISE EXCEPTION 'R333_GATE_ANON_HELPER_EXECUTE' USING ERRCODE='check_violation';\n END IF;\n FOR t IN SELECT c.oid,c.relname FROM pg_class c WHERE c.relnamespace='public'::regnamespace AND c.relkind='r' AND c.relname LIKE 'taxacc\\_%' ESCAPE '\\' LOOP\n  IF has_table_privilege('anon',t.oid,'SELECT') THEN\n   RAISE EXCEPTION 'R333_GATE_ANON_SELECT_%',t.relname USING ERRCODE='check_violation';\n  END IF;\n  protected := t.relname IN ('taxacc_activity_logs','taxacc_contacts','taxacc_link_tokens','taxacc_r91_review_events','taxacc_document_access_logs');\n  IF has_table_privilege('authenticated',t.oid,'SELECT')=protected THEN\n   RAISE EXCEPTION 'R333_GATE_AUTH_READ_GRANT_%',t.relname USING ERRCODE='check_violation';\n  END IF;\n  IF has_table_privilege('anon',t.oid,'INSERT') OR has_table_privilege('anon',t.oid,'UPDATE') OR has_table_privilege('anon',t.oid,'DELETE')\n  OR has_table_privilege('authenticated',t.oid,'INSERT') OR has_table_privilege('authenticated',t.oid,'UPDATE') OR has_table_privilege('authenticated',t.oid,'DELETE') THEN\n   RAISE EXCEPTION 'R333_GATE_WRITE_GRANT_%',t.relname USING ERRCODE='check_violation';\n  END IF;\n  IF protected AND EXISTS (SELECT 1 FROM pg_policies p WHERE p.schemaname='public' AND p.tablename=t.relname) THEN\n   RAISE EXCEPTION 'R333_GATE_SENSITIVE_POLICY_%',t.relname USING ERRCODE='check_violation';\n  END IF;\n END LOOP;\n RAISE NOTICE 'R333_GATE_PASS: 26 RLS+FORCE, 21 SELECT policies, 0 anon SELECT, 0 write grants, 5 protected tables';\nEND $r333_guard$;\nCREATE FUNCTION public.r333_expect_guard_to_reject(label text) RETURNS void LANGUAGE plpgsql AS $r333_expect$\nDECLARE details text;\nBEGIN\n BEGIN\n  PERFORM public.r333_gate();\n  RAISE EXCEPTION 'R333_UNDETECTED_MUTATION_%',label;\n EXCEPTION WHEN check_violation THEN\n  GET STACKED DIAGNOSTICS details = MESSAGE_TEXT;\n  IF details NOT LIKE 'R333_GATE_%' THEN RAISE EXCEPTION 'R333_UNEXPECTED_GUARD_ERROR_%',details; END IF;\n  RAISE NOTICE 'R333_MUTATION_DETECTED: % (% )',label,details;\n END;\nEND $r333_expect$;\nSELECT public.r333_gate();\n-- 1: PERMISSIVE authenticated policy broadens tenant visibility.\nCREATE POLICY r333_bad_auth ON public.taxacc_clients FOR SELECT TO authenticated USING (true);\nSELECT public.r333_expect_guard_to_reject('permissive_policy');\nSET ROLE authenticated;\nBEGIN;\nSET LOCAL request.jwt.claim.sub='00000001-0001-4001-8001-000000000001';\nSELECT public.r330_assert('r333-intentionally-unsafe-owner-sees-all-five',(SELECT count(*) FROM public.taxacc_clients)::bigint,5);\nCOMMIT;\nRESET ROLE;\nDROP POLICY r333_bad_auth ON public.taxacc_clients;\nSELECT public.r333_gate();\n-- 2: A table accidentally loses RLS enforcement.\nALTER TABLE public.taxacc_clients DISABLE ROW LEVEL SECURITY;\nSELECT public.r333_expect_guard_to_reject('rls_disabled');\nALTER TABLE public.taxacc_clients ENABLE ROW LEVEL SECURITY;\nSELECT public.r333_gate();\n-- 3: FORCE RLS drift (especially dangerous under table-owner paths).\nALTER TABLE public.taxacc_clients NO FORCE ROW LEVEL SECURITY;\nSELECT public.r333_expect_guard_to_reject('force_disabled');\nALTER TABLE public.taxacc_clients FORCE ROW LEVEL SECURITY;\nSELECT public.r333_gate();\n-- 4: Unexpected write grant.\nGRANT UPDATE ON public.taxacc_clients TO authenticated;\nSELECT public.r333_expect_guard_to_reject('write_grant');\nREVOKE UPDATE ON public.taxacc_clients FROM authenticated;\nSELECT public.r333_gate();\n-- 5: BYPASSRLS is never an ordinary session privilege.\nALTER ROLE authenticated BYPASSRLS;\nSELECT public.r333_expect_guard_to_reject('bypassrls_role');\nALTER ROLE authenticated NOBYPASSRLS;\nSELECT public.r333_gate();\n-- 6: Sensitive tables must never expose raw secrets/audit rows.\nGRANT SELECT ON public.taxacc_link_tokens TO authenticated;\nSELECT public.r333_expect_guard_to_reject('sensitive_table_grant');\nREVOKE SELECT ON public.taxacc_link_tokens FROM authenticated;\nSELECT public.r333_gate();\n-- 7: Policy on a sensitive table is detected EVEN if no table grant exists.\nCREATE POLICY r333_bad_sensitive ON public.taxacc_link_tokens FOR SELECT TO authenticated USING (true);\nSELECT public.r333_expect_guard_to_reject('sensitive_table_policy');\nDROP POLICY r333_bad_sensitive ON public.taxacc_link_tokens;\nSELECT public.r333_gate();\n-- 8: An accidentally restored anon table grant is detected.\nGRANT SELECT ON public.taxacc_clients TO anon;\nSELECT public.r333_expect_guard_to_reject('anon_select_grant');\nREVOKE SELECT ON public.taxacc_clients FROM anon;\nSELECT public.r333_gate();\n-- 9: Private helper/schema privileges must not extend to anon.\nGRANT USAGE ON SCHEMA qa_private TO anon;\nSELECT public.r333_expect_guard_to_reject('private_schema_usage');\nREVOKE USAGE ON SCHEMA qa_private FROM anon;\nSELECT public.r333_gate();\n-- 10: A missing legitimate authenticated grant should be caught (availability security).\nREVOKE SELECT ON public.taxacc_clients FROM authenticated;\nSELECT public.r333_expect_guard_to_reject('legitimate_client_grant_missing');\nGRANT SELECT ON public.taxacc_clients TO authenticated;\nSELECT public.r333_gate();\n-- 11: The definer helper must not be callable by anon.\nGRANT EXECUTE ON FUNCTION qa_private.r330_client(uuid,uuid) TO anon;\nSELECT public.r333_expect_guard_to_reject('anon_definer_execute');\nREVOKE EXECUTE ON FUNCTION qa_private.r330_client(uuid,uuid) FROM anon;\nSELECT public.r333_gate();\n-- 12: A stealth UPDATE to an existing policy is caught even if the policy count remains 21.\nALTER POLICY r330_clients_read ON public.taxacc_clients USING (true);\nSELECT public.r333_expect_guard_to_reject('same_count_policy_rewrite');\nSET ROLE authenticated;\nBEGIN;\nSET LOCAL request.jwt.claim.sub='00000001-0001-4001-8001-000000000001';\nSELECT public.r330_assert('r333-mutated-policy-exposes-all-five',(SELECT count(*) FROM public.taxacc_clients)::bigint,5);\nCOMMIT;\nRESET ROLE;\nALTER POLICY r330_clients_read ON public.taxacc_clients USING (qa_private.r330_client(office_id,id));\nSELECT public.r333_gate();\n-- Final: baseline user still has tenant-limited reads, no anon privileges, no persistent policy changes.\nSET ROLE authenticated;\nBEGIN;\nSET LOCAL request.jwt.claim.sub='00000001-0001-4001-8001-000000000001';\nSELECT public.r330_assert('r333-final-owner-valid-clients',(SELECT count(*) FROM public.taxacc_clients)::bigint,3);\nSELECT public.r330_assert('r333-final-owner-cannot-see-other-tenant',(SELECT count(*) FROM public.taxacc_clients WHERE office_id='bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb')::bigint,0);\nCOMMIT;\nRESET ROLE;\nSELECT public.r333_gate();\nSELECT 'R333_MUTATION_GUARD_12_SECURITY_DRIFTS_CAUGHT__RELEASE_HOLD' AS result;\n\nR333_STAGE2\n"
