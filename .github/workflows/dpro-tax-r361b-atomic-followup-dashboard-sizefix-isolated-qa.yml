    - name: R356 create read-only visit/materials composite RPC and verify privileges
      shell: bash
      run: "set -euo pipefail\ncat >/tmp/r356_schema.sql <<'R356_R356_SCHEMA_SQL'\n\\set ON_ERROR_STOP on\n-- R356 test-only: combines visit timing with required-material deadline counts.\n-- Applies ONLY to disposable PostgreSQL 17 in the GitHub Actions QA service.\nDO $baseline$ BEGIN\n IF (SELECT count(*) FROM public.r355_visits)<>7\n OR (SELECT count(*) FROM public.r342_requests)<>19\n OR (SELECT count(*) FROM public.r342_audit)<>19\n OR (SELECT count(*) FROM public.r350_status_audit)<>3\n OR (SELECT count(*) FROM public.r342_requests WHERE status='completed')<>3\n OR (SELECT count(*) FROM public.r352_deadlines)<>19\n THEN RAISE EXCEPTION 'R356_R355_BASELINE_DRIFT_HOLD'; END IF;\nEND $baseline$;\n\n-- Demonstration-only function: r342_executor has NOLOGIN/NOBYPASSRLS,\n-- all base tables retain FORCE RLS, and the function checks DB membership\n-- plus assignment inside its body. Never install as a real Supabase migration.\nCREATE FUNCTION public.r356_preview_visit_materials(\n p_office uuid,p_visit uuid,p_as_of timestamptz)\nRETURNS jsonb LANGUAGE plpgsql STABLE SECURITY DEFINER SET search_path=pg_catalog\nAS $r356_rpc$\nDECLARE\n v_claims jsonb;v_sub text;v_actor uuid;v_staff uuid;v_broad boolean;\n v_client uuid;v_visit_at timestamptz;v_status text;\n v_visit_day date;v_today date;v_phase text;\n v_total bigint;v_pending bigint;v_completed bigint;v_due_by_visit bigint;v_overdue bigint;\nBEGIN\n v_claims:=nullif(current_setting('request.jwt.claims',true),'')::jsonb;\n v_sub:=v_claims->>'sub';\n IF (v_claims->>'role') IS DISTINCT FROM 'authenticated'\n OR v_sub IS NULL\n OR v_sub !~* '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'\n OR p_office IS NULL OR p_visit IS NULL\n THEN RAISE EXCEPTION 'R356_ACCESS_DENIED' USING ERRCODE='42501'; END IF;\n IF p_as_of IS NULL OR NOT isfinite(p_as_of)\n THEN RAISE EXCEPTION 'R356_INVALID_AS_OF' USING ERRCODE='22023'; END IF;\n v_actor:=v_sub::uuid;\n SELECT s.id,(s.role IN ('owner','admin') OR s.can_view_all_clients)\n INTO v_staff,v_broad\n FROM public.r335_staff s JOIN public.r335_offices o ON o.id=s.office_id\n WHERE s.office_id=p_office AND s.auth_user_id=v_actor AND s.is_active AND o.is_active\n LIMIT 1;\n IF v_staff IS NULL THEN RAISE EXCEPTION 'R356_ACCESS_DENIED' USING ERRCODE='42501'; END IF;\n SELECT v.client_id,v.visit_at,v.visit_status INTO v_client,v_visit_at,v_status\n FROM public.r355_visits v\n JOIN public.r335_clients c ON c.office_id=v.office_id AND c.id=v.client_id\n WHERE v.office_id=p_office AND v.id=p_visit\n AND (v_broad OR c.assigned_staff_id=v_staff)\n LIMIT 1;\n IF NOT FOUND THEN RAISE EXCEPTION 'R356_ACCESS_DENIED' USING ERRCODE='42501'; END IF;\n\n v_today:=(p_as_of AT TIME ZONE 'Asia/Tokyo')::date;\n v_visit_day:=(v_visit_at AT TIME ZONE 'Asia/Tokyo')::date;\n IF v_status='cancelled' THEN v_phase:='cancelled';\n ELSIF v_status='completed' THEN v_phase:='completed';\n ELSIF v_visit_day<v_today THEN v_phase:='passed';\n ELSIF v_visit_day=v_today THEN v_phase:='today';\n ELSIF v_visit_day=v_today+1 THEN v_phase:='day_before';\n ELSE v_phase:='future'; END IF;\n\n SELECT count(*),\n count(*) FILTER(WHERE r.status='requested'),\n count(*) FILTER(WHERE r.status='completed'),\n count(*) FILTER(WHERE r.status='requested'\n  AND (d.due_at AT TIME ZONE 'Asia/Tokyo')::date<=v_visit_day),\n count(*) FILTER(WHERE r.status='requested'\n  AND (d.due_at AT TIME ZONE 'Asia/Tokyo')::date<v_today)\n INTO v_total,v_pending,v_completed,v_due_by_visit,v_overdue\n FROM public.r342_requests r\n JOIN public.r352_deadlines d ON d.office_id=r.office_id AND d.request_id=r.id\n WHERE r.office_id=p_office AND r.client_id=v_client;\n\n IF v_total<>v_pending+v_completed\n OR v_due_by_visit>v_pending OR v_overdue>v_pending\n THEN RAISE EXCEPTION 'R356_INVALID_MATERIAL_GROUPING' USING ERRCODE='22023'; END IF;\n RETURN pg_catalog.jsonb_build_object(\n  'visit_day',v_visit_day::text,\n  'phase',v_phase,\n  'visit_reminder_eligible',v_phase='day_before',\n  'material_followup_eligible',v_phase='day_before' AND v_due_by_visit>0,\n  'total_materials',v_total,\n  'pending_materials',v_pending,\n  'completed_materials',v_completed,\n  'due_by_visit',v_due_by_visit,\n  'overdue_as_of',v_overdue,\n  'preview_only',true,\n  'notification_scheduled',false);\nEND;\n$r356_rpc$;\n\nALTER FUNCTION public.r356_preview_visit_materials(uuid,uuid,timestamptz)\n OWNER TO r342_executor;\nREVOKE ALL ON FUNCTION public.r356_preview_visit_materials(uuid,uuid,timestamptz)\n FROM PUBLIC,anon;\nGRANT EXECUTE ON FUNCTION public.r356_preview_visit_materials(uuid,uuid,timestamptz)\n TO authenticated;\nNOTIFY pgrst,'reload schema';\n\nDO $guard$ BEGIN\n IF (SELECT count(*) FROM pg_class WHERE oid IN (\n  'public.r342_requests'::regclass,'public.r352_deadlines'::regclass,\n  'public.r355_visits'::regclass) AND relrowsecurity AND relforcerowsecurity)<>3\n OR has_table_privilege('authenticated','public.r355_visits','SELECT')\n OR has_table_privilege('authenticated','public.r342_requests','SELECT')\n OR has_table_privilege('authenticated','public.r352_deadlines','SELECT')\n OR has_function_privilege('anon','public.r356_preview_visit_materials(uuid,uuid,timestamptz)','EXECUTE')\n OR NOT has_function_privilege('authenticated','public.r356_preview_visit_materials(uuid,uuid,timestamptz)','EXECUTE')\n OR (SELECT rolname FROM pg_roles WHERE oid=(SELECT proowner FROM pg_proc WHERE\n  oid='public.r356_preview_visit_materials(uuid,uuid,timestamptz)'::regprocedure))<>'r342_executor'\n OR (SELECT rolcanlogin OR rolbypassrls FROM pg_roles WHERE rolname='r342_executor') IS DISTINCT FROM false\n THEN RAISE EXCEPTION 'R356_MATERIAL_PREVIEW_ACL_HOLD'; END IF;\n RAISE NOTICE 'R356_SYNTHETIC_VISIT_MATERIAL_COMPOSITE_READY visits=7 requests=19 sends=0';\nEND $guard$;\nR356_R356_SCHEMA_SQL\npgid=\"${{ job.services.pg.id }}\"\ntest -n \"$pgid\"\ndocker exec -i \"$pgid\" psql -X -U postgres -d r331_synthetic -v ON_ERROR_STOP=1 < /tmp/r356_schema.sql\n"
    - name: R356 independently snapshot visits and material deadlines from ephemeral PG17
      shell: bash
      run: "set -euo pipefail\ncat >/tmp/r356_oracle.sql <<'R356_R356_ORACLE_SQL'\n\\set ON_ERROR_STOP on\n-- PostgreSQL17 superuser-derived oracle, internal to disposable runner only.\n-- Neither raw visit IDs nor request IDs are returned to the external HTTP caller.\nSELECT pg_catalog.jsonb_build_object(\n 'visits',(\n  SELECT COALESCE(pg_catalog.jsonb_agg(pg_catalog.jsonb_build_object(\n   'id',v.id,'office_id',v.office_id,'client_id',v.client_id,\n   'visit_at',v.visit_at,'status',v.visit_status)\n   ORDER BY v.id),'[]'::jsonb)\n  FROM public.r355_visits v),\n 'requests',(\n  SELECT COALESCE(pg_catalog.jsonb_agg(pg_catalog.jsonb_build_object(\n   'id',r.id,'office_id',r.office_id,'client_id',r.client_id,\n   'due_at',d.due_at,'status',r.status)\n   ORDER BY r.office_id,r.id),'[]'::jsonb)\n  FROM public.r342_requests r JOIN public.r352_deadlines d\n  ON d.office_id=r.office_id AND d.request_id=r.id)\n)::text;\nR356_R356_ORACLE_SQL\npgid=\"${{ job.services.pg.id }}\"\ntest -n \"$pgid\"\ndocker exec -i \"$pgid\" psql -X -At -U postgres -d r331_synthetic -v ON_ERROR_STOP=1 < /tmp/r356_oracle.sql > /tmp/r356_oracle.json\nnode -e 'const x=JSON.parse(require(\"fs\").readFileSync(\"/tmp/r356_oracle.json\")); if(x.visits.length!==7||x.requests.length!==19) process.exit(1); console.log(\"R356_INDEPENDENT_PG17_ORACLE_READY visits=\"+x.visits.length+\" requests=\"+x.requests.length)'\n"
    - name: R356B install valid direct table POST and strict SQLSTATE privilege denial tests
      shell: bash
      run: "set -euo pipefail\ncat >/tmp/r356_http.mjs <<'R356_R356_HTTP_MJS'\nimport assert from 'node:assert/strict';\nimport {readFileSync} from 'node:fs';\nimport {createHmac} from 'node:crypto';\n\nconst STAGE=process.env.R356_STAGE??'initial';\nconst HOST='http://127.0.0.1:3000';\nconst SECRET='R335_SYNTHETIC_JWT_SIGNING_KEY_NOT_REAL_1234567890';\nconst oracle=JSON.parse(readFileSync(process.env.R356_ORACLE_PATH??'/tmp/r356_oracle.json','utf8'));\nconst OA='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa';\nconst OB='bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb';\nconst STAFF='00000002-0002-4002-8002-000000000002';\nconst OWNER_A='00000005-0005-4005-8005-000000000005';\nconst OWNER_B='00000003-0003-4003-8003-000000000003';\nconst CLIENT_ASSIGNED='20000000-0000-4000-8000-000000000004';\nconst CLIENT_ALSO_ASSIGNED='20000000-0000-4000-8000-000000000001';\nconst CLIENT_OWNER_ONLY='20000000-0000-4000-8000-000000000002';\nconst A='2028-02-29T03:00:00Z';\nconst END_OF_FEB='2028-02-29T14:59:59Z';\nconst START_OF_MAR='2028-02-29T15:00:00Z';\nconst DAY_BEFORE_LEAP='2028-02-28T14:59:59Z';\nconst [nextVisit,todayVisit,ownerOnly,otherOffice,cancelled,completed,futureVisit]=oracle.visits;\nconst enc=o=>Buffer.from(JSON.stringify(o)).toString('base64url');\nfunction jwt(sub,extra={}){\n const h=enc({alg:'HS256',typ:'JWT'}),p=enc({sub,role:'authenticated',exp:4102444800,...extra});\n return h+'.'+p+'.'+createHmac('sha256',SECRET).update(h+'.'+p).digest('base64url');\n}\nfunction jstDay(v){\n const parts=new Intl.DateTimeFormat('en-US',{\n  timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'\n }).formatToParts(new Date(v));\n const byType=Object.fromEntries(parts.filter(x=>['year','month','day'].includes(x.type)).map(x=>[x.type,x.value]));\n return `${byType.year}-${byType.month}-${byType.day}`;\n}\nfunction tomorrow(day){\n const d=new Date(day+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+1);\n return d.toISOString().slice(0,10);\n}\nfunction expected(visit,asOf=A){\n const today=jstDay(asOf),vday=jstDay(visit.visit_at);\n let phase;\n if(visit.status==='cancelled')phase='cancelled';\n else if(visit.status==='completed')phase='completed';\n else if(vday<today)phase='passed';\n else if(vday===today)phase='today';\n else if(vday===tomorrow(today))phase='day_before';\n else phase='future';\n const material=oracle.requests.filter(r=>r.office_id===visit.office_id&&r.client_id===visit.client_id);\n const pending=material.filter(r=>r.status==='requested');\n const completedMaterials=material.filter(r=>r.status==='completed');\n assert.equal(material.length,pending.length+completedMaterials.length,'independent-oracle-status-group');\n const dueByVisit=pending.filter(r=>jstDay(r.due_at)<=vday).length;\n const overdue=pending.filter(r=>jstDay(r.due_at)<today).length;\n return {visit_day:vday,phase,\n  visit_reminder_eligible:phase==='day_before',\n  material_followup_eligible:phase==='day_before'&&dueByVisit>0,\n  total_materials:material.length,pending_materials:pending.length,\n  completed_materials:completedMaterials.length,due_by_visit:dueByVisit,\n  overdue_as_of:overdue,preview_only:true,notification_scheduled:false};\n}\nconst keys=['completed_materials','due_by_visit','material_followup_eligible',\n 'notification_scheduled','overdue_as_of','pending_materials','phase',\n 'preview_only','total_materials','visit_day','visit_reminder_eligible'];\nlet checks=0;\nfunction eq(n,a,b){assert.deepEqual(a,b,n);checks++}\nfunction ok(n,v){assert.ok(v,n);checks++}\nasync function call(v,sub=STAFF,office=v.office_id,asOf=A,token=jwt(sub)){\n const r=await fetch(HOST+'/rpc/r356_preview_visit_materials',{\n  method:'POST',headers:{'content-type':'application/json',accept:'application/json',\n   ...(token?{authorization:'Bearer '+token}:{})},\n  body:JSON.stringify({p_office:office,p_visit:v.id,p_as_of:asOf}),\n  signal:AbortSignal.timeout(16000)});\n const raw=await r.text();let body;\n try{body=raw?JSON.parse(raw):null}catch{throw Error('R356_BAD_JSON_'+r.status+'_'+raw.slice(0,180))}\n return {code:r.status,body};\n}\nfunction yes(name,r,visit,asOf=A){\n eq(name+'-status',r.code,200);\n eq(name+'-keys',Object.keys(r.body).sort(),keys);\n const exp=expected(visit,asOf);\n for(const k of keys)eq(name+'-'+k,r.body[k],exp[k]);\n const raw=JSON.stringify(r.body);\n ok(name+'-no-client-office-visit-id',!raw.includes(visit.client_id)&&\n  !raw.includes(visit.office_id)&&!raw.includes(visit.id));\n ok(name+'-no-request-id',!oracle.requests.some(x=>raw.includes(x.id)));\n}\nfunction deny(name,r){\n eq(name+'-403',r.code,403);\n eq(name+'-code',r.body?.code,'42501');\n eq(name+'-generic-message',r.body?.message,'R356_ACCESS_DENIED');\n ok(name+'-no-materials',r.body?.total_materials===undefined);\n}\n\neq('seven-unique-visits',new Set(oracle.visits.map(x=>x.id)).size,7);\neq('nineteen-independent-request-deadlines',oracle.requests.length,19);\neq('first-staff-assigned-client',nextVisit.client_id,CLIENT_ASSIGNED);\neq('second-staff-assigned-client',todayVisit.client_id,CLIENT_ALSO_ASSIGNED);\neq('third-office-owner-client',ownerOnly.client_id,CLIENT_OWNER_ONLY);\neq('fourth-foreign-tenant',otherOffice.office_id,OB);\neq('cancelled-fixture',cancelled.status,'cancelled');\neq('completed-fixture',completed.status,'completed');\neq('future-fixture-status',futureVisit.status,'scheduled');\nif(STAGE==='initial'){\n for(const [i,v] of oracle.visits.entries()){\n  const sub=v.office_id===OB?OWNER_B:v.client_id===CLIENT_OWNER_ONLY?OWNER_A:STAFF;\n  yes('visit-'+i,await call(v,sub),v);\n  yes('jst-midnight-'+i,await call(v,sub,v.office_id,START_OF_MAR),v,START_OF_MAR);\n }\n yes('before-midnight-last-second',await call(nextVisit,STAFF,OA,END_OF_FEB),nextVisit,END_OF_FEB);\n yes('before-leap-day',await call(todayVisit,STAFF,OA,DAY_BEFORE_LEAP),todayVisit,DAY_BEFORE_LEAP);\n yes('owner-broad',await call(nextVisit,OWNER_A),nextVisit);\n for(let i=0;i<12;i++){\n  deny('owner-client-staff-deny-'+i,await call(ownerOnly,STAFF));\n  deny('tenant-other-office-'+i,await call(otherOffice,STAFF,OB));\n  deny('tenant-owner-other-office-'+i,await call(nextVisit,OWNER_B,OA));\n }\n deny('spoof-owner-in-jwt-claims',await call(ownerOnly,STAFF,OA,A,\n  jwt(STAFF,{is_admin:true,can_view_all_clients:true,office_id:OA})));\n deny('absent-staff',await call(nextVisit,'00000000-0000-4000-8000-000000000009'));\n deny('malformed-sub',await call(nextVisit,'not-a-uuid'));\n deny('absent-visit',await call({...nextVisit,id:'35500000-0000-4000-8000-000000000099'}));\n deny('unknown-office',await call(nextVisit,STAFF,'00000000-0000-4000-8000-000000000000'));\n const anon=await call(nextVisit,STAFF,OA,A,null);\n ok('anonymous-closed',[401,403,404].includes(anon.code));\n const wrongRole=await call(nextVisit,STAFF,OA,A,jwt(STAFF,{role:'anon'}));\n ok('wrong-role-closed',[401,403,404].includes(wrongRole.code));\n const invalidTime=await call(nextVisit,STAFF,OA,null);\n eq('null-asof-rejected',invalidTime.code,400);\n eq('null-asof-generic',invalidTime.body?.message,'R356_INVALID_AS_OF');\n eq('infinite-asof-rejected',(await call(nextVisit,STAFF,OA,'infinity')).code,400);\n eq('impossible-date-rejected',(await call(nextVisit,STAFF,OA,'2028-02-30T12:00:00Z')).code,400);\n const parallel=await Promise.all(Array.from({length:64},(_,i)=>\n  i%2===0?call(nextVisit):call(otherOffice,OWNER_B)));\n parallel.forEach((r,i)=>yes('parallel-'+i,r,i%2===0?nextVisit:otherOffice));\n eq('parallel-a-stable',new Set(parallel.filter((_,i)=>i%2===0).map(x=>JSON.stringify(x.body))).size,1);\n eq('parallel-b-stable',new Set(parallel.filter((_,i)=>i%2===1).map(x=>JSON.stringify(x.body))).size,1);\n}else if(STAGE==='revoked'){\n for(let i=0;i<14;i++)deny('revoked-staff-'+i,await call(nextVisit));\n for(let i=0;i<7;i++)yes('active-owner-'+i,await call(nextVisit,OWNER_A),nextVisit);\n}else if(STAGE==='restored'){\n for(let i=0;i<14;i++)yes('restored-staff-'+i,await call(nextVisit),nextVisit);\n}else if(STAGE==='reassigned'){\n for(let i=0;i<14;i++)deny('transferred-client-old-assignee-'+i,await call(nextVisit));\n for(let i=0;i<7;i++)yes('other-client-remains-'+i,await call(todayVisit),todayVisit);\n for(let i=0;i<7;i++)yes('owner-remains-'+i,await call(nextVisit,OWNER_A),nextVisit);\n}else if(STAGE==='office_paused'){\n for(let i=0;i<14;i++)deny('paused-staff-'+i,await call(nextVisit));\n for(let i=0;i<7;i++)deny('paused-owner-'+i,await call(nextVisit,OWNER_A));\n for(let i=0;i<7;i++)yes('other-tenant-active-'+i,await call(otherOffice,OWNER_B),otherOffice);\n}else if(STAGE==='final'){\n for(const [i,v] of oracle.visits.entries()){\n  const sub=v.office_id===OB?OWNER_B:v.client_id===CLIENT_OWNER_ONLY?OWNER_A:STAFF;\n  yes('final-'+i,await call(v,sub),v);\n }\n // All three payloads use real table columns and satisfy table-level shape\n // constraints.  A 400 schema/column error is NEVER evidence of ACL denial.\n const forbiddenDirectTables=[\n  {name:'r355_visits',insert:{office_id:OA,id:'35500000-0000-4000-8000-000000000099',\n   client_id:CLIENT_ASSIGNED,visit_at:'2028-03-06T00:00:00Z',visit_status:'scheduled'}},\n  {name:'r342_requests',insert:{id:'34200000-0000-4000-8000-000000000099',\n   office_id:OA,client_id:CLIENT_ASSIGNED,actor_auth_id:OWNER_A,\n   request_key:'r356b_direct_write_denied'}},\n  {name:'r352_deadlines',insert:{office_id:OA,\n   request_id:oracle.requests.find(x=>x.office_id===OA)?.id,\n   due_at:'2028-03-06T00:00:00Z'}}\n ];\n for(const {name,insert} of forbiddenDirectTables){\n  ok('raw-table-'+name+'-valid-insert-payload',Object.values(insert).every(x=>x!==undefined));\n  const read=await fetch(HOST+'/'+name+'?select=*',{\n   headers:{authorization:'Bearer '+jwt(OWNER_A)},signal:AbortSignal.timeout(12000)});\n  ok('raw-table-'+name+'-GET-denied',[401,403,404,405].includes(read.status));\n  const write=await fetch(HOST+'/'+name,{\n   method:'POST',headers:{authorization:'Bearer '+jwt(OWNER_A),\n    'content-type':'application/json'},body:JSON.stringify(insert),\n   signal:AbortSignal.timeout(12000)});\n  const responseText=await write.text();\n  let error=null;\n  try{error=JSON.parse(responseText)}catch{}\n  eq('raw-table-'+name+'-POST-privilege-403 status='+write.status+\n   ' response='+responseText.slice(0,160),write.status,403);\n  eq('raw-table-'+name+'-POST-sqlstate-42501',error?.code,'42501');\n }\n}else throw Error('R356_UNKNOWN_STAGE_'+STAGE);\nconsole.log(JSON.stringify({suite:'R356_VISIT_MATERIAL_DEADLINE_PREVIEW',stage:STAGE,checks,\n independent_pg17_oracle:true,signed_jwt:true,tenant_scope:true,assignment_scope:true,\n visit_timing:'Asia/Tokyo',notifications_sent:0,notification_scheduled:false,\n commercial_release:'HOLD'}));\nR356_R356_HTTP_MJS\nnode --check /tmp/r356_http.mjs\n"
