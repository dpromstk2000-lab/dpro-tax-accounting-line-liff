name: DPRO TAX R363 Staff Followup UI Readonly Contract QA
'on':
  push:
    branches:
    - dpro-tax-r308-auth-tenant-integration-qa-20261020
    paths:
    - .github/workflows/dpro-tax-r363-japanese-staff-ui-contract-isolated-qa.yml
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  staff-followup-ui-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
    - name: Checkout isolated QA branch only
      uses: actions/checkout@v4
    - name: R363 pin exact formal R362 PG17 source, do not modify it
      shell: bash
      run: 'set -euo pipefail

        test "$(git hash-object .github/workflows/dpro-tax-r362-japanese-followup-cards-isolated-qa.yml)" = ''be57ed19449d1dd91936dd0535d51427daad966d''

        echo R363_R362_FORMAL_PIN_PASS approved_pg17_backend=true'
    - name: R363 materialize checked immutable UI, demo and tests
      shell: bash
      run: 'set -euo pipefail

        python3 - <<''PY''

        from pathlib import Path

        from base64 import b64decode

        from hashlib import sha256

        p=Path(''r363_staff_cards.js'')

        p.write_bytes(b64decode(''''))

        assert sha256(p.read_bytes()).hexdigest()==''ac05a9fab4f23fd058fda4a13f5a83e4d42b249bb4a2c90ac41f6d471f5ca390'', ''R363_SOURCE_DRIFT_HOLD''

        p=Path(''r363_staff_cards_preview.html'')

        p.write_bytes(b64decode(''''))

        assert sha256(p.read_bytes()).hexdigest()==''1138764dafb9a2d8f1bba8a599bf96f3d6d488988ec872f304a506e45993dba3'', ''R363_SOURCE_DRIFT_HOLD''

        p=Path(''r363_dom_contract_test.cjs'')

        p.write_bytes(b64decode(''''))

        assert sha256(p.read_bytes()).hexdigest()==''ac0b71a797fa34d303bdc150e601aa821b18d7e77c465e028c3117fea4a05198'', ''R363_SOURCE_DRIFT_HOLD''

        print(''R363_SOURCE_INTEGRITY_PASS files=3'')

        PY'
    - name: R363 exercise 420 UI security, accessibility, mock cases
      shell: bash
      run: 'set -euo pipefail

        node --check r363_staff_cards.js

        node --check r363_dom_contract_test.cjs

        node r363_dom_contract_test.cjs'
    - name: R363 isolate UI from production, keep NO_GO and HOLD
      shell: bash
      run: 'set -euo pipefail

        test -f r363_staff_cards_preview.html

        test -f r363_staff_cards.js

        test -f r363_dom_contract_test.cjs

        echo R363_UI_ONLY_QA_EVIDENCE github_pg17=R362_FORMAL_PASS synthetic_ui=true production_mutations=0 notifications=0 commercial_release=HOLD'
