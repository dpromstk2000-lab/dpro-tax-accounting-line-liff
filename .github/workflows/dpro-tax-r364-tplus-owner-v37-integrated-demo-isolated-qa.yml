name: DPRO TAX R364 V3.7 Isolated Owner Demo Integration QA
'on':
  push:
    branches:
    - dpro-tax-r308-auth-tenant-integration-qa-20261020
    paths:
    - .github/workflows/dpro-tax-r364-tplus-owner-v37-integrated-demo-isolated-qa.yml
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  owner-v37-isolated-demo-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout isolated QA branch only
      uses: actions/checkout@v4
    - name: Pin R363 formally passed UI and V3.6 exact owner baseline
      shell: bash
      run: 'set -euo pipefail

        test "$(git hash-object .github/workflows/dpro-tax-r363-japanese-staff-ui-contract-isolated-qa.yml)" = "59767dce2a635e07cab00fbc296dc6c81a85c163"

        test "$(git hash-object tplus-owner-dashboard-v36/index.html)" = "d6260fc5160939b9fe4f9fb8ce899e17d981c17c"

        cp tplus-owner-dashboard-v36/index.html r364_v36_formal_source.html

        echo R364_FORMAL_INPUT_PINS_PASS r363=FORMAL_PASS v36=EXACT_GIT_BLOB

        '
    - name: Restore checked integration builder and test fixtures
      shell: bash
      run: 'set -euo pipefail

        python3 - <<''PY''

        from pathlib import Path

        from base64 import b64decode

        from hashlib import sha256

        p=Path(''r363_staff_cards.js'')

        p.write_bytes(b64decode(''''))

        assert sha256(p.read_bytes()).hexdigest()==''ac05a9fab4f23fd058fda4a13f5a83e4d42b249bb4a2c90ac41f6d471f5ca390'', ''R364_SOURCE_PIN_HOLD''

        p=Path(''r363_staff_cards_preview.html'')

        p.write_bytes(b64decode(''''))

        assert sha256(p.read_bytes()).hexdigest()==''1138764dafb9a2d8f1bba8a599bf96f3d6d488988ec872f304a506e45993dba3'', ''R364_SOURCE_PIN_HOLD''

        p=Path(''r363_dom_contract_test.cjs'')

        p.write_bytes(b64decode(''''))

        assert sha256(p.read_bytes()).hexdigest()==''ac0b71a797fa34d303bdc150e601aa821b18d7e77c465e028c3117fea4a05198'', ''R364_SOURCE_PIN_HOLD''

        p=Path(''build_r364_dashboard.py'')

        p.write_bytes(b64decode(''''))

        assert sha256(p.read_bytes()).hexdigest()==''6159c62d6da98b9b44ac2db8e3196274e6f8acf05e513c143697d7cf1560df90'', ''R364_SOURCE_PIN_HOLD''

        p=Path(''r364_integration_regression_test.py'')

        p.write_bytes(b64decode(''''))

        assert sha256(p.read_bytes()).hexdigest()==''4406e867bf7361d7e513d9835c9da71258d5557551a3c4008519c697a1129683'', ''R364_SOURCE_PIN_HOLD''

        p=Path(''r364_mock_adapter_contract_test.cjs'')

        p.write_bytes(b64decode(''''))

        assert sha256(p.read_bytes()).hexdigest()==''b7e7d8059310976580ce1499d3d804ad0bbf31c3b259a4368de0341d177ebe44'', ''R364_SOURCE_PIN_HOLD''

        print(''R364_SOURCE_INTEGRITY_PASS files=6'')

        PY'
    - name: Build isolated owner V3.7 dashboard from unchanged V3.6
      shell: bash
      run: 'set -euo pipefail

        python3 build_r364_dashboard.py

        test "$(sha256sum r364_tplus_owner_v37_integrated_preview.html | cut -d'' '' -f1)" = ''8830d67e922c773ea01b69445314c716b8d2457a0509de78aa7a601aa92e4f97''

        echo R364_INTEGRATED_HTML_HASH_PASS synthetic=true no_publish=true'
    - name: Run 50 integration, 37 adapter and 420 inherited security checks
      shell: bash
      run: 'set -euo pipefail

        python3 r364_integration_regression_test.py

        node r364_mock_adapter_contract_test.cjs

        node r363_dom_contract_test.cjs'
    - name: Attach standalone HTML as isolated preview artifact
      uses: actions/upload-artifact@v4
      with:
        name: DPRO_TAX_R364_TPLUS_OWNER_V37_ISOLATED_PREVIEW
        path: r364_tplus_owner_v37_integrated_preview.html
        if-no-files-found: error
        retention-days: 7
        compression-level: 9
    - name: Report isolated pass; keep production and commercial HOLD
      shell: bash
      run: 'set -euo pipefail

        test -f r364_tplus_owner_v37_integrated_preview.html

        echo R364_ISOLATED_DEMO_QA_EVIDENCE v36_restored_exact=true inherited_ui=R363_FORMAL_PASS inherited_pg17=R362_FORMAL_PASS production_mutations=0 notifications_sent=0 public_deploy=0 commercial_release=HOLD'
