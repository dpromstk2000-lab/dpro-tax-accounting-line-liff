name: DPRO TAX R365B JST CI Timeout Fix Isolated Owner Demo QA
'on':
  push:
    branches:
    - dpro-tax-r308-auth-tenant-integration-qa-20261020
    paths:
    - .github/workflows/dpro-tax-r365b-evergreen-jst-ci-timeout-fix-isolated-qa.yml
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  owner-evergreen-jst-ci-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout isolated branch only
      uses: actions/checkout@v4
    - name: Pin R364 formal pass, failed R365, immutable V3.6
      shell: bash
      run: 'set -euo pipefail

        test "$(git hash-object .github/workflows/dpro-tax-r364-tplus-owner-v37-integrated-demo-isolated-qa.yml)" = "033866608177892df84d853408a7238e9272ae7c"

        test "$(git hash-object .github/workflows/dpro-tax-r365-evergreen-jst-owner-demo-isolated-qa.yml)" = "9310e515423b15f1b194cb5add7273653b75d922"

        test "$(git hash-object tplus-owner-dashboard-v36/index.html)" = "d6260fc5160939b9fe4f9fb8ce899e17d981c17c"

        echo R365B_BASELINE_PIN_PASS r364=FORMAL_PASS r365=FAILED_CI_TIMEOUT v36_unchanged=true'
    - name: Restore exact R365 preview and corrected boundary test
      shell: bash
      run: 'set -euo pipefail

        python3 - <<''PY''

        from pathlib import Path

        from base64 import b64decode

        from hashlib import sha256

        p=Path(''r364_tplus_owner_v37_integrated_preview.html'')

        p.write_bytes(b64decode(''''))

        assert sha256(p.read_bytes()).hexdigest()==''8830d67e922c773ea01b69445314c716b8d2457a0509de78aa7a601aa92e4f97''

        p=Path(''r363_staff_cards.js'')

        p.write_bytes(b64decode(''''))

        assert sha256(p.read_bytes()).hexdigest()==''ac05a9fab4f23fd058fda4a13f5a83e4d42b249bb4a2c90ac41f6d471f5ca390''

        p=Path(''r365_mock_adapter.js'')

        p.write_bytes(b64decode(''''))

        assert sha256(p.read_bytes()).hexdigest()==''1bb53587b2e2b10c5a2241ae2b67e1b7ca7d9bbd2f3b2055aba7f502bb1c5eea''

        p=Path(''build_r365_dynamic_demo.py'')

        p.write_bytes(b64decode(''''))

        assert sha256(p.read_bytes()).hexdigest()==''e64e424c54aebbe6ac3aef0078fff6ed512b73bfcc16439e4f72162add2e6726''

        p=Path(''r365_generation_test.py'')

        p.write_bytes(b64decode(''''))

        assert sha256(p.read_bytes()).hexdigest()==''f0cbc6b62d8208b1f31ec0dd1082ad953a0a936c051f50edbd5e6f23f1d61d79''

        p=Path(''r365b_date_boundary_test.cjs'')

        p.write_bytes(b64decode(''''))

        assert sha256(p.read_bytes()).hexdigest()==''d20eba01d41555f9890a1ba65f580f2fb9a41840999e45b5a1de2db692794ab7''

        print(''R365B_SOURCE_INTEGRITY_PASS files=6'')

        PY'
    - name: Rebuild unchanged R365 standalone mock preview
      shell: bash
      run: 'set -euo pipefail

        python3 build_r365_dynamic_demo.py

        test "$(sha256sum r365_tplus_owner_dynamic_preview.html | cut -d'' '' -f1)" = "dbca6fbf5e88d12bdbcc1409ea14de029a41575b9ae34cf0e569d8a74fd44759"

        echo R365B_PREVIEW_IDENTICAL_PASS r365_html_unchanged=true mock_only=true'
    - name: Run R365 contract QA and serial 20 JST boundary cases
      shell: bash
      run: 'set -euo pipefail

        python3 r365_generation_test.py

        node --version

        node --check r365_mock_adapter.js

        node --check r365b_date_boundary_test.cjs

        node r365b_date_boundary_test.cjs'
    - name: Attach isolated static preview only; never deploy
      uses: actions/upload-artifact@v4
      with:
        name: DPRO_TAX_R365B_DYNAMIC_JST_ISOLATED_PREVIEW
        path: r365_tplus_owner_dynamic_preview.html
        if-no-files-found: error
        retention-days: 7
        compression-level: 9
    - name: Preserve production and commercial guard
      shell: bash
      run: 'set -euo pipefail

        test -f r365_tplus_owner_dynamic_preview.html

        echo R365B_ISOLATED_QA_EVIDENCE checks=434 r364=FORMAL_PASS r365_preview_unchanged=true synthetic_cases=20 production_mutations=0 notifications_sent=0 public_deploy=0 commercial_release=HOLD'
