name: DPRO TAX R367 Synthetic Demo Real Chrome Interaction Isolated QA
'on':
  push:
    branches:
    - dpro-tax-r308-auth-tenant-integration-qa-20261020
    paths:
    - .github/workflows/dpro-tax-r367-synthetic-demo-real-chrome-interactions-isolated-qa.yml
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  pc-mobile-actual-chrome-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
    - name: Checkout isolated branch only
      uses: actions/checkout@v4
    - name: Preserve formally passed R364/R365B and immutable V3.6
      shell: bash
      run: 'set -euo pipefail

        test "$(git hash-object .github/workflows/dpro-tax-r364-tplus-owner-v37-integrated-demo-isolated-qa.yml)" = "033866608177892df84d853408a7238e9272ae7c"

        test "$(git hash-object .github/workflows/dpro-tax-r365b-evergreen-jst-ci-timeout-fix-isolated-qa.yml)" = "4b383217275e070d4e3ee2dd283a837aa496423f"

        test "$(git hash-object .github/workflows/dpro-tax-r366-pc-mobile-actual-chrome-isolated-qa.yml)" = "d200013e3f9dc4aa48517fd7be873c71230aa6b9"

        test "$(git hash-object .github/workflows/dpro-tax-r366b-deterministic-scroll-real-chrome-isolated-qa.yml)" = "d5d0a495cff850e026689633752e372734c0519b"

        test "$(git hash-object tplus-owner-dashboard-v36/index.html)" = "d6260fc5160939b9fe4f9fb8ce899e17d981c17c"

        echo R367_BASELINE_PIN_PASS r364=FORMAL_PASS r365b=FORMAL_PASS r366=HISTORIC_FAIL_PRESERVED r366b=FORMAL_PASS v36=unchanged'
    - name: Restore unchanged R365B HTML and R367 interaction QA code
      shell: bash
      run: 'set -euo pipefail

        python3 - <<''PY''

        from pathlib import Path

        from base64 import b64decode

        from hashlib import sha256

        p=Path(''r365_tplus_owner_dynamic_preview.html'')

        p.write_bytes(b64decode(''''))

        assert sha256(p.read_bytes()).hexdigest()==''dbca6fbf5e88d12bdbcc1409ea14de029a41575b9ae34cf0e569d8a74fd44759''

        p=Path(''r367_browser_interaction_qa.cjs'')

        p.write_bytes(b64decode(''''))

        assert sha256(p.read_bytes()).hexdigest()==''f2771d4ecd6a53fa624810399e4c70a79da9df4f7e1339a7906b07dfaa845927''

        p=Path(''r367_static_browser_contract_test.py'')

        p.write_bytes(b64decode(''''))

        assert sha256(p.read_bytes()).hexdigest()==''10645a41c8dd7fa58620933bc4ec424927c4541927a5af8e7ea62168947189db''

        print(''R367_SOURCE_INTEGRITY_PASS files=3'')

        PY'
    - name: Check preinstalled Chrome and static contract before launch
      shell: bash
      run: 'set -euo pipefail

        node --version

        command -v google-chrome

        google-chrome --version

        node --check r367_browser_interaction_qa.cjs

        python3 r367_static_browser_contract_test.py'
    - name: Run 24 viewport views plus 32 synthetic interaction flows in Chrome
      shell: bash
      run: 'set -euo pipefail

        node r367_browser_interaction_qa.cjs

        test -f r367_browser_qa/r367_browser_qa_report.json

        echo R367_REAL_CHROME_INTERACTION_QA_EXECUTED chrome=true production_mutations=0 commercial_release=HOLD'
    - name: Keep screenshots and report even if layout QA fails
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: DPRO_TAX_R367_SYNTHETIC_INTERACTION_CHROME_EVIDENCE
        path: r367_browser_qa/
        if-no-files-found: warn
        retention-days: 7
        compression-level: 9
    - name: Never deploy or notify production
      shell: bash
      run: 'set -euo pipefail

        echo R367_GUARD_EVIDENCE branch=isolated no_npm_install=true production_mutations=0 notifications_sent=0 public_deploy=0 commercial_release=HOLD'
      if: always()
