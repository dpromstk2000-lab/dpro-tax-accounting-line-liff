name: DPRO TAX R368B Keyboard Gate Customer Journey Real Chrome Isolated QA
'on':
  push:
    branches:
    - dpro-tax-r308-auth-tenant-integration-qa-20261020
    paths:
    - .github/workflows/dpro-tax-r368b-demo-gate-keydown-chrome-isolated-qa.yml
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  pc-mobile-actual-chrome-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
    - name: Checkout isolated branch only
      uses: actions/checkout@v4
    - name: Preserve formally passed R364/R365B and immutable V3.6
      shell: bash
      run: 'set -euo pipefail

        test "$(git hash-object .github/workflows/dpro-tax-r364-tplus-owner-v37-integrated-demo-isolated-qa.yml)" = "033866608177892df84d853408a7238e9272ae7c"

        test "$(git hash-object .github/workflows/dpro-tax-r365b-evergreen-jst-ci-timeout-fix-isolated-qa.yml)" = "4b383217275e070d4e3ee2dd283a837aa496423f"

        test "$(git hash-object .github/workflows/dpro-tax-r366-pc-mobile-actual-chrome-isolated-qa.yml)" = "d200013e3f9dc4aa48517fd7be873c71230aa6b9"

        test "$(git hash-object .github/workflows/dpro-tax-r366b-deterministic-scroll-real-chrome-isolated-qa.yml)" = "d5d0a495cff850e026689633752e372734c0519b"

        test "$(git hash-object .github/workflows/dpro-tax-r367-synthetic-demo-real-chrome-interactions-isolated-qa.yml)" = "91288d118bd84399267f9c15f59ccc2f2cbf9170"

        test "$(git hash-object .github/workflows/dpro-tax-r368-demo-gate-customer-journey-chrome-isolated-qa.yml)" = "c95dd87815a40f5933549644953e1a3eec830fac"

        test "$(git hash-object tplus-owner-dashboard-v36/index.html)" = "d6260fc5160939b9fe4f9fb8ce899e17d981c17c"

        echo R368B_BASELINE_PIN_PASS r364=FORMAL_PASS r365b=FORMAL_PASS r366=HISTORIC_FAIL_PRESERVED r366b=FORMAL_PASS r367=FORMAL_PASS r368=HISTORIC_FAIL_PRESERVED v36=unchanged'
    - name: Restore unchanged R365B and isolated R368B keyboard candidate
      shell: bash
      run: 'set -euo pipefail

        python3 - <<''PY''

        from pathlib import Path

        from base64 import b64decode

        from hashlib import sha256

        p=Path(''r365_tplus_owner_dynamic_preview.html'')

        p.write_bytes(b64decode(''''))

        assert sha256(p.read_bytes()).hexdigest()==''dbca6fbf5e88d12bdbcc1409ea14de029a41575b9ae34cf0e569d8a74fd44759''

        p=Path(''r368b_tplus_owner_demo_gate_keyboard_candidate.html'')

        p.write_bytes(b64decode(''''))

        assert sha256(p.read_bytes()).hexdigest()==''6afb74dc7f405db73aab4f8f7f78a2a44cc63f9737d1dc70e1b309cc2ce64389''

        p=Path(''r368b_browser_customer_journey_qa.cjs'')

        p.write_bytes(b64decode(''''))

        assert sha256(p.read_bytes()).hexdigest()==''0059e1c9f6b067aa84674c39354ec2a8a6e8497444812756b73333d5b63e8c7d''

        p=Path(''r368b_static_customer_gate_test.py'')

        p.write_bytes(b64decode(''''))

        assert sha256(p.read_bytes()).hexdigest()==''5f604c63f48ed6f07a3159d7f4afb9d8aea9b02c63877e872ebb933e32f0be2a''

        print(''R368B_SOURCE_INTEGRITY_PASS files=4'')

        PY'
    - name: Check preinstalled Chrome and static contract before launch
      shell: bash
      run: 'set -euo pipefail

        node --version

        command -v google-chrome

        google-chrome --version

        node --check r368b_browser_customer_journey_qa.cjs

        python3 r368b_static_customer_gate_test.py'
    - name: Run 24 views, 32 prior flows plus 24 customer gate flows in Chrome
      shell: bash
      run: 'set -euo pipefail

        node r368b_browser_customer_journey_qa.cjs

        test -f r368b_browser_qa/r368b_browser_qa_report.json

        echo R368B_REAL_CHROME_CUSTOMER_GATE_QA_EXECUTED chrome=true production_mutations=0 commercial_release=HOLD'
    - name: Keep screenshots and report even if layout QA fails
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: DPRO_TAX_R368B_KEYBOARD_GATE_CHROME_EVIDENCE
        path: r368b_browser_qa/
        if-no-files-found: warn
        retention-days: 7
        compression-level: 9
    - name: Never deploy or notify production
      shell: bash
      run: 'set -euo pipefail

        echo R368B_GUARD_EVIDENCE branch=isolated no_npm_install=true production_mutations=0 notifications_sent=0 public_deploy=0 commercial_release=HOLD'
      if: always()
