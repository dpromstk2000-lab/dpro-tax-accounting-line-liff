name: DPRO TAX R370 Dashboard Cards One-Tap Return Real Chrome Isolated QA
'on':
  push:
    branches:
    - dpro-tax-r308-auth-tenant-integration-qa-20261020
    paths:
    - .github/workflows/dpro-tax-r370-dpro-dashboard-card-return-chrome-isolated-qa.yml
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  r370-pc-mobile-chrome-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - name: Checkout isolated branch only
      uses: actions/checkout@v4
    - name: Verify passed R369 and original dashboard preserved
      shell: bash
      run: 'set -euo pipefail

        test "$(git hash-object .github/workflows/dpro-tax-r368b-demo-gate-keydown-chrome-isolated-qa.yml)" = "cf94fe2bc05ad8b1dcc7e855157e646a41e106aa"

        test "$(git hash-object .github/workflows/dpro-tax-r367-synthetic-demo-real-chrome-interactions-isolated-qa.yml)" = "91288d118bd84399267f9c15f59ccc2f2cbf9170"

        test "$(git hash-object .github/workflows/dpro-tax-r369-evergreen-jst-demo-chrome-isolated-qa.yml)" = "dde52539e7b23594ed3690536fd61234e3f6774a"

        test "$(git hash-object tplus-owner-dashboard-v36/index.html)" = "d6260fc5160939b9fe4f9fb8ce899e17d981c17c"

        echo R370_PINS_PASS production_baseline=unchanged'
    - name: Restore isolated R370 candidate and QA sources
      shell: bash
      run: 'set -euo pipefail

        python3 - <<''PY''

        from base64 import b64decode

        from pathlib import Path

        from hashlib import sha256

        p=Path(''r369_tplus_owner_evergreen_demo_candidate.html'')

        p.write_bytes(b64decode(''''))

        assert sha256(p.read_bytes()).hexdigest()==''3e24d17e026c375e86834654fdf32c02396f746a24dd883e2ae624c3f95e076e''

        p=Path(''r370_tplus_owner_card_navigation_candidate.html'')

        p.write_bytes(b64decode(''''))

        assert sha256(p.read_bytes()).hexdigest()==''7a70b03f9ca2e08258553ac78b97f58f2de27918840fb347904657588b727a29''

        p=Path(''r370_browser_card_navigation_qa.cjs'')

        p.write_bytes(b64decode(''''))

        assert sha256(p.read_bytes()).hexdigest()==''71d3e286cfc5b921a2823b94e451b5f632524ed684f3382b4e99c2a5010cc657''

        p=Path(''r370_navigation_static_and_vm_qa.cjs'')

        p.write_bytes(b64decode(''''))

        assert sha256(p.read_bytes()).hexdigest()==''e695e6508cc82246c95076a9fe34520bb9ac8216e7a141736a82c8d4de0ae3c5''

        print(''R370_SOURCE_INTEGRITY_PASS files=4'')

        PY'
    - name: Static and VM checks (no real data)
      shell: bash
      run: 'set -euo pipefail

        command -v google-chrome

        google-chrome --version

        node --check r370_browser_card_navigation_qa.cjs

        node r370_navigation_static_and_vm_qa.cjs'
    - name: Real Chrome four-card round trip and existing customer journeys
      shell: bash
      run: 'set -euo pipefail

        node r370_browser_card_navigation_qa.cjs

        test -f r370_browser_qa/r370_browser_qa_report.json

        echo R370_CHROME_COMPLETE original_dashboard_unchanged=true production_mutations=0'
    - name: Attach evidence even on failure
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: DPRO_TAX_R370_CARD_NAVIGATION_CHROME_EVIDENCE
        path: r370_browser_qa/
        if-no-files-found: warn
        retention-days: 7
        compression-level: 9
    - name: Deployment remains forbidden
      shell: bash
      run: 'set -euo pipefail

        echo R370_GUARD_BRANCH_ISOLATED notifications=0 production_mutations=0 commercial_release=HOLD'
      if: always()
