name: DPRO TAX TPLUS DEMO V1 One Drop QA-only 36 Browser Tests and Freeze
on:
  push:
    branches:
      - qa/r225-synthetic-pg17-backup-restore-20261014
    paths:
      - .github/workflows/dpro-tax-tplus-demo-v1-one-drop-qa-only.yml
permissions:
  contents: write
jobs:
  tplus-demo-v1-qa:
    if: github.ref == 'refs/heads/qa/r225-synthetic-pg17-backup-restore-20261014' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout QA branch only
        uses: actions/checkout@v4
        with:
          ref: qa/r225-synthetic-pg17-backup-restore-20261014
          persist-credentials: true
          fetch-depth: 1
      - name: Restore exact locally tested demo fixture
        shell: bash
        run: |
          python3 - <<'PY'
          import gzip,base64,hashlib,pathlib
          out=pathlib.Path('tplus-demo');out.mkdir(exist_ok=True)
          html=gzip.decompress(base64.b64decode(''))
          assert hashlib.sha256(html).hexdigest()=='8f6eae21e6627a0cb9720136c1e03530976e04b042f5a5c98f1ace2c65319e91', 'HTML SHA mismatch: abort'
          assert b'http' not in html.split(b'<script>')[-1], 'unexpected external network dependency'
          (out/'index.html').write_bytes(html)
          test=gzip.decompress(base64.b64decode(''))
          (out/'test_demo.py').write_bytes(test)
          print('PASS frozen HTML SHA; no external script; no production writes')
          PY
      - name: Check standalone HTML JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,re
          s=pathlib.Path('tplus-demo/index.html').read_text(encoding='utf8')
          js=re.search(r'<script>([\s\S]*?)</script>',s).group(1)
          pathlib.Path('/tmp/tplus-inline.js').write_text(js,encoding='utf8')
          assert '<form' in s and 'demo' in s.lower()
          PY
          node --check /tmp/tplus-inline.js
      - name: Configure isolated Python for QA
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated browser QA dependencies
        run: |
          python3 -m pip install playwright==1.56.0
          python3 -m playwright install --with-deps chromium
      - name: Run 36 real-browser assertions, 28 screenshots, zero remote network
        run: |
          python3 tplus-demo/test_demo.py
      - name: Preserve approved demo file only in QA branch
        shell: bash
        run: |
          test "$GITHUB_REF" = 'refs/heads/qa/r225-synthetic-pg17-backup-restore-20261014'
          cp tplus-demo/test_demo.py /tmp/tplus-demo-test.py
          rm -f tplus-demo/test_demo.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- tplus-demo/index.html
          if git diff --cached --quiet; then echo 'Candidate unchanged'; else
            git commit -m 'qa: standalone TPLUS demo v1 (36 browser QA PASS)'
            git push origin HEAD:qa/r225-synthetic-pg17-backup-restore-20261014
          fi
      - name: Upload DEMO evidence (QA only)
        uses: actions/upload-artifact@v4
        with:
          name: tax-tplus-demo-v1-36-tests-${{ github.run_id }}
          path: |
            tplus-demo/index.html
            tplus-demo/QA_RESULTS.json
            tplus-demo/QA_*.png
          retention-days: 30
          if-no-files-found: error
