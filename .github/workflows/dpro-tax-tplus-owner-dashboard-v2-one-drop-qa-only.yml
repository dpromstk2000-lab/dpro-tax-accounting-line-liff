name: DPRO TAX TPLUS Owner Dashboard V2 QA-only Real Browser
on:
  push:
    branches:
      - qa/r225-synthetic-pg17-backup-restore-20261014
    paths:
      - .github/workflows/dpro-tax-tplus-owner-dashboard-v2-one-drop-qa-only.yml
permissions:
  contents: write
jobs:
  isolated-dashboard-v2:
    if: github.ref == 'refs/heads/qa/r225-synthetic-pg17-backup-restore-20261014' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout QA branch only
        uses: actions/checkout@v4
        with:
          ref: qa/r225-synthetic-pg17-backup-restore-20261014
          persist-credentials: true
          fetch-depth: 1
      - name: Restore exact verified V2 HTML and browser QA
        shell: bash
        run: |
          python3 - <<'PYBLOCK'
          import pathlib,hashlib,base64,gzip
          dest=pathlib.Path('tplus-owner-dashboard-v2');dest.mkdir(exist_ok=True)
          files={}
          files['index.html']=''
          files['test_dashboard.py']=''
          for name,value in files.items():
              (dest/name).write_bytes(gzip.decompress(base64.b64decode(value)))
          assert hashlib.sha256((dest/'index.html').read_bytes()).hexdigest() == 'fd2423b2f3ddef49cd21a0a66f7a091320153c2dd51bb9d3d6bc01eda7b499ff'
          assert hashlib.sha256((dest/'test_dashboard.py').read_bytes()).hexdigest() == 'a804df46aa7df7e5e967dd973c01e35a6ad49900d374f4e914f5e100f5889b78'
          assert b'https://static.line' not in (dest/'index.html').read_bytes()
          print('PASS: source SHA256 integrity and offline-only HTML')
          PYBLOCK
      - name: Syntax check actual dashboard JavaScript
        shell: bash
        run: |
          python3 - <<'PYBLOCK'
          import pathlib,re
          text=pathlib.Path('tplus-owner-dashboard-v2/index.html').read_text()
          scripts=re.findall(r'<script>(.*?)</script>',text,flags=re.S)
          assert len(scripts)==1,len(scripts)
          pathlib.Path('/tmp/tplus-dashboard-v2.js').write_text(scripts[0])
          PYBLOCK
          node --check /tmp/tplus-dashboard-v2.js
      - name: Configure isolated Python for QA
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated browser QA dependencies
        run: |
          python3 -m pip install playwright==1.56.0
          python3 -m playwright install --with-deps chromium
      - name: Run 48 real-browser checks across desktop, tablet and mobile
        run: |
          python3 tplus-owner-dashboard-v2/test_dashboard.py
      - name: Freeze V2 demo HTML only on QA branch
        shell: bash
        run: |
          test "$GITHUB_REF" = 'refs/heads/qa/r225-synthetic-pg17-backup-restore-20261014'
          rm -f tplus-owner-dashboard-v2/test_dashboard.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- tplus-owner-dashboard-v2/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'qa: freeze TPLUS owner-layout dashboard V2, browser QA PASS'
            git push origin HEAD:qa/r225-synthetic-pg17-backup-restore-20261014
          fi
      - name: Upload QA screenshots and results (no deploy)
        uses: actions/upload-artifact@v4
        with:
          name: tax-tplus-dashboard-v2-48-browser-qa-${{ github.run_id }}
          path: |
            tplus-owner-dashboard-v2/index.html
            tplus-owner-dashboard-v2/qa/*.png
            tplus-owner-dashboard-v2/qa/results.json
          retention-days: 30
          if-no-files-found: error
