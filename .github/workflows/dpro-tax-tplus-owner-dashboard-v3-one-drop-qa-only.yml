      - name: JavaScript syntax and basic HTML checks
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import pathlib,re
          s=pathlib.Path('tplus-owner-dashboard-v3/index.html').read_text(encoding='utf8')
          js=re.findall(r'<script>(.*?)</script>',s,flags=re.S)
          assert len(js)==1, len(js)
          pathlib.Path('/tmp/tplus-v3-qa.js').write_text(js[0])
          assert s.count('id="liff-client"')==1
          assert s.count('id="memo-client"')==1
          print('PASS UI controls and one inline script')
          PYCODE
          node --check /tmp/tplus-v3-qa.js
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser QA dependencies
        run: |
          python3 -m pip install playwright==1.56.0
          python3 -m playwright install --with-deps chromium
      - name: Real Chromium 111 checks / 3 viewports / zero external requests
        run: |
          python3 tplus-owner-dashboard-v3/test_v3.py
      - name: Freeze vetted V3 HTML on QA branch ONLY
        shell: bash
        run: |
          test "$GITHUB_REF" = 'refs/heads/qa/r225-synthetic-pg17-backup-restore-20261014'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- tplus-owner-dashboard-v3/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'qa: TPLUS owner dashboard V3 111 browser checks PASS'
            git pull --rebase origin qa/r225-synthetic-pg17-backup-restore-20261014
            git push origin HEAD:qa/r225-synthetic-pg17-backup-restore-20261014
          fi
      - name: Upload QA evidence (no deployment)
        uses: actions/upload-artifact@v4
        with:
          name: tplus-dashboard-v3-111-real-browser-${{ github.run_id }}
          path: |
            tplus-owner-dashboard-v3/index.html
            tplus-owner-dashboard-v3/*.png
            tplus-owner-dashboard-v3/results.json
          retention-days: 30
          if-no-files-found: error
