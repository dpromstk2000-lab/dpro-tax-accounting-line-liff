      - name: Isolated HTML and JavaScript syntax check
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('tplus-owner-dashboard-v32/index.html').read_text(encoding='utf8')
          snippets=re.findall(r'<script>(.*?)</script>',s,flags=re.S)
          assert len(snippets)==1,len(snippets)
          Path('/tmp/tplus-v32.js').write_text(snippets[0])
          assert 'V3.2' in s
          print('PASS isolated HTML and JavaScript extraction')
          PY
          node --check /tmp/tplus-v32.js
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright browser QA dependencies
        run: |
          python3 -m pip install playwright==1.56.0
          python3 -m playwright install --with-deps chromium
      - name: Run 87 real browser checks on desktop iPad and mobile
        run: |
          python3 tplus-owner-dashboard-v32/test_v32.py
      - name: Freeze passed V3.2 demo HTML on QA branch only
        shell: bash
        run: |
          test "$GITHUB_REF" = 'refs/heads/qa/r225-synthetic-pg17-backup-restore-20261014'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- tplus-owner-dashboard-v32/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'qa: TPLUS dashboard V3.2 docs and notes mock 87 browser PASS'
            git pull --rebase origin qa/r225-synthetic-pg17-backup-restore-20261014
            git push origin HEAD:qa/r225-synthetic-pg17-backup-restore-20261014
          fi
      - name: Upload browser QA evidence (no live deployment)
        uses: actions/upload-artifact@v4
        with:
          name: tax-tplus-v32-87-browser-${{ github.run_id }}
          path: |
            tplus-owner-dashboard-v32/index.html
            tplus-owner-dashboard-v32/QA_RESULTS.json
            tplus-owner-dashboard-v32/QA_*_documents.png
            tplus-owner-dashboard-v32/QA_*_notes.png
          retention-days: 30
          if-no-files-found: error
