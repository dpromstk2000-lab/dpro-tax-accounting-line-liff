name: DPRO TAX TPLUS V3.4 Isolated QA Only
on:
  push:
    branches:
      - qa/r225-synthetic-pg17-backup-restore-20261014
    paths:
      - 'tplus-owner-dashboard-v34/**'
      - '.github/workflows/dpro-tax-tplus-v34-isolated-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa-v34:
    if: github.ref_name == 'qa/r225-synthetic-pg17-backup-restore-20261014'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout isolated QA branch
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser QA dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run V3.4 offline tests
        working-directory: tplus-owner-dashboard-v34
        run: |
          python test_baseline.py
          python test_consistency.py
          python test_extra_qa.py
      - name: Upload QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dpro-tax-tplus-v34-offline-qa
          path: |
            tplus-owner-dashboard-v34/QA_RESULTS.json
            tplus-owner-dashboard-v34/QA_V34_CONSISTENCY.json
            tplus-owner-dashboard-v34/V34_EXTRA_QA_RESULTS.json
            tplus-owner-dashboard-v34/QA_*.png
          if-no-files-found: warn
