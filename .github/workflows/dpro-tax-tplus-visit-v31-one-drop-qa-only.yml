      - name: JavaScript syntax check
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('tplus-owner-dashboard-v31/index.html').read_text()
          snippets=re.findall(r'<script>([\s\S]*?)</script>',s)
          assert len(snippets)==1,len(snippets)
          Path('/tmp/tplus_v31.js').write_text(snippets[0])
          PY
          node --check /tmp/tplus_v31.js
      - name: Prepare isolated Python browser QA
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright for real Chromium checks
        run: |
          python3 -m pip install playwright==1.56.0
          python3 -m playwright install --with-deps chromium
      - name: Run 78 real-browser checks across PC iPad Mobile
        shell: bash
        run: |
          python3 tplus-owner-dashboard-v31/test_v31.py
      - name: Freeze passed HTML only on QA branch
        shell: bash
        run: |
          test "$GITHUB_REF" = 'refs/heads/qa/r225-synthetic-pg17-backup-restore-20261014'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- tplus-owner-dashboard-v31/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'qa: TPLUS V3.1 visit management mock 78 browser PASS'
            git pull --rebase origin qa/r225-synthetic-pg17-backup-restore-20261014
            git push origin HEAD:qa/r225-synthetic-pg17-backup-restore-20261014
          fi
      - name: Preserve QA evidence only
        uses: actions/upload-artifact@v4
        with:
          name: tplus-v31-visit-78-checks-${{ github.run_id }}
          path: |
            tplus-owner-dashboard-v31/index.html
            tplus-owner-dashboard-v31/QA_RESULTS.json
            tplus-owner-dashboard-v31/QA_*_visits.png
          retention-days: 30
          if-no-files-found: error
