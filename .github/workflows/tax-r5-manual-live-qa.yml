name: TAX R5 Corrected Japanese Font + Exact Live QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tax-r5-manual-live-qa.yml'

permissions:
  contents: write

env:
  BASE: https://dpromstk2000-lab.github.io/dpro-tax-accounting-line-liff/
  TUTORIAL_URL: https://dpromstk2000-lab.github.io/dpro-tax-accounting-line-liff/index.html?dpro_tutorial=start
  GUIDE_URL: https://dpromstk2000-lab.github.io/dpro-tax-accounting-line-liff/guide-center.html
  QUICK_URL: https://dpromstk2000-lab.github.io/dpro-tax-accounting-line-liff/DPRO_TUTORIAL_TAX_QUICK_START_V1.0.pdf
  DETAIL_URL: https://dpromstk2000-lab.github.io/dpro-tax-accounting-line-liff/DPRO_TUTORIAL_TAX_DETAILED_MANUAL_V1.0.pdf
  R4_ACCEPTED_HEAD: 7ff039e83a1ff478515a52e041c343a7bf293519

jobs:
  corrected-r5:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Re-lock newest TAX main forward-only
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge --ff-only origin/main
          git merge-base --is-ancestor "$R4_ACCEPTED_HEAD" HEAD
          echo "PREWRITE_HEAD=$(git rev-parse HEAD)" | tee qa-prewrite.txt
          echo "PREWRITE_TREE=$(git rev-parse HEAD^{tree})" | tee -a qa-prewrite.txt
          echo "FORWARD_ONLY=PASS" | tee -a qa-prewrite.txt

      - name: Install PDF, browser, Japanese-font QA tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils fonts-noto-cjk
          python -m pip install --quiet playwright weasyprint qrcode[pil] opencv-python-headless
          python -m playwright install --with-deps chromium

      - name: Capture current public screens and build corrected PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa/assets qa/render/quick qa/render/detail
          cat > qa/build.py <<'PY'
          import os, re, json, hashlib, subprocess, html
          from pathlib import Path
          import qrcode, cv2
          from playwright.sync_api import sync_playwright
          from weasyprint import HTML

          QA=Path('qa'); A=QA/'assets'
          T=os.environ['TUTORIAL_URL']; G=os.environ['GUIDE_URL']; BASE=os.environ['BASE']
          writes=[]
          with sync_playwright() as p:
            b=p.chromium.launch(headless=True)
            for name,url,w,h in [('desktop',T,1440,1020),('guide',G,1440,1120),('mobile',T,390,900)]:
              c=b.new_context(viewport={'width':w,'height':h},has_touch=(w<=390))
              page=c.new_page()
              page.on('request',lambda r: writes.append({'method':r.method,'url':r.url}) if r.method.upper() in {'POST','PUT','PATCH','DELETE'} else None)
              resp=page.goto(url,wait_until='domcontentloaded',timeout=45000)
              assert resp and resp.ok, (name,resp.status if resp else None)
              page.wait_for_timeout(1400)
              page.screenshot(path=str(A/f'{name}.png'),full_page=False)
              c.close()
            b.close()
          assert not writes, writes

          for name,url in [('tutorial',T),('guide',G)]:
            qr=qrcode.QRCode(error_correction=qrcode.constants.ERROR_CORRECT_M,box_size=8,border=4); qr.add_data(url); qr.make(fit=True)
            qr.make_image(fill_color='black',back_color='white').save(A/f'qr-{name}.png')

          CSS='''@page{size:A4 portrait;margin:12mm 13mm 12mm 13mm}@page{@bottom-left{content:"DPRO TUTORIAL / TAX - R5 CORRECTED";color:#60778a;font-size:7.5pt;border-top:.2mm solid #d5e0e8;padding-top:2mm}@bottom-right{content:counter(page);color:#60778a;font-size:7.5pt;border-top:.2mm solid #d5e0e8;padding-top:2mm}}*{box-sizing:border-box}html,body{margin:0;padding:0;color:#17324d;font-family:"Noto Sans CJK JP",sans-serif;font-size:9.4pt;line-height:1.55}h1,h2,h3,p{margin:0}h1{font-size:24pt;line-height:1.24;font-weight:700;margin-bottom:2mm}h2{font-size:20pt;line-height:1.28;font-weight:600;margin-bottom:2mm}h3{font-size:11.5pt;font-weight:700}.eyebrow{font-size:8.6pt;letter-spacing:.08em;color:#315f86;font-weight:600;margin-bottom:5mm}.lead{font-size:10pt;margin-bottom:4mm}.safe{background:#183a59;color:#fff;padding:3mm 4mm;font-size:9.6pt;margin:3mm 0 4mm}.note{border:.25mm solid #ecd6a6;background:#fff8e9;color:#5e5137;padding:3mm 4mm;margin:4mm 0;font-size:9.1pt}.soft{border:.25mm solid #d5e0e8;background:#eef4f8;padding:3mm 4mm;margin:3mm 0}.screen{display:block;width:100%;border:.25mm solid #d6e0e7;background:#f5f8fa;object-fit:contain}.screen.desktop{height:82mm}.screen.guide{height:100mm}.screen.mobile{height:113mm;width:auto;margin:0 auto}.qrgrid{display:grid;grid-template-columns:1fr 1fr;border:.25mm solid #d5e0e8;margin-top:4mm}.qrbox{padding:3mm 4mm;min-height:55mm}.qrbox+.qrbox{border-left:.25mm solid #d5e0e8}.qrbox h3{color:#315f86;margin-bottom:2mm}.qrbox img{display:block;width:30mm;height:30mm;margin:0 auto 2mm}.url{font-size:7.2pt;line-height:1.35;color:#60778a;overflow-wrap:anywhere;word-break:break-all}table{width:100%;border-collapse:collapse;table-layout:fixed;margin-top:3mm}th,td{border:.25mm solid #d2dde5;padding:2.6mm 3mm;vertical-align:top}th{width:29%;background:#edf4f8;text-align:left;font-weight:500}td strong{font-weight:700}.meta{display:block;color:#60778a;font-size:7.4pt;margin-top:1mm;overflow-wrap:anywhere}.page{break-after:page}.page:last-child{break-after:auto}.tiny{font-size:7.8pt;color:#60778a}.opgrid{display:grid;grid-template-columns:2.2fr 1fr;gap:5mm;align-items:start;margin:3mm 0 4mm}.opgrid .screen.desktop{height:85mm}.opgrid .screen.mobile{height:119mm}'''
          def head(t,s): return f'<h1>{html.escape(t)}</h1><div class="eyebrow">{html.escape(s)}</div>'
          def qrs(): return f'<div class="qrgrid"><div class="qrbox"><h3>Tutorial Start</h3><img src="assets/qr-tutorial.png"><div class="url">{html.escape(T)}</div></div><div class="qrbox"><h3>Guide Center</h3><img src="assets/qr-guide.png"><div class="url">{html.escape(G)}</div></div></div>'
          rows={1:('TAX-T01','LINE窓口の全体像','税務・会計の連絡をまとめる顧問先サポート窓口の役割を確認します。','.hero h1'),2:('TAX-T02','この窓口でできること','資料確認、進捗共有、面談希望、相談履歴など、主な利用範囲を確認します。','.hero-panel'),3:('TAX-T03','面談予約の入口','面談予約の入口を確認します。チュートリアルは予約送信を行いません。','#booking'),4:('TAX-T04','相談内容を選ぶ場所','相談内容の選択欄を確認します。選択値は変更しません。','#booking-service'),5:('TAX-T05','希望日を確認する場所','希望日の入力位置を確認します。日付を自動入力しません。','#booking-date'),6:('TAX-T06','希望時間の表示位置','希望時間候補が表示される位置を確認します。候補ボタンはクリックしません。','#slot-message'),7:('TAX-T07','税務・会計相談の入口','相談フォームの入口を確認します。相談送信は行いません。','#inquiry'),8:('TAX-T08','機密情報を送らない','マイナンバー、暗証番号、パスワード、秘密鍵などを入力しないことを確認します。','#inquiry-form .security-notice'),9:('TAX-T09','相談区分を確認する場所','相談区分の選択欄を確認します。選択値は変更しません。','#inquiry-category'),10:('TAX-T10','資料提出時の安全確認','資料提出時も機密情報を含む資料を送らないことを最後に確認します。','#security-notice-text')}
          def table(ns):
            x=['<table><tbody>']
            for n in ns:
              sid,title,copy,target=rows[n]; x.append(f'<tr><th><strong>{sid}</strong><br>{html.escape(title)}</th><td>{html.escape(copy)}<span class="meta">Target: {html.escape(target)} / Route: index.html</span></td></tr>')
            return ''.join(x)+'</tbody></table>'
          quick=f'''<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>{CSS}</style></head><body><section class="page">{head('税理士・会計 操作ガイド','QUICK START / DPRO TUTORIAL STANDARD V1.1 / CORRECTED')}<div class="safe">安全な「読み取り中心」の10ステップ。予約・相談・登録の送信は行いません。</div><img class="screen desktop" src="assets/desktop.png"><table><tbody><tr><th>1. Start</th><td>Guide Center または公開窓口の「操作ガイド」から開始します。</td></tr><tr><th>2. Next / Back</th><td>「次へ」「戻る」で10ステップを移動します。入力欄の値は変更しません。</td></tr><tr><th>3. Resume / Replay</th><td>途中で閉じても続きから再開できます。完了後はStep 1からReplayできます。</td></tr><tr><th>4. Drag / Touch</th><td>カード上部の専用ハンドルだけをドラッグ。スマホはタッチ操作に対応します。</td></tr><tr><th>5. Keyboard</th><td>Tabで操作ガイドへ移動し、Enterで進行。Escで閉じます。フォーカスは見える状態です。</td></tr></tbody></table>{qrs()}<p class="tiny" style="margin-top:2.5mm">※ QRは現在の公開Tutorial Start / Guide Centerへ直接つながります。マイナンバー、暗証番号、パスワード等の機密情報は入力・送信しないでください。</p></section></body></html>'''
          pages=[]
          pages.append(f'''<section class="page">{head('税理士・会計 操作ガイド 詳細マニュアル','DETAILED MANUAL / First10 exactly 10 / CORRECTED')}<img class="screen guide" src="assets/guide.png"><h2 style="margin-top:4mm">Guide Center</h2><p class="lead">Guide CenterにはStart / Resume / Replayと、承認済みFirst10が10件だけ表示されます。Guide Center自身は第2のチュートリアル状態機械を持たず、公開窓口のTutorialと同じ保存状態を読み取ります。</p>{qrs()}</section>''')
          pages.append(f'''<section class="page">{head('First10 - Step 1〜3','SAFE HIGHLIGHT / PUBLIC INDEX')}<div class="soft">First10は必ず10件。公開index.html上の安全な対象をハイライトするだけで、フォーム入力・送信・アップロードは実行しません。</div><img class="screen desktop" src="assets/desktop.png">{table([1,2,3])}</section>''')
          pages.append(f'''<section class="page">{head('First10 - Step 4〜6','BOOKING AREA / READ-ONLY GUIDE')}<p class="lead">面談予約エリアの入力・候補表示を「見る」3ステップです。</p>{table([4,5,6])}<div class="note"><strong>重要：</strong>TAX-T04は選択変更なし、TAX-T05は日付自動入力なし、TAX-T06は生成された時間枠ボタンをクリックしません。</div><p>カードは専用ハンドルで移動できます。画面端まで移動してもviewport内へクランプされます。</p></section>''')
          pages.append(f'''<section class="page">{head('First10 - Step 7〜10','TAX INQUIRY / SECURITY NOTICE')}<p class="lead">税務・会計相談と資料提出時の安全確認を扱います。</p>{table([7,8,9,10])}<div class="note"><strong>機密情報禁止：</strong>マイナンバー、暗証番号、パスワード、秘密鍵、実顧客の会計・税務・支払・申告データをチュートリアル操作や証拠取得のために入力しません。</div></section>''')
          pages.append(f'''<section class="page">{head('操作方法 - Mouse / Touch / Keyboard','DESKTOP + MOBILE')}<p class="lead">デスクトップとスマホの両方で、操作ガイドカードを安全に移動・進行できます。</p><div class="opgrid"><img class="screen desktop" src="assets/desktop.png"><img class="screen mobile" src="assets/mobile.png"></div><table><tbody><tr><th><strong>MOUSE</strong><br>専用ハンドルをドラッグ</th><td>ボタン、リンク、入力欄、select、textareaからドラッグは開始しません。<span class="meta">Target: [data-dpro-tutorial-drag-handle] / Route: index.html</span></td></tr><tr><th><strong>TOUCH</strong><br>スマホでタッチ移動</th><td>タッチ操作でもカードはviewport外へ出ません。<span class="meta">Target: pointerType=touch / Route: index.html</span></td></tr><tr><th><strong>KEYBOARD</strong><br>Tab / Enter / Esc</th><td>Tabで到達、Enterで進行、Escで閉じる。閉じた後はLauncherへフォーカスが戻ります。<span class="meta">Target: focus-visible / Route: index.html</span></td></tr></tbody></table></section>''')
          pages.append(f'''<section class="page">{head('安全境界 / Resume / Replay / 困ったとき','BUSINESS MUTATION = 0 / UNSAFE WRITE = 0')}<div class="safe">Business mutation = 0 / Unsafe write = 0 を維持</div><table><tbody><tr><th><strong>Start</strong><br>最初から開始</th><td>Guide CenterのStartからStep 1を開きます。<span class="meta">Target: Step 1 / Route: index.html</span></td></tr><tr><th><strong>Resume</strong><br>途中から再開</th><td>中断時点のStepへ戻ります。R4 LIVE QAでは同一Step復帰を確認済みです。<span class="meta">Target: 保存Step / Route: index.html</span></td></tr><tr><th><strong>Replay</strong><br>完了後に再確認</th><td>Skipまたは完了後、Step 1から再確認できます。<span class="meta">Target: Step 1 / Route: index.html</span></td></tr><tr><th><strong>Close / Esc</strong><br>一時終了</th><td>閉じても進捗は保持され、Launcherから再開できます。<span class="meta">Target: Launcher / Route: index.html</span></td></tr></tbody></table><div class="note"><strong>やってはいけない操作：</strong>面談予約送信、税務・会計相談送信、登録送信、資料アップロード、system-check、demo_prepare、owner / owner-iPadの書込み操作。</div><p>画面で対象が見つからない場合は、無理に業務コントロールを操作せずGuide Centerへ戻ってください。公開ページの構成が変わった場合は、最新Tutorial契約の再確認が必要です。</p>{qrs()}<p class="tiny" style="margin-top:2mm">このマニュアルのQRは、current mainで再確認した公開Tutorial / Guide Centerを指します。</p></section>''')
          detail='<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>'+CSS+'</style></head><body>'+''.join(pages)+'</body></html>'
          (QA/'quick.html').write_text(quick,encoding='utf-8'); (QA/'detail.html').write_text(detail,encoding='utf-8')
          HTML(string=quick,base_url=str(QA.resolve())).write_pdf('DPRO_TUTORIAL_TAX_QUICK_START_V1.0.pdf')
          HTML(string=detail,base_url=str(QA.resolve())).write_pdf('DPRO_TUTORIAL_TAX_DETAILED_MANUAL_V1.0.pdf')

          ev={'system':'TAX','stage':'R5_CORRECTED','font_family':'Noto Sans CJK JP','manuals':{},'qr':[],'unsafe_write_request':0,'business_mutation':0,'verdict':'R5_HOLD'}
          for label,pdf,pages,out in [('quick','DPRO_TUTORIAL_TAX_QUICK_START_V1.0.pdf',1,QA/'render/quick'),('detail','DPRO_TUTORIAL_TAX_DETAILED_MANUAL_V1.0.pdf',6,QA/'render/detail')]:
            info=subprocess.check_output(['pdfinfo',pdf],text=True); fonts=subprocess.check_output(['pdffonts',pdf],text=True); txt=subprocess.check_output(['pdftotext',pdf,'-'],text=True)
            assert re.search(rf'^Pages:\s+{pages}$',info,re.M) and 'A4' in info
            assert 'Noto-Sans-CJK-JP' in fonts and ' yes yes yes ' in fonts and 'HeiseiKakuGo' not in fonts
            assert '\ufffd' not in txt and '■' not in txt
            subprocess.run(['pdftoppm','-r','200','-png',pdf,str(out/'page')],check=True,stdout=subprocess.DEVNULL)
            renders=sorted(out.glob('*.png')); assert len(renders)==pages
            sha=hashlib.sha256(Path(pdf).read_bytes()).hexdigest(); ev['manuals'][label]={'pages':pages,'a4_portrait':True,'sha256':sha,'font_embedded':True,'rendered_pages':len(renders),'missing_glyph':0}
          det=cv2.QRCodeDetector(); expected=[T,G]
          for lab,path in [('quick-p1',QA/'render/quick/page-1.png'),('detail-p1',QA/'render/detail/page-1.png'),('detail-p6',QA/'render/detail/page-6.png')]:
            im=cv2.imread(str(path)); h,w=im.shape[:2]; got=[]
            for idx,crop in enumerate([im[:,:w//2],im[:,w//2:]]):
              val,_,_=det.detectAndDecode(crop); assert val==expected[idx],(lab,idx,val,expected[idx]); got.append(val)
            ev['qr'].append({'page':lab,'decoded':got})
          ev['gates']={'CANONICAL_SOURCE_RELOCK':'PASS','FIRST10_COUNT':10,'GUIDE_COUNT':10,'ALL_PDF_PAGES_RENDERED':'PASS','JAPANESE_FONT_EMBEDDED':'PASS','QR_DECODE_EVERY_RENDERED_QR':'PASS','QR_DESTINATION_EXACT_PUBLIC':'PASS','MISSING_GLYPH':0,'UNSAFE_WRITE_REQUEST':0,'BUSINESS_MUTATION':0}
          ev['verdict']='R5_CORRECTED_LOCAL_AUTOMATED_PASS'
          (QA/'R5_CORRECTED_LOCAL_EVIDENCE.json').write_text(json.dumps(ev,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(ev,ensure_ascii=False,indent=2))
          PY
          python qa/build.py

      - name: Commit corrected PDF files only
        shell: bash
        run: |
          set -euo pipefail
          CHANGED="$(git status --short --untracked-files=no | awk '{print $2}' | sort || true)"
          # PDF generation may leave existing PDFs modified; only these two are allowed to be committed.
          git add DPRO_TUTORIAL_TAX_QUICK_START_V1.0.pdf DPRO_TUTORIAL_TAX_DETAILED_MANUAL_V1.0.pdf
          STAGED="$(git diff --cached --name-only | sort)"
          test "$STAGED" = $'DPRO_TUTORIAL_TAX_DETAILED_MANUAL_V1.0.pdf\nDPRO_TUTORIAL_TAX_QUICK_START_V1.0.pdf'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Correct TAX R5 Japanese PDF font embedding"
          git push origin HEAD:main
          echo "PDF_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "PDF_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"
          echo "QUICK_SHA256=$(sha256sum DPRO_TUTORIAL_TAX_QUICK_START_V1.0.pdf | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "DETAIL_SHA256=$(sha256sum DPRO_TUTORIAL_TAX_DETAILED_MANUAL_V1.0.pdf | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Exact public R5 corrected QA
        shell: bash
        run: |
          set -euo pipefail
          cat > qa/public_qa.py <<'PY'
          import os,time,hashlib,json,re,subprocess
          from pathlib import Path
          import urllib.request,cv2
          U={'quick':os.environ['QUICK_URL'],'detail':os.environ['DETAIL_URL'],'guide':os.environ['GUIDE_URL'],'tutorial':os.environ['TUTORIAL_URL']}
          expected={'quick':os.environ['QUICK_SHA256'],'detail':os.environ['DETAIL_SHA256']}
          def get(url):
            req=urllib.request.Request(url+('&' if '?' in url else '?')+'r5corrected='+str(time.time_ns()),headers={'Cache-Control':'no-cache'})
            with urllib.request.urlopen(req,timeout=30) as r:return r.status,r.read()
          last={}
          for attempt in range(1,25):
            try:
              sq,bq=get(U['quick']); sd,bd=get(U['detail']); sg,bg=get(U['guide']); st,bt=get(U['tutorial'])
              hq=hashlib.sha256(bq).hexdigest(); hd=hashlib.sha256(bd).hexdigest(); last={'attempt':attempt,'http':[sq,sd,sg,st],'hash':[hq,hd]}
              if sq==sd==sg==st==200 and hq==expected['quick'] and hd==expected['detail']:break
            except Exception as e:last={'attempt':attempt,'error':str(e)}
            time.sleep(5)
          else: raise RuntimeError(last)
          Path('qa/public-quick.pdf').write_bytes(bq); Path('qa/public-detail.pdf').write_bytes(bd)
          guide=bg.decode('utf-8'); js=urllib.request.urlopen(os.environ['BASE']+'dpro-tutorial-v1.1.js').read().decode('utf-8')
          gids=re.findall(r'data-guide-step="(TAX-T\d{2})"',guide); tids=re.findall(r'id\s*:\s*["\'](TAX-T\d{2})["\']',js)
          assert len(gids)==10 and len(dict.fromkeys(tids))==10
          ev=json.loads(Path('qa/R5_CORRECTED_LOCAL_EVIDENCE.json').read_text(encoding='utf-8'))
          ev['public_attempt']=last['attempt']; ev['public_http']={'quick':sq,'detail':sd,'guide':sg,'tutorial':st}; ev['public_hashes']={'quick':hq,'detail':hd}; ev['canonical_pdf_commit']=os.environ['PDF_COMMIT']; ev['canonical_pdf_tree']=os.environ['PDF_TREE']; ev['verdict']='R5_CORRECTED_PUBLIC_AUTOMATED_PASS'
          Path('qa/R5_CORRECTED_PUBLIC_EVIDENCE.json').write_text(json.dumps(ev,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(ev,ensure_ascii=False,indent=2))
          PY
          python qa/public_qa.py

      - name: Upload corrected R5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TAX-R5-CORRECTED-JP-FONT-EVIDENCE
          path: qa/
          if-no-files-found: warn
